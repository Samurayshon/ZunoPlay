<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Criar conta - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 20% 20%,#25145c 0%,transparent 35%),radial-gradient(circle at 80% 80%,#102d59 0%,transparent 35%),#070811;color:#fff}.container{width:100%;max-width:480px;min-height:100vh;margin:auto;padding:25px;display:flex;flex-direction:column;justify-content:center}.logo{text-align:center;margin-bottom:30px;font-size:38px;font-weight:800}.logo span{color:#8b5cf6}.card{background:rgba(20,21,35,.9);border:1px solid rgba(139,92,246,.2);border-radius:24px;padding:25px}h1{font-size:25px;margin-bottom:8px}.description{color:#9293a3;font-size:14px;margin-bottom:25px}label{display:block;margin-top:16px;margin-bottom:7px;font-size:13px;color:#c9c9d4}input{width:100%;padding:15px;border-radius:12px;border:1px solid #303145;background:#11121e;color:white;outline:none;font-size:15px}input:focus{border-color:#8b5cf6}form button{width:100%;padding:16px;margin-top:25px;border:none;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:white;font-size:16px;font-weight:bold;cursor:pointer}form button:disabled{opacity:.6;cursor:not-allowed}.link{display:block;text-align:center;margin-top:18px;color:#999aaa;text-decoration:none;font-size:14px}.message{display:none;margin-top:18px;padding:12px;border-radius:10px;font-size:13px;text-align:center}.success{display:block;background:rgba(34,197,94,.12);color:#86efac}.error{display:block;background:rgba(239,68,68,.12);color:#fca5a5}</style></head><body><div class="container"><div class="logo">Zuno<span>Play</span></div><div class="card"><h1>Criar sua conta</h1><p class="description">Entre para a comunidade ZunoPlay.</p><form id="signupForm"><label for="username">Nome de usuário</label><input type="text" id="username" placeholder="Escolha seu nome" minlength="3" maxlength="20" required><label for="email">E-mail</label><input type="email" id="email" placeholder="seu@email.com" required><label for="password">Senha</label><input type="password" id="password" placeholder="Crie uma senha" minlength="6" required><button type="submit" id="signupButton">Criar conta</button></form><div id="message" class="message"></div><a href="index.html" class="link">← Voltar</a></div></div><script>const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co";const SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const form=document.getElementById("signupForm"),button=document.getElementById("signupButton"),message=document.getElementById("message");form.addEventListener("submit",async e=>{e.preventDefault();const username=document.getElementById("username").value.trim(),email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;message.className="message";message.textContent="";button.disabled=true;button.textContent="Criando conta...";try{const{data,error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:"https://samurayshon.github.io/ZunoPlay/",data:{username}}});if(error)throw error;message.className="message success";message.textContent=data.user&&!data.session?"Conta criada! 📧 Verifique seu e-mail para confirmar a conta.":"Conta criada com sucesso! 🎉";form.reset()}catch(error){console.error("Erro no cadastro:",error);message.className="message error";message.textContent="Não foi possível criar a conta: "+error.message}button.disabled=false;button.textContent="Criar conta"});</script></body></html>
