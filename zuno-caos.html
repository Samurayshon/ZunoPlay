<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080711"><title>Zuno Caos - ZunoPlay</title><script src="nav.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 30%,#281553 0,#0a0915 42%,#05050b 80%);color:#fff;font-family:Inter,system-ui,sans-serif}.app{width:min(100%,760px);min-height:100vh;margin:auto;padding:14px 14px 105px}.top{display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;border:1px solid #34314c;border-radius:14px;background:#11111d;color:#fff;font-size:22px}.title{flex:1}.title b{display:block;font-size:20px}.title span{font-size:9px;color:#9a96ac}.room{font-size:8px;color:#83e6a7}.table{position:relative;margin-top:14px;min-height:520px;border:1px solid #46346c;border-radius:32px;background:radial-gradient(circle at center,rgba(137,61,255,.25),transparent 34%),linear-gradient(145deg,#111127,#090a15);overflow:hidden;box-shadow:0 20px 60px #0008}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px}.player{padding:8px 5px;border:1px solid #2c2d43;border-radius:13px;background:#10111d;text-align:center;font-size:8px}.player.turn{border-color:#b55dff;box-shadow:0 0 18px #8c42ff55}.avatar{width:30px;height:30px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#27223b;font-size:16px}.player b{display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player i{font-style:normal;color:#8f8b9e}.center{height:225px;display:flex;flex-direction:column;align-items:center;justify-content:center}.pulse{font-size:9px;color:#c8a4ff;min-height:18px}.discard{width:88px;height:122px;border-radius:17px;border:2px solid #fff4;display:grid;place-items:center;font-size:32px;font-weight:950;box-shadow:0 10px 30px #0008;transform:rotate(-3deg)}.deck{margin-top:9px;font-size:9px;color:#8e8a9e}.status{text-align:center;font-size:11px;font-weight:850;min-height:24px;padding:4px 12px}.hand{display:flex;gap:7px;overflow-x:auto;padding:12px 10px 18px;align-items:end}.card{flex:0 0 64px;height:94px;border:2px solid #ffffff40;border-radius:14px;color:#fff;font-weight:950;font-size:18px;box-shadow:0 8px 20px #0007;transition:.15s}.card:active{transform:translateY(-7px)}.card[disabled]{opacity:.42}.red{background:linear-gradient(145deg,#ff4e68,#9f1836)}.blue{background:linear-gradient(145deg,#42a9ff,#1953b5)}.green{background:linear-gradient(145deg,#49d98a,#13724b)}.purple{background:linear-gradient(145deg,#b45cff,#5c22b5)}.special{background:linear-gradient(145deg,#ff65db,#6334dc)}.actions{display:flex;gap:8px;padding:0 10px 15px}.actions button,.start{flex:1;min-height:42px;border-radius:13px;border:1px solid #3a3850;background:#151522;color:#fff;font-weight:900}.actions .primary,.start{border:0;background:linear-gradient(135deg,#a346ff,#6551ee)}.overlay{position:absolute;inset:0;background:#080912eF;display:grid;place-items:center;padding:25px;text-align:center;z-index:5}.overlay.hide{display:none}.box{max-width:360px}.box .big{font-size:52px}.box h1{margin:8px 0;font-size:27px}.box p{font-size:11px;color:#aaa6ba;line-height:1.55}.rules{font-size:9px;color:#817d91;margin:13px 0}.start{width:100%;padding:0 18px}.result{font-size:10px;color:#b99bdd;margin-top:10px}</style></head><body><main class="app"><header class="top"><button class="back" id="back">‹</button><div class="title"><b>⚡ ZUNO CAOS</b><span>Cartas · estratégia · Pulse</span></div><div id="room" class="room"></div></header><section class="table"><div id="players" class="players"></div><div class="center"><div id="pulse" class="pulse"></div><div id="discard" class="discard special">Z</div><div id="deck" class="deck">Monte: 0</div></div><div id="status" class="status">Preparando partida…</div><div id="hand" class="hand"></div><div class="actions"><button id="draw">Comprar</button><button id="pass">Passar</button></div><div id="intro" class="overlay"><div class="box"><div class="big">⚡🃏</div><h1>Zuno Caos</h1><p>Fique sem cartas antes dos rivais. Combine cor ou número e use cartas especiais para virar a partida.</p><div class="rules">2–8 jogadores simulados nesta versão · Inverter · Bloquear · +2 · Troca · Escudo · Pulse</div><button id="start" class="start">Começar partida</button><div id="result" class="result"></div></div></div></section></main><script src="zuno-caos.js"></script></body></html>
