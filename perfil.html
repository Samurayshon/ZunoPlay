<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#070811;color:#fff;font-family:Arial,sans-serif}.app{max-width:480px;min-height:100vh;margin:auto;padding:25px}.header{display:flex;align-items:center;gap:15px;margin-bottom:25px}.home{width:42px;height:42px;border-radius:12px;border:1px solid #303145;background:#1b1c2b;color:#fff;font-size:20px}.logo{font-size:28px;font-weight:800}.logo span{color:#8b5cf6}.card{background:#141523;border:1px solid #303145;border-radius:24px;padding:25px}.loading{text-align:center;color:#9293a3;padding:45px 10px}.error{text-align:center;color:#fca5a5}.avatar{width:110px;height:110px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#312e81);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:bold;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{text-align:center;font-size:24px;font-weight:bold}.email{text-align:center;color:#9293a3;font-size:13px;margin:6px 0 20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:#11121e;border:1px solid #292a3d;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:18px}.stat small{color:#858697}.field{margin-top:14px}.field label{display:block;color:#c9c9d4;font-size:13px;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #303145;background:#11121e;color:#fff;font-size:15px}.field textarea{min-height:90px}.btn{width:100%;padding:15px;margin-top:14px;border:0;border-radius:13px;font-weight:bold;color:#fff;background:#7651d6}.secondary{background:#171824;border:1px solid #303145}.msg{text-align:center;margin-top:12px;font-size:13px}</style></head><body><main class="app"><header class="header"><button class="home" onclick="location.href='index.html'">⌂</button><div class="logo">Zuno<span>Play</span></div></header><div id="content"><div class="card loading">Carregando perfil...</div></div></main><script>const client=window.supabase.createClient('https://rliymfbbhqoejgfvsbuu.supabase.co','sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0');const content=document.getElementById('content');const target=new URLSearchParams(location.search).get('user');let me=null;const esc=v=>{const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML};function avatar(p){if(!p.avatar_url)return esc((p.username||'Z').charAt(0).toUpperCase());const raw=String(p.avatar_url);if(/^data:image\/(?:svg\+xml|png|jpeg|webp);/i.test(raw))return '<img src="'+esc(raw)+'" alt="Avatar">';try{const a=JSON.parse(raw);if(a.skin&&a.hair&&a.shirt){const s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><circle cx="100" cy="100" r="100" fill="#312e81"/><path d="M45 200c5-45 30-70 55-70s50 25 55 70" fill="'+a.shirt+'"/><ellipse cx="100" cy="96" rx="46" ry="54" fill="'+a.skin+'"/><path d="M52 88c0-45 20-62 48-62s48 17 48 62c-15-16-30-24-48-24S67 72 52 88" fill="'+a.hair+'"/><circle cx="82" cy="98" r="5"/><circle cx="118" cy="98" r="5"/><path d="M88 120q12 8 24 0" fill="none" stroke="#7b3f45" stroke-width="4"/></svg>';return '<img src="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)+'" alt="Avatar">'}}catch(e){}return /^https?:\/\//i.test(raw)?'<img src="'+esc(raw)+'" alt="Avatar">':esc((p.username||'Z').charAt(0).toUpperCase())}function show(p,own){content.innerHTML='<section class="card"><div class="avatar">'+avatar(p)+'</div><div class="name">'+esc(p.username||'ZunoPlayer')+'</div><div class="email">'+(own?esc(me.email||''):'Perfil público')+'</div><div class="stats"><div class="stat"><b>'+Number(p.level||0)+'</b><small>Nível</small></div><div class="stat"><b>'+Number(p.coins||0)+'</b><small>Moedas</small></div><div class="stat"><b>'+esc(p.created_at?new Date(p.created_at).toLocaleDateString('pt-BR'):'-')+'</b><small>Desde</small></div></div>'+(own?'<div class="field"><label>Nome de usuário</label><input id="username" minlength="3" maxlength="20" autocomplete="username" value="'+esc(p.username||'')+'"></div><div class="field"><label>Bio</label><textarea id="bio" maxlength="300">'+esc(p.bio||'')+'</textarea></div><button class="btn" id="save">Salvar alterações</button><button class="btn secondary" id="avatarBtn">🎨 Personalizar avatar</button><div id="msg" class="msg"></div>':'<p style="text-align:center;color:#c4c4cf">'+esc(p.bio||'Este usuário ainda não adicionou uma bio.')+'</p>')+'</section>';if(own){document.getElementById('save').onclick=save;document.getElementById('avatarBtn').onclick=()=>location.href='avatar.html'}}async function load(){try{const r=await Promise.race([client.auth.getSession(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout-auth')),8000))]);if(!r.data.session){location.href='login.html';return}me=r.data.session.user;const id=target||me.id;const r2=await Promise.race([client.from('profiles').select('id,username,avatar_url,bio,level,coins,created_at').eq('id',id).maybeSingle(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout-profile')),8000))]);if(r2.error)throw r2.error;if(!r2.data){content.innerHTML='<div class="card error">Perfil não encontrado.</div>';return}show(r2.data,id===me.id)}catch(e){console.error(e);content.innerHTML='<div class="card error">Não foi possível carregar o perfil. Tente novamente.</div>'}}async function save(){const msg=document.getElementById('msg'),b=document.getElementById('save');b.disabled=true;try{const username=document.getElementById('username').value.trim(),bio=document.getElementById('bio').value.trim();if(username.length<3)throw new Error('Nome muito curto');const r=await client.from('profiles').update({username,bio:bio||null}).eq('id',me.id);if(r.error)throw r.error;msg.textContent='Perfil atualizado! ✅';await load()}catch(e){msg.textContent=e?.code==='23505'||String(e?.message||'').includes('username_already_exists')?'Esse nome de usuário já está em uso.':'Erro: '+(e.message||'Não foi possível salvar.')}finally{b.disabled=false}}load();</script></body></html>
