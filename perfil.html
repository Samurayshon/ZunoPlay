<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#070811;color:#fff;font-family:Arial,sans-serif}.app{max-width:480px;min-height:100vh;margin:auto;padding:25px}.header{display:flex;align-items:center;gap:15px;margin-bottom:25px}.home{width:42px;height:42px;border-radius:12px;border:1px solid #303145;background:#1b1c2b;color:#fff;font-size:20px}.logo{font-size:28px;font-weight:800}.logo span{color:#8b5cf6}.card{background:#141523;border:1px solid #303145;border-radius:24px;padding:25px}.loading{text-align:center;color:#9293a3;padding:45px 10px}.error{text-align:center;color:#fca5a5}.name{text-align:center;font-size:24px;font-weight:bold}.email{text-align:center;color:#9293a3;font-size:13px;margin:6px 0 20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:#11121e;border:1px solid #292a3d;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:18px}.stat small{color:#858697}.field{margin-top:14px}.field label{display:block;color:#c9c9d4;font-size:13px;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #303145;background:#11121e;color:#fff;font-size:15px}.field textarea{min-height:90px;resize:vertical}.btn{width:100%;padding:15px;margin-top:14px;border:0;border-radius:13px;font-weight:bold;color:#fff;background:#7651d6}.msg{text-align:center;margin-top:12px;font-size:13px}.msg.err{color:#fca5a5}</style></head><body><main class="app"><header class="header"><button class="home" onclick="location.href='index.html'">⌂</button><div class="logo">Zuno<span>Play</span></div></header><div id="content"><div class="card loading">Carregando perfil...</div></div></main><script>
const client=window.supabase.createClient('https://rliymfbbhqoejgfvsbuu.supabase.co','sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0');
const content=document.getElementById('content'),target=new URLSearchParams(location.search).get('user');let me=null,currentProfile=null;
const esc=v=>{const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML};
const validUuid=v=>/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(v||''));
function show(p,own){currentProfile=p;content.innerHTML='<section class="card"><div class="name">'+esc(p.username||'ZunoPlayer')+'</div><div class="email">'+(own?esc(me.email||''):'Perfil público')+'</div><div class="stats"><div class="stat"><b>'+Number(p.level||0)+'</b><small>Nível</small></div><div class="stat"><b>'+Number(p.coins||0)+'</b><small>Moedas</small></div><div class="stat"><b>'+esc(p.created_at?new Date(p.created_at).toLocaleDateString('pt-BR'):'-')+'</b><small>Desde</small></div></div>'+(own?'<div class="field"><label>Nome de usuário</label><input id="username" minlength="3" maxlength="20" autocomplete="username" value="'+esc(p.username||'')+'"></div><div class="field"><label>Bio</label><textarea id="bio" maxlength="300">'+esc(p.bio||'')+'</textarea></div><button class="btn" id="save">Salvar alterações</button><div id="msg" class="msg"></div>':'<p style="text-align:center;color:#c4c4cf">'+esc(p.bio||'Este usuário ainda não adicionou uma bio.')+'</p>')+'</section>';if(own)document.getElementById('save').onclick=save}
async function load(){try{const {data:{session},error:sErr}=await client.auth.getSession();if(sErr||!session){location.href='login.html?next='+encodeURIComponent(location.pathname+location.search);return}const {data:{user},error:uErr}=await client.auth.getUser();if(uErr||!user){await client.auth.signOut({scope:'local'}).catch(()=>{});location.href='login.html';return}me=user;const id=target||me.id;if(target&&!validUuid(target)){content.innerHTML='<div class="card error">Perfil inválido.</div>';return}const {data,error}=await client.from('profiles').select('id,username,bio,level,coins,created_at').eq('id',id).maybeSingle();if(error)throw error;if(!data){content.innerHTML='<div class="card error">Perfil não encontrado.</div>';return}show(data,id===me.id)}catch(e){console.error(e);content.innerHTML='<div class="card error">Não foi possível carregar o perfil. Tente novamente.</div>'}}
async function save(){const msg=document.getElementById('msg'),b=document.getElementById('save');b.disabled=true;msg.className='msg';msg.textContent='';try{const username=document.getElementById('username').value.trim(),bio=document.getElementById('bio').value.trim();if(username.length<3||username.length>20)throw new Error('O nome precisa ter entre 3 e 20 caracteres.');if(bio.length>300)throw new Error('A bio pode ter no máximo 300 caracteres.');const {error}=await client.from('profiles').update({username,bio:bio||null}).eq('id',me.id);if(error)throw error;const currentData={...(me.user_metadata||{}),username};const {error:metaError}=await client.auth.updateUser({data:currentData});if(metaError)console.warn('Perfil salvo, mas metadata não sincronizado',metaError);msg.textContent='Perfil atualizado! ✅';currentProfile={...currentProfile,username,bio:bio||null};setTimeout(load,250)}catch(e){msg.className='msg err';msg.textContent=e?.code==='23505'||String(e?.message||'').includes('username_already_exists')?'Esse nome de usuário já está em uso.':(e.message||'Não foi possível salvar.')}finally{b.disabled=false}}
load();
</script></body></html>
