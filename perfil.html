<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Perfil - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 20% 20%,#25145c 0%,transparent 35%),radial-gradient(circle at 80% 80%,#102d59 0%,transparent 35%),#070811;color:white}.app{width:100%;max-width:480px;min-height:100vh;margin:auto;padding:25px}.header{display:flex;align-items:center;gap:15px;padding-top:20px;margin-bottom:25px}.home-button{width:42px;height:42px;border-radius:12px;border:1px solid #303145;background:#1b1c2b;color:white;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.logo{font-size:28px;font-weight:800}.logo span{color:#8b5cf6}.card{background:rgba(20,21,35,.9);border:1px solid rgba(139,92,246,.2);border-radius:24px;padding:25px;box-shadow:0 20px 50px rgba(0,0,0,.35)}.avatar{width:90px;height:90px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:bold}.profile-name{text-align:center;font-size:24px;font-weight:bold}.profile-email{text-align:center;color:#9293a3;font-size:13px;margin-top:6px;margin-bottom:28px}.info{background:#11121e;border:1px solid #292a3d;border-radius:14px;padding:15px;margin-top:12px}.info-label{color:#858697;font-size:12px;margin-bottom:5px}.info-value{font-size:14px;word-break:break-all}label{display:block;color:#c9c9d4;font-size:13px;margin-top:22px;margin-bottom:7px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #303145;background:#11121e;color:white;outline:none;font-size:15px}input:focus{border-color:#8b5cf6}.button{width:100%;padding:15px;margin-top:15px;border:none;border-radius:13px;font-size:15px;font-weight:bold;cursor:pointer}.save{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:white}.save:disabled{opacity:.6}.logout{background:#171824;border:1px solid #303145;color:#ff8f8f}.message{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:13px;text-align:center}.message.success{display:block;background:rgba(34,197,94,.12);color:#86efac}.message.error{display:block;background:rgba(239,68,68,.12);color:#fca5a5}</style></head><body><div id="app" class="app"><div class="header"><button class="home-button" type="button" onclick="window.location.href='index.html'" aria-label="Voltar para a tela inicial" title="Tela inicial">⌂</button><div class="logo">Zuno<span>Play</span></div></div><div class="card"><div id="avatar" class="avatar">S</div><div id="profileName" class="profile-name">Carregando...</div><div id="profileEmail" class="profile-email">Carregando...</div><div class="info"><div class="info-label">ID da conta</div><div id="userId" class="info-value">Carregando...</div></div><div class="info"><div class="info-label">Conta criada em</div><div id="createdAt" class="info-value">Carregando...</div></div><label for="newUsername">Nome de usuário</label><input type="text" id="newUsername" placeholder="Digite seu novo nome" minlength="3" maxlength="20" autocomplete="off"><button id="saveButton" class="button save">Salvar alteração</button><div id="message" class="message"></div><button id="logoutButton" class="button logout">Sair da conta</button></div></div><script>const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co",SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const avatar=document.getElementById("avatar"),profileName=document.getElementById("profileName"),profileEmail=document.getElementById("profileEmail"),userId=document.getElementById("userId"),createdAt=document.getElementById("createdAt"),newUsername=document.getElementById("newUsername"),saveButton=document.getElementById("saveButton"),logoutButton=document.getElementById("logoutButton"),message=document.getElementById("message");function showMessage(text,type){message.className="message "+type;message.textContent=text}function showProfile(user){if(!user){profileName.textContent="Não conectado";profileEmail.textContent="";newUsername.disabled=true;saveButton.disabled=true;return}let username=user.user_metadata?.username||user.email?.split("@")[0]||"ZunoPlayer";profileName.textContent=username;profileEmail.textContent=user.email||"Sem e-mail";userId.textContent=user.id;if(user.created_at)createdAt.textContent=new Date(user.created_at).toLocaleDateString("pt-BR");newUsername.value=username;avatar.textContent=username.charAt(0).toUpperCase()}async function loadProfile(){try{const result=await Promise.race([supabaseClient.auth.getSession(),new Promise(resolve=>setTimeout(()=>resolve({data:{session:null}}),5000))]);const session=result?.data?.session;if(!session){window.location.href="login.html";return}showProfile(session.user)}catch(error){console.error("Erro ao carregar perfil:",error);profileName.textContent="Erro ao carregar";profileEmail.textContent="Tente atualizar a página."}}saveButton.addEventListener("click",async function(){const username=newUsername.value.trim();if(username.length<3){showMessage("O nome precisa ter pelo menos 3 caracteres.","error");return}if(username.length>20){showMessage("O nome pode ter no máximo 20 caracteres.","error");return}saveButton.disabled=true;saveButton.textContent="Salvando...";message.className="message";try{const result=await supabaseClient.auth.updateUser({data:{username}});if(result.error)throw result.error;showProfile(result.data.user);showMessage("Nome atualizado com sucesso! ✅","success")}catch(error){console.error("Erro ao atualizar perfil:",error);showMessage("Erro ao salvar: "+error.message,"error")}saveButton.disabled=false;saveButton.textContent="Salvar alteração"});logoutButton.addEventListener("click",async function(){logoutButton.disabled=true;logoutButton.textContent="Saindo...";try{await supabaseClient.auth.signOut()}catch(error){console.error("Erro ao sair:",error)}window.location.href="index.html"});supabaseClient.auth.onAuthStateChange(function(event,session){if(event==="SIGNED_IN"&&session?.user)showProfile(session.user);if(event==="SIGNED_OUT")window.location.href="login.html"});loadProfile();</script></body></html>
