<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Perfil - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 20% 20%,#25145c 0%,transparent 35%),radial-gradient(circle at 80% 80%,#102d59 0%,transparent 35%),#070811;color:white}.app{width:100%;max-width:480px;min-height:100vh;margin:auto;padding:25px}.header{display:flex;align-items:center;gap:15px;padding-top:20px;margin-bottom:25px}.home-button{width:42px;height:42px;border-radius:12px;border:1px solid #303145;background:#1b1c2b;color:white;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.logo{font-size:28px;font-weight:800}.logo span{color:#8b5cf6}.card{background:rgba(20,21,35,.9);border:1px solid rgba(139,92,246,.2);border-radius:24px;padding:25px;box-shadow:0 20px 50px rgba(0,0,0,.35)}.avatar{width:90px;height:90px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:bold;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.profile-name{text-align:center;font-size:24px;font-weight:bold}.profile-email{text-align:center;color:#9293a3;font-size:13px;margin-top:6px;margin-bottom:20px}.bio{text-align:center;color:#c4c4cf;line-height:1.5;font-size:14px;white-space:pre-wrap;word-break:break-word;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.stat{background:#11121e;border:1px solid #292a3d;border-radius:14px;padding:13px;text-align:center}.stat strong{display:block;font-size:18px}.stat span{display:block;color:#858697;font-size:10px;margin-top:4px}.info{background:#11121e;border:1px solid #292a3d;border-radius:14px;padding:15px;margin-top:12px}.info-label{color:#858697;font-size:12px;margin-bottom:5px}.info-value{font-size:14px;word-break:break-all}label{display:block;color:#c9c9d4;font-size:13px;margin-top:22px;margin-bottom:7px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #303145;background:#11121e;color:white;outline:none;font-size:15px}textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #303145;background:#11121e;color:white;outline:none;font-size:15px;min-height:90px;resize:vertical}input:focus,textarea:focus{border-color:#8b5cf6}.button{width:100%;padding:15px;margin-top:15px;border:none;border-radius:13px;font-size:15px;font-weight:bold;cursor:pointer}.save{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:white}.secondary{background:#171824;border:1px solid #303145;color:white}.logout{background:#171824;border:1px solid #303145;color:#ff8f8f}.message{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:13px;text-align:center}.message.success{display:block;background:rgba(34,197,94,.12);color:#86efac}.message.error{display:block;background:rgba(239,68,68,.12);color:#fca5a5}.loading{text-align:center;color:#9293a3;padding:40px}.error-card{margin-top:25px;text-align:center;color:#fca5a5}.public-badge{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;background:rgba(139,92,246,.14);color:#c4b5fd;font-size:10px}</style></head><body><div id="app" class="app"><div class="header"><button class="home-button" type="button" onclick="window.location.href='index.html'" aria-label="Voltar para a tela inicial" title="Tela inicial">⌂</button><div class="logo">Zuno<span>Play</span></div></div><div id="content"><div class="loading">Carregando perfil...</div></div></div><script>const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co",SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),content=document.getElementById("content"),targetId=new URLSearchParams(location.search).get("user"),goHome=()=>location.href="index.html";let currentUser=null;const esc=v=>{const d=document.createElement("div");d.textContent=v??"";return d.innerHTML};const fmtDate=v=>v?new Date(v).toLocaleDateString("pt-BR"):"";const initial=v=>(v||"?").charAt(0).toUpperCase();const avatarHtml=(p)=>p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="">':esc(initial(p.username));function showError(msg){content.innerHTML='<div class="card error-card">'+esc(msg)+'</div>'}function profileView(p,isOwn){const bio=esc(p.bio||"Este usuário ainda não adicionou uma bio.");const level=Number.isFinite(p.level)?p.level:0;const coins=Number.isFinite(p.coins)?p.coins:0;const joined=fmtDate(p.created_at);if(isOwn){content.innerHTML='<div class="card"><div id="avatar" class="avatar">'+avatarHtml(p)+'</div><div id="profileName" class="profile-name">'+esc(p.username||"ZunoPlayer")+'</div><div class="profile-email">'+esc(currentUser?.email||"")+'</div><div class="stats"><div class="stat"><strong>'+level+'</strong><span>Nível</span></div><div class="stat"><strong>'+coins+'</strong><span>Moedas</span></div><div class="stat"><strong>'+esc(joined||"-")+'</strong><span>Desde</span></div></div><label for="newUsername">Nome de usuário</label><input type="text" id="newUsername" value="'+esc(p.username||"")+'" minlength="3" maxlength="20" autocomplete="off"><label for="newBio">Bio</label><textarea id="newBio" maxlength="300" placeholder="Fale um pouco sobre você...">'+bio.replace(/^Este usuário ainda não adicionou uma bio\.$/,"")+'</textarea><label for="newAvatar">URL da foto</label><input type="url" id="newAvatar" value="'+esc(p.avatar_url||"")+'" maxlength="500" placeholder="https://..."><button id="saveButton" class="button save">Salvar alteração</button><div id="message" class="message"></div><button id="logoutButton" class="button logout">Sair da conta</button></div>';document.getElementById("saveButton").onclick=saveOwnProfile;document.getElementById("logoutButton").onclick=logout}else{content.innerHTML='<div class="card"><div id="avatar" class="avatar">'+avatarHtml(p)+'</div><div class="profile-name">'+esc(p.username||"ZunoPlayer")+'</div><div class="public-badge">Perfil público</div><div class="bio">'+bio+'</div><div class="stats"><div class="stat"><strong>'+level+'</strong><span>Nível</span></div><div class="stat"><strong>'+coins+'</strong><span>Moedas</span></div><div class="stat"><strong>'+esc(joined||"-")+'</strong><span>Desde</span></div></div><button class="button secondary" onclick="location.href='conversas.html?user='+encodeURIComponent('+JSON.stringify(p.id)+')">💬 Abrir conversa</button></div>'}}async function loadProfile(){const{data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();if(sessionError||!sessionData?.session?.user){location.href="login.html";return}currentUser=sessionData.session.user;const id=targetId||currentUser.id;const{data:p,error}=await supabaseClient.from("profiles").select("id,username,avatar_url,bio,level,coins,created_at").eq("id",id).maybeSingle();if(error||!p){showError("Perfil não encontrado.");return}profileView(p,id===currentUser.id)}async function saveOwnProfile(){const save=document.getElementById("saveButton"),message=document.getElementById("message"),username=document.getElementById("newUsername").value.trim(),bio=document.getElementById("newBio").value.trim(),avatarUrl=document.getElementById("newAvatar").value.trim();if(username.length<3||username.length>20){message.className="message error";message.textContent="O nome precisa ter entre 3 e 20 caracteres.";return}save.disabled=true;save.textContent="Salvando...";try{const{error:a}=await supabaseClient.auth.updateUser({data:{username}});if(a)throw a;const{error:p}=await supabaseClient.from("profiles").update({username,bio:bio||null,avatar_url:avatarUrl||null}).eq("id",currentUser.id);if(p)throw p;message.className="message success";message.textContent="Perfil atualizado com sucesso! ✅";await loadProfile()}catch(e){message.className="message error";message.textContent="Erro ao salvar: "+e.message}finally{save.disabled=false;save.textContent="Salvar alteração"}}async function logout(){const b=document.getElementById("logoutButton");b.disabled=true;b.textContent="Saindo...";await supabaseClient.auth.signOut();goHome()}loadProfile();</script></body></html>
