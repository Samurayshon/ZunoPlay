<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Histórico - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 20% 20%,#25145c 0%,transparent 35%),radial-gradient(circle at 80% 80%,#102d59 0%,transparent 35%),#070811;color:white}.app{width:100%;max-width:480px;min-height:100vh;margin:auto;padding:25px}.header{display:flex;align-items:center;gap:15px;padding-top:20px;margin-bottom:25px}.home-button{width:42px;height:42px;border-radius:12px;border:1px solid #303145;background:#1b1c2b;color:white;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.logo{font-size:28px;font-weight:800}.logo span{color:#8b5cf6}.card{background:rgba(20,21,35,.9);border:1px solid rgba(139,92,246,.2);border-radius:24px;padding:20px}.title{font-size:23px;margin-bottom:8px}.subtitle{color:#9293a3;font-size:13px;margin-bottom:20px}.status{background:#11121e;border:1px solid #303145;border-radius:14px;padding:15px;font-size:12px;line-height:1.7;word-break:break-word}.success{color:#86efac}.error{color:#fca5a5}.muted{color:#9293a3}.item{background:#11121e;border:1px solid #292a3d;border-radius:15px;padding:15px;margin-top:12px}.item-top{display:flex;justify-content:space-between;gap:10px}.game{font-weight:bold}.score{color:#a78bfa;font-weight:bold}.info{color:#9293a3;font-size:12px;margin-top:8px}</style></head><body><div class="app"><div class="header"><button class="home-button" type="button" onclick="window.location.href='index.html'" aria-label="Voltar para a tela inicial" title="Tela inicial">⌂</button><div class="logo">Zuno<span>Play</span></div></div><div class="card"><h1 class="title">📊 Histórico de partidas</h1><p class="subtitle">Suas partidas e pontuações registradas no ZunoPlay.</p><div id="status" class="status">🔄 Carregando histórico...</div><div id="history"></div></div></div><script>const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co",SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),statusElement=document.getElementById("status"),historyElement=document.getElementById("history");function esc(v){const d=document.createElement("div");d.textContent=v==null?"":String(v);return d.innerHTML}async function start(){try{const{data,error}=await supabaseClient.auth.getSession();if(error)throw error;const user=data?.session?.user;if(!user){location.href="login.html";return}const result=await supabaseClient.from("game_scores").select("id,user_id,game,score,questions,correct_answers,created_at").eq("user_id",user.id).order("created_at",{ascending:false});if(result.error)throw result.error;const games=result.data||[];historyElement.innerHTML="";if(!games.length){statusElement.className="status muted";statusElement.textContent="Você ainda não possui partidas registradas.";return}statusElement.className="status success";statusElement.textContent="✅ "+games.length+" partida"+(games.length===1?" encontrada.":"s encontradas.");games.forEach(game=>{const div=document.createElement("div");div.className="item";const questions=Number(game.questions)||0,correct=Number(game.correct_answers)||0,score=Number(game.score)||0;div.innerHTML='<div class="item-top"><div class="game">🎯 '+esc(game.game||"Partida")+'</div><div class="score">⭐ '+esc(score)+'</div></div><div class="info">❓ '+esc(questions)+' perguntas</div><div class="info">✅ '+esc(correct)+' acertos</div><div class="info">📅 '+esc(new Date(game.created_at).toLocaleString("pt-BR"))+'</div>';historyElement.appendChild(div)})}catch(error){console.error("Erro ao carregar histórico:",error);statusElement.className="status error";statusElement.textContent="Não foi possível carregar o histórico. Tente novamente."}}start();</script></body></html>
