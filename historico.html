<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Histórico - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 20% 20%,#25145c 0%,transparent 35%),radial-gradient(circle at 80% 80%,#102d59 0%,transparent 35%),#070811;color:white}.app{width:100%;max-width:480px;min-height:100vh;margin:auto;padding:25px}.header{display:flex;align-items:center;gap:15px;padding-top:20px;margin-bottom:25px}.home-button{width:42px;height:42px;border-radius:12px;border:1px solid #303145;background:#1b1c2b;color:white;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.logo{font-size:28px;font-weight:800}.logo span{color:#8b5cf6}.card{background:rgba(20,21,35,.9);border:1px solid rgba(139,92,246,.2);border-radius:24px;padding:20px}.title{font-size:23px;margin-bottom:8px}.subtitle{color:#9293a3;font-size:13px;margin-bottom:20px}.status{background:#11121e;border:1px solid #303145;border-radius:14px;padding:15px;font-size:12px;line-height:1.7;word-break:break-word}.success{color:#86efac}.error{color:#fca5a5}.item{background:#11121e;border:1px solid #292a3d;border-radius:15px;padding:15px;margin-top:12px}.item-top{display:flex;justify-content:space-between;gap:10px}.game{font-weight:bold}.score{color:#a78bfa;font-weight:bold}.info{color:#9293a3;font-size:12px;margin-top:8px}</style></head><body><div class="app"><div class="header"><button class="home-button" type="button" onclick="window.location.href='index.html'" aria-label="Voltar para a tela inicial" title="Tela inicial">⌂</button><div class="logo">Zuno<span>Play</span></div></div><div class="card"><h1 class="title">📊 Histórico de partidas</h1><p class="subtitle">Diagnóstico do histórico do ZunoPlay.</p><div id="status" class="status">🔄 Verificando...</div><div id="history"></div></div></div><script>const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co",SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),statusElement=document.getElementById("status"),historyElement=document.getElementById("history");async function start(){try{statusElement.innerHTML="🔄 Verificando sessão...";const sessionResult=await supabaseClient.auth.getSession();if(sessionResult.error)throw sessionResult.error;const session=sessionResult.data.session,user=session?.user;if(!user){statusElement.className="status error";statusElement.innerHTML="❌ Nenhum usuário está logado nesta página.";return}statusElement.innerHTML="✅ Usuário encontrado.<br><br><strong>ID:</strong><br>"+user.id+"<br><br>🔄 Buscando partidas...";const result=await supabaseClient.from("game_scores").select("id,user_id,game,score,questions,correct_answers,created_at").eq("user_id",user.id).order("created_at",{ascending:false});if(result.error)throw result.error;const games=result.data||[];if(!games.length){statusElement.className="status error";statusElement.innerHTML="⚠️ Usuário logado, mas nenhuma partida foi retornada.<br><br><strong>ID pesquisado:</strong><br>"+user.id;return}statusElement.className="status success";statusElement.innerHTML="✅ Histórico encontrado!<br><br>Partidas encontradas: "+games.length;historyElement.innerHTML="";games.forEach(game=>{const div=document.createElement("div");div.className="item";div.innerHTML=`<div class="item-top"><div class="game">🎯 ${game.game}</div><div class="score">⭐ ${game.score}</div></div><div class="info">❓ ${game.questions} perguntas</div><div class="info">✅ ${game.correct_answers} acertos</div><div class="info">🆔 ${game.id}</div><div class="info">👤 ${game.user_id}</div><div class="info">📅 ${new Date(game.created_at).toLocaleString("pt-BR")}</div>`;historyElement.appendChild(div)})}catch(error){console.error("ERRO:",error);statusElement.className="status error";statusElement.innerHTML="❌ ERRO AO BUSCAR HISTÓRICO<br><br><strong>Código:</strong> "+(error.code||"sem código")+"<br><br><strong>Mensagem:</strong><br>"+(error.message||error)}}start();</script></body></html>
