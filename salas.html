<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Salas - ZunoPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 20% 20%,
            #25145c 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            #102d59 0%,
            transparent 35%
        ),
        #070811;

    color: white;

}

.app {

    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;

}

.header {

    display: flex;
    align-items: center;
    gap: 12px;

    padding: 20px;

    border-bottom: 1px solid #292a3d;

    background: rgba(10,11,20,.95);

}

.back {

    width: 42px;
    height: 42px;

    border-radius: 12px;

    border: 1px solid #303145;

    background: #1b1c2b;

    color: white;

    font-size: 20px;

    cursor: pointer;

}

.logo {

    font-size: 28px;
    font-weight: 800;

}

.logo span {

    color: #8b5cf6;

}

.page {

    padding: 20px;

}

.title {

    font-size: 26px;

    margin-bottom: 8px;

}

.subtitle {

    color: #9293a3;

    font-size: 14px;

    margin-bottom: 20px;

}

.status {

    padding: 12px;

    margin-bottom: 15px;

    border-radius: 12px;

    background: #141523;

    border: 1px solid #292a3d;

    color: #4ade80;

    font-size: 13px;

}

.room {

    width: 100%;

    padding: 18px;

    margin-bottom: 12px;

    border-radius: 18px;

    border: 1px solid #292a3d;

    background: rgba(20,21,35,.9);

}

.room-name {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 7px;

}

.room-info {

    color: #858697;

    font-size: 12px;

    margin-bottom: 15px;

}

.enter-button {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6366f1
        );

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}

.enter-button:disabled {

    opacity: .6;

}

.empty {

    text-align: center;

    color: #737486;

    padding: 50px 20px;

    font-size: 14px;

}

</style>

</head>

<body>

<div
    id="app"
    class="app"
>

    <div class="header">

        <button
            class="back"
            onclick="history.back()"
        >

            ←

        </button>

        <div class="logo">

            Zuno<span>Play</span>

        </div>

    </div>


    <div class="page">

        <h1 class="title">

            🎙️ Salas

        </h1>


        <p class="subtitle">

            Encontre pessoas e participe
            de uma sala.

        </p>


        <div
            id="status"
            class="status"
        >

            ⏳ Carregando salas...

        </div>


        <div id="roomList">

            <div class="empty">

                Carregando...

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   ELEMENTOS
========================================= */

const statusElement =
document.getElementById(
    "status"
);

const roomList =
document.getElementById(
    "roomList"
);


/* =========================================
   SEGURANÇA
========================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text || "";

    return div.innerHTML;

}


/* =========================================
   DATA
========================================= */

function formatDate(
    dateString
) {

    const date =
        new Date(
            dateString
        );

    return date.toLocaleDateString(
        "pt-BR"
    );

}


/* =========================================
   CARREGAR SALAS
========================================= */

async function loadRooms() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("rooms")
            .select(
                "id, name, owner_id, created_at"
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if(error) {

            console.error(
                error
            );


            statusElement.textContent =
                "❌ Erro ao carregar salas";


            roomList.innerHTML = `

                <div class="empty">

                    Não foi possível carregar
                    as salas.

                    <br><br>

                    ${escapeHTML(
                        error.message
                    )}

                </div>

            `;

            return;

        }


        statusElement.textContent =

            "✅ " +
            data.length +
            " sala(s) encontrada(s)";


        roomList.innerHTML = "";


        if(!data.length) {

            roomList.innerHTML = `

                <div class="empty">

                    Nenhuma sala disponível.

                </div>

            `;

            return;

        }


        data.forEach(
            function(room) {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "room";


                item.innerHTML = `

                    <div class="room-name">

                        🎙️
                        ${escapeHTML(
                            room.name
                        )}

                    </div>


                    <div class="room-info">

                        Sala criada em
                        ${formatDate(
                            room.created_at
                        )}

                    </div>


                    <button
                        class="enter-button"
                        data-room-id="${room.id}"
                        onclick="enterRoom('${room.id}')"
                    >

                        Entrar na sala

                    </button>

                `;


                roomList.appendChild(
                    item
                );

            }
        );


    } catch(error) {

        console.error(
            error
        );


        statusElement.textContent =
            "❌ Erro inesperado";


        roomList.innerHTML = `

            <div class="empty">

                Ocorreu um erro ao
                carregar as salas.

            </div>

        `;

    }

}


/* =========================================
   ENTRAR NA SALA
========================================= */

async function enterRoom(
    roomId
) {

    const button =
        document.querySelector(
            `[data-room-id="${roomId}"]`
        );


    if(button) {

        button.disabled =
            true;

        button.textContent =
            "Entrando...";

    }


    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getUser();


        if(error || !data?.user) {

            alert(
                "Você precisa estar conectado."
            );

            return;

        }


        const user =
            data.user;


        const result =
            await supabaseClient
                .from(
                    "room_members"
                )
                .upsert(
                    {
                        room_id:
                            roomId,

                        user_id:
                            user.id
                    },
                    {
                        onConflict:
                            "room_id,user_id"
                    }
                );


        if(result.error) {

            console.error(
                result.error
            );


            alert(
                "Não foi possível entrar na sala:\n\n" +
                result.error.message
            );

            return;

        }


        alert(
            "Você entrou na sala!"
        );


    } catch(error) {

        console.error(
            error
        );


        alert(
            "Ocorreu um erro ao entrar na sala."
        );

    } finally {

        if(button) {

            button.disabled =
                false;

            button.textContent =
                "Entrar na sala";

        }

    }

}


/* =========================================
   INICIAR
========================================= */

loadRooms();

</script>

</body>

</html>
