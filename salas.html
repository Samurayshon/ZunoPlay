<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Salas - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 20% 20%,#25145c 0%,transparent 35%),radial-gradient(circle at 80% 80%,#102d59 0%,transparent 35%),#070811;color:#fff}.app{width:100%;max-width:480px;min-height:100vh;margin:auto}.header{display:flex;align-items:center;gap:12px;padding:20px;border-bottom:1px solid #292a3d;background:rgba(10,11,20,.95)}.home-button{width:42px;height:42px;border-radius:12px;border:1px solid #303145;background:#1b1c2b;color:#fff;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.logo{font-size:28px;font-weight:800}.logo span{color:#8b5cf6}.page{padding:20px}.title{font-size:25px;margin-bottom:6px}.subtitle{color:#9293a3;font-size:13px;margin-bottom:20px}.status{padding:12px;margin-bottom:15px;border-radius:12px;background:#141523;border:1px solid #292a3d;color:#4ade80;font-size:12px}.room{width:100%;padding:16px;margin-bottom:12px;border-radius:16px;border:1px solid #292a3d;background:rgba(20,21,35,.9);color:#fff}.room-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.room-name{font-size:17px;font-weight:bold}.room-info{color:#858697;font-size:12px;margin-top:6px}.enter-button{flex-shrink:0;padding:10px 15px;border:none;border-radius:11px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-weight:bold;cursor:pointer}.enter-button:disabled{opacity:.6;cursor:default}.empty{text-align:center;color:#737486;padding:60px 20px;font-size:14px}.error{color:#ff8f8f;text-align:center;padding:30px 10px;line-height:1.5}</style></head><body><div id="app" class="app"></div><script>const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co",SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),app=document.getElementById("app");let currentUser=null;function header(){return '<div class="header"><button class="home-button" type="button" onclick="location.href=\'index.html\'" aria-label="Voltar para a tela inicial" title="Tela inicial">⌂</button><div class="logo">Zuno<span>Play</span></div></div>'}function escapeHTML(text){const div=document.createElement("div");div.textContent=text||"";return div.innerHTML}function formatDate(dateString){return new Date(dateString).toLocaleDateString("pt-BR")}async function getCurrentUser(){const{data,error}=await supabaseClient.auth.getUser();if(error){console.error("Erro ao verificar usuário:",error);return null}return data?.user||null}async function enterRoom(roomId){if(!currentUser)return alert("Você precisa estar conectado para entrar em uma sala.");if(!roomId)return alert("ID da sala não encontrado.");const button=document.querySelector(`[data-room-id="${roomId}"]`);if(button){button.disabled=true;button.textContent="Entrando..."}try{const{error}=await supabaseClient.from("room_members").upsert({room_id:roomId,user_id:currentUser.id},{onConflict:"room_id,user_id"});if(error){console.error("Erro ao entrar na sala:",error);alert("Não foi possível entrar na sala:\n\n"+error.message);return}window.location.href="sala.html?room="+encodeURIComponent(roomId)}catch(error){console.error("Erro inesperado:",error);alert("Ocorreu um erro:\n\n"+error.message)}finally{if(button){button.disabled=false;button.textContent="Entrar"}}}async function loadRooms(){app.innerHTML=header()+`<div class="page"><h1 class="title">🎙️ Salas</h1><p class="subtitle">Encontre pessoas e participe de uma sala.</p><div id="status" class="status">⏳ Carregando salas...</div><div id="roomList"><div class="empty">Carregando...</div></div></div>`;const{data,error}=await supabaseClient.from("rooms").select("id, name, owner_id, created_at").order("created_at",{ascending:false});const status=document.getElementById("status"),roomList=document.getElementById("roomList");if(error){console.error("Erro ao carregar salas:",error);status.textContent="❌ Erro ao carregar salas";roomList.innerHTML='<div class="error">Não foi possível carregar as salas.<br><br>'+escapeHTML(error.message)+"</div>";return}status.textContent="✅ "+data.length+" sala(s) encontrada(s)";roomList.innerHTML="";if(!data.length){roomList.innerHTML='<div class="empty">Nenhuma sala disponível.</div>';return}data.forEach(room=>{const item=document.createElement("div");item.className="room";item.innerHTML=`<div class="room-top"><div><div class="room-name">🎙️ ${escapeHTML(room.name)}</div><div class="room-info">Sala criada em ${formatDate(room.created_at)}</div></div><button class="enter-button" data-room-id="${room.id}">Entrar</button></div>`;item.querySelector(".enter-button").addEventListener("click",()=>enterRoom(room.id));roomList.appendChild(item)})}async function init(){app.innerHTML=header()+'<div class="page"><div class="empty">⏳ Verificando usuário...</div></div>';currentUser=await getCurrentUser();if(!currentUser){app.innerHTML=header()+'<div class="page"><div class="empty">Você precisa estar conectado para acessar as salas.</div></div>';return}await loadRooms()}init();</script></body></html>
