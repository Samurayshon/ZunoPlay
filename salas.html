<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Salas - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js?v=200"></script><style>body{margin:0;background:#02040d;color:#fff;font-family:Arial,sans-serif}.app{max-width:560px;margin:auto;padding:18px 14px 110px}.title{font-size:25px;font-weight:950}.subtitle{color:#9fa4ba;font-size:13px}.status{margin:14px 0;padding:12px;border-radius:14px;background:#0b1022;border:1px solid #2e345b;color:#7bf0ad}.room{margin:12px 0;padding:16px;border-radius:18px;background:#080b1c;border:1px solid #2e345b}.room.current{border-color:#31dd7b}.room-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.room-name{font-size:16px;font-weight:900}.room-info{font-size:11px;color:#85899e;margin-top:5px}.enter-button{padding:11px 16px;border:0;border-radius:13px;background:linear-gradient(135deg,#843bff,#c33fff 58%,#31d3ff);color:#fff;font-weight:900}.enter-button:disabled{opacity:.45}.empty,.error{text-align:center;padding:36px 12px;color:#85899e}.error{color:#ff9bb2}</style></head><body><div id="app" class="app"><h1 class="title">Salas</h1><p class="subtitle">Entre em uma sala de voz e conecte-se ao vivo.</p><div id="status" class="status">Carregando salas...</div><div id="roomList"><div class="empty">Carregando...</div></div></div><script>const URL='https://rliymfbbhqoejgfvsbuu.supabase.co',KEY='sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0',sb=window.ZunoSupabaseClient||window.supabase.createClient(URL,KEY),statusEl=document.getElementById('status'),list=document.getElementById('roomList');let user=null,currentRoomId=null;const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML};async function session(){const{data,error}=await sb.auth.getSession();if(error)throw error;return data.session}async function bootstrapAndOpen(roomId){const s=await session();if(!s?.user)throw new Error('Sessão não encontrada.');sessionStorage.setItem('zunoplay_room_id',roomId);sessionStorage.setItem('zuno_room_bootstrap',JSON.stringify({room_id:roomId,access_token:s.access_token,user:s.user,at:Date.now()}));location.href='sala-v200.html?room='+encodeURIComponent(roomId)+'&build=200&t='+Date.now()}async function loadCurrent(){const{data,error}=await sb.from('room_members').select('room_id').eq('user_id',user.id).maybeSingle();if(error)throw error;currentRoomId=data?.room_id||null;if(currentRoomId)sessionStorage.setItem('zunoplay_room_id',currentRoomId)}async function enter(roomId,button){button.disabled=true;button.textContent='Entrando...';try{if(currentRoomId){if(currentRoomId!==roomId){alert('Você já está em outra sala. Saia dela antes de entrar nesta.');return}await bootstrapAndOpen(roomId);return}const{data,error}=await sb.rpc('join_room_session',{p_room_id:roomId});if(error)throw error;currentRoomId=data?.room_id||roomId;await bootstrapAndOpen(currentRoomId)}catch(e){console.error(e);alert('Não foi possível abrir a sala: '+(e.message||'erro desconhecido'))}finally{button.disabled=false;button.textContent=currentRoomId===roomId?'Voltar':'Entrar'}}async function init(){try{const s=await session();user=s?.user;if(!user){location.href='login.html?next='+encodeURIComponent('salas.html?v=200');return}await loadCurrent();const{data,error}=await sb.from('rooms').select('id,name,owner_id,created_at').order('created_at',{ascending:false});if(error)throw error;statusEl.textContent=currentRoomId?'● Você já está em uma sala':'● '+data.length+' sala(s) disponível(is)';list.innerHTML='';if(!data.length){list.innerHTML='<div class="empty">Nenhuma sala disponível.</div>';return}data.forEach(r=>{const current=r.id===currentRoomId,card=document.createElement('div');card.className='room'+(current?' current':'');card.innerHTML='<div class="room-top"><div><div class="room-name">'+esc(r.name)+'</div><div class="room-info">8 assentos'+(current?' · Sua sala atual':'')+'</div></div><button class="enter-button">'+(current?'Voltar':'Entrar')+'</button></div>';const b=card.querySelector('button');if(currentRoomId&&!current)b.disabled=true;b.onclick=()=>enter(r.id,b);list.appendChild(card)})}catch(e){console.error(e);statusEl.textContent='Erro ao carregar salas';list.innerHTML='<div class="error">'+esc(e.message||'Não foi possível carregar as salas.')+'</div>'}}init();</script></body></html>
