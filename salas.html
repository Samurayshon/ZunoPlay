<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030611"><title>Salas - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="nav.js?v=351" defer></script></head><body><main class="rooms-hub"><section class="hub-head"><div><h1 class="hub-title">Salas</h1><p id="hubMeta" class="hub-sub">Descubra conversas ao vivo</p></div><button id="createRoomBtn" class="create-room" type="button" aria-label="Criar sala">+</button></section><section class="hero"><div class="hero-kicker">ZUNOPLAY AO VIVO</div><h2>Encontre sua voz. Entre na conversa.</h2><p>Explore salas, descubra pessoas e viva experiências em tempo real com voz, jogos, reações e Zuno Pulse.</p><div class="hero-badges"><span>8 assentos</span><span>Zuno Pulse</span><span>Jogos</span><span>Social</span></div></section><div class="toolbar"><label class="search-box"><span aria-hidden="true">⌕</span><input id="hubSearch" type="search" maxlength="50" autocomplete="off" placeholder="Buscar salas, pessoas ou categorias..."></label><button id="refreshRooms" class="refresh-btn" type="button" aria-label="Atualizar salas">↻</button></div><nav class="tabs" aria-label="Categorias de salas"><button class="tab active" data-tab="for_you" type="button">Destaques</button><button class="tab" data-tab="following" type="button">Seguindo</button><button class="tab" data-tab="bate_papo" type="button">Bate-papo</button><button class="tab" data-tab="musica" type="button">Música</button><button class="tab" data-tab="jogos" type="button">Jogos</button></nav><div class="section-head"><span class="section-title">Ao vivo agora</span><span id="sectionMeta" class="section-meta">—</span></div><section id="roomList" class="room-list" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section></main><div id="createModal" class="modal-backdrop" aria-hidden="true"><section class="room-modal" role="dialog" aria-modal="true" aria-label="Criar sala de voz"><div class="modal-handle"></div><div class="modal-title">Criar sala</div><form id="createRoomForm"><div class="field"><label for="roomName">Nome da sala</label><input id="roomName" maxlength="60" required placeholder="Ex.: Resenha da madrugada"></div><div class="field"><label for="roomDescription">Descrição</label><textarea id="roomDescription" maxlength="240" placeholder="Conte rapidamente o clima da sala..."></textarea></div><div class="grid2"><div class="field"><label for="roomCategory">Categoria</label><select id="roomCategory"><option value="bate_papo">Bate-papo</option><option value="musica">Música</option><option value="jogos">Jogos</option><option value="amigos">Amigos</option><option value="comunidade">Comunidade</option><option value="evento">Evento</option></select></div><div class="field"><label for="roomVisibility">Visibilidade</label><select id="roomVisibility"><option value="public">Pública</option><option value="friends">Amigos</option><option value="private">Privada</option></select></div></div><div class="field"><label for="roomMic">Acesso ao microfone</label><select id="roomMic"><option value="open">Livre</option><option value="request">Solicitar para subir</option><option value="invite_only">Somente convite</option></select></div><div class="modal-actions"><button id="cancelCreate" class="cancel" type="button">Cancelar</button><button id="createSubmit" class="submit" type="submit">Criar e entrar</button></div></form></section></div></body></html>
