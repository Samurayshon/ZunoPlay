<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070811"><title>Amigos - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js?v=310"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 12%,#27135c 0,transparent 34%),#070811;color:#fff;font-family:Arial,sans-serif}.app{width:min(100%,520px);min-height:100vh;margin:auto;padding:20px 16px 42px}.header{display:flex;align-items:center;gap:12px;margin:8px 0 18px}.home-button{width:44px;height:44px;border-radius:13px;border:1px solid #303145;background:#171827;color:#fff;font-size:20px}.logo{font-size:28px;font-weight:900}.logo span{color:#9b5cff}.card{background:rgba(18,19,33,.94);border:1px solid #2c2d43;border-radius:20px;padding:17px;margin-bottom:13px}.title{font-size:23px;margin:0 0 5px}.sub{color:#9293a3;font-size:12px;margin:0 0 16px}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;padding:13px;border-radius:12px;border:1px solid #33344c;background:#0f101b;color:#fff;outline:none}.btn{border:0;border-radius:11px;padding:10px 13px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-weight:800}.danger{background:#28171d;color:#ffaaaa;border:1px solid #5a2932}.soft{background:#25263a;border:1px solid #3b3c55}.status{font-size:11px;color:#4ade80;margin-top:10px}.status.off{color:#ff9b9b}.section-title{font-size:15px;margin:0 0 8px}.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #27283a}.row:last-child{border-bottom:0}.avatar{width:45px;height:45px;flex:0 0 45px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#8b5cf6,#312e81);display:grid;place-items:center;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.main{min-width:0;flex:1}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#858697;margin-top:3px}.actions{display:flex;gap:5px}.actions .btn{font-size:10px;padding:8px 9px}.empty{color:#737486;text-align:center;padding:18px 6px;font-size:12px}.notice{display:none;margin-top:10px;padding:10px;border-radius:10px;font-size:12px;text-align:center}.notice.ok{display:block;background:#14251b;color:#86efac}.notice.err{display:block;background:#2a171d;color:#fca5a5}</style></head><body><main class="app"><header class="header"><button class="home-button" onclick="location.href='index.html'">⌂</button><div class="logo">Zuno<span>Play</span></div></header><section class="card"><h1 class="title">Amigos</h1><p class="sub">Encontre pessoas e conecte-se no ZunoPlay.</p><div class="search"><input id="q" maxlength="30" placeholder="Nome de usuário..." autocomplete="off"><button id="search" class="btn">Buscar</button></div><div id="notice" class="notice"></div><div id="rt" class="status">● Conectando atualizações...</div></section><section class="card"><h2 class="section-title">🔎 Resultados</h2><div id="results" class="empty">Pesquise um usuário para começar.</div></section><section class="card"><h2 class="section-title">🔔 Solicitações recebidas</h2><div id="requests" class="empty">Carregando...</div></section><section class="card"><h2 class="section-title">👥 Meus amigos</h2><div id="friends" class="empty">Carregando...</div></section></main><script>const URL='https://rliymfbbhqoejgfvsbuu.supabase.co',KEY='sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0',sb=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let me=null,reqCh=null,friendCh=null;const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML},initial=v=>(v||'?').charAt(0).toUpperCase();async function waitOfficial(){for(let i=0;i<50;i++){if(window.ZunoOfficialAvatars)return window.ZunoOfficialAvatars;await new Promise(r=>setTimeout(r,100))}return null}async function hydrate(p){if(!p)return p;const api=await waitOfficial();if(!api)return p;try{p.avatar_url=await api.resolve(p)}catch(e){console.warn('Avatar oficial',e)}return p}async function hydrateMany(list){await Promise.all((list||[]).filter(Boolean).map(hydrate));return list}function avatar(url,name){return url?'<img src="'+esc(url)+'" alt="">':esc(initial(name))}function note(text,type='ok'){$('notice').className='notice '+type;$('notice').textContent=text}function profile(id){return'perfil.html?user='+encodeURIComponent(id)}function row(p,meta,actions=''){return '<div class="row"><a href="'+profile(p.id)+'" class="avatar">'+avatar(p.avatar_url,p.username)+'</a><div class="main"><div class="name">'+esc(p.username||'Usuário')+'</div><div class="meta">'+esc(meta)+'</div></div><div class="actions">'+actions+'</div></div>'}async function login(){const{data,error}=await sb.auth.getSession();if(error||!data?.session?.user){location.href='login.html';return false}me=data.session.user;return true}async function loadRequests(){const box=$('requests');box.className='';box.innerHTML='<div class="empty">Carregando...</div>';const{data,error}=await sb.from('friend_requests').select('id,sender_id,status,profiles!friend_requests_sender_id_fkey(id,username,avatar_url,sex)').eq('receiver_id',me.id).eq('status','pending').order('created_at',{ascending:false});if(error){box.innerHTML='<div class="empty">Não foi possível carregar.</div>';return}if(!data?.length){box.innerHTML='<div class="empty">Nenhuma solicitação pendente.</div>';return}await hydrateMany(data.map(r=>r.profiles));box.innerHTML=data.map(r=>row(r.profiles||{id:r.sender_id,username:'Usuário'},'Quer ser seu amigo','<button class="btn" data-accept="'+r.id+'">Aceitar</button><button class="btn danger" data-reject="'+r.id+'">Recusar</button>')).join('');box.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>answer(b.dataset.accept,true));box.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>answer(b.dataset.reject,false))}async function answer(id,accept){const{data:r,error:e}=await sb.from('friend_requests').select('id,sender_id,receiver_id,status').eq('id',id).eq('receiver_id',me.id).eq('status','pending').maybeSingle();if(e||!r){note('A solicitação já foi respondida.','err');return}if(accept){const u=await sb.from('friend_requests').update({status:'accepted'}).eq('id',id).eq('receiver_id',me.id).eq('status','pending');if(u.error){note('Não foi possível aceitar.','err');return}const f=await sb.from('friendships').insert({user_id:r.sender_id,friend_id:r.receiver_id});if(f.error&&f.error.code!=='23505'){note('Não foi possível criar a amizade.','err');return}note('Amizade aceita! 🎉')}else{const u=await sb.from('friend_requests').update({status:'rejected'}).eq('id',id).eq('receiver_id',me.id).eq('status','pending');if(u.error){note('Não foi possível recusar.','err');return}note('Solicitação recusada.')}await Promise.all([loadRequests(),loadFriends()])}async function loadFriends(){const box=$('friends');const{data,error}=await sb.from('friendships').select('user_id,friend_id').or('user_id.eq.'+me.id+',friend_id.eq.'+me.id);if(error){box.innerHTML='<div class="empty">Não foi possível carregar.</div>';return}const ids=[...new Set((data||[]).map(f=>f.user_id===me.id?f.friend_id:f.user_id))];if(!ids.length){box.innerHTML='<div class="empty">Você ainda não possui amigos.</div>';return}const p=await sb.from('profiles').select('id,username,avatar_url,sex').in('id',ids);if(p.error){box.innerHTML='<div class="empty">Não foi possível carregar.</div>';return}await hydrateMany(p.data||[]);box.innerHTML=(p.data||[]).map(x=>row(x,'Amigo no ZunoPlay','<button class="btn soft" data-chat="'+x.id+'">💬</button><button class="btn danger" data-remove="'+x.id+'">Remover</button>')).join('');box.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>location.href='conversas.html?user='+encodeURIComponent(b.dataset.chat));box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeFriend(b.dataset.remove))}async function removeFriend(id){if(!confirm('Remover este amigo?'))return;const r=await sb.from('friendships').delete().or('and(user_id.eq.'+me.id+',friend_id.eq.'+id+'),and(user_id.eq.'+id+',friend_id.eq.'+me.id+')');if(r.error){note('Não foi possível remover.','err');return}note('Amizade removida.');await loadFriends()}async function search(){const term=$('q').value.trim();if(term.length<2){note('Digite pelo menos 2 caracteres.','err');return}const box=$('results');box.innerHTML='<div class="empty">Buscando...</div>';const r=await sb.from('profiles').select('id,username,avatar_url,sex').ilike('username','%'+term.replace(/[%_]/g,'')+'%').neq('id',me.id).limit(15);if(r.error||!r.data?.length){box.innerHTML='<div class="empty">Nenhum usuário encontrado.</div>';return}await hydrateMany(r.data||[]);box.innerHTML=r.data.map(p=>row(p,'Usuário do ZunoPlay','<button class="btn" data-add="'+p.id+'">Adicionar</button>')).join('');box.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>send(b.dataset.add))}async function send(id){const ex=await sb.from('friend_requests').select('id,status,sender_id,receiver_id').or('and(sender_id.eq.'+me.id+',receiver_id.eq.'+id+'),and(sender_id.eq.'+id+',receiver_id.eq.'+me.id+')').order('created_at',{ascending:false}).limit(1);const last=ex.data?.[0];if(last?.status==='pending'){note('Já existe uma solicitação pendente.','err');return}if(last?.status==='accepted'){note('Vocês já são amigos.','err');return}const r=await sb.from('friend_requests').insert({sender_id:me.id,receiver_id:id,status:'pending'});if(r.error){note('Não foi possível enviar.','err');return}note('Solicitação enviada! ✅')}async function subscribe(){if(reqCh)await sb.removeChannel(reqCh);if(friendCh)await sb.removeChannel(friendCh);reqCh=sb.channel('friends-requests-'+me.id).on('postgres_changes',{event:'*',schema:'public',table:'friend_requests',filter:'receiver_id=eq.'+me.id},()=>loadRequests()).subscribe(status=>{if(status==='SUBSCRIBED'){$('rt').textContent='● Atualizações em tempo real';$('rt').className='status'}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){$('rt').textContent='● Realtime indisponível';$('rt').className='status off'}});friendCh=sb.channel('friends-list-'+me.id).on('postgres_changes',{event:'*',schema:'public',table:'friendships'},()=>loadFriends()).subscribe()}$('search').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search()};sb.auth.onAuthStateChange(e=>{if(e==='SIGNED_OUT')location.href='login.html'});window.addEventListener('pagehide',()=>{if(reqCh)sb.removeChannel(reqCh);if(friendCh)sb.removeChannel(friendCh)});(async()=>{if(await login()){await Promise.all([loadRequests(),loadFriends()]);await subscribe()}})();</script></body></html>
