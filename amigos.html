<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amigos - ZunoPlay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 20% 20%,#25145c 0%,transparent 35%),radial-gradient(circle at 80% 80%,#102d59 0%,transparent 35%),#070811;color:#fff}.app{width:100%;max-width:480px;min-height:100vh;margin:auto;padding:25px}.header{display:flex;align-items:center;gap:15px;padding-top:20px;margin-bottom:25px}.back{width:42px;height:42px;border-radius:12px;border:1px solid #303145;background:#1b1c2b;color:#fff;font-size:20px;cursor:pointer}.logo{font-size:28px;font-weight:800}.logo span{color:#8b5cf6}.card{background:rgba(20,21,35,.9);border:1px solid rgba(139,92,246,.2);border-radius:24px;padding:20px;margin-bottom:15px}.title{font-size:22px;margin-bottom:6px}.subtitle{color:#9293a3;font-size:13px;margin-bottom:20px}.search-box{display:flex;gap:8px}.search-box input{flex:1;min-width:0;padding:14px;border-radius:12px;border:1px solid #303145;background:#11121e;color:#fff;outline:none;font-size:14px}.search-box input:focus{border-color:#8b5cf6}.search-button,.action-button{border:none;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-weight:bold;cursor:pointer}.search-button{padding:0 17px}.section-title{font-size:16px;margin-bottom:12px}.user-card{display:flex;align-items:center;gap:12px;background:#11121e;border:1px solid #292a3d;border-radius:14px;padding:13px;margin-top:10px}.avatar{flex-shrink:0;width:45px;height:45px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#6366f1);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px}.user-info{flex:1;min-width:0}.username{font-size:15px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-status{color:#858697;font-size:11px;margin-top:3px}.action-button{padding:9px 12px;font-size:12px}.chat-button{background:#24253a;border:1px solid #3b3c55}.danger-button{background:#2a171d;border:1px solid #5b2830;color:#ff9b9b}.empty{text-align:center;color:#737486;font-size:13px;padding:20px 5px}.message{display:none;padding:12px;border-radius:10px;margin-top:12px;font-size:13px;text-align:center}.message.success{display:block;background:rgba(34,197,94,.12);color:#86efac}.message.error{display:block;background:rgba(239,68,68,.12);color:#fca5a5}.realtime{color:#4ade80;font-size:11px;margin-top:10px}.realtime.off{color:#ff9b9b}
</style>
</head>
<body>
<div class="app">
<div class="header"><button class="back" onclick="location.href='index.html'">←</button><div class="logo">Zuno<span>Play</span></div></div>
<div class="card"><h1 class="title">Amigos</h1><p class="subtitle">Encontre pessoas e conecte-se no ZunoPlay.</p><div class="search-box"><input id="searchInput" type="text" placeholder="Digite um nome de usuário..." autocomplete="off"><button id="searchButton" class="search-button">Buscar</button></div><div id="message" class="message"></div><div id="realtime" class="realtime">● Conectando atualizações...</div></div>
<div class="card"><h2 class="section-title">🔎 Resultados</h2><div id="results"><div class="empty">Pesquise um usuário para começar.</div></div></div>
<div class="card"><h2 class="section-title">🔔 Solicitações recebidas</h2><div id="requests"><div class="empty">Carregando...</div></div></div>
<div class="card"><h2 class="section-title">👥 Meus amigos</h2><div id="friends"><div class="empty">Carregando amigos...</div></div></div>
</div>
<script>
const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co";const SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const searchInput=document.getElementById("searchInput"),searchButton=document.getElementById("searchButton"),results=document.getElementById("results"),requests=document.getElementById("requests"),friends=document.getElementById("friends"),message=document.getElementById("message"),realtime=document.getElementById("realtime");let currentUser=null,requestChannel=null,friendshipChannel=null;
function esc(v){const d=document.createElement("div");d.textContent=v??"";return d.innerHTML}function initial(v){return(v||"?").charAt(0).toUpperCase()}function showMessage(t,type){message.className="message "+type;message.textContent=t}function setRealtime(t,ok=true){realtime.textContent="● "+t;realtime.className="realtime"+(ok?"":" off")}
async function checkLogin(){const {data,error}=await supabaseClient.auth.getSession();if(error||!data?.session?.user){location.href="login.html";return false}currentUser=data.session.user;return true}
async function searchUsers(){const term=searchInput.value.trim();if(term.length<2){showMessage("Digite pelo menos 2 caracteres.","error");return}results.innerHTML='<div class="empty">Buscando...</div>';try{const {data,error}=await supabaseClient.from("profiles").select("id,username").ilike("username","%"+term+"%").neq("id",currentUser.id).limit(20);if(error)throw error;if(!data?.length){results.innerHTML='<div class="empty">Nenhum usuário encontrado.</div>';return}results.innerHTML="";for(const user of data){const card=document.createElement("div");card.className="user-card";const {data:existing}=await supabaseClient.from("friend_requests").select("id,status,sender_id,receiver_id").or("and(sender_id.eq."+currentUser.id+",receiver_id.eq."+user.id+"),and(sender_id.eq."+user.id+",receiver_id.eq."+currentUser.id+")").order("created_at",{ascending:false}).limit(1);let action='<button class="action-button" data-action="add">Adicionar</button>';const r=existing?.[0];if(r?.status==="accepted")action='<button class="action-button chat-button" data-action="chat">💬 Conversar</button>';else if(r?.status==="pending"&&r.sender_id===currentUser.id)action='<button class="action-button chat-button" disabled>Aguardando</button>';else if(r?.status==="pending"&&r.receiver_id===currentUser.id)action='<button class="action-button" data-action="accept">Aceitar</button>';card.innerHTML='<div class="avatar">'+esc(initial(user.username))+'</div><div class="user-info"><div class="username">'+esc(user.username)+'</div><div class="user-status">Usuário do ZunoPlay</div></div>'+action;const btn=card.querySelector("button");btn.onclick=()=>{if(btn.dataset.action==="add")sendFriendRequest(user.id);else if(btn.dataset.action==="accept")acceptRequest(r.id);else if(btn.dataset.action==="chat")openChat(user.id)};results.appendChild(card)}}catch(error){console.error(error);results.innerHTML='<div class="empty">Não foi possível realizar a busca.</div>'}}
async function sendFriendRequest(userId){try{const {data:existing}=await supabaseClient.from("friend_requests").select("id,status").or("and(sender_id.eq."+currentUser.id+",receiver_id.eq."+userId+"),and(sender_id.eq."+userId+",receiver_id.eq."+currentUser.id+")").order("created_at",{ascending:false}).limit(1);if(existing?.[0]?.status==="pending"){showMessage("Já existe uma solicitação pendente.","error");return}if(existing?.[0]?.status==="accepted"){showMessage("Vocês já são amigos.","success");return}const {error}=await supabaseClient.from("friend_requests").insert({sender_id:currentUser.id,receiver_id:userId,status:"pending"});if(error)throw error;showMessage("Solicitação enviada! ✅","success");searchUsers()}catch(error){console.error(error);showMessage("Não foi possível enviar a solicitação.","error")}}
async function loadRequests(){requests.innerHTML='<div class="empty">Carregando...</div>';try{const {data,error}=await supabaseClient.from("friend_requests").select("id,sender_id,receiver_id,profiles!friend_requests_sender_id_fkey(username)").eq("receiver_id",currentUser.id).eq("status","pending").order("created_at",{ascending:false});if(error)throw error;if(!data?.length){requests.innerHTML='<div class="empty">Nenhuma solicitação por enquanto.</div>';return}requests.innerHTML="";data.forEach(r=>{const username=r.profiles?.username||"Usuário";const div=document.createElement("div");div.className="user-card";div.innerHTML='<div class="avatar">'+esc(initial(username))+'</div><div class="user-info"><div class="username">'+esc(username)+'</div><div class="user-status">Quer ser seu amigo</div></div><button class="action-button">Aceitar</button><button class="action-button danger-button">Recusar</button>';const bs=div.querySelectorAll("button");bs[0].onclick=()=>acceptRequest(r.id);bs[1].onclick=()=>rejectRequest(r.id);requests.appendChild(div)})}catch(error){console.error(error);requests.innerHTML='<div class="empty">Não foi possível carregar as solicitações.</div>'}}
async function acceptRequest(id){try{const {data:r,error:e}=await supabaseClient.from("friend_requests").select("id,sender_id,receiver_id,status").eq("id",id).eq("receiver_id",currentUser.id).single();if(e)throw e;if(r.status!=="pending")return;const {error:u}=await supabaseClient.from("friend_requests").update({status:"accepted"}).eq("id",id).eq("receiver_id",currentUser.id);if(u)throw u;const {error:f}=await supabaseClient.from("friendships").insert({user_id:r.sender_id,friend_id:r.receiver_id});if(f)throw f;showMessage("Amizade aceita! 🎉","success");await loadRequests();await loadFriends()}catch(error){console.error(error);showMessage("Não foi possível aceitar a amizade.","error")}}
async function rejectRequest(id){try{const {error}=await supabaseClient.from("friend_requests").update({status:"rejected"}).eq("id",id).eq("receiver_id",currentUser.id).eq("status","pending");if(error)throw error;showMessage("Solicitação recusada.","success");loadRequests()}catch(error){console.error(error);showMessage("Não foi possível recusar.","error")}}
async function loadFriends(){friends.innerHTML='<div class="empty">Carregando amigos...</div>';try{const {data,error}=await supabaseClient.from("friendships").select("user_id,friend_id").or("user_id.eq."+currentUser.id+",friend_id.eq."+currentUser.id);if(error)throw error;if(!data?.length){friends.innerHTML='<div class="empty">Você ainda não possui amigos.</div>';return}const ids=[...new Set(data.map(f=>f.user_id===currentUser.id?f.friend_id:f.user_id))];const {data:profiles,error:pe}=await supabaseClient.from("profiles").select("id,username").in("id",ids);if(pe)throw pe;friends.innerHTML="";(profiles||[]).forEach(p=>{const div=document.createElement("div");div.className="user-card";div.innerHTML='<div class="avatar">'+esc(initial(p.username))+'</div><div class="user-info"><div class="username">'+esc(p.username)+'</div><div class="user-status">Amigo no ZunoPlay</div></div><button class="action-button chat-button">💬 Conversar</button><button class="action-button danger-button">Remover</button>';const bs=div.querySelectorAll("button");bs[0].onclick=()=>openChat(p.id);bs[1].onclick=()=>removeFriend(p.id);friends.appendChild(div)})}catch(error){console.error(error);friends.innerHTML='<div class="empty">Não foi possível carregar seus amigos.</div>'}}
async function removeFriend(friendId){if(!confirm("Remover este amigo?"))return;try{const {error}=await supabaseClient.from("friendships").delete().or("and(user_id.eq."+currentUser.id+",friend_id.eq."+friendId+"),and(user_id.eq."+friendId+",friend_id.eq."+currentUser.id+")");if(error)throw error;showMessage("Amizade removida.","success");loadFriends()}catch(error){console.error(error);showMessage("Não foi possível remover a amizade.","error")}}
function openChat(id){location.href="conversas.html?user="+encodeURIComponent(id)}
function subscribeRealtime(){if(requestChannel)supabaseClient.removeChannel(requestChannel);if(friendshipChannel)supabaseClient.removeChannel(friendshipChannel);requestChannel=supabaseClient.channel("zunoplay-friend-requests-"+currentUser.id).on("postgres_changes",{event:"*",schema:"public",table:"friend_requests",filter:"receiver_id=eq."+currentUser.id},()=>{loadRequests()}).subscribe(status=>{if(status==="SUBSCRIBED")setRealtime("Atualizações em tempo real");else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT")setRealtime("Realtime indisponível",false)});friendshipChannel=supabaseClient.channel("zunoplay-friendships-"+currentUser.id).on("postgres_changes",{event:"*",schema:"public",table:"friendships"},()=>loadFriends()).subscribe()}
searchButton.onclick=searchUsers;searchInput.addEventListener("keydown",e=>{if(e.key==="Enter")searchUsers()});supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){if(requestChannel)supabaseClient.removeChannel(requestChannel);if(friendshipChannel)supabaseClient.removeChannel(friendshipChannel);location.href="login.html"}});window.addEventListener("beforeunload",()=>{if(requestChannel)supabaseClient.removeChannel(requestChannel);if(friendshipChannel)supabaseClient.removeChannel(friendshipChannel)});
(async()=>{if(await checkLogin()){await loadRequests();await loadFriends();subscribeRealtime()}})();
</script>
</body>
</html>
