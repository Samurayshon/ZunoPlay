<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amigos - ZunoPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #25145c 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #102d59 0%, transparent 35%),
        #070811;
    color: white;
}

.app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
    padding: 25px;
}

.header {
    display: flex;
    align-items: center;
    gap: 15px;
    padding-top: 20px;
    margin-bottom: 25px;
}

.back {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid #303145;
    background: #1b1c2b;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.logo span {
    color: #8b5cf6;
}

.card {
    background: rgba(20, 21, 35, 0.9);
    border: 1px solid rgba(139, 92, 246, 0.2);
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 15px;
}

.title {
    font-size: 22px;
    margin-bottom: 6px;
}

.subtitle {
    color: #9293a3;
    font-size: 13px;
    margin-bottom: 20px;
}

.search-box {
    display: flex;
    gap: 8px;
}

.search-box input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #303145;
    background: #11121e;
    color: white;
    outline: none;
    font-size: 14px;
}

.search-box input:focus {
    border-color: #8b5cf6;
}

.search-button {
    padding: 0 17px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.section-title {
    font-size: 16px;
    margin-bottom: 12px;
}

.user-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #11121e;
    border: 1px solid #292a3d;
    border-radius: 14px;
    padding: 13px;
    margin-top: 10px;
}

.avatar {
    flex-shrink: 0;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
}

.user-info {
    flex: 1;
    min-width: 0;
}

.username {
    font-size: 15px;
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
}

.user-status {
    color: #858697;
    font-size: 11px;
    margin-top: 3px;
}

.action-button {
    border: none;
    border-radius: 10px;
    padding: 9px 12px;
    background: #8b5cf6;
    color: white;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.action-button:disabled {
    opacity: 0.5;
}

.empty {
    text-align: center;
    color: #737486;
    font-size: 13px;
    padding: 20px 5px;
}

.message {
    display: none;
    padding: 12px;
    border-radius: 10px;
    margin-top: 12px;
    font-size: 13px;
    text-align: center;
}

.message.success {
    display: block;
    background: rgba(34,197,94,0.12);
    color: #86efac;
}

.message.error {
    display: block;
    background: rgba(239,68,68,0.12);
    color: #fca5a5;
}

</style>
</head>

<body>

<div class="app">

    <div class="header">

        <button
            class="back"
            onclick="window.location.href='index.html'">
            ←
        </button>

        <div class="logo">
            Zuno<span>Play</span>
        </div>

    </div>


    <div class="card">

        <h1 class="title">
            Amigos
        </h1>

        <p class="subtitle">
            Encontre pessoas e conecte-se no ZunoPlay.
        </p>


        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Digite um nome de usuário..."
                autocomplete="off"
            >

            <button
                class="search-button"
                id="searchButton">
                Buscar
            </button>

        </div>

        <div id="message" class="message"></div>

    </div>


    <div class="card">

        <h2 class="section-title">
            🔎 Resultados
        </h2>

        <div id="results">

            <div class="empty">
                Pesquise um usuário para começar.
            </div>

        </div>

    </div>


    <div class="card">

        <h2 class="section-title">
            🔔 Solicitações recebidas
        </h2>

        <div id="requests">

            <div class="empty">
                Nenhuma solicitação por enquanto.
            </div>

        </div>

    </div>


    <div class="card">

        <h2 class="section-title">
            👥 Meus amigos
        </h2>

        <div id="friends">

            <div class="empty">
                Você ainda não possui amigos.
            </div>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://rliymfbbhqoejgfvsbuu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const searchInput =
    document.getElementById("searchInput");

const searchButton =
    document.getElementById("searchButton");

const results =
    document.getElementById("results");

const requests =
    document.getElementById("requests");

const friends =
    document.getElementById("friends");

const message =
    document.getElementById("message");


let currentUser = null;


/* =========================================
   MENSAGEM
   ========================================= */

function showMessage(text, type) {

    message.className =
        "message " + type;

    message.textContent =
        text;

}


/* =========================================
   AVATAR
   ========================================= */

function getInitial(username) {

    return (
        username ||
        "?"
    )
    .charAt(0)
    .toUpperCase();

}


/* =========================================
   VERIFICAR LOGIN
   ========================================= */

async function checkLogin() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if (error || !data.session) {

        window.location.href =
            "login.html";

        return false;

    }


    currentUser =
        data.session.user;

    return true;

}


/* =========================================
   BUSCAR USUÁRIOS
   ========================================= */

async function searchUsers() {

    const term =
        searchInput.value.trim();


    if (term.length < 2) {

        showMessage(
            "Digite pelo menos 2 caracteres.",
            "error"
        );

        return;

    }


    results.innerHTML =
        '<div class="empty">Buscando...</div>';


    try {

        /*
         * IMPORTANTE:
         * Esta busca depende de uma tabela "profiles"
         * no Supabase contendo username e id.
         */

        const {
            data,
            error
        } =
            await supabaseClient
                .from("profiles")
                .select("id, username")
                .ilike(
                    "username",
                    "%" + term + "%"
                )
                .neq(
                    "id",
                    currentUser.id
                )
                .limit(20);


        if (error) {
            throw error;
        }


        if (!data || data.length === 0) {

            results.innerHTML =
                '<div class="empty">Nenhum usuário encontrado.</div>';

            return;

        }


        results.innerHTML = "";


        data.forEach(function(user) {

            const div =
                document.createElement("div");

            div.className =
                "user-card";


            div.innerHTML = `

                <div class="avatar">
                    ${getInitial(user.username)}
                </div>

                <div class="user-info">

                    <div class="username">
                        ${user.username}
                    </div>

                    <div class="user-status">
                        Usuário do ZunoPlay
                    </div>

                </div>

                <button
                    class="action-button"
                    onclick="sendFriendRequest('${user.id}')">
                    Adicionar
                </button>

            `;


            results.appendChild(div);

        });


    } catch (error) {

        console.error(
            "Erro na busca:",
            error
        );


        results.innerHTML =
            '<div class="empty">A busca ainda não está configurada no banco de dados.</div>';

    }

}


/* =========================================
   SOLICITAÇÃO
   ========================================= */

async function sendFriendRequest(userId) {

    try {

        const {
            error
        } =
            await supabaseClient
                .from("friend_requests")
                .insert({

                    sender_id:
                        currentUser.id,

                    receiver_id:
                        userId,

                    status:
                        "pending"

                });


        if (error) {
            throw error;
        }


        showMessage(
            "Solicitação enviada! ✅",
            "success"
        );


    } catch (error) {

        console.error(
            "Erro ao enviar solicitação:",
            error
        );


        showMessage(
            "Não foi possível enviar a solicitação. Verifique se o sistema de amigos foi configurado no Supabase.",
            "error"
        );

    }

}


/* =========================================
   SOLICITAÇÕES RECEBIDAS
   ========================================= */

async function loadRequests() {

    requests.innerHTML =
        '<div class="empty">Carregando...</div>';


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("friend_requests")
                .select("*")
                .eq(
                    "receiver_id",
                    currentUser.id
                )
                .eq(
                    "status",
                    "pending"
                );


        if (error) {
            throw error;
        }


        if (!data || data.length === 0) {

            requests.innerHTML =
                '<div class="empty">Nenhuma solicitação por enquanto.</div>';

            return;

        }


        requests.innerHTML = "";


        data.forEach(function(request) {

            const div =
                document.createElement("div");

            div.className =
                "user-card";


            div.innerHTML = `

                <div class="avatar">
                    ?
                </div>

                <div class="user-info">

                    <div class="username">
                        Nova solicitação
                    </div>

                    <div class="user-status">
                        Usuário quer ser seu amigo
                    </div>

                </div>

                <button
                    class="action-button"
                    onclick="acceptRequest('${request.id}')">
                    Aceitar
                </button>

            `;


            requests.appendChild(div);

        });


    } catch (error) {

        console.error(
            "Erro ao carregar solicitações:",
            error
        );


        requests.innerHTML =
            '<div class="empty">As solicitações ainda precisam ser configuradas no Supabase.</div>';

    }

}


/* =========================================
   ACEITAR
   ========================================= */

async function acceptRequest(requestId) {

    try {

        const {
            data: request,
            error: requestError
        } =
            await supabaseClient
                .from("friend_requests")
                .select("*")
                .eq(
                    "id",
                    requestId
                )
                .single();


        if (requestError) {
            throw requestError;
        }


        const {
            error: friendError
        } =
            await supabaseClient
                .from("friendships")
                .insert({

                    user_id:
                        request.sender_id,

                    friend_id:
                        request.receiver_id

                });


        if (friendError) {
            throw friendError;
        }


        const {
            error: updateError
        } =
            await supabaseClient
                .from("friend_requests")
                .update({

                    status:
                        "accepted"

                })
                .eq(
                    "id",
                    requestId
                );


        if (updateError) {
            throw updateError;
        }


        showMessage(
            "Amizade aceita! 🎉",
            "success"
        );


        loadRequests();
        loadFriends();


    } catch (error) {

        console.error(
            "Erro ao aceitar:",
            error
        );


        showMessage(
            "Não foi possível aceitar. O banco ainda precisa ser configurado.",
            "error"
        );

    }

}


/* =========================================
   AMIGOS
   ========================================= */

async function loadFriends() {

    friends.innerHTML =
        '<div class="empty">Carregando...</div>';


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("friendships")
                .select("*")
                .or(
                    "user_id.eq." +
                    currentUser.id +
                    ",friend_id.eq." +
                    currentUser.id
                );


        if (error) {
            throw error;
        }


        if (!data || data.length === 0) {

            friends.innerHTML =
                '<div class="empty">Você ainda não possui amigos.</div>';

            return;

        }


        friends.innerHTML =
            '<div class="empty">Você já possui amizades no ZunoPlay. 👥</div>';


    } catch (error) {

        console.error(
            "Erro ao carregar amigos:",
            error
        );


        friends.innerHTML =
            '<div class="empty">A lista de amigos ainda precisa ser configurada.</div>';

    }

}


/* =========================================
   EVENTOS
   ========================================= */

searchButton.addEventListener(
    "click",
    searchUsers
);


searchInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            searchUsers();

        }

    }
);


/* =========================================
   INICIAR
   ========================================= */

async function start() {

    const logged =
        await checkLogin();


    if (!logged) {
        return;
    }


    loadRequests();
    loadFriends();

}


start();

</script>

</body>
</html>
