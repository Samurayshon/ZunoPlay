<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070811"><title>Amigos - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js?v=351"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070811;color:#fff;font-family:Arial,sans-serif}.app{width:min(100%,520px);min-height:100vh;margin:auto;padding:20px 16px 42px}.header{display:flex;align-items:center;gap:12px;margin:8px 0 18px}.home-button{width:44px;height:44px;border-radius:13px;border:1px solid #303145;background:#171827;color:#fff;font-size:20px}.logo{font-size:28px;font-weight:900}.logo span{color:#9b5cff}.card{background:rgba(18,19,33,.94);border:1px solid #2c2d43;border-radius:20px;padding:17px;margin-bottom:13px}.title{font-size:23px;margin:0 0 5px}.sub{color:#9293a3;font-size:12px;margin:0 0 16px}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;padding:13px;border-radius:12px;border:1px solid #33344c;background:#0f101b;color:#fff;outline:none}.btn{border:0;border-radius:11px;padding:10px 13px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-weight:800}.status{font-size:11px;color:#4ade80;margin-top:10px}.section-title{font-size:15px;margin:0 0 8px}.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #27283a}.row:last-child{border-bottom:0}.avatar{width:45px;height:45px;flex:0 0 45px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#8b5cf6,#312e81);display:grid;place-items:center;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.main{min-width:0;flex:1}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#858697;margin-top:3px}.actions{display:flex;gap:5px}.actions .btn{font-size:10px;padding:8px 9px}.empty{color:#737486;text-align:center;padding:18px 6px;font-size:12px}</style></head><body><main class="app"><header class="header"><button class="home-button zuno-context-back" type="button" onclick="history.length>1?history.back():location.href='index.html?central=1'" aria-label="Voltar">‹</button><div class="logo">Amigos</div></header><section class="card"><h1 class="title">Encontre pessoas</h1><p class="sub">Busque novos amigos e conecte-se no ZunoPlay.</p><div class="search"><input id="q" maxlength="30" placeholder="Nome de usuário..." autocomplete="off"><button id="search" class="btn">Buscar</button></div><div id="rt" class="status"></div></section><section class="card"><h2 class="section-title">Resultados</h2><div id="results" class="empty"></div></section><section class="card"><h2 class="section-title">Solicitações recebidas</h2><div id="requests" class="empty"></div></section><section class="card"><h2 class="section-title">Meus amigos</h2><div id="friends" class="empty">Carregando...</div></section></main></body></html>
