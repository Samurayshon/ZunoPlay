<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sala - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;background:#070811;color:#fff}.app{width:100%;max-width:480px;min-height:100vh;margin:auto}.header{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid #292a3d;background:rgba(10,11,20,.95)}.back{width:42px;height:42px;border-radius:12px;border:1px solid #303145;background:#1b1c2b;color:#fff;font-size:20px}.header-info{flex:1}.room-title{font-size:18px;font-weight:bold}.room-status{color:#4ade80;font-size:11px;margin-top:3px}.content{padding:16px}.hero{text-align:center;padding:10px}.hero-icon{font-size:42px}.hero h1{font-size:23px;margin:5px 0}.hero p{color:#9293a3;font-size:13px}.room-stage{position:relative;min-height:300px;margin-top:15px;border-radius:24px;overflow:hidden;border:1px solid #383056;background:linear-gradient(180deg,#16152b,#0e1020 60%,#090a13);box-shadow:inset 0 -50px 80px rgba(0,0,0,.35)}.stage-title{position:absolute;top:14px;left:16px;font-size:11px;color:#9293a3;text-transform:uppercase;letter-spacing:1px}.avatar-slot{position:absolute;transform:translate(-50%,-50%);text-align:center;min-width:70px;cursor:pointer}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid #8b5cf6;background:#7651d6;display:flex;align-items:center;justify-content:center;font-size:27px;margin:auto}.avatar-name{margin-top:6px;font-size:11px;font-weight:bold;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.avatar-role{font-size:9px;color:#858697;margin-top:2px}.avatar-slot.me .avatar{border-color:#22c55e}.panel{background:rgba(20,21,35,.9);border:1px solid #292a3d;border-radius:20px;padding:18px;margin-top:15px}.panel-title{font-size:15px;font-weight:bold;margin-bottom:12px}.member{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #292a3d;cursor:pointer}.member:last-child{border-bottom:none}.member-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#7651d6;display:flex;align-items:center;justify-content:center}.member-name{font-size:14px;font-weight:bold}.member-role{color:#858697;font-size:11px;margin-top:3px}.messages{min-height:150px;max-height:320px;overflow-y:auto;padding:12px;border-radius:16px;background:#0f101b;border:1px solid #292a3d}.message{margin-bottom:10px;padding:10px 12px;border-radius:13px;background:#1b1c2b}.message.me{border-left:3px solid #8b5cf6}.message-user{color:#a78bfa;font-size:11px;font-weight:bold;margin-bottom:4px;cursor:pointer}.message-text{font-size:13px;line-height:1.4;word-break:break-word}.message-time{color:#686978;font-size:9px;margin-top:4px}.empty{text-align:center;color:#737486;font-size:12px;padding:30px 10px}.error{padding:25px 10px;text-align:center;color:#ff8f8f;font-size:13px;line-height:1.5}.chat-form{display:flex;gap:8px;margin-top:10px}.chat-input{flex:1;min-width:0;padding:13px;border-radius:12px;border:1px solid #303145;background:#141523;color:#fff}.send-button{width:52px;border:none;border-radius:12px;background:#7651d6;color:#fff;font-size:18px}.leave{width:100%;margin-top:20px;padding:15px;border-radius:14px;border:1px solid #5b2830;background:#24151a;color:#ff8f8f;font-weight:bold}.hidden{display:none}</style></head><body><div id="app" class="app"><div class="header"><button class="back" onclick="goBack()">←</button><div class="header-info"><div id="roomTitle" class="room-title">Carregando sala...</div><div id="roomStatus" class="room-status">● Conectando...</div></div></div><div class="content"><div class="hero"><div class="hero-icon">🎙️</div><h1 id="heroTitle">Sala</h1><p>Converse com as pessoas da sala.</p></div><div id="roomStage" class="room-stage"><div class="stage-title">Ambiente da sala</div></div><div class="panel"><div class="panel-title">👥 Pessoas na sala</div><div id="members"><div class="empty">Carregando...</div></div></div><div class="panel"><div class="panel-title">💬 Conversa</div><div id="messages" class="messages"><div class="empty">Carregando mensagens...</div></div><form id="chatForm" class="chat-form"><input id="chatInput" class="chat-input" type="text" maxlength="500" placeholder="Digite uma mensagem..." autocomplete="off"><button id="sendButton" class="send-button" type="submit">➤</button></form></div><button id="leaveButton" class="leave">Sair da sala</button></div></div><script>const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co",SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const roomTitle=document.getElementById("roomTitle"),roomStatus=document.getElementById("roomStatus"),heroTitle=document.getElementById("heroTitle"),members=document.getElementById("members"),roomStage=document.getElementById("roomStage"),messages=document.getElementById("messages"),chatForm=document.getElementById("chatForm"),chatInput=document.getElementById("chatInput"),sendButton=document.getElementById("sendButton"),leaveButton=document.getElementById("leaveButton");let roomId=null,currentUser=null,messagesChannel=null,membersChannel=null,profileCache={};function escapeHTML(t){const d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML}function formatTime(v){const d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}function goBack(){location.href="salas.html"}function getRoomId(){const p=new URLSearchParams(location.search);return p.get("room")||p.get("room_id")||p.get("id")||sessionStorage.getItem("zunoplay_room_id")}function setStatus(t,ok=true){roomStatus.textContent="● "+t;roomStatus.style.color=ok?"#4ade80":"#ff8f8f"}async function loadCurrentUser(){const{data,error}=await supabaseClient.auth.getSession();if(error)throw error;currentUser=data?.session?.user||null;if(!currentUser)throw new Error("Você precisa estar conectado para acessar a sala.")}async function loadRoom(){if(!roomId)throw new Error("O endereço da sala não contém o ID da sala.");const{data,error}=await supabaseClient.from("rooms").select("id,name,owner_id,created_at").eq("id",roomId).maybeSingle();if(error)throw error;if(!data)throw new Error("A sala não foi encontrada.");roomTitle.textContent=data.name||"Sala";heroTitle.textContent=data.name||"Sala"}async function getProfiles(ids){const unique=[...new Set(ids.filter(Boolean))];if(!unique.length)return[];const missing=unique.filter(id=>!profileCache[id]);if(missing.length){const{data,error}=await supabaseClient.from("profiles").select("id,username,avatar_url,level").in("id",missing);if(error)throw error;(data||[]).forEach(p=>profileCache[p.id]=p)}return unique.map(id=>profileCache[id]||null)}function requireUsername(p){return p&&typeof p.username==="string"&&p.username.trim()?p.username.trim():null}function openProfile(id){if(!id)return;if(currentUser&&id===currentUser.id){location.href="perfil.html";return}location.href="perfil.html?user="+encodeURIComponent(id)}function avatarHTML(p){const username=requireUsername(p);const alt=username?"Avatar de @"+username:"Avatar";return p?.avatar_url?'<img class="avatar" src="'+escapeHTML(p.avatar_url)+'" alt="'+escapeHTML(alt)+'">':'<div class="avatar">👤</div>'}function renderStage(profiles){roomStage.querySelectorAll(".avatar-slot").forEach(x=>x.remove());const valid=profiles.filter(p=>requireUsername(p));if(!valid.length){const e=document.createElement("div");e.className="empty";e.textContent="Nenhum usuário identificado.";e.style.paddingTop="120px";roomStage.appendChild(e);return}const count=valid.length,positions=count===1?[[50,55]]:count===2?[[30,58],[70,58]]:count===3?[[50,38],[28,65],[72,65]]:count===4?[[30,38],[70,38],[30,68],[70,68]]:[[50,30],[25,48],[75,48],[35,72],[65,72]];valid.slice(0,5).forEach((p,i)=>{const username=requireUsername(p),slot=document.createElement("div");slot.className="avatar-slot"+(currentUser&&p.id===currentUser.id?" me":"");slot.style.left=positions[i][0]+"%";slot.style.top=positions[i][1]+"%";slot.setAttribute("role","button");slot.setAttribute("tabindex","0");slot.setAttribute("aria-label","Abrir perfil de @"+username);slot.innerHTML=avatarHTML(p)+'<div class="avatar-name">@'+escapeHTML(username)+'</div><div class="avatar-role">'+(currentUser&&p.id===currentUser.id?"Você":"")+'</div>';slot.addEventListener("click",()=>openProfile(p.id));slot.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openProfile(p.id)}});roomStage.appendChild(slot)});if(valid.length>5){const more=document.createElement("div");more.className="stage-title";more.style.left="auto";more.style.right="16px";more.textContent="+"+(valid.length-5)+" na sala";roomStage.appendChild(more)}}async function loadMembers(){const{data,error}=await supabaseClient.from("room_members").select("user_id").eq("room_id",roomId);if(error){members.innerHTML='<div class="error">Não foi possível carregar os usuários.</div>';return}const profiles=await getProfiles((data||[]).map(x=>x.user_id));const valid=profiles.filter(p=>requireUsername(p));renderStage(valid);members.innerHTML="";if(!valid.length){members.innerHTML='<div class="empty">Nenhum usuário com username cadastrado.</div>';return}valid.forEach(p=>{const username=requireUsername(p),me=currentUser&&p.id===currentUser.id,el=document.createElement("div");el.className="member";el.setAttribute("role","button");el.setAttribute("tabindex","0");el.setAttribute("aria-label","Abrir perfil de @"+username);el.innerHTML=(p.avatar_url?'<img class="member-avatar" src="'+escapeHTML(p.avatar_url)+'" alt="">':'<div class="member-avatar">👤</div>')+'<div><div class="member-name">@'+escapeHTML(username)+(me?' <span style="color:#4ade80">(Você)</span>':'')+'</div><div class="member-role">Nível '+escapeHTML(p.level??"1")+'</div></div>';el.addEventListener("click",()=>openProfile(p.id));el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openProfile(p.id)}});members.appendChild(el)})}async function loadMessages(){const{data,error}=await supabaseClient.from("room_messages").select("id,room_id,user_id,message,created_at").eq("room_id",roomId).order("created_at",{ascending:true});if(error)throw error;await getProfiles((data||[]).map(m=>m.user_id));messages.innerHTML="";if(!data?.length){messages.innerHTML='<div class="empty">Nenhuma mensagem ainda.<br><br>Seja o primeiro a falar! 👋</div>';return}for(const m of data){if(requireUsername(profileCache[m.user_id]))addMessage(m,false)}messages.scrollTop=messages.scrollHeight}function addMessage(m,scroll=true){if(!m?.id||document.querySelector('[data-message-id="'+CSS.escape(String(m.id))+'"]'))return;const e=messages.querySelector(".empty");if(e)e.remove();const p=profileCache[m.user_id],username=requireUsername(p);if(!username)return;const el=document.createElement("div");el.className="message"+(currentUser&&m.user_id===currentUser.id?" me":"");el.dataset.messageId=String(m.id);el.innerHTML='<div class="message-user">@'+escapeHTML(username)+'</div><div class="message-text">'+escapeHTML(m.message)+'</div><div class="message-time">'+escapeHTML(formatTime(m.created_at))+'</div>';el.querySelector(".message-user").addEventListener("click",()=>openProfile(m.user_id));messages.appendChild(el);if(scroll)messages.scrollTop=messages.scrollHeight}function subscribeMessages(){if(messagesChannel)supabaseClient.removeChannel(messagesChannel);messagesChannel=supabaseClient.channel("zunoplay-room-messages-"+roomId).on("postgres_changes",{event:"INSERT",schema:"public",table:"room_messages",filter:"room_id=eq."+roomId},async p=>{try{await getProfiles([p.new.user_id]);addMessage(p.new,true)}catch(e){console.error(e)}}).subscribe(s=>{if(s==="SUBSCRIBED")setStatus("Sala ativa");else if(s==="CHANNEL_ERROR"||s==="TIMED_OUT")setStatus("Realtime indisponível",false)})}function subscribeMembers(){if(membersChannel)supabaseClient.removeChannel(membersChannel);membersChannel=supabaseClient.channel("zunoplay-room-members-"+roomId).on("postgres_changes",{event:"*",schema:"public",table:"room_members",filter:"room_id=eq."+roomId},()=>loadMembers()).subscribe()}chatForm.addEventListener("submit",async e=>{e.preventDefault();const text=chatInput.value.trim();if(!text||!currentUser||!roomId)return;sendButton.disabled=true;chatInput.disabled=true;try{const{data,error}=await supabaseClient.from("room_messages").insert({room_id:roomId,user_id:currentUser.id,message:text}).select("id,room_id,user_id,message,created_at").single();if(error)throw error;chatInput.value="";await getProfiles([currentUser.id]);addMessage(data,true)}catch(err){alert("Erro ao enviar mensagem:\n\n"+(err.message||"Erro desconhecido."))}finally{sendButton.disabled=false;chatInput.disabled=false;chatInput.focus()}});leaveButton.addEventListener("click",async()=>{leaveButton.disabled=true;leaveButton.textContent="Saindo...";try{if(currentUser&&roomId)await supabaseClient.from("room_members").delete().eq("room_id",roomId).eq("user_id",currentUser.id)}finally{if(messagesChannel)await supabaseClient.removeChannel(messagesChannel);if(membersChannel)await supabaseClient.removeChannel(membersChannel);sessionStorage.removeItem("zunoplay_room_id");goBack()}});async function init(){try{roomId=getRoomId();if(!roomId)throw new Error("ID da sala não encontrado.");sessionStorage.setItem("zunoplay_room_id",roomId);await loadCurrentUser();await loadRoom();await loadMessages();await loadMembers();subscribeMessages();subscribeMembers();setStatus("Sala ativa");chatInput.focus()}catch(err){console.error(err);setStatus("Erro",false);roomTitle.textContent="Erro na sala";heroTitle.textContent="Não foi possível abrir a sala";messages.innerHTML='<div class="error">'+escapeHTML(err.message||"Não foi possível carregar a sala.")+'</div>';chatForm.style.display="none"}}supabaseClient.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT")goBack()});window.addEventListener("beforeunload",()=>{if(messagesChannel)supabaseClient.removeChannel(messagesChannel);if(membersChannel)supabaseClient.removeChannel(membersChannel)});init();</script></body></html>
