<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Sala - ZunoPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 20% 20%,
            #25145c 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            #102d59 0%,
            transparent 35%
        ),
        #070811;

    color: white;

}

.app {

    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;

    display: flex;
    flex-direction: column;

}

.header {

    display: flex;
    align-items: center;
    gap: 12px;

    padding: 18px 20px;

    border-bottom: 1px solid #292a3d;

    background: rgba(10,11,20,.95);

}

.back {

    width: 42px;
    height: 42px;

    border-radius: 12px;

    border: 1px solid #303145;

    background: #1b1c2b;

    color: white;

    font-size: 20px;

    cursor: pointer;

}

.header-info {

    flex: 1;

}

.room-title {

    font-size: 18px;
    font-weight: bold;

}

.room-status {

    color: #4ade80;

    font-size: 11px;

    margin-top: 3px;

}

.content {

    flex: 1;

    padding: 20px;

}

.hero {

    text-align: center;

    padding: 15px 10px 20px;

}

.hero-icon {

    font-size: 45px;

    margin-bottom: 10px;

}

.hero h1 {

    font-size: 23px;

    margin-bottom: 7px;

}

.hero p {

    color: #9293a3;

    font-size: 13px;

}

.panel {

    background: rgba(20,21,35,.9);

    border: 1px solid #292a3d;

    border-radius: 20px;

    padding: 18px;

    margin-top: 15px;

}

.panel-title {

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 12px;

}

.member {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 10px 0;

    border-bottom: 1px solid #292a3d;

}

.member:last-child {

    border-bottom: none;

}

.avatar {

    width: 38px;
    height: 38px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6366f1
        );

    display: flex;

    align-items: center;
    justify-content: center;

}

.member-name {

    font-size: 14px;
    font-weight: bold;

}

.member-role {

    color: #858697;

    font-size: 11px;

    margin-top: 3px;

}

.chat {

    margin-top: 15px;

}

.chat-title {

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 10px;

}

.messages {

    min-height: 160px;
    max-height: 300px;

    overflow-y: auto;

    padding: 12px;

    border-radius: 16px;

    background: #0f101b;

    border: 1px solid #292a3d;

}

.message {

    margin-bottom: 10px;

    padding: 10px 12px;

    border-radius: 13px;

    background: #1b1c2b;

}

.message:last-child {

    margin-bottom: 0;

}

.message-user {

    font-size: 11px;

    color: #a78bfa;

    font-weight: bold;

    margin-bottom: 4px;

}

.message-text {

    font-size: 13px;

    line-height: 1.4;

    word-break: break-word;

}

.message-time {

    color: #686978;

    font-size: 9px;

    margin-top: 4px;

}

.empty-chat {

    text-align: center;

    color: #686978;

    font-size: 12px;

    padding: 40px 10px;

}

.chat-form {

    display: flex;

    gap: 8px;

    margin-top: 10px;

}

.chat-input {

    flex: 1;

    min-width: 0;

    padding: 13px;

    border-radius: 12px;

    border: 1px solid #303145;

    background: #141523;

    color: white;

    outline: none;

}

.chat-input:focus {

    border-color: #8b5cf6;

}

.send-button {

    width: 52px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6366f1
        );

    color: white;

    font-size: 18px;

    cursor: pointer;

}

.send-button:disabled {

    opacity: .6;

}

.leave {

    width: calc(100% - 40px);

    margin: 0 20px 20px;

    padding: 15px;

    border-radius: 14px;

    border: 1px solid #5b2830;

    background: #24151a;

    color: #ff8f8f;

    font-weight: bold;

    cursor: pointer;

}

.error {

    text-align: center;

    padding: 60px 20px;

    color: #ff8f8f;

}

</style>

</head>


<body>


<div
    id="app"
    class="app"
>

    <div class="header">

        <button
            class="back"
            onclick="window.location.href='salas.html'"
        >

            ←

        </button>


        <div class="header-info">

            <div
                id="roomTitle"
                class="room-title"
            >

                Carregando sala...

            </div>

            <div class="room-status">

                ● Sala ativa

            </div>

        </div>

    </div>


    <div class="content">

        <div class="hero">

            <div class="hero-icon">

                🎙️

            </div>

            <h1 id="heroTitle">

                Sala

            </h1>

            <p>

                Converse com as pessoas da sala.

            </p>

        </div>


        <div class="panel">

            <div class="panel-title">

                👥 Pessoas na sala

            </div>


            <div id="members">

                <div class="empty-chat">

                    Carregando participantes...

                </div>

            </div>

        </div>


        <div class="panel chat">

            <div class="chat-title">

                💬 Conversa

            </div>


            <div
                id="messages"
                class="messages"
            >

                <div class="empty-chat">

                    Carregando mensagens...

                </div>

            </div>


            <form
                id="chatForm"
                class="chat-form"
            >

                <input
                    id="chatInput"
                    class="chat-input"
                    type="text"
                    maxlength="500"
                    placeholder="Digite uma mensagem..."
                    autocomplete="off"
                >


                <button
                    id="sendButton"
                    class="send-button"
                    type="submit"
                >

                    ➤

                </button>

            </form>

        </div>

    </div>


    <button
        id="leaveButton"
        class="leave"
    >

        Sair da sala

    </button>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   ELEMENTOS
========================================= */

const roomTitle =
document.getElementById(
    "roomTitle"
);

const heroTitle =
document.getElementById(
    "heroTitle"
);

const membersElement =
document.getElementById(
    "members"
);

const messagesElement =
document.getElementById(
    "messages"
);

const chatForm =
document.getElementById(
    "chatForm"
);

const chatInput =
document.getElementById(
    "chatInput"
);

const sendButton =
document.getElementById(
    "sendButton"
);

const leaveButton =
document.getElementById(
    "leaveButton"
);


/* =========================================
   SALA
========================================= */

const params =
new URLSearchParams(
    window.location.search
);

const roomId =
params.get("room");


let currentUser =
null;

let roomData =
null;

let messagesChannel =
null;

let membersChannel =
null;


/* =========================================
   SEGURANÇA
========================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text || "";

    return div.innerHTML;

}


/* =========================================
   DATA
========================================= */

function formatTime(
    dateString
) {

    const date =
        new Date(
            dateString
        );

    return date.toLocaleTimeString(
        "pt-BR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================
   USUÁRIO
========================================= */

async function getUser() {

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if(error) {

        console.error(
            error
        );

        return null;

    }


    return data?.user || null;

}


/* =========================================
   CARREGAR SALA
========================================= */

async function loadRoom() {

    if(!roomId) {

        showError(
            "Sala não encontrada."
        );

        return false;

    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("rooms")
        .select(
            "id, name, owner_id, created_at"
        )
        .eq(
            "id",
            roomId
        )
        .single();


    if(error) {

        console.error(
            error
        );

        showError(
            "Não foi possível carregar a sala."
        );

        return false;

    }


    roomData =
        data;


    const name =
        data.name ||
        "Sala";


    roomTitle.textContent =
        name;

    heroTitle.textContent =
        name;


    return true;

}


/* =========================================
   CARREGAR PARTICIPANTES
========================================= */

async function loadMembers() {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("room_members")
        .select(
            "user_id"
        )
        .eq(
            "room_id",
            roomId
        );


    if(error) {

        console.error(
            error
        );

        membersElement.innerHTML = `

            <div class="empty-chat">

                Não foi possível carregar
                os participantes.

            </div>

        `;

        return;

    }


    membersElement.innerHTML =
        "";


    if(!data || !data.length) {

        membersElement.innerHTML = `

            <div class="empty-chat">

                Nenhum participante.

            </div>

        `;

        return;

    }


    data.forEach(
        function(member) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "member";


            const isMe =
                currentUser &&
                member.user_id ===
                currentUser.id;


            const label =
                isMe
                ? "Você"
                : "ZunoPlayer";


            item.innerHTML = `

                <div class="avatar">

                    👤

                </div>

                <div>

                    <div class="member-name">

                        ${escapeHTML(label)}

                    </div>

                    <div class="member-role">

                        Participante

                    </div>

                </div>

            `;


            membersElement.appendChild(
                item
            );

        }
    );

}


/* =========================================
   CARREGAR MENSAGENS
========================================= */

async function loadMessages() {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("room_messages")
        .select(
            "id, user_id, message, created_at"
        )
        .eq(
            "room_id",
            roomId
        )
        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if(error) {

        console.error(
            error
        );


        messagesElement.innerHTML = `

            <div class="empty-chat">

                Não foi possível carregar
                as mensagens.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

        return;

    }


    renderMessages(
        data || []
    );

}


/* =========================================
   MOSTRAR MENSAGENS
========================================= */

function renderMessages(
    messages
) {

    messagesElement.innerHTML =
        "";


    if(!messages.length) {

        messagesElement.innerHTML = `

            <div class="empty-chat">

                Nenhuma mensagem ainda.
                <br>
                Seja o primeiro a falar! 👋

            </div>

        `;

        return;

    }


    messages.forEach(
        function(item) {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "message";


            const isMe =
                currentUser &&
                item.user_id ===
                currentUser.id;


            const username =
                isMe
                ? "Você"
                : "ZunoPlayer";


            element.innerHTML = `

                <div class="message-user">

                    ${escapeHTML(
                        username
                    )}

                </div>


                <div class="message-text">

                    ${escapeHTML(
                        item.message
                    )}

                </div>


                <div class="message-time">

                    ${formatTime(
                        item.created_at
                    )}

                </div>

            `;


            messagesElement.appendChild(
                element
            );

        }
    );


    messagesElement.scrollTop =
        messagesElement.scrollHeight;

}


/* =========================================
   ENVIAR MENSAGEM
========================================= */

chatForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const text =
            chatInput.value.trim();


        if(!text) {

            return;

        }


        if(!currentUser) {

            alert(
                "Você precisa estar conectado."
            );

            return;

        }


        sendButton.disabled =
            true;


        chatInput.disabled =
            true;


        const {
            error
        } =
        await supabaseClient
            .from("room_messages")
            .insert(
                {
                    room_id:
                        roomId,

                    user_id:
                        currentUser.id,

                    message:
                        text
                }
            );


        if(error) {

            console.error(
                error
            );


            alert(
                "Não foi possível enviar a mensagem:\n\n" +
                error.message
            );

        } else {

            chatInput.value =
                "";

        }


        sendButton.disabled =
            false;

        chatInput.disabled =
            false;

        chatInput.focus();

    }
);


/* =========================================
   REALTIME DO CHAT
========================================= */

function subscribeMessages() {

    if(messagesChannel) {

        supabaseClient
            .removeChannel(
                messagesChannel
            );

    }


    messagesChannel =
        supabaseClient
            .channel(
                "room-messages-" +
                roomId
            )
            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "room_messages",
                    filter:
                        "room_id=eq." +
                        roomId
                },
                function(payload) {

                    const message =
                        payload.new;


                    addMessage(
                        message
                    );

                }
            )
            .subscribe();

}


/* =========================================
   ADICIONAR MENSAGEM EM TEMPO REAL
========================================= */

function addMessage(
    item
) {

    const empty =
        messagesElement.querySelector(
            ".empty-chat"
        );


    if(empty) {

        messagesElement.innerHTML =
            "";

    }


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "message";


    const isMe =
        currentUser &&
        item.user_id ===
        currentUser.id;


    const username =
        isMe
        ? "Você"
        : "ZunoPlayer";


    element.innerHTML = `

        <div class="message-user">

            ${escapeHTML(
                username
            )}

        </div>


        <div class="message-text">

            ${escapeHTML(
                item.message
            )}

        </div>


        <div class="message-time">

            ${formatTime(
                item.created_at
            )}

        </div>

    `;


    messagesElement.appendChild(
        element
    );


    messagesElement.scrollTop =
        messagesElement.scrollHeight;

}


/* =========================================
   REALTIME PARTICIPANTES
========================================= */

function subscribeMembers() {

    if(membersChannel) {

        supabaseClient
            .removeChannel(
                membersChannel
            );

    }


    membersChannel =
        supabaseClient
            .channel(
                "room-members-" +
                roomId
            )
            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "room_members",
                    filter:
                        "room_id=eq." +
                        roomId
                },
                function() {

                    loadMembers();

                }
            )
            .subscribe();

}


/* =========================================
   SAIR DA SALA
========================================= */

        if(!currentUser) {

        }

        }

        if(error) {
