<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala - ZunoPlay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 20% 20%,#25145c 0%,transparent 35%),radial-gradient(circle at 80% 80%,#102d59 0%,transparent 35%),#070811;color:#fff}.app{width:100%;max-width:480px;min-height:100vh;margin:auto}.header{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid #292a3d;background:rgba(10,11,20,.95)}.back{width:42px;height:42px;border-radius:12px;border:1px solid #303145;background:#1b1c2b;color:#fff;font-size:20px;cursor:pointer}.header-info{flex:1}.room-title{font-size:18px;font-weight:bold}.room-status{color:#4ade80;font-size:11px;margin-top:3px}.content{padding:20px}.hero{text-align:center;padding:20px 10px}.hero-icon{font-size:48px;margin-bottom:10px}.hero h1{font-size:23px;margin-bottom:8px}.hero p{color:#9293a3;font-size:13px}.panel{background:rgba(20,21,35,.9);border:1px solid #292a3d;border-radius:20px;padding:18px;margin-top:15px}.panel-title{font-size:15px;font-weight:bold;margin-bottom:12px}.member{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #292a3d}.member:last-child{border-bottom:none}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#6366f1);display:flex;align-items:center;justify-content:center}.member-name{font-size:14px;font-weight:bold}.member-role{color:#858697;font-size:11px;margin-top:3px}.messages{min-height:150px;max-height:320px;overflow-y:auto;padding:12px;border-radius:16px;background:#0f101b;border:1px solid #292a3d}.message{margin-bottom:10px;padding:10px 12px;border-radius:13px;background:#1b1c2b}.message.me{border-left:3px solid #8b5cf6}.message-user{color:#a78bfa;font-size:11px;font-weight:bold;margin-bottom:4px}.message-text{font-size:13px;line-height:1.4;word-break:break-word}.message-time{color:#686978;font-size:9px;margin-top:4px}.empty{text-align:center;color:#737486;font-size:12px;padding:30px 10px}.error{padding:25px 10px;text-align:center;color:#ff8f8f;font-size:13px;line-height:1.5}.chat-form{display:flex;gap:8px;margin-top:10px}.chat-input{flex:1;min-width:0;padding:13px;border-radius:12px;border:1px solid #303145;background:#141523;color:#fff;outline:none}.chat-input:focus{border-color:#8b5cf6}.send-button{width:52px;border:none;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-size:18px;cursor:pointer}.send-button:disabled{opacity:.6}.leave{width:100%;margin-top:20px;padding:15px;border-radius:14px;border:1px solid #5b2830;background:#24151a;color:#ff8f8f;font-weight:bold;cursor:pointer}.leave:disabled{opacity:.6}
</style>
</head>
<body>
<div id="app" class="app"><div class="header"><button class="back" onclick="goBack()">←</button><div class="header-info"><div id="roomTitle" class="room-title">Carregando sala...</div><div id="roomStatus" class="room-status">● Conectando...</div></div></div><div class="content"><div class="hero"><div class="hero-icon">🎙️</div><h1 id="heroTitle">Sala</h1><p>Converse com as pessoas da sala.</p></div><div class="panel"><div class="panel-title">👥 Pessoas na sala</div><div id="members"><div class="empty">Carregando participantes...</div></div></div><div class="panel"><div class="panel-title">💬 Conversa</div><div id="messages" class="messages"><div class="empty">Carregando mensagens...</div></div><form id="chatForm" class="chat-form"><input id="chatInput" class="chat-input" type="text" maxlength="500" placeholder="Digite uma mensagem..." autocomplete="off"><button id="sendButton" class="send-button" type="submit">➤</button></form></div><button id="leaveButton" class="leave">Sair da sala</button></div></div>
<script>
const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co";const SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const roomTitle=document.getElementById("roomTitle"),roomStatus=document.getElementById("roomStatus"),heroTitle=document.getElementById("heroTitle"),members=document.getElementById("members"),messages=document.getElementById("messages"),chatForm=document.getElementById("chatForm"),chatInput=document.getElementById("chatInput"),sendButton=document.getElementById("sendButton"),leaveButton=document.getElementById("leaveButton");let roomId=null,currentUser=null,messagesChannel=null,membersChannel=null;
function escapeHTML(text){const d=document.createElement("div");d.textContent=text==null?"":String(text);return d.innerHTML}function formatTime(v){const d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}function goBack(){window.location.href="salas.html"}function getRoomId(){const p=new URLSearchParams(location.search);return p.get("room")||p.get("room_id")||p.get("id")||sessionStorage.getItem("zunoplay_room_id")}function setStatus(t,ok=true){roomStatus.textContent="● "+t;roomStatus.style.color=ok?"#4ade80":"#ff8f8f"}
async function loadCurrentUser(){const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;currentUser=data?.session?.user||null;if(!currentUser)throw new Error("Você precisa estar conectado para acessar a sala.");return currentUser}
async function loadRoom(){if(!roomId)throw new Error("O endereço da sala não contém o ID da sala.");const {data,error}=await supabaseClient.from("rooms").select("id,name,owner_id,created_at").eq("id",roomId).maybeSingle();if(error)throw error;if(!data)throw new Error("A sala não foi encontrada.");roomTitle.textContent=data.name||"Sala";heroTitle.textContent=data.name||"Sala"}
async function loadMembers(){const {data,error}=await supabaseClient.from("room_members").select("user_id").eq("room_id",roomId);if(error){console.error(error);members.innerHTML='<div class="error">Não foi possível carregar os participantes.</div>';return}members.innerHTML="";if(!data?.length){members.innerHTML='<div class="empty">Nenhum participante.</div>';return}data.forEach(m=>{const el=document.createElement("div");el.className="member";const me=currentUser&&m.user_id===currentUser.id;el.innerHTML='<div class="avatar">👤</div><div><div class="member-name">'+(me?"Você":"ZunoPlayer")+'</div><div class="member-role">Participante</div></div>';members.appendChild(el)})}
function addMessage(m,scroll=true){if(!m?.id)return;if(document.querySelector('[data-message-id="'+CSS.escape(String(m.id))+'"]'))return;const e=messages.querySelector(".empty");if(e)e.remove();const el=document.createElement("div");el.className="message";el.dataset.messageId=String(m.id);const me=currentUser&&m.user_id===currentUser.id;if(me)el.classList.add("me");el.innerHTML='<div class="message-user">'+(me?"Você":"ZunoPlayer")+'</div><div class="message-text">'+escapeHTML(m.message)+'</div><div class="message-time">'+escapeHTML(formatTime(m.created_at))+'</div>';messages.appendChild(el);if(scroll)messages.scrollTop=messages.scrollHeight}
async function loadMessages(){const {data,error}=await supabaseClient.from("room_messages").select("id,room_id,user_id,message,created_at").eq("room_id",roomId).order("created_at",{ascending:true});if(error)throw error;messages.innerHTML="";if(!data?.length){messages.innerHTML='<div class="empty">Nenhuma mensagem ainda.<br><br>Seja o primeiro a falar! 👋</div>';return}data.forEach(m=>addMessage(m,false));messages.scrollTop=messages.scrollHeight}
function subscribeMessages(){if(messagesChannel)supabaseClient.removeChannel(messagesChannel);messagesChannel=supabaseClient.channel("zunoplay-room-messages-"+roomId).on("postgres_changes",{event:"INSERT",schema:"public",table:"room_messages",filter:"room_id=eq."+roomId},payload=>addMessage(payload.new,true)).subscribe(status=>{console.log("Realtime mensagens:",status);if(status==="SUBSCRIBED")setStatus("Sala ativa");else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT")setStatus("Realtime indisponível",false)})}
function subscribeMembers(){if(membersChannel)supabaseClient.removeChannel(membersChannel);membersChannel=supabaseClient.channel("zunoplay-room-members-"+roomId).on("postgres_changes",{event:"*",schema:"public",table:"room_members",filter:"room_id=eq."+roomId},loadMembers).subscribe()}
chatForm.addEventListener("submit",async e=>{e.preventDefault();const text=chatInput.value.trim();if(!text||!currentUser||!roomId)return;sendButton.disabled=true;chatInput.disabled=true;try{const {data,error}=await supabaseClient.from("room_messages").insert({room_id:roomId,user_id:currentUser.id,message:text}).select("id,room_id,user_id,message,created_at").single();if(error)throw error;chatInput.value="";addMessage(data,true)}catch(err){console.error("Erro ao enviar mensagem:",err);alert("Erro ao enviar mensagem:\n\n"+(err.message||"Erro desconhecido."))}finally{sendButton.disabled=false;chatInput.disabled=false;chatInput.focus()}});
leaveButton.addEventListener("click",async()=>{leaveButton.disabled=true;leaveButton.textContent="Saindo...";try{if(currentUser&&roomId)await supabaseClient.from("room_members").delete().eq("room_id",roomId).eq("user_id",currentUser.id)}finally{if(messagesChannel)await supabaseClient.removeChannel(messagesChannel);if(membersChannel)await supabaseClient.removeChannel(membersChannel);sessionStorage.removeItem("zunoplay_room_id");goBack()}});
async function init(){try{roomId=getRoomId();if(!roomId)throw new Error("ID da sala não encontrado. Abra a sala pela lista de salas.");sessionStorage.setItem("zunoplay_room_id",roomId);await loadCurrentUser();await loadRoom();await loadMessages();await loadMembers();subscribeMessages();subscribeMembers();setStatus("Sala ativa");chatInput.focus()}catch(err){console.error("Erro ao iniciar sala:",err);setStatus("Erro",false);roomTitle.textContent="Erro na sala";heroTitle.textContent="Não foi possível abrir a sala";messages.innerHTML='<div class="error">'+escapeHTML(err.message||"Não foi possível carregar a sala.")+'</div>';chatForm.style.display="none"}}
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){currentUser=null;if(messagesChannel)supabaseClient.removeChannel(messagesChannel);if(membersChannel)supabaseClient.removeChannel(membersChannel);goBack()}});window.addEventListener("beforeunload",()=>{if(messagesChannel)supabaseClient.removeChannel(messagesChannel);if(membersChannel)supabaseClient.removeChannel(membersChannel)});init();
</script></body></html>
