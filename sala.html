<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070811">
  <title>Sala - ZunoPlay</title>

  <script src="presenca-sala.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    :root{--bg:#070811;--panel:#11121d;--panel2:#171827;--line:#292a3d;--purple:#8b5cf6;--indigo:#6366f1;--muted:#9293a3;--green:#4ade80;--danger:#ff8f8f}

    button{cursor:pointer}
    .app{width:100%;max-width:680px;height:100dvh;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#0b0c16,#070811 52%);border-left:1px solid rgba(255,255,255,.025);border-right:1px solid rgba(255,255,255,.025)}

    .icon-btn{width:42px;height:42px;flex:0 0 42px;border-radius:14px;border:1px solid #303145;background:#171827;color:#fff;font-size:20px;display:grid;place-items:center}
    .header-info{min-width:0;flex:1}
    .room-title{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .top-people{display:flex;align-items:center;margin-right:2px}
    .top-avatar{width:31px;height:31px;border-radius:50%;object-fit:cover;border:2px solid #090a12;background:#34265e;display:grid;place-items:center;font-size:14px;margin-left:-8px;overflow:hidden}
    .top-avatar:first-child{margin-left:0}
    .people-count{height:31px;min-width:31px;padding:0 8px;border-radius:16px;border:1px solid #37384b;background:#20212f;color:#d9d9e4;font-size:11px;display:grid;place-items:center;margin-left:-5px}

    .main{min-height:0;flex:1;display:flex;flex-direction:column;overflow:hidden}
    .stage-shell{flex:0 0 auto;padding:12px 14px 8px}
    .stage-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;padding:0 3px}

    .room-stage{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,1fr);gap:14px 7px;min-height:250px;padding:22px 10px 17px;border-radius:26px;border:1px solid #35304d;background:radial-gradient(circle at 50% 35%,rgba(139,92,246,.16),transparent 28%),linear-gradient(180deg,#161626,#0d0e18);box-shadow:inset 0 -48px 90px rgba(0,0,0,.36),0 16px 45px rgba(0,0,0,.2);overflow:hidden}
    .room-stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.7%,rgba(139,92,246,.035) 50%,transparent 50.3%);pointer-events:none}

    .mic-dot{position:absolute;left:0;bottom:1px;width:20px;height:20px;border:2px solid #11121d;border-radius:50%;background:#292a3b;display:grid;place-items:center;font-size:9px}
    .avatar-name{margin-top:6px;width:100%;font-size:11px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    @keyframes speakPulse{50%{transform:scale(1.055)}}
    @keyframes wave{0%{transform:scale(.92);opacity:.75}100%{transform:scale(1.2);opacity:0}}
    .seat-empty .empty-circle{width:62px;height:62px;border-radius:50%;border:1.5px solid #756c95;background:rgba(255,255,255,.015);display:grid;place-items:center;color:#8b8b9b;font-size:31px;font-weight:200}

    .chat-head{height:40px;flex:0 0 auto;padding:9px 17px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,11,19,.72)}
    .chat-title{font-size:12px;font-weight:800;color:#d7d7e2}
    .chat-hint{font-size:9px;color:#747587}
    .messages{min-height:0;flex:1;overflow-y:auto;padding:12px 13px 22px;scroll-behavior:smooth;overscroll-behavior:contain}

    .chat-avatar{width:32px;height:32px;flex:0 0 32px;border-radius:50%;object-fit:cover;background:#34265e;display:grid;place-items:center;font-size:14px;overflow:hidden;cursor:pointer}
    .bubble-wrap{min-width:0}
    .message-user{margin:0 4px 4px;font-size:10px;font-weight:800;color:#c4b5fd;cursor:pointer}
    .chat-row.me .message-user{text-align:right;color:#a7f3d0}
    .message{position:relative;padding:10px 12px;border-radius:16px 16px 16px 5px;background:#191a28;border:1px solid #292a3d;box-shadow:0 6px 20px rgba(0,0,0,.12)}
    .chat-row.me .message{border-radius:16px 16px 5px 16px;background:linear-gradient(135deg,#6551c7,#5954c5);border-color:#756ae1}
    .message-text{font-size:13px;line-height:1.42;word-break:break-word;color:#f7f7fb}
    .message-time{font-size:8px;color:#6f7182;margin-top:5px;text-align:right}
    .chat-row.me .message-time{color:rgba(255,255,255,.64)}
    .system-event{text-align:center;margin:12px auto;color:#77798a;font-size:10px;max-width:85%;line-height:1.4}

    .error{padding:24px 12px;text-align:center;color:var(--danger);font-size:12px;line-height:1.5}

    .composer-wrap{flex:0 0 auto;padding:7px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #292a3d;background:rgba(10,11,19,.97);backdrop-filter:blur(18px);z-index:12}
    .voice-dock .hero{display:none!important}
    .voice-dock .zuno-voice{width:100%;margin:0 0 7px!important;padding:7px 8px!important;border-radius:13px!important;background:#11121d!important;border:1px solid #27283a!important;gap:7px!important}
    .voice-dock .zuno-voice button{padding:8px 10px!important;font-size:11px!important;border-radius:9px!important;white-space:nowrap}
    .voice-dock .zuno-voice .voice-status{font-size:9px!important;min-width:90px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .voice-dock .zuno-voice .voice-count{font-size:9px!important;white-space:nowrap}
    .composer{display:flex;align-items:center;gap:7px}
    .speaker,.emoji-button,.send-button{width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:1px solid #2d2e41;background:#171827;color:#fff;display:grid;place-items:center;font-size:18px}
    .speaker.muted{color:#ff9b9b;border-color:#5b3139;background:#24161b}
    .chat-form{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
    .chat-input{min-width:0;flex:1;height:42px;padding:0 14px;border-radius:21px;border:1px solid #2d2e41;background:#151621;color:#fff;outline:none;font-size:13px}
    .chat-input:focus{border-color:#655ec0}
    .send-button{border:0;background:linear-gradient(135deg,var(--purple),var(--indigo));font-size:16px}
    .emoji-pop{display:none;position:absolute;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));padding:9px;border-radius:16px;border:1px solid #303145;background:#171827;box-shadow:0 16px 50px #0008;grid-template-columns:repeat(8,1fr);gap:4px;z-index:30}
    .emoji-pop.open{display:grid}.emoji-pop button{border:0;background:transparent;font-size:21px;padding:5px;border-radius:9px}.emoji-pop button:hover{background:#242538}

    .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:.2s}
    .sheet-backdrop.open{opacity:1;pointer-events:auto}
    .members-sheet{position:absolute;left:50%;bottom:0;width:min(680px,100%);max-height:72dvh;transform:translate(-50%,105%);transition:.24s ease;background:#11121d;border:1px solid #303145;border-bottom:0;border-radius:25px 25px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 70px #000b}
    .sheet-backdrop.open .members-sheet{transform:translate(-50%,0)}
    .sheet-handle{width:44px;height:4px;border-radius:4px;background:#3a3b4f;margin:0 auto 14px}
    .sheet-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.sheet-title h3{font-size:15px}.sheet-title span{font-size:10px;color:#858697}
    #members{max-height:45dvh;overflow-y:auto}
    .member{display:flex;align-items:center;gap:11px;padding:10px 3px;border-bottom:1px solid #242536;cursor:pointer}
    .member:last-child{border-bottom:0}
    .member-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#34265e;display:grid;place-items:center;overflow:hidden}
    .member-main{min-width:0;flex:1}.member-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.member-role{font-size:10px;color:#858697;margin-top:3px}.member .presence-status{margin-left:auto!important;font-size:9px!important}
    .leave{width:100%;margin-top:13px;padding:13px;border-radius:13px;border:1px solid #5b2830;background:#24151a;color:#ff9b9b;font-weight:800}
    .hidden{display:none!important}
    @media(max-width:390px){.room-stage{gap:12px 2px;padding-left:5px;padding-right:5px}.avatar-wrap{width:62px;height:62px}.avatar{width:56px;height:56px}.avatar-slot.owner .avatar{width:62px;height:62px}.avatar-name{font-size:10px}.top-people{display:none}.voice-dock .zuno-voice .voice-status{display:none}}
  </style>
</head>
<body>
<div id="app" class="app">
  <header class="header">
    <button class="icon-btn" type="button" onclick="goBack()" aria-label="Voltar">‹</button>
    <div class="header-info">
      <div id="roomTitle" class="room-title">Carregando sala...</div>
      <div class="room-meta"><span id="roomStatus" class="room-status">● Conectando...</span><span>•</span><span id="roomCountText">0 pessoas</span></div>
    </div>
    <div id="topPeople" class="top-people" aria-hidden="true"></div>
    <button id="peopleButton" class="icon-btn" type="button" aria-label="Ver participantes">•••</button>
  </header>

  <main class="main">
    <section class="stage-shell">
      <div class="stage-head"><span class="stage-label">Palco de voz</span><span class="stage-live">● Ao vivo</span></div>
      <div id="roomStage" class="room-stage" aria-label="Participantes no palco"></div>
    </section>

    <section class="chat-section">
      <div class="chat-head"><span class="chat-title">Conversa da sala</span><span class="chat-hint">Toque no avatar para abrir o perfil</span></div>
      <div id="messages" class="messages"><div class="empty">Carregando mensagens...</div></div>
    </section>
  </main>

  <div class="composer-wrap">
    <div id="voiceDock" class="voice-dock"><div class="hero" aria-hidden="true"></div></div>
    <div class="composer">
      <button id="speakerButton" class="speaker" type="button" aria-label="Silenciar áudio da sala">🔊</button>
      <button id="emojiButton" class="emoji-button" type="button" aria-label="Emojis">☺</button>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" class="chat-input" type="text" maxlength="500" placeholder="Conversar..." autocomplete="off">
        <button id="sendButton" class="send-button" type="submit" aria-label="Enviar mensagem">➤</button>
      </form>
    </div>
    <div id="emojiPop" class="emoji-pop" aria-label="Escolher emoji"></div>
  </div>
</div>

<div id="sheetBackdrop" class="sheet-backdrop" aria-hidden="true">
  <section class="members-sheet" role="dialog" aria-modal="true" aria-label="Pessoas na sala">
    <div class="sheet-handle"></div>
    <div class="sheet-title"><h3>Pessoas na sala</h3><span id="sheetCount">0 participantes</span></div>
    <div id="members"><div class="empty">Carregando...</div></div>
    <button id="leaveButton" class="leave" type="button">Sair da sala</button>
  </section>
</div>

<script>
const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co",SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const roomTitle=document.getElementById("roomTitle"),roomStatus=document.getElementById("roomStatus"),roomCountText=document.getElementById("roomCountText"),topPeople=document.getElementById("topPeople"),members=document.getElementById("members"),roomStage=document.getElementById("roomStage"),messages=document.getElementById("messages"),chatForm=document.getElementById("chatForm"),chatInput=document.getElementById("chatInput"),sendButton=document.getElementById("sendButton"),leaveButton=document.getElementById("leaveButton"),peopleButton=document.getElementById("peopleButton"),sheetBackdrop=document.getElementById("sheetBackdrop"),sheetCount=document.getElementById("sheetCount"),speakerButton=document.getElementById("speakerButton"),emojiButton=document.getElementById("emojiButton"),emojiPop=document.getElementById("emojiPop");
let roomId=null,currentUser=null,roomOwnerId=null,messagesChannel=null,membersChannel=null,profileCache={},speakerMuted=false;
const EMOJIS=["😀","😂","😍","🥰","😎","😭","😅","🤔","👏","🔥","💜","✨","🎉","🎮","🎙️","👋","❤️","🤣","😴","😈","🤝","🌟","💫","🚀"];
function escapeHTML(t){const d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML}
function formatTime(v){const d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function broadcastRecord(p){return p?.payload?.record||p?.payload?.new||p?.record||p?.new||null}
function realtimeCore(){if(window.ZunoRealtime)return Promise.resolve(window.ZunoRealtime);return new Promise((resolve,reject)=>{let done=false;const finish=()=>{if(done)return;if(window.ZunoRealtime){done=true;resolve(window.ZunoRealtime)}};window.addEventListener("zuno:realtime-installed",finish,{once:true});setTimeout(()=>{if(done)return;done=true;window.ZunoRealtime?resolve(window.ZunoRealtime):reject(new Error("Realtime global indisponível"))},5000)})}
function goBack(){location.href="salas.html"}
function getRoomId(){const p=new URLSearchParams(location.search);return p.get("room")||p.get("room_id")||p.get("id")||sessionStorage.getItem("zunoplay_room_id")}
function setStatus(t,ok=true){roomStatus.textContent="● "+t;roomStatus.style.color=ok?"#4ade80":"#ff8f8f"}
function toggleSheet(open){const value=open??!sheetBackdrop.classList.contains("open");sheetBackdrop.classList.toggle("open",value);sheetBackdrop.setAttribute("aria-hidden",String(!value))}
peopleButton.addEventListener("click",()=>toggleSheet(true));sheetBackdrop.addEventListener("click",e=>{if(e.target===sheetBackdrop)toggleSheet(false)});document.addEventListener("keydown",e=>{if(e.key==="Escape")toggleSheet(false)});
function applySpeakerMute(){document.querySelectorAll('audio[data-peer-id]').forEach(a=>a.muted=speakerMuted);speakerButton.classList.toggle("muted",speakerMuted);speakerButton.textContent=speakerMuted?"🔇":"🔊";speakerButton.setAttribute("aria-label",speakerMuted?"Ativar áudio da sala":"Silenciar áudio da sala")}
speakerButton.addEventListener("click",()=>{speakerMuted=!speakerMuted;applySpeakerMute()});new MutationObserver(applySpeakerMute).observe(document.body,{childList:true,subtree:true});
EMOJIS.forEach(emoji=>{const b=document.createElement("button");b.type="button";b.textContent=emoji;b.addEventListener("click",()=>{chatInput.value+=emoji;emojiPop.classList.remove("open");chatInput.focus()});emojiPop.appendChild(b)});emojiButton.addEventListener("click",()=>emojiPop.classList.toggle("open"));
async function loadCurrentUser(){const{data,error}=await supabaseClient.auth.getSession();if(error)throw error;currentUser=data?.session?.user||null;if(!currentUser)throw new Error("Você precisa estar conectado para acessar a sala.")}
async function loadRoom(){if(!roomId)throw new Error("O endereço da sala não contém o ID da sala.");const{data,error}=await supabaseClient.from("rooms").select("id,name,owner_id,created_at").eq("id",roomId).maybeSingle();if(error)throw error;if(!data)throw new Error("A sala não foi encontrada.");roomOwnerId=data.owner_id||null;roomTitle.textContent=data.name||"Sala"}
async function getProfiles(ids){const unique=[...new Set(ids.filter(Boolean))];if(!unique.length)return[];const missing=unique.filter(id=>!profileCache[id]);if(missing.length){const{data,error}=await supabaseClient.from("profiles").select("id,username,avatar_url,level,sex").in("id",missing);if(error)throw error;(data||[]).forEach(p=>profileCache[p.id]=p)}return unique.map(id=>profileCache[id]||null)}
function requireUsername(p){return p&&typeof p.username==="string"&&p.username.trim()?p.username.trim():null}
function openProfile(id){if(!id)return;location.href=currentUser&&id===currentUser.id?"perfil.html":"perfil.html?user="+encodeURIComponent(id)}
function avatarNodeHTML(p,cls="avatar"){const username=requireUsername(p),alt=username?"Avatar de @"+username:"Avatar";return p?.avatar_url?'<img class="'+cls+'" src="'+escapeHTML(p.avatar_url)+'" alt="'+escapeHTML(alt)+'">':'<div class="'+cls+'">👤</div>'}
function orderedProfiles(profiles){return [...profiles].sort((a,b)=>{if(a.id===roomOwnerId)return-1;if(b.id===roomOwnerId)return 1;if(a.id===currentUser?.id)return-1;if(b.id===currentUser?.id)return 1;return String(requireUsername(a)||"").localeCompare(String(requireUsername(b)||""),"pt-BR")})}
function renderTopPeople(valid){topPeople.innerHTML="";valid.slice(0,3).forEach(p=>{const el=document.createElement("div");el.className="top-avatar";el.innerHTML=p.avatar_url?'<img src="'+escapeHTML(p.avatar_url)+'" alt="" style="width:100%;height:100%;object-fit:cover">':'👤';topPeople.appendChild(el)});if(valid.length){const count=document.createElement("div");count.className="people-count";count.textContent=valid.length;topPeople.appendChild(count)}}
function renderStage(profiles){roomStage.innerHTML="";const valid=orderedProfiles(profiles.filter(p=>requireUsername(p))),shown=valid.slice(0,8);shown.forEach(p=>{const username=requireUsername(p),me=p.id===currentUser?.id,owner=p.id===roomOwnerId,slot=document.createElement("div");slot.className="avatar-slot"+(me?" me":"")+(owner?" owner":"");slot.dataset.userId=p.id;slot.setAttribute("role","button");slot.setAttribute("tabindex","0");slot.setAttribute("aria-label","Abrir perfil de @"+username);slot.innerHTML='<div class="avatar-wrap">'+avatarNodeHTML(p)+(owner?'<span class="owner-crown" title="Dono da sala">♛</span>':'')+'<span class="mic-dot">🎙</span></div><div class="avatar-name">@'+escapeHTML(username)+'</div><div class="avatar-role">'+(owner?"Dono":me?"Você":"Participante")+'</div>';slot.addEventListener("click",()=>openProfile(p.id));slot.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openProfile(p.id)}});roomStage.appendChild(slot)});for(let i=shown.length;i<8;i++){const empty=document.createElement("div");empty.className="seat-empty";empty.innerHTML='<div class="empty-circle">＋</div><div class="empty-label">Livre</div>';roomStage.appendChild(empty)}if(valid.length>8){const more=document.createElement("div");more.className="stage-overflow";more.textContent="+"+(valid.length-8)+" ouvindo";roomStage.appendChild(more)}window.ZunoRoomPresence?.refresh?.().catch?.(()=>{})}
async function loadMembers(){const{data,error}=await supabaseClient.from("room_members").select("user_id").eq("room_id",roomId);if(error){members.innerHTML='<div class="error">Não foi possível carregar os usuários.</div>';return}const profiles=await getProfiles((data||[]).map(x=>x.user_id)),valid=orderedProfiles(profiles.filter(p=>requireUsername(p)));renderStage(valid);renderTopPeople(valid);const label=valid.length+" "+(valid.length===1?"pessoa":"pessoas");roomCountText.textContent=label;sheetCount.textContent=valid.length+" "+(valid.length===1?"participante":"participantes");members.innerHTML="";if(!valid.length){members.innerHTML='<div class="empty">Ninguém na sala agora.</div>';return}valid.forEach(p=>{const username=requireUsername(p),me=p.id===currentUser?.id,owner=p.id===roomOwnerId,el=document.createElement("div");el.className="member";el.dataset.userId=p.id;el.setAttribute("role","button");el.setAttribute("tabindex","0");el.innerHTML=avatarNodeHTML(p,"member-avatar")+'<div class="member-main"><div class="member-name">@'+escapeHTML(username)+(me?' <span style="color:#4ade80">(Você)</span>':'')+'</div><div class="member-role">'+(owner?'♛ Dono da sala · ':'')+'Nível '+escapeHTML(p.level??1)+'</div></div>';el.addEventListener("click",()=>openProfile(p.id));el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openProfile(p.id)}});members.appendChild(el)});window.ZunoRoomPresence?.refresh?.().catch?.(()=>{})}
async function loadMessages(){const{data,error}=await supabaseClient.from("room_messages").select("id,room_id,user_id,message,created_at").eq("room_id",roomId).order("created_at",{ascending:true});if(error)throw error;await getProfiles((data||[]).map(m=>m.user_id));messages.innerHTML="";if(!data?.length){messages.innerHTML='<div class="empty">Nenhuma mensagem ainda.<br>Comece a conversa 👋</div>';return}for(const m of data){if(requireUsername(profileCache[m.user_id]))addMessage(m,false)}messages.scrollTop=messages.scrollHeight}
function addMessage(m,scroll=true){if(!m?.id||messages.querySelector('[data-message-id="'+CSS.escape(String(m.id))+'"]'))return;messages.querySelector(".empty")?.remove();const p=profileCache[m.user_id],username=requireUsername(p);if(!username)return;const me=m.user_id===currentUser?.id,row=document.createElement("div");row.className="chat-row"+(me?" me":"");row.dataset.messageId=String(m.id);row.innerHTML=avatarNodeHTML(p,"chat-avatar")+'<div class="bubble-wrap"><div class="message-user">@'+escapeHTML(username)+'</div><div class="message"><div class="message-text">'+escapeHTML(m.message)+'</div><div class="message-time">'+escapeHTML(formatTime(m.created_at))+'</div></div></div>';row.querySelector(".chat-avatar").addEventListener("click",()=>openProfile(m.user_id));row.querySelector(".message-user").addEventListener("click",()=>openProfile(m.user_id));messages.appendChild(row);if(scroll)messages.scrollTop=messages.scrollHeight}
function addSystemEvent(text){const el=document.createElement("div");el.className="system-event";el.innerHTML='<span>'+escapeHTML(text)+'</span>';messages.querySelector(".empty")?.remove();messages.appendChild(el);messages.scrollTop=messages.scrollHeight;setTimeout(()=>el.remove(),30000)}
async function subscribeMessages(){if(messagesChannel)await messagesChannel.close?.();const core=await realtimeCore();await core.start();messagesChannel=core.broadcast.scope("room:"+roomId+":messages",{private:true});messagesChannel.on("INSERT",async p=>{const m=broadcastRecord(p);if(!m||m.room_id!==roomId)return;try{await getProfiles([m.user_id]);addMessage(m,true)}catch(e){console.error(e)}});await messagesChannel.subscribe();setStatus("Sala ativa")}
function subscribeMembers(){if(membersChannel)supabaseClient.removeChannel(membersChannel);membersChannel=supabaseClient.channel("zunoplay-room-members-"+roomId).on("postgres_changes",{event:"*",schema:"public",table:"room_members",filter:"room_id=eq."+roomId},async payload=>{try{const row=payload.new?.user_id?payload.new:payload.old,id=row?.user_id;if(id){await getProfiles([id]);const name=requireUsername(profileCache[id]);if(name&&id!==currentUser?.id)addSystemEvent("@"+name+(payload.eventType==="DELETE"?" saiu da sala":" entrou na sala"))}await loadMembers()}catch(e){console.error(e)}}).subscribe()}
chatForm.addEventListener("submit",async e=>{e.preventDefault();emojiPop.classList.remove("open");const text=chatInput.value.trim();if(!text||!currentUser||!roomId)return;sendButton.disabled=true;chatInput.disabled=true;try{const{data,error}=await supabaseClient.from("room_messages").insert({room_id:roomId,user_id:currentUser.id,message:text}).select("id,room_id,user_id,message,created_at").single();if(error)throw error;chatInput.value="";await getProfiles([currentUser.id]);addMessage(data,true)}catch(err){alert("Erro ao enviar mensagem:\n\n"+(err.message||"Erro desconhecido."))}finally{sendButton.disabled=false;chatInput.disabled=false;chatInput.focus()}});
leaveButton.addEventListener("click",async()=>{leaveButton.disabled=true;leaveButton.textContent="Saindo...";try{await window.ZunoRoomVoice?.stop?.();if(currentUser&&roomId)await supabaseClient.from("room_members").delete().eq("room_id",roomId).eq("user_id",currentUser.id)}finally{if(messagesChannel)await messagesChannel.close?.();if(membersChannel)await supabaseClient.removeChannel(membersChannel);sessionStorage.removeItem("zunoplay_room_id");goBack()}});
async function init(){try{roomId=getRoomId();if(!roomId)throw new Error("ID da sala não encontrado.");sessionStorage.setItem("zunoplay_room_id",roomId);await loadCurrentUser();await loadRoom();await subscribeMessages();await loadMessages();await loadMembers();subscribeMembers();setStatus("Sala ativa");chatInput.focus()}catch(err){console.error(err);setStatus("Erro",false);roomTitle.textContent="Erro na sala";messages.innerHTML='<div class="error">'+escapeHTML(err.message||"Não foi possível carregar a sala.")+'</div>';chatForm.style.display="none"}}
supabaseClient.auth.onAuthStateChange(event=>{if(event==="SIGNED_OUT")goBack()});
window.addEventListener("pagehide",()=>{messagesChannel?.close?.().catch?.(()=>{});if(membersChannel)supabaseClient.removeChannel(membersChannel).catch?.(()=>{})});
init();
</script>
</body>
