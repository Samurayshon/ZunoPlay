  <style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030611;color:#fff;font-family:Inter,Arial,sans-serif}body{overflow:hidden}.app{width:100%;max-width:760px;height:100dvh;margin:auto;display:flex;flex-direction:column;background:#030611}.header{height:64px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #293153}.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid #30385e;background:#0d1224;color:#fff;font-size:20px}.header-info{min-width:0;flex:1}.room-title{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.room-meta{display:flex;gap:7px;margin-top:4px;font-size:10px;color:#9fa4ba}.room-status{color:#31dd7b}.top-people{display:flex;align-items:center}.top-avatar{width:31px;height:31px;border-radius:50%;overflow:hidden;background:#171b33;margin-left:-7px;display:grid;place-items:center}.people-count{min-width:31px;height:31px;padding:0 7px;border-radius:16px;background:#0d1224;border:1px solid #30385e;display:grid;place-items:center;font-size:10px}.main{min-height:0;flex:1;display:flex;flex-direction:column}.stage-shell{padding:12px 14px 8px}.stage-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.stage-label{font-size:10px;font-weight:900;letter-spacing:.13em;color:#aaaec0}.stage-live{font-size:10px;color:#7bf0ad;padding:5px 9px;border:1px solid rgba(49,221,123,.2);border-radius:999px;background:rgba(49,221,123,.07)}.room-stage{min-height:236px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,1fr);gap:12px 6px;padding:18px 8px 14px;border:1px solid #343b67;border-radius:24px;background:linear-gradient(180deg,#0d1228,#070a18)}.avatar-slot,.seat-empty{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}.avatar-wrap{position:relative;width:64px;height:64px;display:grid;place-items:center}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid #6755a9;background:#171b33;display:grid;place-items:center;font-size:24px}.owner .avatar{border-color:#f1c86e}.me .avatar{border-color:#31dd7b}.owner-crown,.mic-dot{position:absolute;border-radius:50%;display:grid;place-items:center}.owner-crown{right:0;bottom:0;width:21px;height:21px;background:#e9ad35;color:#161000;font-size:10px}.mic-dot{left:0;bottom:0;width:20px;height:20px;background:#20263f;font-size:9px}.avatar-name{margin-top:5px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:900}.avatar-role,.presence-status{font-size:8.5px;color:#8f95ab;margin-top:2px}.presence-status{color:#31dd7b}.empty-circle{width:58px;height:58px;border:1.5px solid #4c557e;border-radius:50%;display:grid;place-items:center;font-size:28px;color:#727a98}.empty-label{font-size:9px;color:#686e85;margin-top:6px}.chat-section{min-height:0;flex:1;display:flex;flex-direction:column;border-top:1px solid rgba(62,71,116,.35)}.chat-head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.chat-title{font-size:12px;font-weight:900}.chat-hint{font-size:9px;color:#747a90}.messages{min-height:0;flex:1;overflow-y:auto;padding:12px 14px}.empty,.error{text-align:center;padding:28px 12px;color:#777d92;font-size:12px;line-height:1.5}.error{color:#ff9bb2}.chat-row{display:flex;align-items:flex-end;gap:8px;margin:9px 0;max-width:92%}.chat-row.me{margin-left:auto;flex-direction:row-reverse}.chat-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#171b33;display:grid;place-items:center}.message-user{font-size:10px;font-weight:800;color:#c4b5fd;margin:0 4px 4px}.message{padding:10px 12px;border-radius:16px;background:#0d1222;border:1px solid #2d3458}.chat-row.me .message{background:linear-gradient(135deg,#7337da,#8d3fc5)}.message-text{font-size:13px;line-height:1.4}.message-time{font-size:8px;color:#8b90a4;text-align:right;margin-top:5px}.composer-wrap{padding:7px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #2b3152;background:#040711}.composer{display:flex;align-items:center;gap:7px}.speaker,.emoji-button,.send-button{width:42px;height:42px;border-radius:50%;border:1px solid #30385e;background:#0d1224;color:#fff}.chat-form{display:flex;gap:7px;flex:1}.chat-input{height:42px;min-width:0;flex:1;border-radius:21px;border:1px solid #30385e;background:#0a0f20;color:#fff;padding:0 14px}.send-button{border:0;background:linear-gradient(135deg,#843bff,#c33fff 58%,#31d3ff)}.emoji-pop{display:none;position:absolute;left:10px;right:10px;bottom:70px;padding:10px;border-radius:16px;background:#0d1224;border:1px solid #30385e;grid-template-columns:repeat(5,1fr);z-index:50}.emoji-pop.open{display:grid}.emoji-pop button{background:transparent;border:0;font-size:21px}.sheet-backdrop{position:fixed;inset:0;background:#0009;display:none;z-index:80}.sheet-backdrop.open{display:block}.members-sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);max-height:72dvh;overflow:auto;background:#080c1b;border:1px solid #30375c;border-radius:25px 25px 0 0;padding:12px 14px calc(18px + env(safe-area-inset-bottom))}.sheet-handle{width:44px;height:4px;border-radius:999px;background:#3a4266;margin:0 auto 14px}.sheet-title{display:flex;justify-content:space-between;align-items:center}.sheet-title h3{font-size:15px}.sheet-title span{font-size:10px;color:#8f95aa}.member{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #252c4b}.member-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#171b33;display:grid;place-items:center}.member-main{min-width:0;flex:1}.member-name{font-size:12px;font-weight:900}.member-role{font-size:9px;color:#8d93a7;margin-top:3px}.leave{width:100%;margin-top:12px;padding:13px;border-radius:13px;border:1px solid #5b2b3d;background:#24131c;color:#ff9bb2;font-weight:900}@media(max-width:390px){.top-people{display:none}}</style>

<body class="zuno-room-immersive zuno-page-sala">
<div id="app" class="app">
  <header class="header">
    <button class="icon-btn" type="button" onclick="goBack()" aria-label="Voltar">‹</button>
    <div class="header-info"><div id="roomTitle" class="room-title">Carregando sala...</div><div class="room-meta"><span id="roomStatus" class="room-status">● Iniciando...</span><span>•</span><span id="roomCountText">0 pessoas</span></div></div>
    <div id="topPeople" class="top-people" aria-hidden="true"></div>
    <button id="peopleButton" class="icon-btn" type="button" aria-label="Informações e controles da sala">•••</button>
  </header>
  <main class="main">
    <section class="stage-shell"><div class="stage-head"><span class="stage-label">PALCO DE VOZ</span><span class="stage-live">● Ao vivo</span></div><div id="roomStage" class="room-stage"></div></section>
    <section class="chat-section"><div class="chat-head"><span class="chat-title">Conversa da sala</span><span class="chat-hint">Mensagens desta entrada</span></div><div id="messages" class="messages"><div class="empty">Preparando sala...</div></div></section>
  </main>
  <div class="composer-wrap"><div id="voiceDock" class="voice-dock"><div class="hero" aria-hidden="true"></div></div><div class="composer"><button id="speakerButton" class="speaker" type="button" aria-label="Áudio da sala">🔊</button><button id="emojiButton" class="emoji-button" type="button" aria-label="Microfone">🎙️</button><form id="chatForm" class="chat-form"><input id="chatInput" class="chat-input" maxlength="500" placeholder="Conversar..." autocomplete="off"><button id="sendButton" class="send-button" type="submit" aria-label="Enviar">➤</button></form></div><div id="emojiPop" class="emoji-pop"></div></div>
</div>
<div id="sheetBackdrop" class="sheet-backdrop" aria-hidden="true"><section class="members-sheet"><div class="sheet-handle"></div><div class="sheet-title"><h3>Pessoas na sala</h3><span id="sheetCount">0 participantes</span></div><div id="members"><div class="empty">Carregando...</div></div><button id="leaveButton" class="leave" type="button">Sair da sala</button></section></div>
