<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Sala - ZunoPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 20% 20%,
            #25145c 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            #102d59 0%,
            transparent 35%
        ),
        #070811;

    color: white;

}

.app {

    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;

}

.header {

    display: flex;
    align-items: center;
    gap: 12px;

    padding: 18px 20px;

    border-bottom: 1px solid #292a3d;

    background: rgba(10,11,20,.95);

}

.back {

    width: 42px;
    height: 42px;

    border-radius: 12px;

    border: 1px solid #303145;

    background: #1b1c2b;

    color: white;

    font-size: 20px;

    cursor: pointer;

}

.header-info {

    flex: 1;

}

.room-title {

    font-size: 18px;

    font-weight: bold;

}

.room-status {

    color: #4ade80;

    font-size: 11px;

    margin-top: 3px;

}

.content {

    padding: 20px;

}

.hero {

    text-align: center;

    padding: 20px 10px;

}

.hero-icon {

    font-size: 48px;

    margin-bottom: 10px;

}

.hero h1 {

    font-size: 23px;

    margin-bottom: 8px;

}

.hero p {

    color: #9293a3;

    font-size: 13px;

}

.panel {

    background: rgba(20,21,35,.9);

    border: 1px solid #292a3d;

    border-radius: 20px;

    padding: 18px;

    margin-top: 15px;

}

.panel-title {

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 12px;

}

.member {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 10px 0;

    border-bottom: 1px solid #292a3d;

}

.member:last-child {

    border-bottom: none;

}

.avatar {

    width: 38px;

    height: 38px;

    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #8b5cf6,
        #6366f1
    );

    display: flex;

    align-items: center;

    justify-content: center;

}

.member-name {

    font-size: 14px;

    font-weight: bold;

}

.member-role {

    color: #858697;

    font-size: 11px;

    margin-top: 3px;

}

.chat {

    margin-top: 15px;

}

.messages {

    min-height: 150px;

    max-height: 300px;

    overflow-y: auto;

    padding: 12px;

    border-radius: 16px;

    background: #0f101b;

    border: 1px solid #292a3d;

}

.message {

    margin-bottom: 10px;

    padding: 10px 12px;

    border-radius: 13px;

    background: #1b1c2b;

}

.message-user {

    color: #a78bfa;

    font-size: 11px;

    font-weight: bold;

    margin-bottom: 4px;

}

.message-text {

    font-size: 13px;

    word-break: break-word;

}

.message-time {

    color: #686978;

    font-size: 9px;

    margin-top: 4px;

}

.empty {

    text-align: center;

    color: #737486;

    font-size: 12px;

    padding: 30px 10px;

}

.chat-form {

    display: flex;

    gap: 8px;

    margin-top: 10px;

}

.chat-input {

    flex: 1;

    min-width: 0;

    padding: 13px;

    border-radius: 12px;

    border: 1px solid #303145;

    background: #141523;

    color: white;

    outline: none;

}

.send-button {

    width: 52px;

    border: none;

    border-radius: 12px;

    background: linear-gradient(
        135deg,
        #8b5cf6,
        #6366f1
    );

    color: white;

    font-size: 18px;

}

.leave {

    width: calc(100% - 40px);

    margin: 20px;

    padding: 15px;

    border-radius: 14px;

    border: 1px solid #5b2830;

    background: #24151a;

    color: #ff8f8f;

    font-weight: bold;

}

.error {

    padding: 50px 20px;

    text-align: center;

    color: #ff8f8f;

}

</style>

</head>


<body>


<div class="app">


    <div class="header">

        <button
            class="back"
            onclick="window.location.href='salas.html'"
        >

            ←

        </button>


        <div class="header-info">

            <div
                id="roomTitle"
                class="room-title"
            >

                Carregando sala...

            </div>


            <div class="room-status">

                ● Sala ativa

            </div>

        </div>

    </div>


    <div class="content">


        <div class="hero">

            <div class="hero-icon">

                🎙️

            </div>


            <h1 id="heroTitle">

                Sala

            </h1>


            <p>

                Converse com as pessoas da sala.

            </p>

        </div>


        <div class="panel">

            <div class="panel-title">

                👥 Pessoas na sala

            </div>


            <div id="members">

                <div class="empty">

                    Carregando participantes...

                </div>

            </div>

        </div>


        <div class="panel chat">

            <div class="panel-title">

                💬 Conversa

            </div>


            <div
                id="messages"
                class="messages"
            >

                <div class="empty">

                    Carregando mensagens...

                </div>

            </div>


            <form
                id="chatForm"
                class="chat-form"
            >

                <input
                    id="chatInput"
                    class="chat-input"
                    type="text"
                    maxlength="500"
                    placeholder="Digite uma mensagem..."
                    autocomplete="off"
                >


                <button
                    class="send-button"
                    type="submit"
                >

                    ➤

                </button>

            </form>

        </div>


        <button
            id="leaveButton"
            class="leave"
        >

            Sair da sala

        </button>

    </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   ELEMENTOS
========================================= */

const roomTitle =
document.getElementById("roomTitle");

const heroTitle =
document.getElementById("heroTitle");

const members =
document.getElementById("members");

const messages =
document.getElementById("messages");

const chatForm =
document.getElementById("chatForm");

const chatInput =
document.getElementById("chatInput");

const leaveButton =
document.getElementById("leaveButton");


/* =========================================
   ID DA SALA
========================================= */

const params =
new URLSearchParams(
    window.location.search
);

const roomId =
params.get("room");


let currentUser =
null;


/* =========================================
   ESCAPE
========================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}


/* =========================================
   USUÁRIO
========================================= */

async function getUser() {

    const result =
        await supabaseClient
            .auth
            .getUser();

    if(result.error) {

        throw result.error;

    }

    return result.data.user;

}


/* =========================================
   SALA
========================================= */

async function loadRoom() {

    if(!roomId) {

        throw new Error(
            "O endereço da sala não contém o ID da sala."
        );

    }


    const result =
        await supabaseClient
            .from("rooms")
            .select(
                "id, name, owner_id, created_at"
            )
            .eq(
                "id",
                roomId
            )
            .maybeSingle();


    if(result.error) {

        throw result.error;

    }


    if(!result.data) {

        throw new Error(
            "A sala não foi encontrada no banco de dados."
        );

    }


    const name =
        result.data.name ||
        "Sala";


    roomTitle.textContent =
        name;

    heroTitle.textContent =
        name;

}


/* =========================================
   PARTICIPANTES
========================================= */

async function loadMembers() {

    const result =
        await supabaseClient
            .from("room_members")
            .select(
                "user_id"
            )
            .eq(
                "room_id",
                roomId
            );


    if(result.error) {

        throw result.error;

    }


    members.innerHTML =
        "";


    if(!result.data.length) {

        members.innerHTML = `

            <div class="empty">

                Nenhum participante.

            </div>

        `;

        return;

    }


    result.data.forEach(
        function(member) {

            const div =
                document.createElement("div");


            div.className =
                "member";


            const isMe =
                member.user_id ===
                currentUser.id;


            div.innerHTML = `

                <div class="avatar">

                    👤

                </div>

                <div>

                    <div class="member-name">

                        ${
                            isMe
                            ? "Você"
                            : "ZunoPlayer"
                        }

                    </div>

                    <div class="member-role">

                        Participante

                    </div>

                </div>

            `;


            members.appendChild(
                div
            );

        }
    );

}


/* =========================================
   MENSAGENS
========================================= */

async function loadMessages() {

    const result =
        await supabaseClient
            .from("room_messages")
            .select(
                "id, user_id, message, created_at"
            )
            .eq(
                "room_id",
                roomId
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if(result.error) {

        throw result.error;

    }


    renderMessages(
        result.data || []
    );

}


function renderMessages(
    list
) {

    messages.innerHTML =
        "";


    if(!list.length) {

        messages.innerHTML = `

            <div class="empty">

                Nenhuma mensagem ainda.

                <br><br>

                Seja o primeiro a falar! 👋

            </div>

        `;

        return;

    }


    list.forEach(
        addMessage
    );

}


function addMessage(
    item
) {

    const div =
        document.createElement("div");


    div.className =
        "message";


    const isMe =
        item.user_id ===
        currentUser.id;


    const time =
        new Date(
            item.created_at
        ).toLocaleTimeString(
            "pt-BR",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    div.innerHTML = `

        <div class="message-user">

            ${
                isMe
                ? "Você"
                : "ZunoPlayer"
            }

        </div>


        <div class="message-text">

            ${escapeHTML(
                item.message
            )}

        </div>


        <div class="message-time">

            ${time}

        </div>

    `;


    messages.appendChild(
        div
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================================
   ENVIAR
========================================= */

chatForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const text =
            chatInput.value.trim();


        if(!text) {

            return;

        }


        const result =
            await supabaseClient
                .from("room_messages")
                .insert(
                    {
                        room_id:
                            roomId,

                        user_id:
                            currentUser.id,

                        message:
                            text
                    }
                );


        if(result.error) {

            alert(
                "Erro ao enviar mensagem:\n\n" +
                result.error.message
            );

            return;

        }


        chatInput.value =
            "";

        await loadMessages();

    }
);


/* =========================================
   SAIR
========================================= */

leaveButton.addEventListener(
    "click",
    async function() {

        leaveButton.disabled =
            true;

        leaveButton.textContent =
            "Saindo...";


        const result =
            await supabaseClient
                .from("room_members")
                .delete()
                .eq(
                    "room_id",
                    roomId
                )
                .eq(
                    "user_id",
                    currentUser.id
                );


        if(result.error) {

            alert(
                "Erro ao sair:\n\n" +
                result.error.message
            );

            leaveButton.disabled =
                false;

            leaveButton.textContent =
                "Sair da sala";

            return;

        }


        window.location.href =
            "salas.html";

    }
);


/* =========================================
   INICIAR
========================================= */

async function init() {

    try {

        roomTitle.textContent =
            "Carregando...";


        currentUser =
            await getUser();


        if(!currentUser) {

            throw new Error(
                "Você não está conectado."
            );

        }


        await loadRoom();

        await loadMembers();

        await loadMessages();


    } catch(error) {

        console.error(
            "ERRO ZUNOPLAY:",
            error
        );


        document.querySelector(
            ".content"
        ).innerHTML = `

            <div class="error">

                ❌

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <br><br>

                <button
                    onclick="window.location.href='salas.html'"
                    style="
                        padding:14px 20px;
                        border:0;
                        border-radius:12px;
                        background:#8b5cf6;
                        color:white;
                        font-weight:bold;
                    "
                >

                    Voltar para salas

                </button>

            </div>

        `;

    }

}


init();

</script>

</body>

</html>
