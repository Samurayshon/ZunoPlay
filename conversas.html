========================================= */

}

.name {

    margin-bottom: 5px;

}

.last-message {

    font-size: 12px;

    white-space: nowrap;

    overflow: hidden;

    color: #737486;

    margin-bottom: 5px;

    padding: 50px 20px;

<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";


const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   VARIÁVEIS
========================================= */

const app =
document.getElementById("app");


let currentUser = null;

let friendId = null;

let chatChannel = null;

let listChannel = null;


const params =
new URLSearchParams(
    window.location.search
);


friendId =
params.get("user");


/* =========================================
   FUNÇÕES AUXILIARES
========================================= */

function initial(name) {

    if (!name) {

        return "?";

    }

    return name
        .charAt(0)
        .toUpperCase();

}


function escapeHTML(text) {

    const div =
    document.createElement("div");

    div.textContent =
    text || "";

    return div.innerHTML;

}


function formatTime(dateString) {

    if (!dateString) {

        return "";

    }

    const date =
    new Date(dateString);


    return date.toLocaleTimeString(
        "pt-BR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function formatDate(dateString) {

    if (!dateString) {

        return "";

    }

    const date =
    new Date(dateString);


    return date.toLocaleDateString(
        "pt-BR"
    );

}


function goBack() {

    if (friendId) {

        window.location.href =
            "conversas.html";

    } else {

        window.location.href =
            "index.html";

    }

}


/* =========================================
   USUÁRIO
========================================= */

async function getCurrentUser() {

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getSession();


    if (
        error ||
        !data ||
        !data.session ||
        !data.session.user
    ) {

        window.location.href =
            "login.html";

        return false;

    }


    currentUser =
        data.session.user;


    return true;

}


/* =========================================
   HEADER
========================================= */

function renderHeader() {

    return `

        <div class="header">

            <button
                class="back"
                onclick="goBack()"
            >
                ←
            </button>

            <div class="logo">
                Zuno<span>Play</span>
            </div>

        </div>

    `;

}


/* =========================================
   LISTA DE CONVERSAS
========================================= */

async function loadConversations() {


    app.innerHTML = `

        ${renderHeader()}

        <div class="page">

            <h1 class="title">
                💬 Conversas
            </h1>

            <p class="subtitle">
                Suas conversas recentes.
            </p>

            <div id="conversationList">

                <div class="loading">
                    Carregando conversas...
                </div>

            </div>

        </div>

    `;


    const list =
    document.getElementById(
        "conversationList"
    );


    /*
     * BUSCA ENVIADAS
     */

    const {
        data:sent,
        error:sentError
    } =
    await supabaseClient
        .from("messages")
        .select(
            "id,sender_id,receiver_id,content,created_at,read_at"
        )
        .eq(
            "sender_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if (sentError) {

        console.error(
            "Erro nas mensagens enviadas:",
            sentError
        );

        list.innerHTML = `

            <div class="error">

                Erro ao carregar mensagens enviadas.

                <br><br>

                ${escapeHTML(
                    sentError.message
                )}

            </div>

        `;

        return;

    }


    /*
     * BUSCA RECEBIDAS
     */

    const {
        data:received,
        error:receivedError
    } =
    await supabaseClient
        .from("messages")
        .select(
            "id,sender_id,receiver_id,content,created_at,read_at"
        )
        .eq(
            "receiver_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if (receivedError) {

        console.error(
            "Erro nas mensagens recebidas:",
            receivedError
        );

        list.innerHTML = `

            <div class="error">

                Erro ao carregar mensagens recebidas.

                <br><br>

                ${escapeHTML(
                    receivedError.message
                )}

            </div>

        `;

        return;

    }


    /*
     * JUNTA TODAS AS MENSAGENS
     */

    const allMessages = [

        ...(sent || []),

        ...(received || [])

    ];


    /*
     * ORDENA DA MAIS NOVA
     * PARA A MAIS ANTIGA
     */

    allMessages.sort(
        function(a,b) {

            return (
                new Date(b.created_at)
                -
                new Date(a.created_at)
            );

        }
    );


    /*
     * CRIA CONVERSAS POR USUÁRIO
     */

    const conversations = {};


    allMessages.forEach(
        function(message) {


            const otherId =

                message.sender_id ===
                currentUser.id

                ?

                message.receiver_id

                :

                message.sender_id;


            if (!otherId) {

                return;

            }


            if (
                !conversations[otherId]
            ) {

                conversations[otherId] = {

                    lastMessage:
                        message,

                    unread: 0

                };

            }


            /*
             * CONTADOR DE NÃO LIDAS
             */

            if (

                message.receiver_id ===
                currentUser.id

                &&

                message.read_at === null

            ) {

                conversations[otherId]
                    .unread++;

            }

        }
    );


    const ids =
    Object.keys(
        conversations
    );


    if (!ids.length) {

        list.innerHTML = `

            <div class="empty">

                Você ainda não possui conversas.

                <br><br>

                Vá em Amigos e comece uma conversa! 👋

            </div>

        `;

        subscribeConversationList();

        return;

    }


    /*
     * BUSCA PERFIS
     */

    const {
        data:profiles,
        error:profileError
    } =
    await supabaseClient
        .from("profiles")
        .select(
            "id,username"
        )
        .in(
            "id",
            ids
        );


    if (profileError) {

        console.error(
            "Erro ao buscar perfis:",
            profileError
        );

        list.innerHTML = `

            <div class="error">

                As mensagens foram encontradas,
                mas não foi possível carregar
                os usuários.

                <br><br>

                ${escapeHTML(
                    profileError.message
                )}

            </div>

        `;

        return;

    }


    /*
     * MAPA DE PERFIS
     */

    const profileMap = {};


    (profiles || []).forEach(
        function(profile) {

            profileMap[
                profile.id
            ] = profile;

        }
    );


    /*
     * RENDERIZA
     */

    list.innerHTML = "";


    ids.forEach(
        function(id) {


            const conversation =
            conversations[id];


            const profile =
            profileMap[id];


            /*
             * Se não houver perfil,
             * ainda mostramos a conversa.
             */

            const username =
                profile &&
                profile.username

                ?

                profile.username

                :

                "Usuário";


            const message =
            conversation.lastMessage;


            const item =
            document.createElement(
                "button"
            );


            item.className =
                "conversation";


            item.type =
                "button";


            item.onclick =
            function() {

                window.location.href =
                    "conversas.html?user=" +
                    encodeURIComponent(id);

            };


            let badge = "";


            if (
                conversation.unread > 0
            ) {

                badge = `

                    <div class="badge">

                        ${
                            conversation.unread > 99

                            ? "99+"

                            : conversation.unread

                        }

                    </div>

                `;

            }


            item.innerHTML = `

                <div class="avatar">

                    ${initial(username)}

                </div>


                <div class="info">

                    <div class="name">

                        ${escapeHTML(username)}

                    </div>


                    <div class="last-message">

                        ${escapeHTML(
                            message.content
                        )}

                    </div>

                </div>


                <div>

                    <div class="time">

                        ${formatTime(
                            message.created_at
                        )}

                    </div>

                    ${badge}

                </div>

            `;


            list.appendChild(item);

        }
    );


    subscribeConversationList();

}
