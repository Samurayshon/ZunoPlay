<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Diagnóstico - ZunoPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    background:
    radial-gradient(
        circle at 20% 20%,
        #25145c 0%,
        transparent 35%
    ),
    radial-gradient(
        circle at 80% 80%,
        #102d59 0%,
        transparent 35%
    ),
    #070811;

    color:white;

}

.app{

    width:100%;
    max-width:480px;
    min-height:100vh;
    margin:auto;
    padding:20px;

}

.card{

    background:#141523;

    border:1px solid #303145;

    border-radius:20px;

    padding:20px;

    margin-bottom:15px;

}

h1{

    font-size:25px;
    margin-bottom:20px;

}

h2{

    font-size:17px;
    margin-bottom:10px;

}

.info{

    color:#b7b7c5;

    font-size:13px;

    line-height:1.7;

    word-break:break-all;

}

.ok{

    color:#4ade80;

    font-weight:bold;

}

.error{

    color:#ff7777;

    font-weight:bold;

}

.warning{

    color:#facc15;

    font-weight:bold;

}

.message{

    background:#1b1c2b;

    border:1px solid #303145;

    border-radius:14px;

    padding:12px;

    margin-top:8px;

}

.message small{

    color:#858697;

}

.back{

    width:100%;

    padding:15px;

    margin-top:10px;

    border:0;

    border-radius:14px;

    background:
    linear-gradient(
        135deg,
        #8b5cf6,
        #6366f1
    );

    color:white;

    font-weight:bold;

    font-size:15px;

}

</style>

</head>


<body>


<div id="app" class="app">

    <h1>
        🔎 Diagnóstico ZunoPlay
    </h1>

    <div class="card">

        <h2>
            Status da sessão
        </h2>

        <div id="session" class="info">
            Verificando...
        </div>

    </div>


    <div class="card">

        <h2>
            Usuário logado
        </h2>

        <div id="user" class="info">
            Verificando...
        </div>

    </div>


    <div class="card">

        <h2>
            Mensagens
        </h2>

        <div id="messagesStatus" class="info">
            Buscando...
        </div>

    </div>


    <div class="card">

        <h2>
            Primeiras mensagens encontradas
        </h2>

        <div id="messagesList" class="info">
            Buscando...
        </div>

    </div>


    <button
        class="back"
        onclick="window.location.href='index.html'">

        ← Voltar para o ZunoPlay

    </button>

</div>


<script>


const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";


const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function diagnostico(){

    const sessionElement =
    document.getElementById(
        "session"
    );

    const userElement =
    document.getElementById(
        "user"
    );

    const messagesStatus =
    document.getElementById(
        "messagesStatus"
    );

    const messagesList =
    document.getElementById(
        "messagesList"
    );


    /* =====================================
       SESSÃO
    ===================================== */

    const {
        data: sessionData,
        error: sessionError
    } =
    await supabaseClient.auth.getSession();


    if(sessionError){

        sessionElement.innerHTML = `

            <span class="error">
                ERRO NA SESSÃO
            </span>

            <br>

            ${sessionError.message}

        `;

        return;

    }


    const session =
    sessionData?.session;


    if(!session){

        sessionElement.innerHTML = `

            <span class="error">
                NENHUMA SESSÃO ENCONTRADA
            </span>

            <br><br>

            O ZunoPlay não reconheceu
            uma conta logada neste momento.

        `;

        userElement.innerHTML = `

            <span class="warning">
                Usuário não identificado.
            </span>

        `;

    }else{

        sessionElement.innerHTML = `

            <span class="ok">
                SESSÃO ATIVA
            </span>

            <br><br>

            Session ID:

            <br>

            ${session.access_token
            ? "Token presente"
            : "Token ausente"}

        `;


        const user =
        session.user;


        userElement.innerHTML = `

            <span class="ok">
                USUÁRIO ENCONTRADO
            </span>

            <br><br>

            <strong>ID DO USUÁRIO:</strong>

            <br>

            ${user.id}

            <br><br>

            <strong>E-MAIL:</strong>

            <br>

            ${user.email || "Sem e-mail"}

        `;

    }


    /* =====================================
       BUSCAR TODAS AS MENSAGENS
    ===================================== */

    const {
        data: messages,
        error: messagesError
    } =
    await supabaseClient
    .from("messages")
    .select(
        "id,sender_id,receiver_id,content,created_at,read_at"
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(messagesError){

        messagesStatus.innerHTML = `

            <span class="error">
                ERRO AO BUSCAR MENSAGENS
            </span>

            <br><br>

            ${messagesError.message}

        `;

        return;

    }


    messagesStatus.innerHTML = `

        <span class="ok">
            ${messages?.length || 0}
            mensagens encontradas
        </span>

    `;


    if(!messages || !messages.length){

        messagesList.innerHTML = `

            <span class="warning">
                Nenhuma mensagem retornada.
            </span>

        `;

        return;

    }


    /* =====================================
       MOSTRAR MENSAGENS
    ===================================== */

    messagesList.innerHTML = "";


    messages
    .slice(0,10)
    .forEach(
        function(message,index){

            const div =
            document.createElement(
                "div"
            );


            div.className =
            "message";


            div.innerHTML = `

                <strong>
                    Mensagem ${index + 1}
                </strong>

                <br><br>

                <small>
                    ID:
                </small>

                <br>

                ${message.id}

                <br><br>

                <small>
                    sender_id:
                </small>

                <br>

                ${message.sender_id}

                <br><br>

                <small>
                    receiver_id:
                </small>

                <br>

                ${message.receiver_id}

                <br><br>

                <small>
                    mensagem:
                </small>

                <br>

                ${message.content || "(vazia)"}

                <br><br>

                <small>
                    read_at:
                </small>

                <br>

                ${message.read_at || "NULL"}

            `;


            messagesList.appendChild(
                div
            );

        }
    );


}


diagnostico();

</script>

</body>

</html>
