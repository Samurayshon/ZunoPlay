<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Conversas - ZunoPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 20% 20%,
            #25145c,
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            #102d59,
            transparent 35%
        ),
        #070811;

    color: white;

}

.app {

    width: 100%;

    max-width: 480px;

    min-height: 100vh;

    margin: auto;

}

.header {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 18px 20px;

    background: #0a0b14;

    border-bottom: 1px solid #292a3d;

    position: sticky;

    top: 0;

    z-index: 10;

}

.back {

    width: 42px;

    height: 42px;

    border-radius: 12px;

    border: 1px solid #303145;

    background: #1b1c2b;

    color: white;

    font-size: 21px;

}

.logo {

    font-size: 28px;

    font-weight: 800;

}

.logo span {

    color: #8b5cf6;

}

.page {

    padding: 20px;

}

.title {

    font-size: 25px;

    margin-bottom: 6px;

}

.subtitle {

    color: #9293a3;

    font-size: 13px;

    margin-bottom: 15px;

}

.status {

    padding: 12px;

    margin-bottom: 15px;

    border-radius: 12px;

    background: #141523;

    border: 1px solid #292a3d;

    font-size: 12px;

    color: #4ade80;

}

.message-card {

    width: 100%;

    margin-bottom: 10px;

    padding: 15px;

    background: #141523;

    border: 1px solid #292a3d;

    border-radius: 16px;

}

.message-card.mine {

    border-left: 4px solid #8b5cf6;

}

.message-card.theirs {

    border-left: 4px solid #3b82f6;

}

.type {

    font-size: 11px;

    color: #8b5cf6;

    margin-bottom: 6px;

    font-weight: bold;

}

.theirs .type {

    color: #60a5fa;

}

.content {

    font-size: 15px;

    margin-bottom: 8px;

    word-break: break-word;

}

.details {

    color: #737486;

    font-size: 10px;

    line-height: 1.5;

    word-break: break-all;

}

.empty {

    text-align: center;

    color: #737486;

    padding: 50px 20px;

}

</style>

</head>


<body>


<div id="app" class="app">

    <div class="header">

        <button
            class="back"
            onclick="window.location.href='index.html'"
        >
            ←
        </button>

        <div class="logo">
            Zuno<span>Play</span>
        </div>

    </div>


    <div class="page">

        <h1 class="title">
            💬 Conversas
        </h1>

        <p class="subtitle">
            Diagnóstico das suas mensagens
        </p>

        <div
            id="status"
            class="status"
        >
            ⏳ Carregando...
        </div>

        <div
            id="messages"
        >
        </div>

    </div>

</div>


<script>


const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";


const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const status =
document.getElementById(
    "status"
);


const messagesContainer =
document.getElementById(
    "messages"
);


function escapeHTML(text) {

    const div =
    document.createElement(
        "div"
    );

    div.textContent =
        text || "";

    return div.innerHTML;

}


function formatDate(date) {

    if (!date) {

        return "";

    }

    return new Date(
        date
    ).toLocaleString(
        "pt-BR"
    );

}


async function iniciar() {


    try {


        /* ===============================
           SESSÃO
        =============================== */

        const {
            data: sessionData,
            error: sessionError
        } =
        await supabaseClient
            .auth
            .getSession();


        if (sessionError) {

            throw sessionError;

        }


        if (
            !sessionData ||
            !sessionData.session ||
            !sessionData.session.user
        ) {

            status.innerHTML =
                "❌ Usuário não autenticado.";

            return;

        }


        const user =
            sessionData.session.user;


        /* ===============================
           CONSULTA
           MESMA CONSULTA DO TESTE
        =============================== */

        const {
            data,
            error
        } =
        await supabaseClient
            .from("messages")
            .select("*")
            .or(
                "sender_id.eq." +
                user.id +
                ",receiver_id.eq." +
                user.id
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {

            throw error;

        }


        const messages =
            data || [];


        status.innerHTML =

            "✅ " +

            messages.length +

            " mensagens encontradas para o usuário " +

            user.id;


        messagesContainer.innerHTML = "";


        if (!messages.length) {

            messagesContainer.innerHTML = `

                <div class="empty">

                    Nenhuma mensagem encontrada.

                </div>

            `;

            return;

        }


        /* ===============================
           MOSTRAR TODAS AS MENSAGENS
        =============================== */

        messages.forEach(
            function(message) {


                const isMine =
                    message.sender_id ===
                    user.id;


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "message-card " +
                    (
                        isMine
                        ? "mine"
                        : "theirs"
                    );


                card.innerHTML = `

                    <div class="type">

                        ${
                            isMine
                            ? "VOCÊ ENVIOU"
                            : "VOCÊ RECEBEU"
                        }

                    </div>


                    <div class="content">

                        ${escapeHTML(
                            message.content
                        )}

                    </div>


                    <div class="details">

                        ID: ${escapeHTML(
                            message.id
                        )}

                        <br>

                        ${
                            isMine
                            ? "Destinatário"
                            : "Remetente"
                        }:

                        ${
                            isMine
                            ? escapeHTML(
                                message.receiver_id
                              )
                            : escapeHTML(
                                message.sender_id
                              )
                        }

                        <br>

                        read_at:

                        ${
                            message.read_at === null
                            ? "NULL"
                            : escapeHTML(
                                message.read_at
                              )
                        }

                        <br>

                        ${formatDate(
                            message.created_at
                        )}

                    </div>

                `;


                messagesContainer.appendChild(
                    card
                );

            }
        );


    } catch (error) {


        console.error(
            "ERRO:",
            error
        );


        status.innerHTML =

            "❌ ERRO: " +

            escapeHTML(
                error.message ||
                String(error)
            );

    }

}


iniciar();

</script>

</body>

</html>
