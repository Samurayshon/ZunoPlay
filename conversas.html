<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Diagnóstico ZunoPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    background:
    radial-gradient(
        circle at 20% 20%,
        #25145c,
        transparent 35%
    ),
    radial-gradient(
        circle at 80% 80%,
        #102d59,
        transparent 35%
    ),
    #070811;

    color:white;

}

.app{

    max-width:480px;
    margin:auto;
    padding:20px;

}

.card{

    background:#141523;

    border:1px solid #303145;

    border-radius:18px;

    padding:18px;

    margin-bottom:14px;

}

h1{

    font-size:25px;
    margin-bottom:20px;

}

h2{

    font-size:16px;
    margin-bottom:10px;

}

.info{

    font-size:13px;

    line-height:1.7;

    color:#b7b7c5;

    word-break:break-all;

}

.ok{

    color:#4ade80;
    font-weight:bold;

}

.error{

    color:#ff7777;
    font-weight:bold;

}

.warning{

    color:#facc15;
    font-weight:bold;

}

.message{

    background:#1b1c2b;

    border:1px solid #303145;

    border-radius:12px;

    padding:12px;

    margin-top:8px;

    font-size:12px;

    line-height:1.6;

}

button{

    width:100%;

    padding:15px;

    border:0;

    border-radius:14px;

    background:
    linear-gradient(
        135deg,
        #8b5cf6,
        #6366f1
    );

    color:white;

    font-size:15px;

    font-weight:bold;

}

</style>

</head>


<body>


<div class="app">

<h1>
🔎 Diagnóstico das Conversas
</h1>


<div class="card">

<h2>
Usuário autenticado
</h2>

<div
id="user"
class="info">

Carregando...

</div>

</div>


<div class="card">

<h2>
Mensagens enviadas por você
</h2>

<div
id="sent"
class="info">

Carregando...

</div>

</div>


<div class="card">

<h2>
Mensagens recebidas por você
</h2>

<div
id="received"
class="info">

Carregando...

</div>

</div>


<div class="card">

<h2>
Resultado
</h2>

<div
id="result"
class="info">

Carregando...

</div>

</div>


<button
onclick="window.location.href='index.html'">

← Voltar

</button>


</div>


<script>


const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";


const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function diagnostico(){


const userElement =
document.getElementById(
    "user"
);

const sentElement =
document.getElementById(
    "sent"
);

const receivedElement =
document.getElementById(
    "received"
);

const resultElement =
document.getElementById(
    "result"
);


/* ================================
   USUÁRIO
================================ */

const {
    data:sessionData,
    error:sessionError
} =
await supabaseClient
.auth
.getSession();


if(
    sessionError ||
    !sessionData.session
){

    userElement.innerHTML = `

        <span class="error">
        Nenhum usuário logado
        </span>

    `;

    return;

}


const user =
sessionData.session.user;


userElement.innerHTML = `

    <span class="ok">
    SESSÃO ATIVA
    </span>

    <br><br>

    <strong>ID:</strong>

    <br>

    ${user.id}

`;


/* ================================
   ENVIADAS
================================ */

const {
    data:sent,
    error:sentError
} =
await supabaseClient
.from("messages")
.select(
    "id,sender_id,receiver_id,content,created_at,read_at"
)
.eq(
    "sender_id",
    user.id
)
.order(
    "created_at",
    {
        ascending:false
    }
);


if(sentError){

    sentElement.innerHTML = `

        <span class="error">
        ERRO
        </span>

        <br>

        ${sentError.message}

    `;

}else{

    sentElement.innerHTML = `

        <span class="ok">
        ${sent?.length || 0}
        mensagens enviadas
        </span>

    `;


    (sent || [])
    .slice(0,5)
    .forEach(
        function(message){

            sentElement.innerHTML += `

                <div class="message">

                    ID:
                    ${message.id}

                    <br>

                    Destinatário:
                    ${message.receiver_id}

                    <br>

                    Mensagem:
                    ${message.content}

                    <br>

                    read_at:
                    ${message.read_at || "NULL"}

                </div>

            `;

        }
    );

}


/* ================================
   RECEBIDAS
================================ */

const {
    data:received,
    error:receivedError
} =
await supabaseClient
.from("messages")
.select(
    "id,sender_id,receiver_id,content,created_at,read_at"
)
.eq(
    "receiver_id",
    user.id
)
.order(
    "created_at",
    {
        ascending:false
    }
);


if(receivedError){

    receivedElement.innerHTML = `

        <span class="error">
        ERRO
        </span>

        <br>

        ${receivedError.message}

    `;

}else{

    receivedElement.innerHTML = `

        <span class="ok">
        ${received?.length || 0}
        mensagens recebidas
        </span>

    `;


    (received || [])
    .slice(0,5)
    .forEach(
        function(message){

            receivedElement.innerHTML += `

                <div class="message">

                    ID:
                    ${message.id}

                    <br>

                    Remetente:
                    ${message.sender_id}

                    <br>

                    Mensagem:
                    ${message.content}

                    <br>

                    read_at:
                    ${message.read_at || "NULL"}

                </div>

            `;

        }
    );

}


/* ================================
   RESULTADO
================================ */

const sentCount =
(sent || []).length;

const receivedCount =
(received || []).length;


resultElement.innerHTML = `

    <strong>
    Usuário:
    </strong>

    <br>

    ${user.id}

    <br><br>

    <strong>
    Enviadas:
    </strong>

    ${sentCount}

    <br>

    <strong>
    Recebidas:
    </strong>

    ${receivedCount}

    <br><br>

    ${
        sentCount > 0 ||
        receivedCount > 0

        ?

        `
        <span class="ok">
        ✅ O filtro por usuário está funcionando.
        </span>
        `

        :

        `
        <span class="error">
        ❌ O filtro por usuário não encontrou mensagens.
        </span>
        `
    }

`;

}


diagnostico();

</script>

</body>

</html>
