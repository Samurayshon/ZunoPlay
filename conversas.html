<!DOCTYPE html>
<html lang="pt-BR">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 20% 20%,
            #25145c 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            #102d59 0%,
            transparent 35%
        ),
        #070811;

    color: white;

}

.app {

    width: 100%;

    max-width: 480px;

    min-height: 100vh;

    margin: auto;

}


/* =========================================
   HEADER
========================================= */

.header {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 18px 20px;

    background: rgba(10,11,20,.97);

    border-bottom: 1px solid #292a3d;

    position: sticky;

    top: 0;

    z-index: 20;

}

.back {

    width: 42px;

    height: 42px;

    border-radius: 12px;

    border: 1px solid #303145;

    background: #1b1c2b;

    color: white;

    font-size: 21px;

    cursor: pointer;

}

.logo {

    font-size: 28px;

    font-weight: 800;

}

.logo span {

    color: #8b5cf6;

}


/* =========================================
   PAGE
========================================= */

.page {

    padding: 20px;

}

.title {

    font-size: 25px;

    margin-bottom: 6px;

}

.subtitle {

    color: #9293a3;

    font-size: 13px;

    margin-bottom: 20px;

}


/* =========================================
   STATUS
========================================= */

.status {

    padding: 12px 14px;

    border-radius: 12px;

    background: #141523;

    border: 1px solid #292a3d;

    color: #9293a3;

    font-size: 12px;

    margin-bottom: 15px;

}

.status.ok {

    color: #4ade80;

}


/* =========================================
   CONVERSA
========================================= */

.conversation {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 13px;

    padding: 14px;

    margin-bottom: 10px;

    border-radius: 17px;

    border: 1px solid #292a3d;

    background: rgba(20,21,35,.95);

    color: white;

    cursor: pointer;

    text-align: left;

    transition: .15s;

}

.conversation:hover {

    border-color: #8b5cf6;

    transform: translateY(-1px);

}

.avatar {

    width: 50px;

    height: 50px;

    min-width: 50px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6366f1
        );

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 18px;

    font-weight: bold;

}

.info {

    flex: 1;

    min-width: 0;

}

.name {

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 5px;

}

.last-message {

    color: #858697;

    font-size: 12px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}

.right {

    text-align: right;

}

.time {

    color: #737486;

    font-size: 10px;

    margin-bottom: 6px;

}

.badge {

    min-width: 21px;

    height: 21px;

    padding: 0 6px;

    border-radius: 11px;

    background: #8b5cf6;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    font-size: 10px;

    font-weight: bold;

}


/* =========================================
   EMPTY
========================================= */

.empty {

    text-align: center;

    color: #737486;

    padding: 60px 20px;

    font-size: 14px;

}


/* =========================================
   CHAT
========================================= */

.chat {

    min-height: 100vh;

    display: flex;

    flex-direction: column;

}

.chat-header {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 14px 20px;

    background: rgba(10,11,20,.97);

    border-bottom: 1px solid #292a3d;

    position: sticky;

    top: 0;

    z-index: 20;

}

.chat-messages {

    flex: 1;

    padding: 20px;

    display: flex;

    flex-direction: column;

    gap: 9px;

    overflow-y: auto;

    min-height: calc(100vh - 140px);

}

.message {

    max-width: 78%;

    padding: 11px 14px;

    border-radius: 16px;

    font-size: 14px;

    line-height: 1.4;

    word-break: break-word;

}

.mine {

    align-self: flex-end;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6366f1
        );

    border-bottom-right-radius: 5px;

}

.theirs {

    align-self: flex-start;

    background: #1b1c2b;

    border: 1px solid #303145;

    border-bottom-left-radius: 5px;

}

.message-time {

    display: block;

    font-size: 9px;

    opacity: .6;

    margin-top: 4px;

}

.composer {

    display: flex;

    gap: 8px;

    padding: 12px 15px;

    background: rgba(10,11,20,.98);

    border-top: 1px solid #292a3d;

    position: sticky;

    bottom: 0;

}

.composer input {

    flex: 1;

    min-width: 0;

    padding: 14px;

    border-radius: 13px;

    border: 1px solid #303145;

    background: #11121e;

    color: white;

    outline: none;

}

.send {

    width: 50px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6366f1
        );

    color: white;

    font-size: 19px;

    cursor: pointer;

}

.send:disabled {

    opacity: .5;

}


/* =========================================
   DEBUG
========================================= */

.debug {

    margin-top: 20px;

    padding: 12px;

    border-radius: 12px;

    background: #10111c;

    border: 1px solid #242537;

    color: #686978;

    font-size: 10px;

    word-break: break-all;

}

<script>

const SUPABASE_URL =

const SUPABASE_KEY =

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   VARIÁVEIS
========================================= */

const app =
document.getElementById("app");

let currentUser = null;

let friendId = null;

let realtimeChannel = null;


const params =
new URLSearchParams(
    window.location.search
);

friendId =
params.get("user");


/* =========================================
   FUNÇÕES AUXILIARES
========================================= */

function escapeHTML(text) {

    const div =
    document.createElement("div");

    div.textContent =
    text || "";

    return div.innerHTML;

}


function initial(name) {

    if (!name) {

        return "?";

    }

    return name
        .charAt(0)
        .toUpperCase();

}


function formatTime(dateString) {

    if (!dateString) {

        return "";

    }

    return new Date(
        dateString
    ).toLocaleTimeString(
        "pt-BR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function goBack() {

    if (friendId) {

        window.location.href =
            "conversas.html";

    } else {

        window.location.href =
            "index.html";

    }

}


/* =========================================
   AUTENTICAÇÃO
========================================= */

async function getCurrentUser() {

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getSession();


    if (error) {

        console.error(error);

        return null;

    }


    if (
        !data ||
        !data.session ||
        !data.session.user
    ) {

        return null;

    }


    return data.session.user;

}


/* =========================================
   HEADER
========================================= */

function createHeader() {

    return `

        <div class="header">

            <button
                class="back"
                onclick="goBack()"
            >
                ←
            </button>

            <div class="logo">

                Zuno<span>Play</span>

            </div>

        </div>

    `;

}


/* =========================================
   LISTA
========================================= */

async function showConversationList() {


    app.innerHTML =

        createHeader() +

        `

        <div class="page">

            <h1 class="title">
                💬 Conversas
            </h1>

            <p class="subtitle">
                Suas conversas recentes.
            </p>


            <div
                id="status"
                class="status"
            >
                Carregando mensagens...
            </div>


            <div
                id="conversationList"
            >
            </div>


            <div
                id="debug"
                class="debug"
            >
            </div>

        </div>

        `;


    const status =
    document.getElementById(
        "status"
    );

    const list =
    document.getElementById(
        "conversationList"
    );

    const debug =
    document.getElementById(
        "debug"
    );


    /* =====================================
       CONSULTA EXATAMENTE COMO NO TESTE
    ===================================== */

    const {
        data: messages,
        error
    } =
    await supabaseClient
        .from("messages")
        .select("*")
        .or(
            "sender_id.eq." +
            currentUser.id +
            ",receiver_id.eq." +
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        status.textContent =
            "❌ Erro ao carregar mensagens.";

        debug.textContent =
            error.message;

        return;

    }


    const allMessages =
        messages || [];


    status.className =
        "status ok";


    status.innerHTML =

        "✅ " +

        allMessages.length +

        " mensagens encontradas.";


    debug.innerHTML =

        "Usuário: " +

        escapeHTML(
            currentUser.id
        );


    if (!allMessages.length) {

        list.innerHTML = `

            <div class="empty">

                Nenhuma conversa encontrada.

            </div>

        `;

        return;

    }


    /* =====================================
       AGRUPAR POR OUTRO USUÁRIO
    ===================================== */

    const conversations = {};


    allMessages.forEach(
        function(message) {


            let otherId;


            if (
                message.sender_id ===
                currentUser.id
            ) {

                otherId =
                    message.receiver_id;

            } else {

                otherId =
                    message.sender_id;

            }


            if (!otherId) {

                return;

            }


            if (
                !conversations[otherId]
            ) {

                conversations[otherId] = {

                    lastMessage:
                        message,

                    unread: 0,

                    count: 0

                };

            }


            conversations[otherId]
                .count++;


            if (

                message.receiver_id ===
                currentUser.id

                &&

                message.read_at ===
                null

            ) {

                conversations[otherId]
                    .unread++;

            }

        }
    );


    const ids =
    Object.keys(
        conversations
    );


    if (!ids.length) {

        list.innerHTML = `

            <div class="empty">

                As mensagens existem,
                mas não foi possível identificar
                os participantes.

            </div>

        `;

        return;

    }


    /* =====================================
       BUSCAR USERNAMES
       OPCIONAL
    ===================================== */

    let profiles = [];


    try {

        const {
            data
        } =
        await supabaseClient
            .from("profiles")
            .select(
                "id,username"
            )
            .in(
                "id",
                ids
            );


        if (data) {

            profiles =
                data;

        }

    } catch (error) {

        console.log(
            "Profiles não disponíveis."
        );

    }


    const profileMap = {};


    profiles.forEach(
        function(profile) {

            profileMap[
                profile.id
            ] = profile;

        }
    );


    /* =====================================
       MOSTRAR CONVERSAS
    ===================================== */

    list.innerHTML = "";


    ids.forEach(
        function(otherId) {


            const conversation =
            conversations[otherId];


            const profile =
            profileMap[otherId];


            const username =

                profile &&
                profile.username

                ?

                profile.username

                :

                "Usuário";


            const message =
            conversation.lastMessage;


            const button =
            document.createElement(
                "button"
            );


            button.type =
                "button";


            button.className =
                "conversation";


            button.onclick =
            function() {

                window.location.href =

                    "conversas.html?user=" +

                    encodeURIComponent(
                        otherId
                    );

            };


            let badge = "";


            if (
                conversation.unread > 0
            ) {

                badge = `

                    <div class="badge">

                        ${
                            conversation.unread > 99
                            ? "99+"
                            : conversation.unread
                        }

                    </div>

                `;

            }


            button.innerHTML = `

                <div class="avatar">

                    ${initial(username)}

                </div>


                <div class="info">

                    <div class="name">

                        ${escapeHTML(
                            username
                        )}

                    </div>


                    <div class="last-message">

                        ${escapeHTML(
                            message.content
                        )}

                    </div>

                </div>


                <div class="right">

                    <div class="time">

                        ${formatTime(
                            message.created_at
                        )}

                    </div>

                    ${badge}

                </div>

            `;


            list.appendChild(
                button
            );

        }
    );


    subscribeRealtime();

}

/* =========================================
   MENSAGENS DO CHAT
========================================= */

async function loadChatMessages() {


    const container =
    document.getElementById(
        "messages"
    );


    const {
        data: messages,
        error
    } =
    await supabaseClient
        .from("messages")
        .select("*")
        .or(

            "and(sender_id.eq." +
            currentUser.id +
            ",receiver_id.eq." +
            friendId +
            ")," +

            "and(sender_id.eq." +
            friendId +
            ",receiver_id.eq." +
            currentUser.id +
            ")"

        )
        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        container.innerHTML = `

            <div class="empty">

                ❌ Não foi possível carregar
                as mensagens.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    const data =
        messages || [];


    if (!data.length) {

        container.innerHTML = `

            <div class="empty">

                Nenhuma mensagem ainda.

                <br><br>

                Comece a conversa! 👋

            </div>

        `;

        return;

    }


    data.forEach(
        renderMessage
    );


    scrollBottom();

}
