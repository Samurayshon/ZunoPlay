<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversas - ZunoPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #25145c 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #102d59 0%, transparent 35%),
        #070811;
    color: white;
}

.app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
}

.header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px;
    border-bottom: 1px solid #292a3d;
    background: rgba(10,11,20,.95);
    position: sticky;
    top: 0;
    z-index: 10;
}

.back {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid #303145;
    background: #1b1c2b;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.logo span {
    color: #8b5cf6;
}

.page {
    padding: 20px;
}

.title {
    font-size: 25px;
    margin-bottom: 6px;
}

.subtitle {
    color: #9293a3;
    font-size: 13px;
    margin-bottom: 20px;
}

.conversation {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border-radius: 16px;
    border: 1px solid #292a3d;
    background: rgba(20,21,35,.9);
    color: white;
    cursor: pointer;
    text-align: left;
}

.conversation:active {
    transform: scale(.98);
}

.avatar {
    width: 48px;
    height: 48px;
    min-width: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg,#8b5cf6,#6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
}

.info {
    min-width: 0;
    flex: 1;
}

.name {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 5px;
}

.last-message {
    color: #858697;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.time {
    color: #737486;
    font-size: 10px;
    white-space: nowrap;
}

.badge {
    min-width: 21px;
    height: 21px;
    padding: 0 6px;
    margin-top: 5px;
    margin-left: auto;
    border-radius: 11px;
    background: #8b5cf6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: bold;
}

.empty {
    text-align: center;
    color: #737486;
    padding: 60px 20px;
    font-size: 14px;
}

.error {
    text-align: center;
    color: #ff8f8f;
    padding: 40px 20px;
    font-size: 14px;
}

.chat {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

.chat-messages {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    min-height: calc(100vh - 145px);
}

.message {
    max-width: 78%;
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
}

.mine {
    align-self: flex-end;
    background: linear-gradient(135deg,#8b5cf6,#6366f1);
    border-bottom-right-radius: 5px;
}

.theirs {
    align-self: flex-start;
    background: #1b1c2b;
    border: 1px solid #303145;
    border-bottom-left-radius: 5px;
}

.message-time {
    display: block;
    font-size: 9px;
    opacity: .6;
    margin-top: 4px;
}

.composer {
    display: flex;
    gap: 8px;
    padding: 12px 15px;
    border-top: 1px solid #292a3d;
    background: rgba(10,11,20,.97);
    position: sticky;
    bottom: 0;
}

.composer input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 13px;
    border: 1px solid #303145;
    background: #11121e;
    color: white;
    outline: none;
}

.send {
    width: 50px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg,#8b5cf6,#6366f1);
    color: white;
    font-size: 19px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="app" class="app">
    <div class="empty">Carregando conversas...</div>
</div>

<script>

const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const app =
document.getElementById("app");

let currentUser = null;
let friendId = null;
let realtimeChannel = null;

const params =
new URLSearchParams(
    window.location.search
);

friendId =
params.get("user");


function escapeHTML(text) {

    const div =
    document.createElement("div");

    div.textContent =
    text || "";

    return div.innerHTML;

}


function initial(name) {

    return (
        name || "?"
    )
    .charAt(0)
    .toUpperCase();

}


function formatTime(dateString) {

    if (!dateString) {
        return "";
    }

    const date =
    new Date(dateString);

    return date.toLocaleTimeString(
        "pt-BR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function goBack() {

    if (friendId) {

        window.location.href =
        "conversas.html";

    } else {

        window.location.href =
        "index.html";

    }

}


function header() {

    return `

        <div class="header">

            <button
                class="back"
                onclick="goBack()">
                ←
            </button>

            <div class="logo">
                Zuno<span>Play</span>
            </div>

        </div>

    `;

}


/* =========================================
   USUÁRIO
========================================= */

async function getUser() {

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();

    if (
        error ||
        !data?.session?.user
    ) {

        window.location.href =
        "login.html";

        return false;

    }

    currentUser =
    data.session.user;

    console.log(
        "Usuário logado:",
        currentUser.id
    );

    return true;

}


/* =========================================
   LISTA DE CONVERSAS
========================================= */

async function loadConversations() {

    app.innerHTML =
    header() +

    `

    <div class="page">

        <h1 class="title">
            💬 Conversas
        </h1>

        <p class="subtitle">
            Suas conversas recentes.
        </p>

        <div id="conversationList">

            <div class="empty">
                Buscando mensagens...
            </div>

        </div>

    </div>

    `;


    console.log(
        "Buscando mensagens do usuário:",
        currentUser.id
    );


    const {
        data: messages,
        error
    } =
    await supabaseClient
    .from("messages")
    .select(
        "id,sender_id,receiver_id,content,created_at,read_at"
    )
    .or(
        "sender_id.eq." +
        currentUser.id +
        ",receiver_id.eq." +
        currentUser.id
    )
    .order(
        "created_at",
        {
            ascending: false
        }
    );


    if (error) {

        console.error(
            "Erro messages:",
            error
        );

        document.getElementById(
            "conversationList"
        ).innerHTML = `

            <div class="error">

                Erro ao carregar mensagens.

                <br><br>

                ${escapeHTML(error.message)}

            </div>

        `;

        return;

    }


    console.log(
        "Mensagens encontradas:",
        messages
    );


    if (
        !messages ||
        messages.length === 0
    ) {

        document.getElementById(
            "conversationList"
        ).innerHTML = `

            <div class="empty">

                Nenhuma conversa encontrada.

            </div>

        `;

        return;

    }


    const conversations = {};


    messages.forEach(
        function(message) {

            const otherId =
            message.sender_id === currentUser.id
            ? message.receiver_id
            : message.sender_id;


            if (!otherId) {
                return;
            }


            if (!conversations[otherId]) {

                conversations[otherId] = {

                    lastMessage:
                    message,

                    unread: 0

                };

            }


            if (
                message.receiver_id === currentUser.id &&
                message.read_at === null
            ) {

                conversations[otherId].unread++;

            }

        }
    );


    const ids =
    Object.keys(
        conversations
    );


    console.log(
        "Outros usuários encontrados:",
        ids
    );


    if (!ids.length) {

        document.getElementById(
            "conversationList"
        ).innerHTML = `

            <div class="empty">

                Não foi possível identificar
                os participantes das conversas.

            </div>

        `;

        return;

    }


    const {
        data: profiles,
        error: profileError
    } =
    await supabaseClient
    .from("profiles")
    .select(
        "id,username"
    )
    .in(
        "id",
        ids
    );


    if (profileError) {

        console.error(
            "Erro profiles:",
            profileError
        );

        document.getElementById(
            "conversationList"
        ).innerHTML = `

            <div class="error">

                Mensagens encontradas,
                mas não foi possível carregar
                os usuários.

                <br><br>

                ${escapeHTML(profileError.message)}

            </div>

        `;

        return;

    }


    console.log(
        "Perfis encontrados:",
        profiles
    );


    const profileMap = {};


    (profiles || []).forEach(
        function(profile) {

            profileMap[
                profile.id
            ] =
            profile;

        }
    );


    const list =
    document.getElementById(
        "conversationList"
    );


    list.innerHTML = "";


    ids.forEach(
        function(id) {

            const conversation =
            conversations[id];

            const profile =
            profileMap[id];


            if (!profile) {

                console.warn(
                    "Perfil não encontrado:",
                    id
                );

                return;

            }


            const message =
            conversation.lastMessage;


            const item =
            document.createElement(
                "button"
            );


            item.className =
            "conversation";


            item.onclick =
            function() {

                window.location.href =
                "conversas.html?user=" +
                encodeURIComponent(
                    profile.id
                );

            };


            let badge = "";


            if (
                conversation.unread > 0
            ) {

                badge = `

                    <div class="badge">
                        ${
                            conversation.unread > 99
                            ? "99+"
                            : conversation.unread
                        }
                    </div>

                `;

            }


            item.innerHTML = `

                <div class="avatar">
                    ${initial(profile.username)}
                </div>

                <div class="info">

                    <div class="name">
                        ${escapeHTML(profile.username)}
                    </div>

                    <div class="last-message">
                        ${escapeHTML(message.content)}
                    </div>

                </div>

                <div>

                    <div class="time">
                        ${formatTime(message.created_at)}
                    </div>

                    ${badge}

                </div>

            `;


            list.appendChild(
                item
            );

        }
    );


    if (
        !list.children.length
    ) {

        list.innerHTML = `

            <div class="empty">

                As mensagens existem,
                mas nenhum perfil correspondente
                foi encontrado.

            </div>

        `;

    }


    subscribeConversationList();

}


/* =========================================
   CHAT
========================================= */

async function loadChat() {

    const {
        data: profile,
        error
    } =
    await supabaseClient
    .from("profiles")
    .select(
        "id,username"
    )
    .eq(
        "id",
        friendId
    )
    .single();


    if (error) {

        console.error(
            error
        );

        app.innerHTML = `

            <div class="empty">

                Usuário não encontrado.

                <br><br>

                <button
                    class="back"
                    onclick="goBack()">
                    ← Voltar
                </button>

            </div>

        `;

        return;

    }


    app.innerHTML = `

        <div class="chat">

            <div class="header">

                <button
                    class="back"
                    onclick="goBack()">
                    ←
                </button>

                <div class="avatar">
                    ${initial(profile.username)}
                </div>

                <div class="info">

                    <div class="name">
                        ${escapeHTML(profile.username)}
                    </div>

                    <div class="last-message">
                        Conversa privada
                    </div>

                </div>

            </div>


            <div
                class="chat-messages"
                id="messages">

                <div class="empty">
                    Carregando mensagens...
                </div>

            </div>


            <form
                class="composer"
                id="messageForm">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Digite uma mensagem..."
                    maxlength="2000"
                    autocomplete="off"
                    required
                >

                <button

                </button>

            </form>

        </div>

    `;


    await loadMessages();

    subscribeChat();


    document
    .getElementById(
        "messageForm"
    )
    .addEventListener(
        "submit",
        sendMessage
    );

}


/* =========================================
   CARREGAR MENSAGENS DO CHAT
========================================= */

async function loadMessages() {

    const container =
    document.getElementById(
        "messages"
    );


    const {
        data,
        error
    } =
    await supabaseClient
    .from("messages")
    .select(
        "id,sender_id,receiver_id,content,created_at,read_at"
    )
    .or(
        "and(sender_id.eq." +
        currentUser.id +
        ",receiver_id.eq." +
        friendId +
        "),and(sender_id.eq." +
        friendId +
        ",receiver_id.eq." +
        currentUser.id +
        ")"
    )
    .order(
        "created_at",
        {
            ascending: true
        }
    );


    if (error) {

        console.error(
            error
        );

        container.innerHTML = `

            <div class="error">

                Não foi possível carregar
                as mensagens.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    if (
        !data ||
        !data.length
    ) {

        container.innerHTML = `

            <div class="empty">

                Nenhuma mensagem ainda.<br><br>

                Comece a conversa! 👋

            </div>

        `;

        return;

    }


    data.forEach(
        addMessage
    );


    scrollBottom();

}


/* =========================================
   ADICIONAR MENSAGEM
========================================= */

function addMessage(message) {

    const container =
    document.getElementById(
        "messages"
    );


    if (!container) {
        return;
    }


    const empty =
    container.querySelector(
        ".empty"
    );


    if (empty) {

        container.innerHTML =
        "";

    }


    const div =
    document.createElement(
        "div"
    );


    div.className =
    "message " +
    (
        message.sender_id === currentUser.id
        ? "mine"
        : "theirs"
    );


    div.innerHTML = `

        ${escapeHTML(message.content)}

        <span class="message-time">
            ${formatTime(message.created_at)}
        </span>

    `;


    container.appendChild(
        div
    );

}


/* =========================================
   MARCAR COMO LIDA
========================================= */

async function markMessagesAsRead() {

    if (!friendId) {
        return;
    }


    const {
        error
    } =
    await supabaseClient
    .from("messages")
    .update({

        read_at:
        new Date().toISOString()

    })
    .eq(
        "receiver_id",
        currentUser.id
    )
    .eq(
        "sender_id",
        friendId
    )
    .is(
        "read_at",
        null
    );


    if (error) {

        console.error(
            "Erro ao marcar como lida:",
            error
        );

    }

}


/* =========================================
   ENVIAR MENSAGEM
========================================= */

async function sendMessage(event) {

    event.preventDefault();


    const input =
    document.getElementById(
        "messageInput"
    );


    const content =
    input.value.trim();


    if (!content) {
        return;
    }


    input.disabled = true;


    const {
        error
    } =
    await supabaseClient
    .from("messages")
    .insert({

        sender_id:
        currentUser.id,

        receiver_id:
        friendId,

        content:
        content

    });


    input.disabled = false;


    if (error) {

        console.error(
            error
        );

        alert(
            "Não foi possível enviar a mensagem."
        );

        return;

    }


    input.value = "";

    input.focus();

}


/* =========================================
   REALTIME CHAT
========================================= */

function subscribeChat() {

    realtimeChannel =
    supabaseClient
    .channel(
        "chat-" +
        currentUser.id +
        "-" +
        friendId
    )
    .on(
        "postgres_changes",
        {
            event: "INSERT",
            schema: "public",
            table: "messages"
        },
        async function(payload) {

            const message =
            payload.new;


            const related =
            (
                message.sender_id === currentUser.id &&
                message.receiver_id === friendId
            )
            ||
            (
                message.sender_id === friendId &&
                message.receiver_id === currentUser.id
            );


            if (!related) {
                return;
            }


            addMessage(
                message
            );


            if (
                message.sender_id === friendId &&
                message.receiver_id === currentUser.id
            ) {

                await supabaseClient
                .from("messages")
                .update({

                    read_at:
                    new Date().toISOString()

                })
                .eq(
                    "id",
                    message.id
                );
