<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   VARIÁVEIS
========================================= */

const app =
document.getElementById("app");

let currentUser = null;

let friendId = null;

let conversationChannel = null;

let chatChannel = null;


const params =
new URLSearchParams(
    window.location.search
);

friendId =
params.get("user");


/* =========================================
   SEGURANÇA
========================================= */

function escapeHTML(text){

    const div =
    document.createElement("div");

    div.textContent =
    text || "";

    return div.innerHTML;

}


/* =========================================
   INICIAL
========================================= */

function initial(name){

    return (
        name ||
        "?"
    )
    .charAt(0)
    .toUpperCase();

}


/* =========================================
   HORÁRIO
========================================= */

function formatTime(dateString){

    const date =
    new Date(dateString);

    return date.toLocaleTimeString(
        "pt-BR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================
   VOLTAR
========================================= */

function goBack(){

    if(friendId){

        window.location.href =
        "conversas.html";

    }else{

        window.location.href =
        "index.html";

    }

}


/* =========================================
   USUÁRIO
========================================= */

async function getUser(){

    const {
        data,
        error
    } =
    await supabaseClient
    .auth
    .getSession();


    if(
        error ||
        !data ||
        !data.session ||
        !data.session.user
    ){

        window.location.href =
        "login.html";

        return false;

    }


    currentUser =
    data.session.user;


    return true;

}


/* =========================================
   HEADER
========================================= */

function header(){

    return `

        <div class="header">

            <button
                class="back"
                onclick="goBack()">

                ←

            </button>


            <div class="logo">

                Zuno<span>Play</span>

            </div>

        </div>

    `;

}


/* =========================================
   LISTA DE CONVERSAS
========================================= */

async function loadConversations(){

    app.innerHTML =

        header() +

        `

        <div class="page">

            <h1 class="title">

                💬 Conversas

            </h1>


            <p class="subtitle">

                Suas conversas recentes.

            </p>


            <div id="conversationList">

                <div class="empty">

                    Carregando conversas...

                </div>

            </div>

        </div>

        `;


    const list =
    document.getElementById(
        "conversationList"
    );


    /*
     * Busca mensagens enviadas
     * pelo usuário.
     */

    const {
        data: sent,
        error: sentError
    } =
    await supabaseClient
    .from("messages")
    .select(
        "id,sender_id,receiver_id,content,created_at,read_at"
    )
    .eq(
        "sender_id",
        currentUser.id
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    /*
     * Busca mensagens recebidas
     * pelo usuário.
     */

    const {
        data: received,
        error: receivedError
    } =
    await supabaseClient
    .from("messages")
    .select(
        "id,sender_id,receiver_id,content,created_at,read_at"
    )
    .eq(
        "receiver_id",
        currentUser.id
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(
        sentError ||
        receivedError
    ){

        console.error(
            sentError ||
            receivedError
        );


        list.innerHTML = `

            <div class="empty">

                Não foi possível carregar
                suas conversas.

            </div>

        `;

        return;

    }


    const allMessages = [

        ...(sent || []),

        ...(received || [])

    ];


    /*
     * Ordena todas as mensagens
     * da mais nova para a mais antiga.
     */

    allMessages.sort(
        function(a,b){

            return new Date(
                b.created_at
            ) -
            new Date(
                a.created_at
            );

        }
    );


    const conversations = {};


    /*
     * Cria uma conversa por usuário.
     */

    allMessages.forEach(
        function(message){

            const otherId =

                message.sender_id ===
                currentUser.id

                ? message.receiver_id

                : message.sender_id;


            if(!otherId){
                return;
            }


            if(
                !conversations[otherId]
            ){

                conversations[otherId] = {

                    lastMessage:
                    message,

                    unread:0

                };

            }


            /*
             * Conta mensagens não lidas
             */

            if(

                message.receiver_id ===
                currentUser.id

                &&

                message.read_at ===
                null

            ){

                conversations[
                    otherId
                ].unread++;

            }

        }
    );


    const ids =
    Object.keys(
        conversations
    );


    if(!ids.length){

        list.innerHTML = `

            <div class="empty">

                Você ainda não possui
                conversas.<br><br>

                Vá em <strong>Amigos</strong>
                e comece uma conversa! 👋

            </div>

        `;

        return;

    }


    /*
     * Busca os perfis
     */

    const {
        data: profiles,
        error: profilesError
    } =
    await supabaseClient
    .from("profiles")
    .select(
        "id,username"
    )
    .in(
        "id",
        ids
    );


    if(profilesError){

        console.error(
            profilesError
        );


        list.innerHTML = `

            <div class="empty">

                Erro ao carregar
                os perfis das conversas.

            </div>

        `;

        return;

    }


    const profileMap = {};


    (profiles || []).forEach(
        function(profile){

            profileMap[
                profile.id
            ] =
            profile;

        }
    );


    list.innerHTML = "";


    /*
     * Mantém a ordem da conversa
     * pela mensagem mais recente.
     */

    ids.forEach(
        function(id){

            const conversation =
            conversations[id];


            const profile =
            profileMap[id];


            /*
             * Mesmo que o perfil não seja
             * encontrado, não elimina a conversa.
             */

            const username =
            profile?.username ||
            "Usuário";


            const message =
            conversation.lastMessage;


            const button =
            document.createElement(
                "button"
            );


            button.className =
            "conversation";


            button.onclick =
            function(){

                window.location.href =
                "conversas.html?user=" +
                encodeURIComponent(id);

            };


            let badge = "";


            if(
                conversation.unread >
                0
            ){

                badge = `

                    <div class="badge">

                        ${
                            conversation.unread >
                            99
                            ? "99+"
                            : conversation.unread
                        }

                    </div>

                `;

            }


            button.innerHTML = `

                <div class="avatar">

                    ${initial(username)}

                </div>


                <div class="info">

                    <div class="name">

                        ${
                            escapeHTML(
                                username
                            )
                        }

                    </div>


                    <div class="last-message">

                        ${
                            escapeHTML(
                                message.content
                            )
                        }

                    </div>

                </div>


                <div>

                    <div class="time">

                        ${
                            formatTime(
                                message.created_at
                            )
                        }

                    </div>


                    ${badge}

                </div>

            `;


            list.appendChild(
                button
            );

        }
    );


    subscribeConversationList();

}


/* =========================================
   CHAT
========================================= */

            </div>


            <div

/* =========================================
   MENSAGENS
========================================= */

async function loadMessages(){

    const container =
    document.getElementById(
        "messages"
    );


    const {
        data,
        error
    } =
    await supabaseClient
    .from("messages")
    .select(
        "id,sender_id,receiver_id,content,created_at,read_at"
    )
    .or(

        "and(sender_id.eq." +
        currentUser.id +
        ",receiver_id.eq." +
        friendId +
        ")," +

        "and(sender_id.eq." +
        friendId +
        ",receiver_id.eq." +
        currentUser.id +
        ")"

    )
    .order(
        "created_at",
        {
            ascending:true
        }
    );


    if(error){

        console.error(error);


        container.innerHTML = `

            <div class="empty">

                Não foi possível carregar
                as mensagens.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    if(
        !data ||
        !data.length
    ){

        container.innerHTML = `

            <div class="empty">

                Nenhuma mensagem ainda.<br><br>

                Comece a conversa! 👋

            </div>

        `;

        return;

    }


    data.forEach(
        addMessage
    );


    scrollBottom();

}


/* =========================================
   ADICIONAR MENSAGEM
========================================= */

function addMessage(message){

    const container =
    document.getElementById(
        "messages"
    );


    if(!container){
        return;
    }


    const empty =
    container.querySelector(
        ".empty"
    );


    if(empty){

        container.innerHTML = "";

    }


    /*
     * Evita mensagens duplicadas
     */

    if(
        container.querySelector(
            `[data-message-id="${message.id}"]`
        )
    ){

        return;

    }


    const div =
    document.createElement(
        "div"
    );


    div.dataset.messageId =
    message.id;


    div.className =

        "message " +

        (
            message.sender_id ===
            currentUser.id

            ? "mine"

            : "theirs"
        );


    div.innerHTML = `

        ${
            escapeHTML(
                message.content
            )
        }


        <span class="message-time">

            ${
                formatTime(
                    message.created_at
                )
            }

        </span>

    `;


    container.appendChild(
        div
    );

}


/* =========================================
   MARCAR COMO LIDA
========================================= */

async function markMessagesAsRead(){

    if(!friendId){
        return;
    }


    const {
        error
    } =
    await supabaseClient
    .from("messages")
    .update({

        read_at:
        new Date().toISOString()

    })
    .eq(
        "receiver_id",
        currentUser.id
    )
    .eq(
        "sender_id",
        friendId
    )
    .is(
        "read_at",
        null
    );


    if(error){

        console.error(
            "Erro ao marcar como lidas:",
            error
        );

    }

}

   ENVIAR MENSAGEM
========================================= */

    event.preventDefault();


    const input =
    document.getElementById(
        "messageInput"
    );


    const content =
    input.value.trim();


    if(!content){
        return;
    }


    input.disabled =
    true;


    const {
        error
    } =
