<style>

.subtitle {

}

.status {

    padding: 12px;

    margin-bottom: 15px;

    border-radius: 12px;

    background: #141523;

    border: 1px solid #292a3d;

    width: 50px;

    border: none;

    border-radius: 13px;

</head>


<body>


<div
    id="app"
    class="app"
></div>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   VARIÁVEIS
========================================= */

const app =
document.getElementById("app");

let currentUser =
null;

let friendId =
null;


const params =
new URLSearchParams(
    window.location.search
);

friendId =
params.get("user");


/* =========================================
   FUNÇÕES AUXILIARES
========================================= */

function initial(name) {

    return (
        name || "?"
    )
    .charAt(0)
    .toUpperCase();

}


function escapeHTML(text) {

    const div =
    document.createElement("div");

    div.textContent =
    text || "";

    return div.innerHTML;

}


function formatTime(dateString) {

    const date =
    new Date(dateString);

    return date.toLocaleTimeString(
        "pt-BR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function formatDate(dateString) {

    const date =
    new Date(dateString);

    return date.toLocaleDateString(
        "pt-BR"
    );

}


/* =========================================
   USUÁRIO LOGADO
========================================= */

async function getUser() {

    const {
        data,
        error
    } =
    await supabaseClient
    .auth
    .getSession();


    if (
        error ||
        !data ||
        !data.session
    ) {

        window.location.href =
        "login.html";

        return false;

    }


    currentUser =
    data.session.user;


    return true;

}


/* =========================================
   VOLTAR
========================================= */

function goBack() {

    if (friendId) {

        window.location.href =
        "conversas.html";

    } else {

        window.location.href =
        "index.html";

    }

}


/* =========================================
   CABEÇALHO
========================================= */

function header() {

    return `

        <div class="header">

            <button
                class="back"
                onclick="goBack()"
            >

                ←

            </button>


            <div class="logo">

                Zuno<span>Play</span>

            </div>

        </div>

    `;

}


/* =========================================
   LISTA DE CONVERSAS
========================================= */

async function loadConversations() {

    app.innerHTML =
    header() +

    `

        <div class="page">

            <h1 class="title">

                💬 Conversas

            </h1>


            <p class="subtitle">

                Suas conversas recentes.

            </p>


            <div
                id="status"
                class="status"
            >

                ⏳ Carregando...

            </div>


            <div
                id="conversationList"
            >

                <div class="empty">

                    Carregando conversas...

                </div>

            </div>

        </div>

    `;


    const {
        data: messages,
        error
    } =
    await supabaseClient
    .from("messages")
    .select("*")
    .or(
        "sender_id.eq." +
        currentUser.id +
        ",receiver_id.eq." +
        currentUser.id
    )
    .order(
        "created_at",
        {
            ascending: false
        }
    );


    if (error) {

        console.error(
            "Erro messages:",
            error
        );


        document.getElementById(
            "status"
        ).textContent =
        "❌ Erro ao consultar mensagens";


        document.getElementById(
            "conversationList"
        ).innerHTML = `

            <div class="empty">

                Não foi possível carregar
                as conversas.

            </div>

        `;


        return;

    }


    document.getElementById(
        "status"
    ).textContent =

        "✅ " +
        (messages || []).length +
        " mensagens encontradas";


    const conversations = {};


    (messages || []).forEach(
        function(message) {

            const otherId =

                message.sender_id ===
                currentUser.id

                ? message.receiver_id

                : message.sender_id;


            if (!otherId) {

                return;

            }


            if (
                !conversations[otherId]
            ) {

                conversations[otherId] = {

                    lastMessage:
                    message,

                    unread: 0

                };

            }


            if (

                message.receiver_id ===
                currentUser.id

                &&

                message.read_at ===
                null

            ) {

                conversations[
                    otherId
                ].unread++;

            }

        }
    );


    const ids =
    Object.keys(
        conversations
    );


    const list =
    document.getElementById(
        "conversationList"
    );


    list.innerHTML =
    "";


    if (!ids.length) {

        list.innerHTML = `

            <div class="empty">

                Você ainda não possui
                conversas.

                <br><br>

                Vá em Amigos e comece
                uma conversa! 👋

            </div>

        `;

        return;

    }


    /*
     * Carrega cada usuário separadamente.
     * Isso evita que um problema em profiles
     * apague a tela inteira.
     */

    for (
        const id of ids
    ) {

        let username =
        "Usuário " +
        id.substring(
            0,
            8
        );


        const {
            data: profile
        } =
        await supabaseClient
        .from("profiles")
        .select(
            "id, username"
        )
        .eq(
            "id",
            id
        )
        .maybeSingle();


        if (
            profile &&
            profile.username
        ) {

            username =
            profile.username;

        }


        const conversation =
        conversations[id];


        const message =
        conversation.lastMessage;


        const item =
        document.createElement(
            "button"
        );


        item.className =
        "conversation";


        item.onclick =
        function() {

            window.location.href =
            "conversas.html?user=" +
            encodeURIComponent(
                id
            );

        };


        item.innerHTML = `

            <div class="avatar">

                ${escapeHTML(
                    initial(username)
                )}

            </div>


            <div class="info">

                <div class="name">

                    ${escapeHTML(
                        username
                    )}

                </div>


                <div class="last-message">

                    ${escapeHTML(
                        message.content
                    )}

                </div>

            </div>


            <div class="time">

                ${formatTime(
                    message.created_at
                )}

            </div>

        `;


        list.appendChild(
            item
        );

    }

}


/* =========================================
   CARREGAR CHAT
========================================= */

async function loadChat() {

    let username =
    "Usuário " +
    friendId.substring(
        0,
        8
    );


    const {
        data: profile
    } =
    await supabaseClient
    .from("profiles")
    .select(
        "id, username"
    )
    .eq(
        "id",
        friendId
    )
    .maybeSingle();


    if (
        profile &&
        profile.username
    ) {

        username =
        profile.username;

    }


    app.innerHTML = `

        <div class="chat">


            <div class="header">

                <button
                    class="back"
                    onclick="goBack()"
                >

                    ←

                </button>


                <div class="avatar">

                    ${escapeHTML(
                        initial(username)
                    )}

                </div>


                <div class="info">

                    <div class="name">

                        ${escapeHTML(
                            username
                        )}

                    </div>


                    <div class="last-message">

                        Conversa privada

                    </div>

                </div>

            </div>


            <div
                id="messages"
                class="chat-messages"
            >

                <div class="empty">

                    Carregando mensagens...

                </div>

            </div>


            <form
                id="messageForm"
                class="composer"
            >

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Digite uma mensagem..."
                    maxlength="2000"
                    autocomplete="off"
                    required
                >


                <button
                    class="send"
                    type="submit"
                >

                    ➤

                </button>

            </form>


        </div>

    `;


    await loadMessages();


    await markMessagesAsRead();


    document
    .getElementById(
        "messageForm"
    )
    .addEventListener(
        "submit",
        sendMessage
    );

}


/* =========================================
   CARREGAR MENSAGENS DO CHAT
========================================= */

async function loadMessages() {

    const container =
    document.getElementById(
        "messages"
    );


    if (!container) {

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
    .from("messages")
    .select("*")
    .or(

        "and(sender_id.eq." +
        currentUser.id +
        ",receiver_id.eq." +
        friendId +
        "),and(sender_id.eq." +
        friendId +
        ",receiver_id.eq." +
        currentUser.id +
        ")"

    )
    .order(
        "created_at",
        {
            ascending: true
        }
    );


    if (error) {

        console.error(
            "Erro mensagens do chat:",
            error
        );


        container.innerHTML = `

            <div class="empty">

                ❌ Erro ao carregar mensagens.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;


        return;

    }


    container.innerHTML =
    "";


    if (
        !data ||
        !data.length
    ) {

        container.innerHTML = `

            <div class="empty">

                Nenhuma mensagem ainda.

                <br><br>

                Comece a conversa! 👋

            </div>

        `;


        return;

    }


    data.forEach(
        function(message) {

            addMessage(
                message
            );

        }
    );


    scrollBottom();

}


/* =========================================
   ADICIONAR MENSAGEM
========================================= */

function addMessage(
    message
) {

    const container =
    document.getElementById(
        "messages"
    );


    if (!container) {

        return;

    }


    const div =
    document.createElement(
        "div"
    );


    div.className =

        "message " +

        (

            message.sender_id ===
            currentUser.id

            ? "mine"

            : "theirs"

        );


    div.innerHTML = `

        ${escapeHTML(
            message.content
        )}

        <span class="message-time">

            ${formatTime(
                message.created_at
            )}

        </span>

    `;


    container.appendChild(
        div
    );

}


/* =========================================
   MARCAR COMO LIDA
========================================= */

async function markMessagesAsRead() {

    if (
        !currentUser ||
        !friendId
    ) {

        return;

    }


    const {
        error
    } =
    await supabaseClient
    .from("messages")
    .update({

        read_at:
        new Date().toISOString()

    })
    .eq(
        "receiver_id",
        currentUser.id
    )
    .eq(
        "sender_id",
        friendId
    )
    .is(
        "read_at",
        null
    );


    if (error) {

        console.error(
            "Erro read_at:",
            error
        );

    }

}


/* =========================================
   ENVIAR MENSAGEM
========================================= */

async function sendMessage(
    event
) {

    event.preventDefault();


    const input =
    document.getElementById(
        "messageInput"
    );


    const content =
    input.value.trim();


    if (!content) {

        return;

    }


    input.disabled =
    true;


    const {
        data,
        error
    } =
    await supabaseClient
    .from("messages")
    .insert({

        sender_id:
        currentUser.id,

        receiver_id:
        friendId,

        content:
        content

    })
    .select("*")
    .single();


    input.disabled =
    false;


    if (error) {

        console.error(
            "Erro ao enviar:",
            error
        );


        alert(
            "Não foi possível enviar a mensagem."
        );


        return;

    }


    input.value =
    "";


    input.focus();


    /*
     * Mostra imediatamente a mensagem
     * enviada pelo próprio usuário.
     */

    if (data) {

        addMessage(
            data
        );

        scrollBottom();

    }

}


/* =========================================
   SCROLL
========================================= */

function scrollBottom() {

    const container =
    document.getElementById(
        "messages"
    );


    if (!container) {

        return;

    }


    setTimeout(
        function() {

            container.scrollTop =
            container.scrollHeight;

        },
        50
    );

}


/* =========================================
   REALTIME - TESTE DE CONEXÃO
========================================= */

function iniciarRealtimeTeste() {

    if (!currentUser) {

        console.error(
            "REALTIME ERRO: usuário não está carregado."
        );

        return;

    }


    try {

        const realtimeChannel =
        supabaseClient
        .channel(
            "messages-test-" +
            currentUser.id
        )
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "messages"
            },
            function (payload) {

                console.log(
                    "REALTIME OK:",
                    payload.new
                );

            }
        )
        .subscribe(function (status) {

            console.log(
                "REALTIME STATUS:",
                status
            );

        });


        window.realtimeChannel =
        realtimeChannel;


    } catch (error) {

        console.error(
            "REALTIME ERRO:",
            error
        );

    }

}

========================================= */

    try {
