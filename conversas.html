<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conversas - ZunoPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #25145c 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #102d59 0%, transparent 35%),
        #070811;
    color: white;
}

.app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
}

.header {
    height: 70px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: #0a0b14;
    border-bottom: 1px solid #292a3d;
}

.back {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid #303145;
    background: #1b1c2b;
    color: white;
    font-size: 20px;
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.logo span {
    color: #8b5cf6;
}

.page {
    padding: 20px;
}

.title {
    font-size: 26px;
    margin-bottom: 5px;
}

.subtitle {
    color: #9293a3;
    font-size: 13px;
    margin-bottom: 20px;
}

.status {
    padding: 12px;
    border-radius: 12px;
    background: #141523;
    border: 1px solid #292a3d;
    color: #4ade80;
    font-size: 12px;
    margin-bottom: 15px;
}

.conversation {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 17px;
    border: 1px solid #292a3d;
    background: #141523;
    color: white;
    text-align: left;
    cursor: pointer;
}

.avatar {
    width: 50px;
    height: 50px;
    min-width: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg,#8b5cf6,#6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
}

.info {
    min-width: 0;
    flex: 1;
}

.name {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 5px;
}

.last {
    color: #858697;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.time {
    color: #737486;
    font-size: 10px;
}

.empty {
    text-align: center;
    color: #737486;
    padding: 50px 20px;
}

.chat {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.chat-header {
    height: 70px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 15px;
    background: #0a0b14;
    border-bottom: 1px solid #292a3d;
}

.chat-name {
    font-weight: bold;
    font-size: 15px;
}

.messages {
    flex: 1;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
}

.message {
    max-width: 78%;
    padding: 11px 14px;
    border-radius: 17px;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
}

.mine {
    align-self: flex-end;
    background: linear-gradient(135deg,#8b5cf6,#6366f1);
    border-bottom-right-radius: 5px;
}

.theirs {
    align-self: flex-start;
    background: #1b1c2b;
    border: 1px solid #303145;
    border-bottom-left-radius: 5px;
}

.message-time {
    display: block;
    font-size: 9px;
    opacity: .6;
    margin-top: 4px;
    text-align: right;
}

.composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #0a0b14;
    border-top: 1px solid #292a3d;
}

.composer input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid #303145;
    background: #11121e;
    color: white;
    outline: none;
}

.send {
    width: 52px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg,#8b5cf6,#6366f1);
    color: white;
    font-size: 18px;
}

</style>

</head>

<body>

<div id="app" class="app">

    <div class="header">

        <button
            class="back"
            onclick="window.location.href='index.html'"
        >
            ←
        </button>

        <div class="logo">
            Zuno<span>Play</span>
        </div>

    </div>

    <div class="page">

        <h1 class="title">
            💬 Conversas
        </h1>

        <p class="subtitle">
            Suas conversas recentes.
        </p>

        <div
            id="status"
            class="status"
        >
            ⏳ Verificando sessão...
        </div>

        <div id="conversationList">

            <div class="empty">
                Carregando conversas...
            </div>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const app =
document.getElementById("app");

const statusBox =
document.getElementById("status");

const list =
document.getElementById("conversationList");

let currentUser = null;


/* ================================
   SEGURANÇA
================================ */

function escapeHTML(text) {

    const div =
    document.createElement("div");

    div.textContent =
    text || "";

    return div.innerHTML;

}


/* ================================
   HORÁRIO
================================ */

function time(date) {

    if (!date) {
        return "";
    }

    return new Date(date).toLocaleTimeString(
        "pt-BR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* ================================
   CARREGAR
================================ */

async function iniciar() {

    try {

        statusBox.textContent =
            "⏳ Verificando usuário...";


        const sessionResult =
            await supabaseClient
                .auth
                .getSession();


        if (sessionResult.error) {

            throw sessionResult.error;

        }


        const session =
            sessionResult.data.session;


        if (!session) {

            statusBox.textContent =
                "❌ Nenhuma sessão ativa.";

            list.innerHTML = `

                <div class="empty">

                    Faça login novamente.

                </div>

            `;

            return;

        }


        currentUser =
            session.user;


        statusBox.textContent =
            "⏳ Buscando mensagens...";


        const result =
            await supabaseClient
                .from("messages")
                .select("*")
                .or(
                    "sender_id.eq." +
                    currentUser.id +
                    ",receiver_id.eq." +
                    currentUser.id
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (result.error) {

            throw result.error;

        }


        const messages =
            result.data || [];


        statusBox.textContent =
            "✅ " +
            messages.length +
            " mensagens encontradas";


        mostrarConversas(
            messages
        );


    } catch (error) {

        console.error(
            "ZunoPlay:",
            error
        );


        statusBox.textContent =
            "❌ Erro: " +
            (
                error.message ||
                "erro desconhecido"
            );


        list.innerHTML = `

            <div class="empty">

                Ocorreu um erro ao carregar as conversas.

                <br><br>

                ${
                    escapeHTML(
                        error.message ||
                        String(error)
                    )
                }

            </div>

        `;

    }

}


/* ================================
   CONVERSAS
================================ */

function mostrarConversas(
    messages
) {

    list.innerHTML = "";


    if (!messages.length) {

        list.innerHTML = `

            <div class="empty">

                Você ainda não possui conversas.

            </div>

        `;

        return;

    }


    const groups = {};


    messages.forEach(
        function(message) {

            const otherId =
                message.sender_id ===
                currentUser.id

                ? message.receiver_id

                : message.sender_id;


            if (!otherId) {
                return;
            }


            if (!groups[otherId]) {

                groups[otherId] = {

                    message: message,

                    unread: 0

                };

            }


            if (
                message.receiver_id ===
                currentUser.id &&
                message.read_at === null
            ) {

                groups[otherId].unread++;

            }

        }
    );


    Object.keys(groups).forEach(
        function(otherId) {

            const data =
                groups[otherId];


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "conversation";


            button.onclick =
                function() {

                    window.location.href =
                        "conversas.html?user=" +
                        encodeURIComponent(
                            otherId
                        );

                };


            button.innerHTML = `

                <div class="avatar">

                    ${escapeHTML(
                        otherId.charAt(0)
                    )}

                </div>


                <div class="info">

                    <div class="name">

                        Usuário

                        ${escapeHTML(
                            otherId.substring(0,8)
                        )}

                    </div>


                    <div class="last">

                        ${escapeHTML(
                            data.message.content
                        )}

                    </div>

                </div>


                <div>

                    <div class="time">

                        ${time(
                            data.message.created_at
                        )}

                    </div>

                </div>

            `;


            list.appendChild(
                button
            );

        }
    );

}


/* ================================
   INICIAR
================================ */

iniciar();

</script>

</body>

</html>
