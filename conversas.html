<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teste ZunoPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
    margin: 0;
    min-height: 100vh;
    background: #070811;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.box {
    max-width: 480px;
    margin: 30px auto;
    background: #141523;
    border: 1px solid #303145;
    border-radius: 20px;
    padding: 20px;
}

h1 {
    margin-top: 0;
}

.row {
    margin: 12px 0;
    padding: 12px;
    background: #1b1c2b;
    border-radius: 10px;
    word-break: break-all;
}

.ok {
    color: #4ade80;
}

.erro {
    color: #ff7777;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: 0;
    border-radius: 12px;
    background: #8b5cf6;
    color: white;
    font-weight: bold;
    font-size: 16px;
}

</style>

</head>

<body>

<div class="box">

<h1>🔎 Diagnóstico ZunoPlay</h1>

<div id="status" class="row">
    Iniciando...
</div>

<div id="user" class="row">
    Verificando usuário...
</div>

<div id="messages" class="row">
    Verificando mensagens...
</div>

<button onclick="window.location.href='index.html'">
    Voltar para o ZunoPlay
</button>

</div>


<script>

const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function teste() {

    const status =
    document.getElementById("status");

    const userBox =
    document.getElementById("user");

    const messagesBox =
    document.getElementById("messages");


    try {

        status.innerHTML =
            "⏳ Supabase carregado. Verificando sessão...";


        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getSession();


        if (error) {

            status.innerHTML =
                "❌ Erro na sessão";

            status.className =
                "row erro";

            userBox.innerHTML =
                error.message;

            return;

        }


        if (
            !data ||
            !data.session ||
            !data.session.user
        ) {

            status.innerHTML =
                "⚠️ Página abriu, mas não existe sessão.";

            status.className =
                "row erro";

            userBox.innerHTML =
                "Nenhum usuário autenticado.";

            messagesBox.innerHTML =
                "Consulta não executada.";

            return;

        }


        const user =
        data.session.user;


        status.innerHTML =
            "✅ Supabase funcionando e sessão ativa.";

        status.className =
            "row ok";


        userBox.innerHTML =

            "<strong>ID do usuário:</strong><br><br>" +

            user.id;


        const {
            data: messages,
            error: messageError
        } =
        await supabaseClient
            .from("messages")
            .select("*")
            .or(
                "sender_id.eq." +
                user.id +
                ",receiver_id.eq." +
                user.id
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (messageError) {

            messagesBox.innerHTML =
                "❌ Erro ao consultar messages:<br><br>" +
                messageError.message;

            messagesBox.className =
                "row erro";

            return;

        }


        messagesBox.innerHTML =

            "✅ Consulta funcionando.<br><br>" +

            "<strong>Total de mensagens:</strong> " +

            messages.length;


        messagesBox.className =
            "row ok";


        if (messages.length > 0) {

            messagesBox.innerHTML +=
                "<br><br>Primeira mensagem:<br>" +
                (
                    messages[0].content ||
                    "(sem conteúdo)"
                );

        }


    } catch (error) {

        status.innerHTML =
            "❌ JavaScript encontrou um erro.";

        status.className =
            "row erro";


        userBox.innerHTML =
            error.message ||
            error;


    }

}


teste();

</script>

</body>

</html>
