/* =========================================

const app =

/* =========================================
   AUXILIARES
========================================= */

function escapeHTML(text) {

    const div =
    document.createElement("div");

    div.textContent =
    text || "";

    return div.innerHTML;

}


function initial(name) {

    if (!name) {

        return "?";

    }

    return name
        .charAt(0)
        .toUpperCase();

}


function formatTime(dateString) {

    if (!dateString) {

        return "";

    }

    return new Date(
        dateString
    ).toLocaleTimeString(
        "pt-BR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function goBack() {

    if (friendId) {

        window.location.href =
            "conversas.html";

    } else {

        window.location.href =
            "index.html";

    }

}


/* =========================================
   USUÁRIO
========================================= */

async function getUser() {

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getSession();


    if (
        error ||
        !data ||
        !data.session ||
        !data.session.user
    ) {

        window.location.href =
            "login.html";

        return false;

    }


    currentUser =
        data.session.user;


    return true;

}


/* =========================================
   HEADER
========================================= */

function header() {

    return `

        <div class="header">

            <button
                class="back"

            <div class="logo">
                Zuno<span>Play</span>
            </div>

        </div>

    `;

}


/* =========================================
   LISTA DE CONVERSAS
========================================= */

async function loadConversations() {


    app.innerHTML = `

        ${header()}

        <div class="page">

            <h1 class="title">
                💬 Conversas
            </h1>

            <p class="subtitle">
                Suas conversas recentes.
            </p>

            <div
                id="diagnostic"
                class="diagnostic"
            >

                <div class="diagnostic-title">
                    Diagnóstico
                </div>

                <div class="diagnostic-row">
                    Usuário:
                    <strong>
                        ${escapeHTML(currentUser.id)}
                    </strong>
                </div>

                <div class="diagnostic-row">
                    Buscando mensagens...
                </div>

            </div>


            <div id="conversationList">

                <div class="empty">
                    Carregando...
                </div>

            </div>

        </div>

    `;


    const diagnostic =
    document.getElementById(
        "diagnostic"
    );


    const list =
    document.getElementById(
        "conversationList"
    );


    /* =====================================
       ENVIADAS
    ===================================== */

    const {
        data:sent,
        error:sentError
    } =
    await supabaseClient
        .from("messages")
        .select("*")
        .eq(
            "sender_id",
            currentUser.id
        );


    if (sentError) {

        diagnostic.innerHTML += `

            <div class="diagnostic-row error">

                Erro nas enviadas:
                ${escapeHTML(
                    sentError.message
                )}

            </div>

        `;

        return;

    }


    /* =====================================
       RECEBIDAS
    ===================================== */

    const {
        data:received,
        error:receivedError
    } =
    await supabaseClient
        .from("messages")
        .select("*")
        .eq(
            "receiver_id",
            currentUser.id
        );


    if (receivedError) {

        diagnostic.innerHTML += `

            <div class="diagnostic-row error">

                Erro nas recebidas:
                ${escapeHTML(
                    receivedError.message
                )}

            </div>

        `;

        return;

    }


    const sentMessages =
        sent || [];

    const receivedMessages =
        received || [];


    /* =====================================
       JUNTA TUDO
    ===================================== */

    const allMessages = [

        ...sentMessages,

        ...receivedMessages

    ];


    allMessages.sort(
        function(a,b) {

            return new Date(
                b.created_at
            ) - new Date(
                a.created_at
            );

        }
    );


    diagnostic.innerHTML = `

        <div class="diagnostic-title">
            Diagnóstico das Conversas
        </div>

        <div class="diagnostic-row success">
            ✅ Usuário autenticado
        </div>

        <div class="diagnostic-row">
            ID:
            <strong>
                ${escapeHTML(currentUser.id)}
            </strong>
        </div>

        <div class="diagnostic-row">
            Mensagens enviadas:
            <strong>
                ${sentMessages.length}
            </strong>
        </div>

        <div class="diagnostic-row">
            Mensagens recebidas:
            <strong>
                ${receivedMessages.length}
            </strong>
        </div>

        <div class="diagnostic-row">
            Total:
            <strong>
                ${allMessages.length}
            </strong>
        </div>

    `;


    /* =====================================
       NENHUMA MENSAGEM
    ===================================== */

    if (!allMessages.length) {

        list.innerHTML = `

            <div class="empty">

                Nenhuma mensagem encontrada.

            </div>

        `;

        return;

    }


    /* =====================================
       IDENTIFICAR OUTROS USUÁRIOS
    ===================================== */

    const conversations = {};


    allMessages.forEach(
        function(message) {


            const otherId =

                message.sender_id ===
                currentUser.id

                ?

                message.receiver_id

                :

                message.sender_id;


            if (!otherId) {

                return;

            }


            if (
                !conversations[otherId]
            ) {

                conversations[otherId] = {

                    lastMessage:
                        message,

                    unread: 0,

                    total: 0

                };

            }


            conversations[otherId]
                .total++;


            if (

                message.receiver_id ===
                currentUser.id

                &&

                message.read_at === null

            ) {

                conversations[otherId]
                    .unread++;

            }

        }
    );


    const ids =
    Object.keys(
        conversations
    );


    diagnostic.innerHTML += `

        <div class="diagnostic-row success">

            ✅ Conversas encontradas:
            <strong>
                ${ids.length}
            </strong>

        </div>

    `;


    /*
     * MOSTRA OS IDs
     */

    ids.forEach(
        function(id) {

            diagnostic.innerHTML += `

                <div class="diagnostic-row">

                    Outro usuário:
                    <strong>
                        ${escapeHTML(id)}
                    </strong>

                </div>

            `;

        }
    );


    /* =====================================
       BUSCAR USERNAMES
    ===================================== */

    let profiles = [];


    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("profiles")
            .select(
                "id,username"
            )
            .in(
                "id",
                ids
            );


        if (!error && data) {

            profiles =
                data;

        }

    } catch (error) {

        console.error(
            "Erro ao buscar profiles:",
            error
        );

    }


    const profileMap = {};


    profiles.forEach(
        function(profile) {

            profileMap[
                profile.id
            ] = profile;

        }
    );


    /* =====================================
       RENDERIZAR
    ===================================== */

    list.innerHTML = "";


    ids.forEach(
        function(id) {


            const conversation =
            conversations[id];


            const profile =
            profileMap[id];


            const username =

                profile &&
                profile.username

                ?

                profile.username

                :

                "Usuário";


            const message =
            conversation.lastMessage;


            const button =
            document.createElement(
                "button"
            );


            button.className =
                "conversation";


            button.type =
                "button";


            button.onclick =
            function() {

                window.location.href =
                    "conversas.html?user=" +
                    encodeURIComponent(id);

            };


            let badge = "";


            if (
                conversation.unread > 0
            ) {

                badge = `

                    <div class="badge">

                        ${
                            conversation.unread > 99
                            ? "99+"
                            : conversation.unread
                        }

                    </div>

                `;

            }


            button.innerHTML = `

                <div class="avatar">

                    ${initial(username)}

                </div>


                <div class="info">

                    <div class="name">

                        ${escapeHTML(username)}

                    </div>


                    <div class="last-message">

                        ${escapeHTML(
                            message.content
                        )}

                    </div>

                </div>


                <div>

                    <div class="time">

                        ${formatTime(
                            message.created_at
                        )}

                    </div>

                    ${badge}

                </div>

            `;


            list.appendChild(
                button
            );

        }
    );


    subscribeRealtime();

}
