<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Conversas - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 20% 20%,#25145c 0%,transparent 35%),radial-gradient(circle at 80% 80%,#102d59 0%,transparent 35%),#070811;color:#fff}.app{width:100%;max-width:480px;min-height:100vh;margin:auto}.header,.chat-header{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid #292a3d;background:rgba(10,11,20,.97);position:sticky;top:0;z-index:5}.back,.refresh{width:42px;height:42px;border-radius:12px;border:1px solid #303145;background:#1b1c2b;color:#fff;font-size:20px;cursor:pointer}.logo{font-size:28px;font-weight:800;flex:1}.logo span{color:#8b5cf6}.page{padding:20px}.title{font-size:25px;margin-bottom:6px}.subtitle{color:#9293a3;font-size:13px;margin-bottom:18px}.status{padding:11px 12px;margin-bottom:15px;border-radius:12px;background:#141523;border:1px solid #292a3d;color:#4ade80;font-size:12px}.conversation{display:flex;align-items:center;gap:13px;width:100%;padding:14px;margin-bottom:10px;border-radius:16px;border:1px solid #292a3d;background:rgba(20,21,35,.9);color:#fff;cursor:pointer;text-align:left}.avatar,.chat-avatar{border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#6366f1);display:flex;align-items:center;justify-content:center;font-weight:bold}.avatar{width:48px;height:48px;min-width:48px;font-size:18px}.info{min-width:0;flex:1}.name-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}.name{font-size:15px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.last-message{color:#858697;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{color:#737486;font-size:10px}.unread-badge{min-width:21px;height:21px;padding:0 6px;border-radius:20px;background:#ef4444;color:#fff;font-size:10px;font-weight:bold;display:flex;align-items:center;justify-content:center}.empty{text-align:center;color:#737486;padding:60px 20px}.chat{display:flex;flex-direction:column;min-height:100vh}.chat-user{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.chat-avatar{width:40px;height:40px}.chat-name{font-size:16px;font-weight:bold}.chat-status{font-size:10px;color:#4ade80;margin-top:3px}.chat-messages{flex:1;padding:20px 15px 90px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;min-height:calc(100vh - 130px)}.message{max-width:78%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-break:break-word}.mine{align-self:flex-end;background:linear-gradient(135deg,#8b5cf6,#6366f1);border-bottom-right-radius:5px}.theirs{align-self:flex-start;background:#1b1c2b;border:1px solid #303145;border-bottom-left-radius:5px}.message-time{display:block;font-size:9px;opacity:.6;margin-top:4px}.composer{display:flex;gap:8px;padding:12px 15px;border-top:1px solid #292a3d;background:rgba(10,11,20,.98);position:fixed;bottom:0;width:100%;max-width:480px}.composer input{flex:1;min-width:0;padding:14px;border-radius:13px;border:1px solid #303145;background:#11121e;color:#fff;outline:none}.send{width:50px;border:none;border-radius:13px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-size:19px;cursor:pointer}.error{text-align:center;color:#ff8f8f;padding:30px 20px}</style></head><body><div id="app" class="app"></div><script>
const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co",SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),app=document.getElementById("app");let currentUser=null,friendId=new URLSearchParams(location.search).get("user"),messageChannel=null,listChannel=null;function esc(t){const d=document.createElement("div");d.textContent=t??"";return d.innerHTML}function initial(n){return(n||"?").charAt(0).toUpperCase()}function tm(v){const d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}function nav(){return '<button type="button" class="back" onclick="location.href=\'index.html\'" aria-label="Tela inicial">⌂</button><div class="logo">Zuno<span>Play</span></div><button type="button" class="refresh" onclick="location.reload()" aria-label="Atualizar">↻</button>'}async function user(){const{data,error}=await supabaseClient.auth.getSession();if(error||!data?.session?.user){location.href="login.html";return false}currentUser=data.session.user;return true}function showList(){app.innerHTML='<div class="header">'+nav()+'</div><div class="page"><h1 class="title">💬 Conversas</h1><p class="subtitle">Suas conversas recentes.</p><div id="status" class="status">⏳ Carregando...</div><div id="conversationList"><div class="empty">Carregando conversas...</div></div></div>'}async function loadList(){showList();const{data:rows,error}=await supabaseClient.from("messages").select("id,sender_id,receiver_id,content,created_at,read_at").or("sender_id.eq."+currentUser.id+",receiver_id.eq."+currentUser.id).order("created_at",{ascending:false});if(error){document.getElementById("status").textContent="❌ Erro ao consultar mensagens";return}document.getElementById("status").textContent="⚡ Realtime ativo";const map={},unread={};for(const m of rows||[]){const other=m.sender_id===currentUser.id?m.receiver_id:m.sender_id;if(!other)continue;if(!map[other])map[other]=m;if(m.receiver_id===currentUser.id&&m.read_at===null)unread[other]=(unread[other]||0)+1}const list=document.getElementById("conversationList");list.innerHTML="";const ids=Object.keys(map);if(!ids.length){list.innerHTML='<div class="empty">Você ainda não possui conversas.<br><br>Vá em Amigos e comece uma conversa! 👋</div>';return}for(const id of ids){let name="Usuário "+id.slice(0,8);const{data:p}=await supabaseClient.from("profiles").select("id,username").eq("id",id).maybeSingle();if(p?.username)name=p.username;const m=map[id],count=unread[id]||0,item=document.createElement("button");item.className="conversation";item.onclick=()=>location.href="conversas.html?user="+encodeURIComponent(id);item.innerHTML='<div class="avatar">'+esc(initial(name))+'</div><div class="info"><div class="name-row"><div class="name">'+esc(name)+'</div>'+(count?'<span class="unread-badge">'+(count>99?"99+":count)+'</span>':"")+'</div><div class="last-message">'+esc(m.content)+'</div></div><div class="time">'+esc(tm(m.created_at))+'</div>';list.appendChild(item)}}function renderChat(name){app.innerHTML='<div class="chat"><div class="chat-header">'+nav()+'<div class="chat-user"><div class="chat-avatar">'+esc(initial(name))+'</div><div><div class="chat-name">'+esc(name)+'</div><div id="chatStatus" class="chat-status">● Conectando...</div></div></div></div><div id="chatMessages" class="chat-messages"><div class="empty">Carregando mensagens...</div></div><form id="composer" class="composer"><input id="messageInput" maxlength="2000" autocomplete="off" placeholder="Digite uma mensagem..."><button class="send" type="submit">➤</button></form></div>'}function relevant(m){return m&&(m.sender_id===currentUser.id&&m.receiver_id===friendId||m.sender_id===friendId&&m.receiver_id===currentUser.id)}function add(m,scroll=true){if(!relevant(m)||!m.id)return;const box=document.getElementById("chatMessages");if(!box||document.querySelector('[data-message-id="'+CSS.escape(String(m.id))+'"]'))return;box.querySelector(".empty")?.remove();const e=document.createElement("div");e.className="message "+(m.sender_id===currentUser.id?"mine":"theirs");e.dataset.messageId=m.id;e.innerHTML=esc(m.content)+'<span class="message-time">'+esc(tm(m.created_at))+'</span>';box.appendChild(e);if(scroll)box.scrollTop=box.scrollHeight}async function mark(){if(!friendId)return;const{error}=await supabaseClient.rpc("mark_message_notifications_read",{p_sender_id:friendId});if(error){console.warn("Falha ao marcar mensagens/notificações como lidas:",error);await supabaseClient.from("messages").update({read_at:new Date().toISOString()}).eq("receiver_id",currentUser.id).eq("sender_id",friendId).is("read_at",null)}}async function chat(){let name="Usuário "+friendId.slice(0,8);const{data:p}=await supabaseClient.from("profiles").select("id,username").eq("id",friendId).maybeSingle();if(p?.username)name=p.username;renderChat(name);const{data,error}=await supabaseClient.from("messages").select("id,sender_id,receiver_id,content,created_at,read_at").or("and(sender_id.eq."+currentUser.id+",receiver_id.eq."+friendId+"),and(sender_id.eq."+friendId+",receiver_id.eq."+currentUser.id+")").order("created_at",{ascending:true});const box=document.getElementById("chatMessages");if(error){box.innerHTML='<div class="error">Não foi possível carregar as mensagens.</div>';return}box.innerHTML="";(data||[]).forEach(m=>add(m,false));box.scrollTop=box.scrollHeight;await mark();messageChannel=supabaseClient.channel("private-"+currentUser.id+"-"+friendId).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>{if(relevant(p.new)){add(p.new);if(p.new.sender_id===friendId)mark()}}).subscribe(s=>{const x=document.getElementById("chatStatus");if(x&&s==="SUBSCRIBED")x.textContent="● Online · mensagens em tempo real"});document.getElementById("composer").addEventListener("submit",async e=>{e.preventDefault();const input=document.getElementById("messageInput"),content=input.value.trim();if(!content)return;const{data,error}=await supabaseClient.from("messages").insert({sender_id:currentUser.id,receiver_id:friendId,content}).select("id,sender_id,receiver_id,content,created_at,read_at").single();if(error){alert("Não foi possível enviar a mensagem.\n\n"+error.message);return}input.value="";add(data);input.focus()})}async function main(){if(!await user())return;if(friendId)await chat();else{await loadList();listChannel=supabaseClient.channel("list-"+currentUser.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},loadList).on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages"},loadList).subscribe()}}main();
</script></body></html>
