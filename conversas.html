<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conversas - ZunoPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #25145c 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #102d59 0%, transparent 35%),
        #070811;
    color: white;
}

.app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
}

.header {
    height: 70px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: #0a0b14;
    border-bottom: 1px solid #292a3d;
    position: sticky;
    top: 0;
    z-index: 10;
}

.back {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid #303145;
    background: #1b1c2b;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.logo span {
    color: #8b5cf6;
}

.page {
    padding: 20px;
}

.title {
    font-size: 26px;
    margin-bottom: 5px;
}

.subtitle {
    color: #9293a3;
    font-size: 13px;
    margin-bottom: 20px;
}

.status {
    padding: 12px;
    border-radius: 12px;
    background: #141523;
    border: 1px solid #292a3d;
    color: #4ade80;
    font-size: 12px;
    margin-bottom: 15px;
}

.conversation {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 17px;
    border: 1px solid #292a3d;
    background: #141523;
    color: white;
    text-align: left;
    cursor: pointer;
}

.conversation:active {
    transform: scale(.98);
}

.avatar {
    width: 50px;
    height: 50px;
    min-width: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg,#8b5cf6,#6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
}

.info {
    min-width: 0;
    flex: 1;
}

.name {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 5px;
}

.last {
    color: #858697;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.time {
    color: #737486;
    font-size: 10px;
}

.empty {
    text-align: center;
    color: #737486;
    padding: 50px 20px;
}

.chat {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.chat-header {
    height: 70px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 15px;
    background: #0a0b14;
    border-bottom: 1px solid #292a3d;
    position: sticky;
    top: 0;
    z-index: 10;
}

.chat-name {
    font-weight: bold;
    font-size: 15px;
}

.chat-status {
    color: #4ade80;
    font-size: 10px;
    margin-top: 3px;
}

.messages {
    flex: 1;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    min-height: calc(100vh - 140px);
}

.message {
    max-width: 78%;
    padding: 11px 14px;
    border-radius: 17px;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
}

.mine {
    align-self: flex-end;
    background: linear-gradient(135deg,#8b5cf6,#6366f1);
    border-bottom-right-radius: 5px;
}

.theirs {
    align-self: flex-start;
    background: #1b1c2b;
    border: 1px solid #303145;
    border-bottom-left-radius: 5px;
}

.message-time {
    display: block;
    font-size: 9px;
    opacity: .6;
    margin-top: 4px;
    text-align: right;
}

.composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #0a0b14;
    border-top: 1px solid #292a3d;
    position: sticky;
    bottom: 0;
}

.composer input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid #303145;
    background: #11121e;
    color: white;
    outline: none;
}

.composer input:focus {
    border-color: #8b5cf6;
}

.send {
    width: 52px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg,#8b5cf6,#6366f1);
    color: white;
    font-size: 18px;
    cursor: pointer;
}

</style>

</head>

<body>

<div id="app" class="app"></div>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   VARIÁVEIS
========================================= */

let currentUser = null;

let friendId = null;

let friendProfile = null;

let realtimeChannel = null;

const params =
new URLSearchParams(
    window.location.search
);

friendId =
params.get("user");

const app =
document.getElementById("app");


/* =========================================
   UTILIDADES
========================================= */

function escapeHTML(text) {

    const div =
    document.createElement("div");

    div.textContent =
    text || "";

    return div.innerHTML;

}


function formatTime(date) {

    if (!date) {
        return "";
    }

    return new Date(date).toLocaleTimeString(
        "pt-BR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function initial(name) {

    return (
        name ||
        "?"
    )
    .charAt(0)
    .toUpperCase();

}


function goBack() {

    if (friendId) {

        window.location.href =
        "conversas.html";

    } else {

        window.location.href =
        "index.html";

    }

}


/* =========================================
   USUÁRIO LOGADO
========================================= */

async function getUser() {

    const result =
    await supabaseClient
        .auth
        .getSession();

    if (
        result.error ||
        !result.data.session
    ) {

        window.location.href =
        "login.html";

        return false;

    }

    currentUser =
    result.data.session.user;

    return true;

}


/* =========================================
   BUSCAR PERFIL
========================================= */

async function getProfile(userId) {

    const result =
    await supabaseClient
        .from("profiles")
        .select("id, username")
        .eq(
            "id",
            userId
        )
        .maybeSingle();

    if (result.error) {

        console.error(
            "Erro ao buscar perfil:",
            result.error
        );

        return null;

    }

    return result.data;

}


/* =========================================
   LISTA DE CONVERSAS
========================================= */

async function loadList() {

    app.innerHTML = `

        <div class="header">

            <button
                class="back"
                onclick="goBack()"
            >
                ←
            </button>

            <div class="logo">
                Zuno<span>Play</span>
            </div>

        </div>

        <div class="page">

            <h1 class="title">
                💬 Conversas
            </h1>

            <p class="subtitle">
                Suas conversas recentes.
            </p>

            <div
                id="status"
                class="status"
            >
                ⏳ Carregando...
            </div>

            <div id="list">

                <div class="empty">
                    Carregando conversas...
                </div>

            </div>

        </div>

    `;


    const result =
    await supabaseClient
        .from("messages")
        .select("*")
        .or(
            "sender_id.eq." +
            currentUser.id +
            ",receiver_id.eq." +
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (result.error) {

        document.getElementById(
            "status"
        ).textContent =
            "❌ " +
            result.error.message;

        return;

    }


    const messages =
    result.data || [];


    document.getElementById(
        "status"
    ).textContent =
        "✅ " +
        messages.length +
        " mensagens encontradas";


    const groups = {};


    messages.forEach(
        function(message) {

            const otherId =
                message.sender_id ===
                currentUser.id

                ? message.receiver_id

                : message.sender_id;


            if (!otherId) {
                return;
            }


            if (!groups[otherId]) {

                groups[otherId] = {

                    last: message,

                    unread: 0

                };

            }


            if (
                message.receiver_id ===
                currentUser.id &&
                message.read_at === null
            ) {

                groups[otherId].unread++;

            }

        }
    );


    const list =
    document.getElementById("list");


    list.innerHTML = "";


    for (
        const otherId of Object.keys(groups)
    ) {

        const data =
        groups[otherId];


        const profile =
        await getProfile(
            otherId
        );


        const username =
        profile?.username ||
        "Usuário";


        const button =
        document.createElement(
            "button"
        );


        button.className =
        "conversation";


        button.onclick =
        function() {

            window.location.href =
            "conversas.html?user=" +
            encodeURIComponent(
                otherId
            );

        };


        button.innerHTML = `

            <div class="avatar">

                ${escapeHTML(
                    initial(username)
                )}

            </div>


            <div class="info">

                <div class="name">

                    ${escapeHTML(
                        username
                    )}

                </div>


                <div class="last">

                    ${escapeHTML(
                        data.last.content
                    )}

                </div>

            </div>


            <div class="time">

                ${formatTime(
                    data.last.created_at
                )}

            </div>

        `;


        list.appendChild(
            button
        );

    }


    subscribeList();

}


/* =========================================
   CHAT
========================================= */

async function loadChat() {

    friendProfile =
    await getProfile(
        friendId
    );


    const username =
    friendProfile?.username ||
    "Usuário";


    app.innerHTML = `

        <div class="chat">

            <div class="chat-header">

                <button
                    class="back"
                    onclick="goBack()"
                >
                    ←
                </button>


                <div class="avatar">

                    ${escapeHTML(
                        initial(username)
                    )}

                </div>


                <div>

                    <div class="chat-name">

                        ${escapeHTML(
                            username
                        )}

                    </div>


                    <div
                        id="chatStatus"
                        class="chat-status"
                    >

                        ● Conversa privada

                    </div>

                </div>

            </div>


            <div
                id="messages"
                class="messages"
            >

                <div class="empty">

                    Carregando mensagens...

                </div>

            </div>


            <form
                id="composer"
                class="composer"
            >

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Digite uma mensagem..."
                    maxlength="2000"
                    autocomplete="off"
                    required
                >


                <button
                    class="send"
                    type="submit"
                >

                    ➤

                </button>

            </form>

        </div>

    `;


    await loadMessages();


    await markAsRead();


    document
        .getElementById("composer")
        .addEventListener(
            "submit",
            sendMessage
        );


    subscribeChat();

}


/* =========================================
   CARREGAR MENSAGENS
========================================= */

async function loadMessages() {

    const container =
    document.getElementById(
        "messages"
    );


    const result =
    await supabaseClient
        .from("messages")
        .select("*")
        .or(
            "and(sender_id.eq." +
            currentUser.id +
            ",receiver_id.eq." +
            friendId +
            "),and(sender_id.eq." +
            friendId +
            ",receiver_id.eq." +
            currentUser.id +
            ")"
        )
        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (result.error) {

        container.innerHTML = `

            <div class="empty">

                ❌ Erro ao carregar mensagens.

                <br><br>

                ${escapeHTML(
                    result.error.message
                )}

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    const messages =
    result.data || [];


    if (!messages.length) {

        container.innerHTML = `

            <div class="empty">

                Nenhuma mensagem ainda.<br><br>

                Comece a conversa! 👋

            </div>

        `;

    }


    messages.forEach(
        addMessage
    );


    scrollBottom();

}


/* =========================================
   ADICIONAR MENSAGEM
========================================= */

function addMessage(message) {

    const container =
    document.getElementById(
        "messages"
    );


    if (!container) {
        return;
    }


    if (
        document.querySelector(
            '[data-message-id="' +
            message.id +
            '"]'
        )
    ) {

        return;

    }


    const empty =
    container.querySelector(
        ".empty"
    );


    if (empty) {

        container.innerHTML = "";

    }


    const div =
    document.createElement(
        "div"
    );


    div.dataset.messageId =
    message.id;


    div.className =
    "message " +
    (
        message.sender_id ===
        currentUser.id
        ? "mine"
        : "theirs"
    );


    div.innerHTML = `

        ${escapeHTML(
            message.content
        )}

        <span class="message-time">

            ${formatTime(
                message.created_at
            )}

        </span>

    `;


    container.appendChild(
        div
    );

}


/* =========================================
   MARCAR COMO LIDA
========================================= */

async function markAsRead() {

    if (!friendId) {
        return;
    }


    await supabaseClient
        .from("messages")
        .update({

            read_at:
            new Date().toISOString()

        })
        .eq(
            "sender_id",
            friendId
        )
        .eq(
            "receiver_id",
            currentUser.id
        )
        .is(
            "read_at",
            null
        );

}


/* =========================================
   ENVIAR
========================================= */

async function sendMessage(event) {

    event.preventDefault();


    const input =
    document.getElementById(
        "messageInput"
    );


    const content =
    input.value.trim();


    if (!content) {
        return;
    }


    input.disabled = true;


    const result =
    await supabaseClient
        .from("messages")
        .insert({

            sender_id:
            currentUser.id,

            receiver_id:
            friendId,

            content:
            content

        })
        .select()
        .single();


    input.disabled = false;


    if (result.error) {

        alert(
            "Erro ao enviar mensagem:\n\n" +
            result.error.message
        );

        return;

    }


    input.value = "";

    input.focus();


    /*
     * Mostra imediatamente.
     * O Realtime também poderá receber
     * o evento, mas addMessage evita duplicação.
     */

    addMessage(
        result.data
    );


    scrollBottom();

}


/* =========================================
   REALTIME DO CHAT
========================================= */

function subscribeChat() {

    if (realtimeChannel) {

        supabaseClient
            .removeChannel(
                realtimeChannel
            );

    }


    realtimeChannel =
    supabaseClient
        .channel(
            "zunoplay-chat-" +
            currentUser.id +
            "-" +
            friendId
        )
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "messages"
            },
            async function(payload) {

                const message =
                payload.new;


                const related =
                (
                    message.sender_id ===
                    currentUser.id &&
                    message.receiver_id ===
                    friendId
                )
                ||
                (
                    message.sender_id ===
                    friendId &&
                    message.receiver_id ===
                    currentUser.id
                );


                if (!related) {
                    return;
                }


                addMessage(
                    message
                );


                if (
                    message.sender_id ===
                    friendId
                ) {

                    await supabaseClient
                        .from("messages")
                        .update({

                            read_at:
                            new Date().toISOString()

                        })
                        .eq(
                            "id",
                            message.id
                        );

                }


                scrollBottom();

            }
        )
        .subscribe(
            function(status) {

                console.log(
                    "Realtime:",
                    status
                );

            }
        );

}


/* =========================================
   REALTIME DA LISTA
========================================= */

function subscribeList() {

    supabaseClient
        .channel(
            "zunoplay-conversation-list-" +
            currentUser.id
        )
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "messages"
            },
            function(payload) {

                const message =
                payload.new;


                if (
                    message?.sender_id ===
                    currentUser.id ||
                    message?.receiver_id ===
                    currentUser.id
                ) {

                    loadList();

                }

            }
        )
        .subscribe();

}


/* =========================================
   SCROLL
========================================= */

function scrollBottom() {

    const container =
    document.getElementById(
        "messages"
    );
