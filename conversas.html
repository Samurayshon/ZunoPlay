<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Conversas - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#070811;color:#fff;font-family:Arial,sans-serif}.app{max-width:480px;margin:auto;min-height:100vh}.header,.chat-header{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid #292a3d;background:#0a0b14;position:sticky;top:0;z-index:5}.back{width:42px;height:42px;border-radius:12px;border:1px solid #303145;background:#1b1c2b;color:#fff;font-size:20px;cursor:pointer}.logo{font-size:28px;font-weight:800;flex:1}.logo span{color:#8b5cf6}.page{padding:20px}.title{font-size:25px}.subtitle,.last-message{color:#858697;font-size:12px}.status{padding:11px;margin:15px 0;border-radius:12px;background:#141523;color:#4ade80}.conversation{display:flex;align-items:center;gap:13px;width:100%;padding:14px;margin-bottom:10px;border-radius:16px;border:1px solid #292a3d;background:#141523;color:#fff;cursor:pointer;text-align:left}.avatar,.chat-avatar{border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#6366f1);display:flex;align-items:center;justify-content:center;font-weight:bold}.avatar{width:48px;height:48px;min-width:48px}.info{min-width:0;flex:1}.name-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}.name{font-size:15px;font-weight:bold}.last-message{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{color:#737486;font-size:10px}.unread-badge{min-width:21px;height:21px;padding:0 6px;border-radius:20px;background:#ef4444;color:#fff;font-size:10px;font-weight:bold;display:flex;align-items:center;justify-content:center}.empty{text-align:center;color:#737486;padding:60px 20px}.chat{display:flex;flex-direction:column;min-height:100vh}.chat-user{display:flex;align-items:center;gap:10px;flex:1}.chat-avatar{width:40px;height:40px}.chat-name{font-weight:bold}.chat-status{font-size:10px;color:#4ade80}.chat-messages{flex:1;padding:20px 15px 90px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}.message{max-width:78%;padding:11px 14px;border-radius:16px;line-height:1.4;word-break:break-word}.mine{align-self:flex-end;background:#7651d6}.theirs{align-self:flex-start;background:#1b1c2b;border:1px solid #303145}.message-time{display:block;font-size:9px;opacity:.6;margin-top:4px}.composer{display:flex;gap:8px;padding:12px 15px;border-top:1px solid #292a3d;background:#0a0b14;position:fixed;bottom:0;width:100%;max-width:480px}.composer input{flex:1;padding:14px;border-radius:13px;border:1px solid #303145;background:#11121e;color:#fff}.send{width:50px;border:0;border-radius:13px;background:#7651d6;color:#fff;font-size:19px}</style></head><body><div id="app" class="app"></div><script>const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co",SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),app=document.getElementById("app");let currentUser=null,friendId=new URLSearchParams(location.search).get("user"),globalMessageChannel=null,messageChannel=null;const esc=t=>{const d=document.createElement("div");d.textContent=t??"";return d.innerHTML},initial=n=>(n||"?").charAt(0).toUpperCase(),tm=v=>new Date(v).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});function nav(){return '<button class="back" type="button" onclick="location.href=\'index.html\'" aria-label="Tela inicial" title="Tela inicial">⌂</button><div class="logo">Zuno<span>Play</span></div>'}async function user(){const{data,error}=await supabaseClient.auth.getSession();if(error||!data?.session?.user){location.href="login.html";return false}currentUser=data.session.user;return true}function relevant(m){return m&&(m.sender_id===currentUser.id&&m.receiver_id===friendId||m.sender_id===friendId&&m.receiver_id===currentUser.id)}async function profileName(id){const{data}=await supabaseClient.from("profiles").select("username").eq("id",id).maybeSingle();return data?.username||"Usuário "+id.slice(0,8)}async function updateRow(id,m){const list=document.getElementById("conversationList");if(!list)return;let row=list.querySelector('[data-user-id="'+CSS.escape(id)+'"]');if(!row){row=document.createElement("button");row.className="conversation";row.dataset.userId=id;row.onclick=()=>location.href="conversas.html?user="+encodeURIComponent(id);list.prepend(row)}const name=await profileName(id);const{count}=await supabaseClient.from("messages").select("id",{count:"exact",head:true}).eq("receiver_id",currentUser.id).eq("sender_id",id).is("read_at",null);row.innerHTML='<div class="avatar">'+esc(initial(name))+'</div><div class="info"><div class="name-row"><div class="name">'+esc(name)+'</div>'+(count?'<span class="unread-badge">'+(count>99?"99+":count)+'</span>':"")+'</div><div class="last-message">'+esc(m.content)+'</div></div><div class="time">'+esc(tm(m.created_at))+'</div>'}function startGlobalRealtime(){if(globalMessageChannel)return;globalMessageChannel=supabaseClient.channel("global-messages-"+currentUser.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"receiver_id=eq."+currentUser.id},async p=>{if(friendId&&relevant(p.new)){add(p.new);return}if(!friendId)await updateRow(p.new.sender_id,p.new)}).subscribe()}function showList(){app.innerHTML='<div class="header">'+nav()+'</div><div class="page"><h1 class="title">💬 Conversas</h1><p class="subtitle">Suas conversas recentes.</p><div id="status" class="status">⚡ Realtime ativo</div><div id="conversationList"><div class="empty">Carregando...</div></div></div>'}async function loadList(){showList();const{data,error}=await supabaseClient.from("messages").select("id,sender_id,receiver_id,content,created_at,read_at").or("sender_id.eq."+currentUser.id+",receiver_id.eq."+currentUser.id).order("created_at",{ascending:false});if(error)return;const map={},unread={};for(const m of data||[]){const id=m.sender_id===currentUser.id?m.receiver_id:m.sender_id;if(!map[id])map[id]=m;if(m.receiver_id===currentUser.id&&!m.read_at)unread[id]=(unread[id]||0)+1}const list=document.getElementById("conversationList");list.innerHTML="";for(const id of Object.keys(map)){const m=map[id],name=await profileName(id),count=unread[id]||0,item=document.createElement("button");item.className="conversation";item.dataset.userId=id;item.onclick=()=>location.href="conversas.html?user="+encodeURIComponent(id);item.innerHTML='<div class="avatar">'+esc(initial(name))+'</div><div class="info"><div class="name-row"><div class="name">'+esc(name)+'</div>'+(count?'<span class="unread-badge">'+(count>99?"99+":count)+'</span>':"")+'</div><div class="last-message">'+esc(m.content)+'</div></div><div class="time">'+esc(tm(m.created_at))+'</div>';list.appendChild(item)}}function renderChat(name){app.innerHTML='<div class="chat"><div class="chat-header">'+nav()+'<div class="chat-user"><div class="chat-avatar">'+esc(initial(name))+'</div><div><div class="chat-name">'+esc(name)+'</div><div id="chatStatus" class="chat-status">● Conectando...</div></div></div></div><div id="chatMessages" class="chat-messages"></div><form id="composer" class="composer"><input id="messageInput" maxlength="2000" autocomplete="off" placeholder="Digite uma mensagem..."><button class="send" type="submit">➤</button></form></div>'}function add(m){if(!relevant(m)||!m.id)return;const box=document.getElementById("chatMessages");if(!box||document.querySelector('[data-message-id="'+CSS.escape(String(m.id))+'"]'))return;const e=document.createElement("div");e.className="message "+(m.sender_id===currentUser.id?"mine":"theirs");e.dataset.messageId=m.id;e.innerHTML=esc(m.content)+'<span class="message-time">'+esc(tm(m.created_at))+'</span>';box.appendChild(e);box.scrollTop=box.scrollHeight}async function mark(){if(friendId)await supabaseClient.rpc("mark_message_notifications_read",{p_sender_id:friendId})}async function chat(){const name=await profileName(friendId);renderChat(name);const{data,error}=await supabaseClient.from("messages").select("id,sender_id,receiver_id,content,created_at,read_at").or("and(sender_id.eq."+currentUser.id+",receiver_id.eq."+friendId+"),and(sender_id.eq."+friendId+",receiver_id.eq."+currentUser.id+")").order("created_at");const box=document.getElementById("chatMessages");if(error){box.innerHTML='<div class="empty">Não foi possível carregar as mensagens.</div>';return}(data||[]).forEach(add);await mark();messageChannel=supabaseClient.channel("private-"+currentUser.id+"-"+friendId).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>{if(relevant(p.new)){add(p.new);if(p.new.sender_id===friendId)mark()}}).subscribe(s=>{if(s==="SUBSCRIBED")document.getElementById("chatStatus").textContent="● Online · mensagens em tempo real"});document.getElementById("composer").onsubmit=async e=>{e.preventDefault();const input=document.getElementById("messageInput"),content=input.value.trim();if(!content)return;const{data,error}=await supabaseClient.from("messages").insert({sender_id:currentUser.id,receiver_id:friendId,content}).select("id,sender_id,receiver_id,content,created_at,read_at").single();if(error)return alert("Não foi possível enviar a mensagem.\n\n"+error.message);input.value="";add(data);input.focus()}}async function main(){if(!await user())return;startGlobalRealtime();if(friendId)await chat();else await loadList()}main();</script></body></html>
