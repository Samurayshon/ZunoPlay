  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02040d;color:#f7f7ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 18% 12%,rgba(139,61,255,.20),transparent 28%),radial-gradient(circle at 82% 88%,rgba(49,211,255,.11),transparent 30%),#02040d}.container{width:min(100%,520px);min-height:100dvh;margin:auto;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center}.brand{display:flex;justify-content:center;align-items:center;min-height:46px;margin:0 0 10px}.card{background:linear-gradient(145deg,rgba(13,17,42,.98),rgba(6,8,21,.99));border:1px solid #2d335c;border-radius:20px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.32)}h1{font-size:24px;line-height:1.05;margin:0 0 6px;letter-spacing:-.6px}.description{color:#9298ad;font-size:12px;line-height:1.35;margin:0 0 12px}label{display:block;margin:10px 0 5px;font-size:11px;font-weight:850;color:#c7cada}.field{position:relative}input{width:100%;height:44px;padding:0 13px;border-radius:13px;border:1px solid #303653;background:#080b1a;color:#fff;outline:none;font-size:16px}input:focus{border-color:#7d4cff;box-shadow:0 0 0 3px rgba(125,76,255,.10)}.password-input{padding-right:50px}.password-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;min-height:36px;border:0;border-radius:10px;background:transparent;color:#858ca8;display:grid;place-items:center}.password-toggle.active{color:#78dfff;background:rgba(49,211,255,.08)}.password-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}form button[type=submit]{width:100%;height:44px;margin-top:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#843bff,#c33fff 58%,#31d3ff);color:#fff;font-size:14px;font-weight:950}form button:disabled{opacity:.6}.link{display:flex;align-items:center;justify-content:center;min-height:36px;margin-top:6px;color:#989eb4;text-decoration:none;font-size:11px}.message{display:none;margin-top:8px;padding:8px 10px;border-radius:10px;font-size:11px;text-align:center}.success{display:block;background:rgba(34,197,94,.10);color:#86efac}.error{display:block;background:rgba(239,68,68,.10);color:#fca5a5}@media(max-height:620px){.container{justify-content:flex-start}.brand{min-height:38px;margin-bottom:6px}.card{padding:14px}h1{font-size:21px}.description{margin-bottom:8px}label{margin-top:7px}form button[type=submit]{margin-top:10px}.link{min-height:30px;margin-top:3px}}

<body>
  <div class="container">
    <div class="brand">ZunoPlay</div>
    <div class="card">
      <h1>Bem-vindo de volta</h1>
      <p class="description">Entre na sua conta para continuar.</p>
      <form id="loginForm">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
        <label for="password">Senha</label>
        <div class="field"><input class="password-input" type="password" id="password" placeholder="Sua senha" autocomplete="current-password" required><button id="passwordToggle" class="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.8"></circle></svg></button></div>
        <button type="submit" id="loginButton">Entrar</button>
      </form>
      <div id="message" class="message"></div>
      <a href="cadastro.html" class="link">Ainda não tenho uma conta</a>
      <a href="entrada.html" class="link">Voltar</a>
    </div>
  </div>
  <script>
    const form=document.getElementById('loginForm'),button=document.getElementById('loginButton'),message=document.getElementById('message'),passwordInput=document.getElementById('password'),passwordToggle=document.getElementById('passwordToggle');
    passwordToggle.addEventListener('click',()=>{const showing=passwordInput.type==='text';passwordInput.type=showing?'password':'text';passwordToggle.classList.toggle('active',!showing);passwordToggle.setAttribute('aria-pressed',String(!showing));passwordToggle.setAttribute('aria-label',showing?'Mostrar senha':'Ocultar senha')});
    function safeNext(){const raw=new URLSearchParams(location.search).get('next')||'index.html';return /^[a-z0-9_-]+\.html(?:[?#].*)?$/i.test(raw)?raw:'index.html'}
    function show(type,text){message.className='message '+type;message.textContent=text}
    if(!window.supabase?.createClient){show('error','O serviço de login não carregou. Verifique sua conexão e recarregue a página.');button.disabled=true}else{const SUPABASE_URL='https://rliymfbbhqoejgfvsbuu.supabase.co',SUPABASE_KEY='sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0',supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);(async()=>{try{const{data,error}=await supabaseClient.auth.getSession();if(!error&&data?.session?.user)location.replace(safeNext())}catch(error){console.warn('Não foi possível restaurar a sessão:',error)}})();form.addEventListener('submit',async event=>{event.preventDefault();const email=document.getElementById('email').value.trim(),password=passwordInput.value;message.className='message';message.textContent='';button.disabled=true;button.textContent='Entrando...';try{const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;if(!data?.session?.user)throw new Error('Não foi possível iniciar a sessão.');show('success','Login realizado! Entrando no ZunoPlay...');location.replace(safeNext())}catch(error){const raw=String(error?.message||'');show('error',/Invalid login credentials/i.test(raw)?'E-mail ou senha incorretos.':/Email not confirmed/i.test(raw)?'Confirme seu e-mail antes de entrar.':'Não foi possível entrar. Tente novamente.');button.disabled=false;button.textContent='Entrar'}})}
  </script>
