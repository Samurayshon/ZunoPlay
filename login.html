="za-universe-title">Seu universo continua aqui</div><div class="za-orbit" aria-hidden="true"><span class="za-orbit-line"></span><div class="za-node za-rooms"><span class="za-icon">◖))</span><b>Salas</b></div><div class="za-core"><span></span></div><div class="za-node za-games"><span class="za-icon">✦</span><b>Jogos</b></div><div class="za-node za-people"><span class="za-icon">●●</span><b>Pessoas</b></div></div></div></section><div class="za-legal"><a href="termos.html">Termos de Uso</a><span>·</span><a href="privacidade.html">Política de Privacidade</a></div></main><script>const form=document.getElementById('loginForm'),button=document.getElementById('loginButton'),message=document.getElementById('message'),passwordInput=document.getElementById('password'),passwordToggle=document.getElementById('passwordToggle');passwordToggle.addEventListener('click',()=>{const showing=passwordInput.type==='text';passwordInput.type=showing?'password':'text';passwordToggle.classList.toggle('active',!showing);passwordToggle.setAttribute('aria-pressed',String(!showing));passwordToggle.setAttribute('aria-label',showing?'Mostrar senha':'Ocultar senha')});function safeNext(){const raw=new URLSearchParams(location.search).get('next')||'index.html';return /^[a-z0-9_-]+\.html(?:[?#].*)?$/i.test(raw)?raw:'index.html'}function show(type,text){message.className='za-message '+type;message.textContent=text}if(!window.supabase?.createClient){show('error','O serviço de login não carregou. Verifique sua conexão e recarregue a página.');button.disabled=true}else{const SUPABASE_URL='https://rliymfbbhqoejgfvsbuu.supabase.co',SUPABASE_KEY='sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0',supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);(async()=>{try{const{data,error}=await supabaseClient.auth.getSession();if(!error&&data?.session?.user)location.replace(safeNext())}catch(error){console.warn('Não foi possível restaurar a sessão:',error)}})();form.addEventListener('submit',async event=>{event.preventDefault();const email=document.getElementById('email').value.trim(),password=passwordInput.value;message.className='za-message';message.textContent='';button.disabled=true;button.textContent='Entrando...';try{const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;if(!data?.session?.user)throw new Error('Não foi possível iniciar a sessão.');show('success','Login realizado! Entrando no ZunoPlay...');location.replace(safeNext())}catch(error){const raw=String(error?.message||'');show('error',/Invalid login credentials/i.test(raw)?'E-mail ou senha incorretos.':/Email not confirmed/i.test(raw)?'Confirme seu e-mail antes de entrar.':'Não foi possível entrar. Tente novamente.');button.disabled=false;button.textContent='Entrar'}})}</script></body></html>
