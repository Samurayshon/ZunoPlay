-mail</label><input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required><label for="password">Senha</label><input type="password" id="password" placeholder="Sua senha" autocomplete="current-password" required><button type="submit" id="loginButton">Entrar</button></form><div id="message" class="message"></div><a href="cadastro.html" class="link">Ainda não tenho uma conta</a><a href="index.html" class="link">← Voltar</a></div></div><script>const SUPABASE_URL='https://rliymfbbhqoejgfvsbuu.supabase.co',SUPABASE_KEY='sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0',supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),form=document.getElementById('loginForm'),button=document.getElementById('loginButton'),message=document.getElementById('message');function safeNext(){const raw=new URLSearchParams(location.search).get('next')||'index.html';return /^[a-z0-9_-]+\.html(?:[?#].*)?$/i.test(raw)?raw:'index.html'}function show(type,text){message.className='message '+type;message.textContent=text}async function validExistingSession(){try{const{data:{session}}=await supabaseClient.auth.getSession();if(!session)return false;const{data,error}=await supabaseClient.auth.getUser();return !error&&!!data?.user}catch(_){return false}}(async()=>{if(await validExistingSession())location.replace(safeNext())})();form.addEventListener('submit',async event=>{event.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;message.className='message';message.textContent='';button.disabled=true;button.textContent='Entrando...';try{const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;if(!data.session?.user)throw new Error('Não foi possível iniciar a sessão.');const{data:verified,error:verifyError}=await supabaseClient.auth.getUser();if(verifyError||!verified?.user)throw new Error('A sessão não pôde ser validada.');show('success','Login realizado! Entrando no ZunoPlay...');location.replace(safeNext())}catch(error){console.error('Erro no login:',error);const raw=String(error?.message||'');show('error',/Invalid login credentials/i.test(raw)?'E-mail ou senha incorretos.':/Email not confirmed/i.test(raw)?'Confirme seu e-mail antes de entrar.':'Não foi possível entrar. Tente novamente.');button.disabled=false;button.textContent='Entrar'}});</script></body></html>
