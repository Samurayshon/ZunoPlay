<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - ZunoPlay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 20% 20%,#25145c 0%,transparent 35%),radial-gradient(circle at 80% 80%,#102d59 0%,transparent 35%),#070811;color:#fff}.container{width:100%;max-width:480px;min-height:100vh;margin:auto;padding:25px;display:flex;flex-direction:column;justify-content:center}.logo{text-align:center;margin-bottom:30px}.logo button{appearance:none;border:1px solid rgba(139,92,246,.45);background:#1b1c2b;color:#fff;border-radius:14px;padding:10px 15px;font-size:38px;font-weight:800;cursor:pointer}.logo button span{color:#8b5cf6}.card{background:rgba(20,21,35,.9);border:1px solid rgba(139,92,246,.2);border-radius:24px;padding:25px}h1{font-size:25px;margin-bottom:8px}.description{color:#9293a3;font-size:14px;margin-bottom:25px}label{display:block;margin-top:16px;margin-bottom:7px;font-size:13px;color:#c9c9d4}input{width:100%;padding:15px;border-radius:12px;border:1px solid #303145;background:#11121e;color:#fff;outline:none;font-size:15px}input:focus{border-color:#8b5cf6}form button{width:100%;padding:16px;margin-top:25px;border:none;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-size:16px;font-weight:bold;cursor:pointer}form button:disabled{opacity:.6;cursor:not-allowed}.link{display:block;text-align:center;margin-top:18px;color:#999aaa;text-decoration:none;font-size:14px}.message{display:none;margin-top:18px;padding:12px;border-radius:10px;font-size:13px;text-align:center}.success{display:block;background:rgba(34,197,94,.12);color:#86efac}.error{display:block;background:rgba(239,68,68,.12);color:#fca5a5}.refresh-button{position:fixed;right:18px;bottom:22px;width:46px;height:46px;border-radius:50%;border:1px solid #303145;background:#1b1c2b;color:#fff;font-size:21px;cursor:pointer;z-index:9999}
</style>
</head>
<body>
<div class="container">
<div class="logo"><button type="button" onclick="window.location.href='index.html'" aria-label="Voltar para a tela inicial">Zuno<span>Play</span></button></div>
<div class="card">
<h1>Bem-vindo de volta</h1><p class="description">Entre na sua conta para continuar.</p>
<form id="loginForm"><label for="email">E-mail</label><input type="email" id="email" placeholder="seu@email.com" required><label for="password">Senha</label><input type="password" id="password" placeholder="Sua senha" required><button type="submit" id="loginButton">Entrar</button></form>
<div id="message" class="message"></div><a href="cadastro.html" class="link">Ainda não tenho uma conta</a><a href="index.html" class="link">← Voltar</a>
</div></div>
<button type="button" class="refresh-button" onclick="window.location.reload()" aria-label="Atualizar página" title="Atualizar página">↻</button>
<script>
const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co";const SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const form=document.getElementById("loginForm"),button=document.getElementById("loginButton"),message=document.getElementById("message");form.addEventListener("submit",async function(event){event.preventDefault();const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;message.className="message";message.textContent="";button.disabled=true;button.textContent="Entrando...";try{const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;if(!data.session)throw new Error("Não foi possível iniciar a sessão.");message.className="message success";message.textContent="Login realizado! Entrando no ZunoPlay...";setTimeout(function(){window.location.href="index.html"},800)}catch(error){console.error("Erro no login:",error);message.className="message error";message.textContent=error.message.includes("Invalid login credentials")?"E-mail ou senha incorretos.":"Não foi possível entrar: "+error.message}button.disabled=false;button.textContent="Entrar"});
</script>
</body></html>
