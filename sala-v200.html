<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02040d"><title>Sala - ZunoPlay</title><link rel="stylesheet" href="zuno-room-stage-v2.css?v=208"><link rel="stylesheet" href="zuno-room-realtime-v2.css?v=208"><link rel="stylesheet" href="zuno-room-voice-v2.css?v=208"><link rel="stylesheet" href="zuno-room-social-v2.css?v=208"><link rel="stylesheet" href="zuno-room-admin-activities-v2.css?v=208"><link rel="stylesheet" href="zuno-room-stability-v2.css?v=208"></head><body><div class="voice-app"><header class="voice-header"><button class="icon-btn" type="button" onclick="goBack()" aria-label="Voltar">‹</button><div class="voice-head-main"><div id="roomTitle" class="room-title">Abrindo sala...</div><div class="room-meta"><span id="roomStatus" class="room-status">● Inicializando...</span><span id="roomCategoryChip" class="room-chip">Sala</span><span>•</span><span id="roomCountText">0 pessoas</span><span id="voiceHealth" class="voice-health" data-state="connecting"><i class="voice-health-dot"></i><span>preparando voz</span></span></div></div><button id="peopleButton" class="icon-btn" type="button" aria-label="Participantes">•••</button></header><main class="voice-main"><section class="room-about"><div class="room-about-copy"><div id="roomDescription" class="room-description">Carregando informações...</div></div><span class="audience-pill">Audiência + Palco</span></section><section class="stage-card"><div class="stage-head"><span class="stage-label">PALCO DE VOZ</span><span class="stage-live">● AO VIVO</span></div><div id="roomStage" class="room-stage"></div></section><section class="audience-card"><div class="audience-head"><span class="audience-title">Audiência</span><span id="audienceCount" class="audience-sub">0 ouvindo</span></div><div id="audienceStrip" class="audience-strip"><div class="audience-sub">Carregando...</div></div></section><section class="room-feed"><div class="feed-head"><span class="feed-title">Conversa da sala</span><span class="feed-hint">desta entrada</span></div><div id="messages" class="messages"><div class="empty">Carregando conversa...</div></div></section></main><div class="voice-dock"><div class="stage-actions"><button id="stageAction" class="stage-action primary" type="button">Subir ao palco</button><button id="micAction" class="stage-action" type="button" hidden>Ativar mic</button></div><div class="composer"><form id="chatForm" class="chat-form"><input id="chatInput" class="chat-input" maxlength="500" autocomplete="off" placeholder="Conversar..."><button id="sendButton" class="send-button" type="submit">➤</button></form></div></div></div><div id="sheetBackdrop" class="sheet-backdrop" aria-hidden="true"><section class="members-sheet"><div class="sheet-handle"></div><div><b>Pessoas na sala</b> · <span id="sheetCount">0 participantes</span></div><div id="seatRequestsWrap" hidden><div class="sheet-section-title">Pedidos para subir</div><div id="seatRequests"></div></div><div class="sheet-section-title">Participantes</div><div id="members"><div class="empty">Carregando...</div></div><button id="leaveButton" class="leave-room" type="button">Sair da sala</button></section></div><div id="voiceAudioLayer" class="voice-audio-layer" aria-hidden="true"></div><script src="zuno-room-stage-v2.js?v=208"></script><script src="zuno-room-realtime-v2.js?v=208"></script><script src="zuno-room-voice-v2.js?v=208"></script><script src="zuno-room-social-v2.js?v=208"></script><script src="zuno-room-admin-activities-v2.js?v=208"></script><script src="zuno-room-stability-v2.js?v=208"></script></body></html>
