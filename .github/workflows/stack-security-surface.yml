name: Zuno Stack Security Surface

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*zuno_stack*.sql'
      - '.github/workflows/stack-security-surface.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*zuno_stack*.sql'
      - '.github/workflows/stack-security-surface.yml'

jobs:
  stack-security-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard public wrappers and privileged internals
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*zuno_stack*.sql)
          test ${#files[@]} -gt 0

          if grep -RIn --include='*zuno_stack*.sql' -E 'create[[:space:]]+or[[:space:]]+replace[[:space:]]+function[[:space:]]+public\.zuno_stack_[^(]+\([^;]*security[[:space:]]+definer' supabase/migrations; then
            echo 'Public Zuno Stack SECURITY DEFINER wrapper detected'
            exit 1
          fi

          required=(zuno_stack_apply_tile zuno_stack_apply_undo zuno_stack_relay_send zuno_stack_relay_take zuno_stack_pulse_shift zuno_stack_hint zuno_stack_power zuno_stack_gelo zuno_stack_desfazer)
          for fn in "${required[@]}"; do
            grep -Riq "function public\.${fn}" supabase/migrations || { echo "Missing public Stack RPC: $fn"; exit 1; }
          done

          for f in \
            supabase/migrations/20260830033601_server_authoritative_zuno_stack_hint.sql \
            supabase/migrations/20260830034500_server_authoritative_zuno_stack_fluxo_troca.sql \
            supabase/migrations/20260830040257_server_authoritative_zuno_stack_gelo.sql \
            supabase/migrations/20260830041009_server_authoritative_zuno_stack_desfazer.sql; do
            test -s "$f"
            grep -Eqi 'revoke[[:space:]]+(all|execute)[[:space:]]+on[[:space:]]+function[[:space:]]+public\.zuno_stack_' "$f" || { echo "public/anon revoke missing: $f"; exit 1; }
          done

          grep -Riq 'function zuno_private.zuno_stack_apply_tile_internal' supabase/migrations
          grep -Riq 'function zuno_private.zuno_stack_apply_undo_internal' supabase/migrations
          grep -Riq 'function zuno_private.zuno_stack_apply_relay_internal' supabase/migrations
          grep -Riq 'function zuno_private.zuno_stack_apply_pulse_shift_internal' supabase/migrations
          grep -Riq 'function zuno_private.zuno_stack_apply_hint_internal' supabase/migrations
          grep -Riq 'function zuno_private.zuno_stack_apply_power_internal' supabase/migrations
          grep -Riq 'function zuno_private.zuno_stack_apply_gelo_internal' supabase/migrations
          grep -Riq 'function zuno_private.zuno_stack_apply_desfazer_internal' supabase/migrations

          for f in \
            supabase/migrations/20260830033601_server_authoritative_zuno_stack_hint.sql \
            supabase/migrations/20260830035500_server_authoritative_zuno_stack_board_powers.sql \
            supabase/migrations/20260830040257_server_authoritative_zuno_stack_gelo.sql \
            supabase/migrations/20260830041009_server_authoritative_zuno_stack_desfazer.sql; do
            grep -q 'auth.uid()' "$f" || { echo "auth.uid guard missing: $f"; exit 1; }
            grep -q 'room_members' "$f" || { echo "room membership guard missing: $f"; exit 1; }
            grep -q 'owner_id' "$f" || { echo "room owner guard missing: $f"; exit 1; }
            grep -Eqi "set[[:space:]]+search_path[[:space:]]*=[[:space:]]*''" "$f" || { echo "fixed search_path missing: $f"; exit 1; }
          done

          reward_guard='supabase/migrations/20260830043411_block_client_zuno_stack_reward_state_mutation.sql'
          power_guard='supabase/migrations/20260830043810_block_client_zuno_stack_power_state_mutation.sql'
          timer_guard='supabase/migrations/20260830043900_block_client_zuno_stack_timer_state_mutation.sql'
          for f in "$reward_guard" "$power_guard" "$timer_guard"; do
            test -s "$f"
            grep -qi 'security invoker' "$f"
          done
          grep -q 'stack_server_reward_state_required' "$reward_guard"
          grep -q 'metaDone' "$reward_guard"
          grep -q 'comboRewards' "$reward_guard"
          grep -q 'metaSurgeUntil' "$reward_guard"
          grep -q 'trg_zuno_stack_reward_system_required' "$reward_guard"
          grep -q 'stack_server_power_state_required' "$power_guard"
          grep -q "serverPowers" "$power_guard"
          grep -q "selected" "$power_guard"
          grep -q "charges" "$power_guard"
          grep -q 'trg_zuno_stack_power_system_required' "$power_guard"
          grep -q 'stack_server_timer_state_required' "$timer_guard"
          grep -q "serverTimer" "$timer_guard"
          grep -q "deadlineAt" "$timer_guard"
          grep -q "freezeUntil" "$timer_guard"
          grep -q 'trg_zuno_stack_timer_system_required' "$timer_guard"

          echo 'Zuno Stack RPC security surface guarded'
