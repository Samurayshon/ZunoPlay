name: Preview Secret Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/ZUNOPLAY_PREVIEW_SECRETS.md'
      - 'scripts/vercel-preview-backend-guard.mjs'

jobs:
  secret-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -q 'ZUNO_SUPABASE_URL' docs/ZUNOPLAY_PREVIEW_SECRETS.md
          grep -q 'ZUNO_SUPABASE_PUBLISHABLE_KEY' docs/ZUNOPLAY_PREVIEW_SECRETS.md
          node scripts/vercel-preview-backend-guard.mjs --self-test
