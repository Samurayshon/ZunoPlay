name: Preview Branch Head Handling

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/ZUNOPLAY_PREVIEW_BRANCH_HEAD.md'

jobs:
  head-handling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -q 'não congela um SHA mutável' docs/ZUNOPLAY_PREVIEW_BRANCH_HEAD.md
