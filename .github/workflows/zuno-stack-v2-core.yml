name: Zuno Stack V2 Core

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/zuno-stack-v2/core/**'
      - 'tests/zuno-stack-v2-core-*.test.mjs'
      - 'docs/zuno-stack-v2/**'
      - '.github/workflows/zuno-stack-v2-core.yml'
  push:
    branches: [main]
    paths:
      - 'src/zuno-stack-v2/core/**'
      - 'tests/zuno-stack-v2-core-*.test.mjs'
      - 'docs/zuno-stack-v2/**'
      - '.github/workflows/zuno-stack-v2-core.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Core syntax
        run: |
          set -euo pipefail
          for file in src/zuno-stack-v2/core/*.mjs tests/zuno-stack-v2-core-*.test.mjs; do node --check "$file"; done
      - name: Validate Core behavior
        run: node tests/zuno-stack-v2-core-block1.test.mjs
      - name: Validate Core boundaries
        run: node tests/zuno-stack-v2-core-boundary.test.mjs
