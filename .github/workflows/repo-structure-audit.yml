name: ZunoPlay Repository Structure Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit repository references and duplicates
        run: node scripts/repo-audit.mjs
      - name: Inventory cleanup candidates
        run: node scripts/cleanup-candidates.mjs
