name: Android 0.0.0 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-v0/**'
      - '.github/workflows/android-v0-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-v0 assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-v0/app/build/outputs/apk/debug/app-debug.apk ZunoPlay-0.0.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZunoPlay-0.0.0-APK
          path: ZunoPlay-0.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
