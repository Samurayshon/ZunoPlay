name: Android APK

on:
  workflow_dispatch:
    inputs:
      release_authorization:
        description: 'Type PUBLICAR APK ZUNOPLAY to publish a GitHub Release'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - 'android-v0/**'
      - '.github/workflows/android-v0-build.yml'
  pull_request:
    paths:
      - 'android-v0/**'
      - '.github/workflows/android-v0-build.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android-v0 assembleDebug --stacktrace
      - name: Verify APK metadata and resolve version
        run: |
          APK='android-v0/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-v0/app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android-v0/app/build.gradle | head -n 1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee android-apk-badging.txt
          grep -q "package: name='com.zunoplay.app' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'" android-apk-badging.txt
          grep -q "application-label:'ZunoPlay'" android-apk-badging.txt
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=ZunoPlay-${VERSION_NAME}-debug.apk" >> "$GITHUB_ENV"
          cp "$APK" "ZunoPlay-${VERSION_NAME}-debug.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZunoPlay-${{ env.VERSION_NAME }}-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Stabilize Android emulator graphics
        run: |
          mkdir -p "$HOME/.android"
          cat > "$HOME/.android/advancedFeatures.ini" <<'EOF'
          Vulkan = off
          GLDirectMem = off
          EOF
          cat "$HOME/.android/advancedFeatures.ini"
      - name: Start independent Android host telemetry
        run: |
          : > android-runtime-monitor.txt
          : > android-emulator-crash-monitor.txt
          mkdir -p android-emulator-crash-evidence
          nohup bash -c '
            known_qemu=""
            find_real_qemu() {
              pgrep -f "^[^ ]*/qemu-system-x86_64-headless( |$)" | tr "\n" " " || true
            }
            while true; do
              {
                echo "===== $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
                free -m || true
                grep -E "^(MemTotal|MemFree|MemAvailable|SwapTotal|SwapFree):" /proc/meminfo || true
                for f in memory.current memory.max memory.high memory.events memory.events.local memory.swap.current memory.swap.max; do
                  p="/sys/fs/cgroup/$f"
                  if [ -r "$p" ]; then echo "--- $f ---"; cat "$p" || true; fi
                done
                echo "--- emulator/qemu/adb ---"
                ps -eo pid,ppid,state,%cpu,%mem,rss,vsz,etime,cmd | grep -E "[e]mulator|[q]emu|[a]db" || true
                current_qemu=$(find_real_qemu)
                if [ -n "$current_qemu" ]; then known_qemu="$current_qemu"; fi
                for p in $current_qemu; do
                  echo "--- /proc/$p/status ---"
                  grep -E "^(Name|State|VmPeak|VmSize|VmRSS|VmSwap|Threads):" "/proc/$p/status" 2>/dev/null || true
                done
                echo "--- kernel oom evidence ---"
                dmesg 2>/dev/null | tail -n 300 | grep -Ei "oom|out of memory|killed process|memory cgroup" || true
                echo
              } >> android-runtime-monitor.txt 2>&1
              current_qemu=$(find_real_qemu)
              if [ -n "$known_qemu" ] && [ -z "$current_qemu" ]; then
                {
                  echo "===== QEMU DISAPPEARED $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
                  echo "last-known-pids=$known_qemu"
                  echo "--- immediate qemu wait status ---"
                  for p in $known_qemu; do
                    if [ -r "/proc/$p/stat" ]; then
                      proc_stat=$(cat "/proc/$p/stat" 2>/dev/null || true)
                      echo "pid=$p"
                      echo "proc_stat=$proc_stat"
                      rest="${proc_stat##*) }"
                      read -r -a stat_fields <<< "$rest"
                      state="${stat_fields[0]:-unavailable}"
                      ppid="${stat_fields[1]:-unavailable}"
                      wait_status_raw="${stat_fields[49]:-}"
                      echo "ppid=$ppid"
                      echo "state=$state"
                      if [[ "$wait_status_raw" =~ ^[0-9]+$ ]]; then
                        echo "wait_status_raw=$wait_status_raw"
                        term_signal=$((wait_status_raw & 127))
                        if [ "$term_signal" -eq 0 ]; then
                          echo "wait_status_exited=true"
                          echo "wait_status_signaled=false"
                          echo "exit_status=$(((wait_status_raw >> 8) & 255))"
                          echo "term_signal=n/a"
                          echo "term_signal_name=n/a"
                          echo "core_dumped=false"
                        else
                          echo "wait_status_exited=false"
                          echo "wait_status_signaled=true"
                          echo "exit_status=n/a"
                          echo "term_signal=$term_signal"
                          echo "term_signal_name=$(kill -l "$term_signal" 2>/dev/null || echo unknown)"
                          if [ $((wait_status_raw & 128)) -ne 0 ]; then echo "core_dumped=true"; else echo "core_dumped=false"; fi
                        fi
                      else
                        echo "wait_status_raw=unavailable"
                        echo "wait_status_exited=unavailable"
                        echo "wait_status_signaled=unavailable"
                        echo "exit_status=unavailable"
                        echo "term_signal=unavailable"
                        echo "term_signal_name=unavailable"
                        echo "core_dumped=unavailable"
                      fi
                    else
                      echo "pid=$p proc_stat=unavailable (already reaped)"
                      echo "ppid=unavailable"
                      echo "state=unavailable"
                      echo "wait_status_raw=unavailable"
                      echo "wait_status_exited=unavailable"
                      echo "wait_status_signaled=unavailable"
                      echo "exit_status=unavailable"
                      echo "term_signal=unavailable"
                      echo "term_signal_name=unavailable"
                      echo "core_dumped=unavailable"
                    fi
                  done
                  echo "--- ps ---"
                  ps -eo pid,ppid,state,%cpu,%mem,rss,vsz,etime,cmd | grep -E "[e]mulator|[q]emu|[a]db" || true
                  echo "--- kernel messages ---"
                  dmesg 2>/dev/null | tail -n 1000 || true
                  echo "--- journal kernel ---"
                  journalctl -k --no-pager -n 1000 2>/dev/null || true
                  echo "--- crash-related files ---"
                  find "$HOME/.android" /tmp "${ANDROID_HOME:-/opt/android-sdk}" -maxdepth 8 -type f \
                    \( -iname "*emu-crash*" -o -iname "*.dmp" -o -iname "*crashpad*" -o -iname "core" -o -iname "core.*" -o -iname "*qemu*.log" -o -iname "*emulator*.log" \) \
                    -printf "%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n" 2>/dev/null | sort || true
                } >> android-emulator-crash-monitor.txt 2>&1
                find "$HOME/.android" /tmp "${ANDROID_HOME:-/opt/android-sdk}" -maxdepth 8 -type f \
                  \( -iname "*emu-crash*" -o -iname "*.dmp" -o -iname "*crashpad*" -o -iname "core" -o -iname "core.*" -o -iname "*qemu*.log" -o -iname "*emulator*.log" \) \
                  -print0 2>/dev/null | while IFS= read -r -d "" f; do
                    rel=$(printf "%s" "$f" | sed "s#^/##; s#[^A-Za-z0-9._-]#_#g")
                    cp -a "$f" "android-emulator-crash-evidence/$rel" 2>/dev/null || true
                  done
                known_qemu=""
              fi
              sleep 2
            done
          ' >/dev/null 2>&1 &
          echo $! > android-runtime-monitor.pid
      - name: Runtime smoke test on Android 14
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-build: 15507667
          disable-animations: true
          emulator-options: -no-window -gpu software -memory 2048
          script: bash android-v0/ci/runtime-smoke.sh
      - name: Stop independent Android host telemetry
        if: always()
        run: |
          if [ -s android-runtime-monitor.pid ]; then kill "$(cat android-runtime-monitor.pid)" >/dev/null 2>&1 || true; fi
          {
            echo "===== FINAL CRASH EVIDENCE $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
            find "$HOME/.android" /tmp "${ANDROID_HOME:-/opt/android-sdk}" -maxdepth 8 -type f \
              \( -iname "*emu-crash*" -o -iname "*.dmp" -o -iname "*crashpad*" -o -iname "core" -o -iname "core.*" -o -iname "*qemu*.log" -o -iname "*emulator*.log" \) \
              -printf "%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n" 2>/dev/null | sort || true
            echo "--- kernel messages ---"
            dmesg 2>/dev/null | tail -n 1000 || true
            echo "--- journal kernel ---"
            journalctl -k --no-pager -n 1000 2>/dev/null || true
          } >> android-emulator-crash-monitor.txt 2>&1
          find "$HOME/.android" /tmp "${ANDROID_HOME:-/opt/android-sdk}" -maxdepth 8 -type f \
            \( -iname "*emu-crash*" -o -iname "*.dmp" -o -iname "*crashpad*" -o -iname "core" -o -iname "core.*" -o -iname "*qemu*.log" -o -iname "*emulator*.log" \) \
            -print0 2>/dev/null | while IFS= read -r -d '' f; do
              rel=$(printf '%s' "$f" | sed 's#^/##; s#[^A-Za-z0-9._-]#_#g')
              cp -a "$f" "android-emulator-crash-evidence/$rel" 2>/dev/null || true
            done
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZunoPlay-android-runtime-diagnostics
          path: |
            android-apk-badging.txt
            android-runtime-logcat.txt
            android-runtime-host.txt
            android-runtime-monitor.txt
            android-emulator-crash-monitor.txt
            android-emulator-crash-evidence/
            android-package.txt
            android-activities.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Publish APK release
        if: github.event_name == 'workflow_dispatch' && inputs.release_authorization == 'PUBLICAR APK ZUNOPLAY'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" --target "$GITHUB_SHA" --title "ZunoPlay Android ${VERSION_NAME}" --notes "APK Android de teste. Build, metadados, safe areas e smoke test de runtime em Android 14 validados pelo CI antes da publicação."
          fi
