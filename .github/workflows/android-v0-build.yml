name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-v0/**'
      - '.github/workflows/android-v0-build.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-v0 assembleDebug --stacktrace

      - name: Verify APK metadata
        run: |
          APK='android-v0/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee android-apk-badging.txt
          grep -q "package: name='com.zunoplay.app' versionCode='4' versionName='0.0.3'" android-apk-badging.txt
          grep -q "application-label:'ZunoPlay'" android-apk-badging.txt

      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Runtime smoke test on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            set -eu
            APK='android-v0/app/build/outputs/apk/debug/app-debug.apk'
            adb install -r "$APK"
            adb logcat -c

            for ATTEMPT in 1 2 3; do
              adb shell am force-stop com.zunoplay.app
              START_OUTPUT="$(adb shell am start -W -n com.zunoplay.app/.MainActivity | tr -d '\r')"
              echo "$START_OUTPUT"
              echo "$START_OUTPUT" | grep -q 'Status: ok'
              sleep 8
              PID="$(adb shell pidof com.zunoplay.app | tr -d '\r' || true)"
              test -n "$PID"
            done

            adb shell input keyevent 223
            sleep 3
            test -n "$(adb shell pidof com.zunoplay.app | tr -d '\r' || true)"
            adb shell input keyevent 224
            adb shell wm dismiss-keyguard || true
            sleep 5
            test -n "$(adb shell pidof com.zunoplay.app | tr -d '\r' || true)"

            adb logcat -d -v threadtime > android-runtime-logcat.txt
            adb shell dumpsys package com.zunoplay.app > android-package.txt
            adb shell dumpsys activity activities > android-activities.txt

            python3 - <<'PY'
            from pathlib import Path
            log = Path('android-runtime-logcat.txt').read_text(errors='replace')
            blocks = log.split('FATAL EXCEPTION')
            fatal_for_app = any('Process: com.zunoplay.app' in block[:4000] for block in blocks[1:])
            if fatal_for_app:
                raise SystemExit('Fatal ZunoPlay process crash detected in logcat.')
            PY

            test -n "$(adb shell pidof com.zunoplay.app | tr -d '\r' || true)"

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZunoPlay-android-runtime-diagnostics
          path: |
            android-apk-badging.txt
            android-runtime-logcat.txt
            android-package.txt
            android-activities.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Resolve APK version
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-v0/app/build.gradle | head -n 1)
          test -n "$VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=ZunoPlay-${VERSION_NAME}-debug.apk" >> "$GITHUB_ENV"
          cp android-v0/app/build/outputs/apk/debug/app-debug.apk "ZunoPlay-${VERSION_NAME}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZunoPlay-${{ env.VERSION_NAME }}-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" --target "$GITHUB_SHA" --title "ZunoPlay Android ${VERSION_NAME}" --notes "APK Android de teste. Build, metadados e smoke test de runtime em Android 14 validados pelo CI antes da publicação."
          fi

# runtime-validation-trigger
