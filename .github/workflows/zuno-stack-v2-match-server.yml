name: Zuno Stack V2 Match Server

on:
  push:
    branches:
      - 'codex/zuno-stack-v2-phase-4-*'
  pull_request:
    paths:
      - 'src/zuno-stack-v2/**'
      - 'tests/zuno-stack-v2-*.test.mjs'
      - '.github/workflows/zuno-stack-v2-match-server.yml'

jobs:
  match-server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate V2 syntax
        run: |
          node --check src/zuno-stack-v2/server/match-protocol.mjs
          node --check src/zuno-stack-v2/server/authoritative-match-engine.mjs
      - name: Validate frozen Core Solo and Match Server
        run: node --test tests/zuno-stack-v2-core-*.test.mjs tests/zuno-stack-v2-solo-*.test.mjs tests/zuno-stack-v2-match-*.test.mjs
