name: Private Helper Security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/private-helper-identity-guard.test.mjs
      - run: node scripts/supabase-migration-reconciliation.mjs --strict
