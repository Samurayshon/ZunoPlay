name: Android Phase 2 APK Validation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mobile-scroll-p1-phase2-v350
    paths:
      - '.github/workflows/android-v0-phase2-validation.yml'

permissions:
  contents: read

jobs:
  validate-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Phase 2 SHA
        uses: actions/checkout@v4
        with:
          ref: 214010598fdf6fabc3bffd31a35f0381cdf449da
          persist-credentials: false

      - name: Prove checked out SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "214010598fdf6fabc3bffd31a35f0381cdf449da"
          git rev-parse HEAD

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-v0 assembleDebug --stacktrace

      - name: Verify APK metadata and provenance
        shell: bash
        run: |
          set -euo pipefail
          APK='android-v0/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          test "$(git rev-parse HEAD)" = "214010598fdf6fabc3bffd31a35f0381cdf449da"
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-v0/app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android-v0/app/build.gradle | head -n 1)
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee android-apk-badging.txt
          grep -q "package: name='com.zunoplay.app' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'" android-apk-badging.txt
          grep -q "application-label:'ZunoPlay'" android-apk-badging.txt
          echo "source_sha=$(git rev-parse HEAD)"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          cp "$APK" "ZunoPlay-${VERSION_NAME}-debug.apk"
          echo "APK_NAME=ZunoPlay-${VERSION_NAME}-debug.apk" >> "$GITHUB_ENV"

      - name: Upload validation APK artifact only
        uses: actions/upload-artifact@v4
        with:
          name: ZunoPlay-${{ env.VERSION_NAME }}-Phase2-SHA-214010598-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Prepare repaired host-isolation probe
        shell: bash
        run: |
          cat > /tmp/zunoplay-host-probe.sh <<'BASH'
          #!/usr/bin/env bash
          set -uo pipefail

          MODE="${1:?control|host-blocked}"
          APK='android-v0/app/build/outputs/apk/debug/app-debug.apk'
          PACKAGE='com.zunoplay.app'
          ACTIVITY='com.zunoplay.app/.MainActivity'
          HOST='samurayshon.github.io'
          GENERAL_HOST='example.com'
          PREFIX="android-host-${MODE}"
          TRACE="${PREFIX}-trace.txt"
          LIVE="${PREFIX}-liveness.txt"
          LOGCAT="${PREFIX}-logcat-continuous.txt"
          WEBVIEW="${PREFIX}-webview-state.txt"
          NETWORK="${PREFIX}-network-state.txt"
          METHOD_FILE='android-host-connectivity-method.txt'
          LOGCAT_PID=''
          BLOCKED_V4=''
          BLOCKED_V6=''

          trace(){ printf '%s | %s\n' "$(date -u +%FT%TZ)" "$*" | tee -a "$TRACE"; }

          cleanup(){
            [[ -n "$LOGCAT_PID" ]] && kill "$LOGCAT_PID" >/dev/null 2>&1 || true
            for ip in $BLOCKED_V4; do sudo iptables -D OUTPUT -d "$ip" -j REJECT >/dev/null 2>&1 || true; done
            for ip in $BLOCKED_V6; do sudo ip6tables -D OUTPUT -d "$ip" -j REJECT >/dev/null 2>&1 || true; done
          }
          trap cleanup EXIT

          qemu_ok(){ pgrep -af 'qemu-system|emulator.*-avd' >/dev/null 2>&1; }
          port_ok(){ ss -ltn 2>/dev/null | grep -qE ':5554\b'; }
          getstate_ok(){ timeout 5s adb get-state >/dev/null 2>&1; }
          devices_ok(){ timeout 5s adb devices -l 2>/dev/null | grep -qE '^emulator-[0-9]+[[:space:]]+device\b'; }
          shell_ok(){ timeout 5s adb shell true >/dev/null 2>&1; }

          probe(){
            local label="$1" q=0 p=0 g=0 d=0 s=0
            qemu_ok && q=1 || true
            port_ok && p=1 || true
            getstate_ok && g=1 || true
            devices_ok && d=1 || true
            shell_ok && s=1 || true
            printf '%s | %s qemu=%s port5554=%s get_state=%s devices=%s shell=%s\n' "$(date -u +%FT%TZ)" "$label" "$q" "$p" "$g" "$d" "$s" | tee -a "$LIVE"
          }

          webview(){
            local label="$1"
            {
              echo "=== $(date -u +%FT%TZ) $label ==="
              timeout 4s adb shell dumpsys webviewupdate 2>&1 || true
              timeout 4s adb shell ps -A 2>&1 | grep -Ei 'webview|chromium|sandboxed_process|com.google.android.webview|com.zunoplay.app' || true
            } >> "$WEBVIEW"
          }

          hoststate(){
            local label="$1"
            local out="${PREFIX}-host-${label}.txt"
            {
              echo '=== UTC ==='; date -u
              echo '=== qemu ==='; pgrep -af 'qemu-system|emulator.*-avd' || true
              echo '=== listeners ==='; ss -ltnp 2>/dev/null | grep -E ':(5037|5554)\b' || true
              echo '=== adb ==='; timeout 5s adb devices -l || true
              echo '=== adb get-state ==='; timeout 5s adb get-state || true
              echo '=== adb shell ==='; timeout 5s adb shell true; echo "exit=$?"
              echo '=== coredumps ==='; coredumpctl --no-pager list 2>&1 | tail -n 80 || true
              echo '=== qemu coredump ==='; coredumpctl --no-pager info qemu-system-x86_64-headless 2>&1 | tail -n 180 || true
            } > "$out" 2>&1
          }

          guest_has(){ timeout 5s adb shell "command -v $1" >/dev/null 2>&1; }

          connectivity_probe(){
            local method="$1" host="$2"
            case "$method" in
              curl_https)
                timeout 12s adb shell curl -fsS --connect-timeout 5 --max-time 8 "https://${host}/" >/dev/null 2>&1
                ;;
              wget_https)
                timeout 12s adb shell wget -q -T 8 -O /dev/null "https://${host}/" >/dev/null 2>&1
                ;;
              toybox_wget_https)
                timeout 12s adb shell toybox wget -q -T 8 -O /dev/null "https://${host}/" >/dev/null 2>&1
                ;;
              ping)
                timeout 10s adb shell ping -c 1 -W 5 "$host" >/dev/null 2>&1
                ;;
              *)
                return 2
                ;;
            esac
          }

          select_connectivity_method(){
            local method
            for method in curl_https wget_https toybox_wget_https ping; do
              case "$method" in
                curl_https) guest_has curl || continue ;;
                wget_https) guest_has wget || continue ;;
                toybox_wget_https) timeout 5s adb shell toybox --help 2>&1 | grep -qw wget || continue ;;
                ping) guest_has ping || continue ;;
              esac
              trace "connectivity candidate=$method general=${GENERAL_HOST}"
              connectivity_probe "$method" "$GENERAL_HOST" || continue
              trace "connectivity candidate=$method target=${HOST}"
              connectivity_probe "$method" "$HOST" || continue
              printf '%s\n' "$method" > "$METHOD_FILE"
              trace "connectivity method validated=$method (general+target both reachable in CONTROL)"
              return 0
            done
            trace 'INSTRUMENTATION INVALID: no guest connectivity method could prove both general internet and target reachability'
            return 1
          }

          network_check(){
            local label="$1" method="${2:-}"
            {
              echo "=== $(date -u +%FT%TZ) $label ==="
              echo '--- guest route ---'; timeout 5s adb shell ip route 2>&1 || true
              echo '--- connectivity capabilities ---'
              timeout 5s adb shell 'command -v curl; command -v wget; command -v ping; toybox --help 2>&1 | head -n 5' 2>&1 || true
              echo "--- method=${method:-none} general=${GENERAL_HOST} ---"
              if [[ -n "$method" ]]; then connectivity_probe "$method" "$GENERAL_HOST"; echo "exit=$?"; fi
              echo "--- method=${method:-none} target=${HOST} ---"
              if [[ -n "$method" ]]; then connectivity_probe "$method" "$HOST"; echo "exit=$?"; fi
              echo '--- host resolved target ---'; getent ahosts "$HOST" 2>&1 || true
              echo '--- iptables target rules ---'; sudo iptables -S OUTPUT 2>&1 | grep -F "$HOST" || true
            } >> "$NETWORK" 2>&1
          }

          trace "BEGIN mode=$MODE exact APK SHA 214010598fdf6fabc3bffd31a35f0381cdf449da"
          grep -E 'Pkg.Revision|Pkg.Path' "${ANDROID_HOME}/emulator/source.properties" | tee "${PREFIX}-emulator-version.txt"
          grep -q 'Pkg.Revision *= *36\.5\.11' "${PREFIX}-emulator-version.txt"
          timeout 30s adb wait-for-device
          timeout 10s adb shell true
          adb install -r "$APK" | tee -a "$TRACE"
          probe pre-network

          METHOD=''
          if [[ "$MODE" == 'control' ]]; then
            if ! select_connectivity_method; then
              network_check control-instrumentation-invalid ''
              hoststate control-instrumentation-invalid
              exit 140
            fi
            METHOD="$(cat "$METHOD_FILE")"
            network_check control-prelaunch "$METHOD"
            connectivity_probe "$METHOD" "$GENERAL_HOST" || { trace 'INSTRUMENTATION INVALID: CONTROL general internet not reachable'; exit 141; }
            connectivity_probe "$METHOD" "$HOST" || { trace 'INSTRUMENTATION INVALID: CONTROL target not reachable'; exit 142; }
            trace "CONTROL PRECONDITION PASS method=$METHOD general=reachable target=reachable"
          else
            [[ -s "$METHOD_FILE" ]] || { trace 'INSTRUMENTATION INVALID: validated CONTROL method file missing'; hoststate method-missing; exit 143; }
            METHOD="$(cat "$METHOD_FILE")"
            connectivity_probe "$METHOD" "$GENERAL_HOST" || { trace 'INSTRUMENTATION INVALID: HOST-BLOCKED general internet not reachable before filtering'; network_check blocked-before-filter-invalid "$METHOD"; exit 144; }
            connectivity_probe "$METHOD" "$HOST" || { trace 'INSTRUMENTATION INVALID: HOST-BLOCKED target not reachable before filtering'; network_check blocked-before-filter-invalid "$METHOD"; exit 145; }

            mapfile -t V4 < <(getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u)
            mapfile -t V6 < <(getent ahostsv6 "$HOST" | awk '{print $1}' | sort -u)
            ((${#V4[@]} > 0)) || { trace 'INSTRUMENTATION INVALID: no IPv4 addresses resolved'; exit 146; }
            for ip in "${V4[@]}"; do sudo iptables -I OUTPUT 1 -d "$ip" -j REJECT; BLOCKED_V4+=" $ip"; done
            for ip in "${V6[@]}"; do sudo ip6tables -I OUTPUT 1 -d "$ip" -j REJECT 2>/dev/null && BLOCKED_V6+=" $ip" || true; done
            trace "HOST-BLOCKED rules installed IPv4:${BLOCKED_V4} IPv6:${BLOCKED_V6}"
            network_check blocked-prelaunch "$METHOD"

            GENERAL_STATUS=0
            TARGET_STATUS=0
            connectivity_probe "$METHOD" "$GENERAL_HOST" || GENERAL_STATUS=$?
            connectivity_probe "$METHOD" "$HOST" || TARGET_STATUS=$?
            trace "HOST-BLOCKED prelaunch proof method=$METHOD general_status=$GENERAL_STATUS target_status=$TARGET_STATUS"
            if [[ "$GENERAL_STATUS" -ne 0 || "$TARGET_STATUS" -eq 0 ]]; then
              trace 'INSTRUMENTATION INVALID: required general=reachable and target=blocked precondition not demonstrated; APK launch skipped'
              hoststate blocked-precondition-invalid
              exit 147
            fi
            trace "HOST-BLOCKED PRECONDITION PASS method=$METHOD general=reachable target=blocked"
          fi

          adb logcat -c || true
          adb logcat -v threadtime > "$LOGCAT" 2>&1 & LOGCAT_PID=$!
          webview before-launch
          probe before-launch
          timeout 10s adb shell am force-stop "$PACKAGE"
          set +e
          START_OUTPUT="$(timeout 30s adb shell am start -W -n "$ACTIVITY" 2>&1 | tr -d '\r')"
          START_STATUS=$?
          set -e
          printf '%s\n' "$START_OUTPUT" | tee -a "$TRACE"
          trace "am-start exit=$START_STATUS"
          probe immediately-after-launch
          webview immediately-after-launch

          FREEZE=0
          for SECOND in $(seq 1 20); do
            sleep 1
            probe "post-launch-${SECOND}s"
            webview "post-launch-${SECOND}s"
            if ! shell_ok; then
              FREEZE=1
              trace "freeze detected at iteration=${SECOND}; host/QEMU/ADB evidence captured independently"
              hoststate "freeze-${SECOND}s"
              break
            fi
          done

          sleep 2
          probe final
          webview final
          network_check final "$METHOD"
          hoststate final
          tar -czf "${PREFIX}-crashdata.tgz" /tmp/android-runner 2>/dev/null || true
          if shell_ok; then timeout 10s adb logcat -d -v threadtime > "${PREFIX}-logcat-snapshot.txt" || true; fi

          [[ "$START_STATUS" -eq 0 ]] || exit 120
          grep -q 'Status: ok' <<< "$START_OUTPUT" || exit 121
          [[ "$FREEZE" -eq 0 ]] || exit 122
          trace "RESULT stable-for-20s mode=$MODE"
          BASH
          chmod +x /tmp/zunoplay-host-probe.sh
          bash -n /tmp/zunoplay-host-probe.sh

      - name: CONTROL ONLINE - validate connectivity then probe
        id: control_probe
        continue-on-error: true
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-build: '15261927'
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash /tmp/zunoplay-host-probe.sh control

      - name: HOST-BLOCKED - require valid isolation then probe
        id: blocked_probe
        continue-on-error: true
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-build: '15261927'
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash /tmp/zunoplay-host-probe.sh host-blocked

      - name: Record matrix outcomes
        if: always()
        shell: bash
        run: |
          printf 'control=%s\nhost_blocked=%s\n' '${{ steps.control_probe.outcome }}' '${{ steps.blocked_probe.outcome }}' | tee android-host-matrix-outcomes.txt
          if [ -s android-host-connectivity-method.txt ]; then
            printf 'connectivity_method=%s\n' "$(cat android-host-connectivity-method.txt)" | tee -a android-host-matrix-outcomes.txt
          else
            echo 'connectivity_method=UNVALIDATED' | tee -a android-host-matrix-outcomes.txt
          fi

      - name: Enforce probe execution
        shell: bash
        run: |
          CONTROL='${{ steps.control_probe.outcome }}'
          BLOCKED='${{ steps.blocked_probe.outcome }}'
          echo "control=$CONTROL host_blocked=$BLOCKED"
          if grep -Rqs 'INSTRUMENTATION INVALID' android-host-*-trace.txt 2>/dev/null; then
            echo 'Host isolation instrumentation was invalid; no product conclusion is allowed.' >&2
            exit 2
          fi
          if [ "$CONTROL" = success ] && [ "$BLOCKED" = success ]; then exit 0; fi
          echo 'At least one valid host-isolation runtime probe failed; inspect diagnostics.' >&2
          exit 1

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZunoPlay-Phase2-android-runtime-diagnostics
          path: |
            android-apk-badging.txt
            android-host-connectivity-method.txt
            android-host-matrix-outcomes.txt
            android-host-*.txt
            android-host-*.tgz
          if-no-files-found: warn
          retention-days: 7
