name: Android Phase 2 APK Validation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mobile-scroll-p1-phase2-v350
    paths:
      - '.github/workflows/android-v0-phase2-validation.yml'

permissions:
  contents: read

jobs:
  validate-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact Phase 2 SHA
        uses: actions/checkout@v4
        with:
          ref: 214010598fdf6fabc3bffd31a35f0381cdf449da
          persist-credentials: false

      - name: Prove checked out SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "214010598fdf6fabc3bffd31a35f0381cdf449da"
          git rev-parse HEAD

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-v0 assembleDebug --stacktrace

      - name: Verify APK metadata and provenance
        shell: bash
        run: |
          set -euo pipefail
          APK='android-v0/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"

          test "$(git rev-parse HEAD)" = "214010598fdf6fabc3bffd31a35f0381cdf449da"
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-v0/app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android-v0/app/build.gradle | head -n 1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee android-apk-badging.txt
          grep -q "package: name='com.zunoplay.app' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'" android-apk-badging.txt
          grep -q "application-label:'ZunoPlay'" android-apk-badging.txt

          echo "source_sha=$(git rev-parse HEAD)"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=ZunoPlay-${VERSION_NAME}-debug.apk" >> "$GITHUB_ENV"
          cp "$APK" "ZunoPlay-${VERSION_NAME}-debug.apk"

      - name: Upload validation APK artifact only
        uses: actions/upload-artifact@v4
        with:
          name: ZunoPlay-${{ env.VERSION_NAME }}-Phase2-SHA-214010598-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Prepare instrumented smoke wrapper
        shell: bash
        run: |
          cat > /tmp/zunoplay-phase2-smoke-wrapper.sh <<'BASH'
          #!/usr/bin/env bash
          set -uo pipefail

          CI_ATTEMPT="${CI_ATTEMPT:-1}"
          STATE_PREFIX="android-emulator-attempt-${CI_ATTEMPT}"

          capture_state() {
            local LABEL="$1"
            local OUT="${STATE_PREFIX}-${LABEL}.txt"
            {
              echo '=== UTC ==='
              date -u
              echo '=== memory ==='
              free -m || true
              echo '=== disk ==='
              df -h || true
              echo '=== emulator version ==='
              emulator -version 2>&1 | head -n 8 || true
              echo '=== emulator/qemu processes ==='
              pgrep -af 'emulator|qemu' || true
              echo '=== listeners 5037/5554 ==='
              ss -ltnp 2>/dev/null | grep -E ':(5037|5554)\b' || true
              echo '=== adb devices ==='
              timeout 10s adb devices -l || true
              echo '=== kernel tail ==='
              dmesg --ctime 2>&1 | tail -n 80 || true
              echo '=== coredump list ==='
              coredumpctl --no-pager list 2>&1 | tail -n 80 || true
            } > "$OUT"
          }

          archive_crash_data() {
            local LABEL="$1"
            tar -czf "${STATE_PREFIX}-${LABEL}-crashdata.tgz" /tmp/android-runner 2>/dev/null || true
          }

          monitor_emulator() {
            local SEEN=0
            while true; do
              if pgrep -af 'emulator.*-avd|qemu-system' >/dev/null 2>&1; then
                SEEN=1
              elif [ "$SEEN" -eq 1 ]; then
                echo "Emulator process disappeared at $(date -u +%FT%TZ)" > "${STATE_PREFIX}-process-exit.txt"
                capture_state 'process-exit'
                archive_crash_data 'process-exit'
                return 0
              fi
              sleep 1
            done
          }

          wait_for_adb() {
            local RECOVERY_ATTEMPT
            for RECOVERY_ATTEMPT in 1 2 3; do
              echo "ADB readiness attempt ${RECOVERY_ATTEMPT}/3"
              adb start-server || true
              adb reconnect offline || true
              if timeout 30s adb wait-for-device; then
                if timeout 10s adb shell true >/dev/null 2>&1; then
                  echo "ADB transport is ready."
                  return 0
                fi
              fi
              echo "ADB transport not ready after bounded wait."
              adb kill-server || true
              sleep 3
            done
            return 1
          }

          echo "Phase 2 runtime smoke environment attempt ${CI_ATTEMPT}/2"
          if ! wait_for_adb; then
            echo "ADB device was not ready within the bounded window." >&2
            capture_state 'adb-not-ready'
            archive_crash_data 'adb-not-ready'
            exit 124
          fi

          capture_state 'before-smoke'
          monitor_emulator &
          MONITOR_PID=$!

          set +e
          timeout 180s bash android-v0/ci/runtime-smoke.sh > "android-smoke-attempt-${CI_ATTEMPT}.txt" 2>&1
          STATUS=$?
          set -e

          kill "$MONITOR_PID" >/dev/null 2>&1 || true
          wait "$MONITOR_PID" 2>/dev/null || true
          capture_state 'after-smoke'
          archive_crash_data 'after-smoke'
          cat "android-smoke-attempt-${CI_ATTEMPT}.txt" || true
          exit "$STATUS"
          BASH
          chmod +x /tmp/zunoplay-phase2-smoke-wrapper.sh
          bash -n /tmp/zunoplay-phase2-smoke-wrapper.sh

      - name: Runtime smoke Android 14 - GPU off
        id: smoke_gpu_off
        continue-on-error: true
        timeout-minutes: 6
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu off
          script: CI_ATTEMPT=1 bash /tmp/zunoplay-phase2-smoke-wrapper.sh

      - name: Runtime smoke Android 14 - SwiftShader baseline
        id: smoke_swiftshader
        if: steps.smoke_gpu_off.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 6
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: CI_ATTEMPT=2 bash /tmp/zunoplay-phase2-smoke-wrapper.sh

      - name: Enforce runtime smoke result
        shell: bash
        run: |
          echo "gpu_off=${{ steps.smoke_gpu_off.outcome }}"
          echo "swiftshader=${{ steps.smoke_swiftshader.outcome }}"
          if [ "${{ steps.smoke_gpu_off.outcome }}" = 'success' ] || [ "${{ steps.smoke_swiftshader.outcome }}" = 'success' ]; then
            exit 0
          fi
          echo 'Both emulator environment smoke attempts failed.' >&2
          exit 1

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZunoPlay-Phase2-android-runtime-diagnostics
          path: |
            android-apk-badging.txt
            android-runtime-logcat.txt
            android-package.txt
            android-activities.txt
            android-smoke-attempt-*.txt
            android-emulator-attempt-*.txt
            android-emulator-attempt-*.tgz
          if-no-files-found: warn
          retention-days: 7
