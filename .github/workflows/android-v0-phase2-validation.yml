name: Android Phase 2 APK Validation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mobile-scroll-p1-phase2-v350
    paths:
      - '.github/workflows/android-v0-phase2-validation.yml'

permissions:
  contents: read

jobs:
  validate-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Phase 2 SHA
        uses: actions/checkout@v4
        with:
          ref: 214010598fdf6fabc3bffd31a35f0381cdf449da
          persist-credentials: false

      - name: Prove checked out SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "214010598fdf6fabc3bffd31a35f0381cdf449da"
          git rev-parse HEAD

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-v0 assembleDebug --stacktrace

      - name: Verify APK metadata and provenance
        shell: bash
        run: |
          set -euo pipefail
          APK='android-v0/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          test "$(git rev-parse HEAD)" = "214010598fdf6fabc3bffd31a35f0381cdf449da"
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-v0/app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android-v0/app/build.gradle | head -n 1)
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee android-apk-badging.txt
          grep -q "package: name='com.zunoplay.app' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'" android-apk-badging.txt
          grep -q "application-label:'ZunoPlay'" android-apk-badging.txt
          echo "source_sha=$(git rev-parse HEAD)"
          echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          cp "$APK" "ZunoPlay-${VERSION_NAME}-debug.apk"
          echo "APK_NAME=ZunoPlay-${VERSION_NAME}-debug.apk" >> "$GITHUB_ENV"

      - name: Upload validation APK artifact only
        uses: actions/upload-artifact@v4
        with:
          name: ZunoPlay-${{ env.VERSION_NAME }}-Phase2-SHA-214010598-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Prepare runner-observed network isolation probe
        shell: bash
        run: |
          cat > /tmp/zunoplay-proxy.py <<'PY'
          import argparse
          import asyncio
          from datetime import datetime, timezone

          parser = argparse.ArgumentParser()
          parser.add_argument('--mode', choices=['control', 'host-blocked'], required=True)
          parser.add_argument('--port', type=int, default=8899)
          parser.add_argument('--log', required=True)
          args = parser.parse_args()

          TARGET = 'samurayshon.github.io'

          def log(message):
              stamp = datetime.now(timezone.utc).isoformat()
              with open(args.log, 'a', encoding='utf-8') as fh:
                  fh.write(f'{stamp} | {message}\n')
                  fh.flush()

          async def tunnel(reader_a, writer_a, reader_b, writer_b):
              async def pump(reader, writer):
                  try:
                      while True:
                          data = await reader.read(65536)
                          if not data:
                              break
                          writer.write(data)
                          await writer.drain()
                  except Exception:
                      pass
                  finally:
                      try:
                          writer.close()
                      except Exception:
                          pass
              await asyncio.gather(
                  pump(reader_a, writer_b),
                  pump(reader_b, writer_a),
                  return_exceptions=True,
              )

          async def handle(client_reader, client_writer):
              peer = client_writer.get_extra_info('peername')
              try:
                  first = await asyncio.wait_for(client_reader.readline(), timeout=10)
                  if not first:
                      client_writer.close()
                      return
                  line = first.decode('latin1', 'replace').strip()
                  parts = line.split()
                  if len(parts) < 2:
                      log(f'INVALID peer={peer} line={line!r}')
                      client_writer.close()
                      return
                  method, target = parts[0].upper(), parts[1]
                  headers = []
                  while True:
                      raw = await asyncio.wait_for(client_reader.readline(), timeout=10)
                      if not raw or raw in (b'\r\n', b'\n'):
                          break
                      headers.append(raw)

                  if method == 'CONNECT':
                      host, _, port_text = target.rpartition(':')
                      if not host:
                          host, port_text = target, '443'
                      port = int(port_text or '443')
                      blocked = args.mode == 'host-blocked' and host.lower() == TARGET
                      if blocked:
                          log(f'CONNECT BLOCK peer={peer} host={host} port={port}')
                          client_writer.write(b'HTTP/1.1 403 Forbidden\r\nConnection: close\r\n\r\n')
                          await client_writer.drain()
                          client_writer.close()
                          return
                      try:
                          upstream_reader, upstream_writer = await asyncio.wait_for(
                              asyncio.open_connection(host, port), timeout=10
                          )
                      except Exception as exc:
                          log(f'CONNECT UPSTREAM_FAIL peer={peer} host={host} port={port} error={type(exc).__name__}:{exc}')
                          client_writer.write(b'HTTP/1.1 502 Bad Gateway\r\nConnection: close\r\n\r\n')
                          await client_writer.drain()
                          client_writer.close()
                          return
                      log(f'CONNECT ALLOW peer={peer} host={host} port={port}')
                      client_writer.write(b'HTTP/1.1 200 Connection Established\r\n\r\n')
                      await client_writer.drain()
                      await tunnel(client_reader, client_writer, upstream_reader, upstream_writer)
                      return

                  log(f'HTTP UNSUPPORTED peer={peer} method={method} target={target}')
                  client_writer.write(b'HTTP/1.1 501 Not Implemented\r\nConnection: close\r\n\r\n')
                  await client_writer.drain()
                  client_writer.close()
              except Exception as exc:
                  log(f'CLIENT_ERROR peer={peer} error={type(exc).__name__}:{exc}')
                  try:
                      client_writer.close()
                  except Exception:
                      pass

          async def main():
              server = await asyncio.start_server(handle, '0.0.0.0', args.port)
              log(f'PROXY_READY mode={args.mode} port={args.port} target={TARGET}')
              async with server:
                  await server.serve_forever()

          asyncio.run(main())
          PY

          cat > /tmp/NetProbe.java <<'JAVA'
          import java.net.HttpURLConnection;
          import java.net.URL;

          public final class NetProbe {
              public static void main(String[] args) throws Exception {
                  if (args.length != 1) throw new IllegalArgumentException("url required");
                  System.setProperty("http.proxyHost", "10.0.2.2");
                  System.setProperty("http.proxyPort", "8899");
                  System.setProperty("https.proxyHost", "10.0.2.2");
                  System.setProperty("https.proxyPort", "8899");
                  URL url = new URL(args[0]);
                  HttpURLConnection c = (HttpURLConnection) url.openConnection();
                  c.setConnectTimeout(8000);
                  c.setReadTimeout(8000);
                  c.setInstanceFollowRedirects(false);
                  c.setRequestProperty("User-Agent", "ZunoPlay-Phase2-NetProbe/1");
                  try {
                      int code = c.getResponseCode();
                      System.out.println("NETPROBE_OK url=" + args[0] + " code=" + code);
                  } catch (Throwable t) {
                      System.out.println("NETPROBE_FAIL url=" + args[0] + " type=" + t.getClass().getName() + " message=" + t.getMessage());
                      throw t;
                  } finally {
                      c.disconnect();
                  }
              }
          }
          JAVA

          mkdir -p /tmp/netprobe-classes /tmp/netprobe-dex
          javac -source 8 -target 8 -d /tmp/netprobe-classes /tmp/NetProbe.java
          "${ANDROID_HOME}/build-tools/35.0.0/d8" --output /tmp/netprobe-dex /tmp/netprobe-classes/NetProbe.class
          (cd /tmp/netprobe-dex && zip -q /tmp/netprobe.jar classes.dex)
          test -s /tmp/netprobe.jar

          cat > /tmp/zunoplay-host-probe.sh <<'BASH'
          #!/usr/bin/env bash
          set -uo pipefail

          MODE="${1:?control|host-blocked}"
          APK='android-v0/app/build/outputs/apk/debug/app-debug.apk'
          PACKAGE='com.zunoplay.app'
          ACTIVITY='com.zunoplay.app/.MainActivity'
          GENERAL_URL='https://example.com/'
          TARGET_URL='https://samurayshon.github.io/ZunoPlay/'
          TARGET_HOST='samurayshon.github.io'
          PREFIX="android-proxy-${MODE}"
          TRACE="${PREFIX}-trace.txt"
          LIVE="${PREFIX}-liveness.txt"
          LOGCAT="${PREFIX}-logcat-continuous.txt"
          WEBVIEW="${PREFIX}-webview-state.txt"
          PROXY_LOG="${PREFIX}-runner-proxy.txt"
          NETPROBE_LOG="${PREFIX}-android-netprobe.txt"
          PROXY_PID=''
          LOGCAT_PID=''

          trace(){ printf '%s | %s\n' "$(date -u +%FT%TZ)" "$*" | tee -a "$TRACE"; }

          cleanup(){
            [[ -n "$LOGCAT_PID" ]] && kill "$LOGCAT_PID" >/dev/null 2>&1 || true
            [[ -n "$PROXY_PID" ]] && kill "$PROXY_PID" >/dev/null 2>&1 || true
            timeout 5s adb shell settings put global http_proxy :0 >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          qemu_ok(){ pgrep -af 'qemu-system|emulator.*-avd' >/dev/null 2>&1; }
          port_ok(){ ss -ltn 2>/dev/null | grep -qE ':5554\b'; }
          getstate_ok(){ timeout 5s adb get-state >/dev/null 2>&1; }
          devices_ok(){ timeout 5s adb devices -l 2>/dev/null | grep -qE '^emulator-[0-9]+[[:space:]]+device\b'; }
          shell_ok(){ timeout 5s adb shell true >/dev/null 2>&1; }

          probe(){
            local label="$1" q=0 p=0 g=0 d=0 s=0
            qemu_ok && q=1 || true
            port_ok && p=1 || true
            getstate_ok && g=1 || true
            devices_ok && d=1 || true
            shell_ok && s=1 || true
            printf '%s | %s qemu=%s port5554=%s get_state=%s devices=%s shell=%s\n' "$(date -u +%FT%TZ)" "$label" "$q" "$p" "$g" "$d" "$s" | tee -a "$LIVE"
          }

          webview(){
            local label="$1"
            {
              echo "=== $(date -u +%FT%TZ) $label ==="
              timeout 4s adb shell dumpsys webviewupdate 2>&1 || true
              timeout 4s adb shell ps -A 2>&1 | grep -Ei 'webview|chromium|sandboxed_process|com.google.android.webview|com.zunoplay.app' || true
            } >> "$WEBVIEW"
          }

          hoststate(){
            local label="$1"
            local out="${PREFIX}-host-${label}.txt"
            {
              echo '=== UTC ==='; date -u
              echo '=== qemu ==='; pgrep -af 'qemu-system|emulator.*-avd' || true
              echo '=== listeners ==='; ss -ltnp 2>/dev/null | grep -E ':(5037|5554|8899)\b' || true
              echo '=== adb ==='; timeout 5s adb devices -l || true
              echo '=== adb get-state ==='; timeout 5s adb get-state || true
              echo '=== adb shell ==='; timeout 5s adb shell true; echo "exit=$?"
              echo '=== system proxy ==='; timeout 5s adb shell settings get global http_proxy || true
              echo '=== coredumps ==='; coredumpctl --no-pager list 2>&1 | tail -n 80 || true
              echo '=== qemu coredump ==='; coredumpctl --no-pager info qemu-system-x86_64-headless 2>&1 | tail -n 180 || true
            } > "$out" 2>&1
          }

          run_android_probe(){
            local label="$1" url="$2" output status
            set +e
            output="$(timeout 20s adb shell "CLASSPATH=/data/local/tmp/netprobe.jar app_process /system/bin NetProbe '$url'" 2>&1 | tr -d '\r')"
            status=$?
            set -e
            printf '%s | label=%s status=%s | %s\n' "$(date -u +%FT%TZ)" "$label" "$status" "$output" | tee -a "$NETPROBE_LOG"
            return "$status"
          }

          trace "BEGIN mode=$MODE exact APK SHA 214010598fdf6fabc3bffd31a35f0381cdf449da"
          grep -E 'Pkg.Revision|Pkg.Path' "${ANDROID_HOME}/emulator/source.properties" | tee "${PREFIX}-emulator-version.txt"
          grep -q 'Pkg.Revision *= *36\.5\.11' "${PREFIX}-emulator-version.txt"
          timeout 30s adb wait-for-device
          timeout 10s adb shell true
          adb install -r "$APK" | tee -a "$TRACE"
          adb push /tmp/netprobe.jar /data/local/tmp/netprobe.jar >/dev/null
          probe pre-network

          python3 /tmp/zunoplay-proxy.py --mode "$MODE" --port 8899 --log "$PROXY_LOG" &
          PROXY_PID=$!
          for _ in $(seq 1 30); do
            ss -ltn 2>/dev/null | grep -qE ':8899\b' && break
            sleep 0.2
          done
          ss -ltn 2>/dev/null | grep -qE ':8899\b' || { trace 'INSTRUMENTATION INVALID: runner proxy did not start'; exit 150; }
          trace "runner proxy ready pid=$PROXY_PID mode=$MODE"

          timeout 5s adb shell settings put global http_proxy 10.0.2.2:8899
          PROXY_VALUE="$(timeout 5s adb shell settings get global http_proxy 2>/dev/null | tr -d '\r')"
          trace "guest system proxy=$PROXY_VALUE"
          [[ "$PROXY_VALUE" == '10.0.2.2:8899' ]] || { trace 'INSTRUMENTATION INVALID: guest system proxy not applied'; exit 151; }

          GENERAL_STATUS=0
          TARGET_STATUS=0
          run_android_probe general "$GENERAL_URL" || GENERAL_STATUS=$?
          run_android_probe target "$TARGET_URL" || TARGET_STATUS=$?
          sleep 1

          GENERAL_ALLOWED=0
          TARGET_ALLOWED=0
          TARGET_BLOCKED=0
          grep -q 'CONNECT ALLOW .*host=example.com port=443' "$PROXY_LOG" && GENERAL_ALLOWED=1 || true
          grep -q 'CONNECT ALLOW .*host=samurayshon.github.io port=443' "$PROXY_LOG" && TARGET_ALLOWED=1 || true
          grep -q 'CONNECT BLOCK .*host=samurayshon.github.io port=443' "$PROXY_LOG" && TARGET_BLOCKED=1 || true
          trace "prelaunch external proof general_status=$GENERAL_STATUS target_status=$TARGET_STATUS general_allowed=$GENERAL_ALLOWED target_allowed=$TARGET_ALLOWED target_blocked=$TARGET_BLOCKED"

          if [[ "$MODE" == 'control' ]]; then
            if [[ "$GENERAL_STATUS" -ne 0 || "$TARGET_STATUS" -ne 0 || "$GENERAL_ALLOWED" -ne 1 || "$TARGET_ALLOWED" -ne 1 || "$TARGET_BLOCKED" -ne 0 ]]; then
              trace 'INSTRUMENTATION INVALID: CONTROL did not prove Android-originated general+target connectivity through runner observer; APK launch skipped'
              hoststate control-precondition-invalid
              exit 152
            fi
            trace 'CONTROL PRECONDITION PASS: Android-originated general and ZunoPlay host traffic both externally observed and allowed'
          else
            if [[ "$GENERAL_ALLOWED" -ne 1 || "$TARGET_ALLOWED" -ne 0 || "$TARGET_BLOCKED" -ne 1 ]]; then
              trace 'INSTRUMENTATION INVALID: HOST-BLOCKED did not prove general allowed + ZunoPlay host blocked; APK launch skipped'
              hoststate blocked-precondition-invalid
              exit 153
            fi
            trace 'HOST-BLOCKED PRECONDITION PASS: general internet allowed and only ZunoPlay host explicitly blocked by runner proxy'
          fi

          adb logcat -c || true
          adb logcat -v threadtime > "$LOGCAT" 2>&1 & LOGCAT_PID=$!
          webview before-launch
          probe before-launch
          timeout 10s adb shell am force-stop "$PACKAGE"
          set +e
          START_OUTPUT="$(timeout 30s adb shell am start -W -n "$ACTIVITY" 2>&1 | tr -d '\r')"
          START_STATUS=$?
          set -e
          printf '%s\n' "$START_OUTPUT" | tee -a "$TRACE"
          trace "am-start exit=$START_STATUS"
          probe immediately-after-launch
          webview immediately-after-launch

          FREEZE=0
          for SECOND in $(seq 1 20); do
            sleep 1
            probe "post-launch-${SECOND}s"
            webview "post-launch-${SECOND}s"
            if ! shell_ok; then
              FREEZE=1
              trace "freeze detected at iteration=${SECOND}; QEMU/port/ADB state captured independently"
              hoststate "freeze-${SECOND}s"
              break
            fi
          done

          sleep 2
          probe final
          webview final
          hoststate final
          cp "$PROXY_LOG" "${PREFIX}-runner-proxy-final.txt" || true
          tar -czf "${PREFIX}-crashdata.tgz" /tmp/android-runner 2>/dev/null || true
          if shell_ok; then timeout 10s adb logcat -d -v threadtime > "${PREFIX}-logcat-snapshot.txt" || true; fi

          [[ "$START_STATUS" -eq 0 ]] || exit 120
          grep -q 'Status: ok' <<< "$START_OUTPUT" || exit 121
          [[ "$FREEZE" -eq 0 ]] || exit 122
          trace "RESULT stable-for-20s mode=$MODE"
          BASH
          chmod +x /tmp/zunoplay-host-probe.sh
          bash -n /tmp/zunoplay-host-probe.sh
          python3 -m py_compile /tmp/zunoplay-proxy.py

      - name: CONTROL ONLINE - externally prove Android traffic then probe
        id: control_probe
        continue-on-error: true
        timeout-minutes: 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-build: 15261927
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash /tmp/zunoplay-host-probe.sh control

      - name: HOST-BLOCKED - externally prove selective block then probe
        id: blocked_probe
        continue-on-error: true
        timeout-minutes: 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-build: 15261927
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash /tmp/zunoplay-host-probe.sh host-blocked

      - name: Record matrix outcomes
        if: always()
        shell: bash
        run: |
          printf 'control=%s\nhost_blocked=%s\n' '${{ steps.control_probe.outcome }}' '${{ steps.blocked_probe.outcome }}' | tee android-proxy-matrix-outcomes.txt

      - name: Enforce valid preconditions and probe execution
        if: always()
        shell: bash
        run: |
          CONTROL='${{ steps.control_probe.outcome }}'
          BLOCKED='${{ steps.blocked_probe.outcome }}'
          echo "control=$CONTROL host_blocked=$BLOCKED"
          if grep -Rqs 'INSTRUMENTATION INVALID' android-proxy-*-trace.txt 2>/dev/null; then
            echo 'Network-isolation instrumentation was invalid; no product conclusion is allowed.' >&2
            exit 2
          fi
          if [ "$CONTROL" = success ] && [ "$BLOCKED" = success ]; then exit 0; fi
          echo 'At least one valid runtime probe failed; inspect diagnostics.' >&2
          exit 1

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZunoPlay-Phase2-android-runtime-diagnostics
          path: |
            android-apk-badging.txt
            android-proxy-matrix-outcomes.txt
            android-proxy-*.txt
            android-proxy-*.tgz
          if-no-files-found: warn
          retention-days: 7
