name: XP next block guard
on:
  pull_request:
    paths:
      - 'meu-xp.html'
      - 'zuno-my-xp-v1.js'
      - 'zuno-my-xp-v1.css'
      - 'zuno-xp-ui-v1.js'
      - 'supabase/migrations/*xp*.sql'
      - 'sw.js'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check zuno-my-xp-v1.js
          node --check zuno-xp-ui-v1.js
          node --check sw.js
      - name: XP separation guard
        run: |
          ! grep -qi 'aura' zuno-my-xp-v1.js
          grep -q 'meu-xp.html' zuno-xp-ui-v1.js
          grep -q 'xp_transactions' zuno-my-xp-v1.js
