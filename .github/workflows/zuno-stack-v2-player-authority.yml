name: Zuno Stack V2 Player Authority
on:
  push:
    branches: ['codex/zuno-stack-v2-phase-9-*']
  pull_request:
    paths: ['src/zuno-stack-v2/**','tests/zuno-stack-v2-*.test.mjs','.github/workflows/zuno-stack-v2-player-authority.yml']
jobs:
  player-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Validate Player Authority syntax
        run: |
          node --check src/zuno-stack-v2/player-authority/player-authority-contract.mjs
          node --check src/zuno-stack-v2/player-authority/player-authority-processor.mjs
      - name: Validate frozen phases and Player Authority
        run: node --test tests/zuno-stack-v2-core-*.test.mjs tests/zuno-stack-v2-solo-*.test.mjs tests/zuno-stack-v2-match-*.test.mjs tests/zuno-stack-v2-trio-*.test.mjs tests/zuno-stack-v2-pvp-*.test.mjs tests/zuno-stack-v2-ranking-*.test.mjs tests/zuno-stack-v2-player-authority-*.test.mjs
