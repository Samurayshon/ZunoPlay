name: Supabase Production Migration Apply V2

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Type AUTORIZO_APLICAR_MIGRATIONS to continue'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-apply-v2
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event.inputs.authorization == 'AUTORIZO_APLICAR_MIGRATIONS'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_CLI_VERSION: '2.116.0'
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify explicit authorization and stable database secret
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.inputs.authorization }}" = 'AUTORIZO_APLICAR_MIGRATIONS' || { echo 'Explicit authorization phrase missing.'; exit 20; }
          test -n "${SUPABASE_DB_URL:-}" || { echo 'Missing environment/repository secret: SUPABASE_DB_URL'; exit 21; }
          echo 'Authorization gate and database secret are present; secret value was not printed.'

      - name: Build ledger-aware local production plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/supabase-production-plan.mjs --check --json | tee supabase-production-plan-local.json

      - name: Capture remote ledger before apply
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" 2>&1 | tee supabase-production-ledger-before.log
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('supabase-production-ledger-before.log').read_text(errors='replace')
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          remote = []
          for raw in text.splitlines():
              parts = ansi.sub('', raw).split('|')
              if len(parts) < 2:
                  continue
              candidate = parts[1].strip()
              if re.fullmatch(r'\d{14}', candidate) and candidate not in remote:
                  remote.append(candidate)
          remote.sort()
          pathlib.Path('supabase-production-remote-before.txt').write_text('\n'.join(remote) + ('\n' if remote else ''))
          print(f'Remote migration versions captured: {len(remote)}')
          PY

      - name: Reconcile production ledger and approved pending set
        shell: bash
        run: |
          set -euo pipefail
          node scripts/supabase-production-plan.mjs \
            --remote-versions-file supabase-production-remote-before.txt \
            --check --json | tee supabase-production-plan-before-apply.json

      - name: Mandatory final dry-run before apply
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --dry-run --include-all --db-url "$SUPABASE_DB_URL" 2>&1 | tee supabase-production-dry-run-before-apply.log

      - name: Fail closed unless final dry-run matches ledger-aware approved pending set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, sys
          plan = json.loads(pathlib.Path('supabase-production-plan-before-apply.json').read_text())
          expected = sorted(row['version'] for row in plan['classifications']['approvedPending'])
          pending = {row['version'] for row in plan['classifications']['pending']}
          dry = pathlib.Path('supabase-production-dry-run-before-apply.log').read_text(errors='replace')
          observed = sorted({version for version in re.findall(r'(?<!\d)(\d{14})(?!\d)', dry) if version in pending})
          if observed != expected:
              print('FAIL-CLOSED: final dry-run does not match ledger-aware approved pending set.')
              print('Expected:', ', '.join(expected) if expected else '<none>')
              print('Observed:', ', '.join(observed) if observed else '<none>')
              sys.exit(40)
          pathlib.Path('expected-pending.txt').write_text('\n'.join(expected) + ('\n' if expected else ''))
          print('Final dry-run approved.')
          print('Approved pending:', ', '.join(expected) if expected else '<none>')
          PY

      - name: Apply approved truly-pending migrations
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s expected-pending.txt ]; then
            echo 'No approved pending migrations; nothing to apply.'
            exit 0
          fi
          supabase db push --include-all --db-url "$SUPABASE_DB_URL" 2>&1 | tee supabase-production-apply.log

      - name: Verify production ledger after apply
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" 2>&1 | tee supabase-production-ledger-after.log
          python3 - <<'PY'
          import csv, pathlib, re, sys

          text = pathlib.Path('supabase-production-ledger-after.log').read_text(errors='replace')
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          remote = set()
          for raw in text.splitlines():
              parts = ansi.sub('', raw).split('|')
              if len(parts) < 2:
                  continue
              candidate = parts[1].strip()
              if re.fullmatch(r'\d{14}', candidate):
                  remote.add(candidate)

          ledger = set()
          for path in sorted(pathlib.Path('supabase/reconciliation').glob('production-migrations-*.csv')):
              with path.open(newline='') as handle:
                  for row in csv.DictReader(handle):
                      ledger.add(row['version'])

          pending_path = pathlib.Path('expected-pending.txt')
          applied_now = {line.strip() for line in pending_path.read_text().splitlines() if line.strip()} if pending_path.exists() else set()
          expected = ledger | applied_now
          missing = sorted(expected - remote)
          unexpected = sorted(remote - expected)
          if missing or unexpected:
              print('FAIL-CLOSED: post-apply production ledger mismatch.')
              print('Expected but missing:', ', '.join(missing) if missing else '<none>')
              print('Unexpected remote:', ', '.join(unexpected) if unexpected else '<none>')
              sys.exit(50)

          if applied_now:
              pathlib.Path('production-reconciliation-required.txt').write_text(
                  'Production advanced by these approved migrations; capture them in a new reconciliation ledger before the next release:\n'
                  + '\n'.join(sorted(applied_now)) + '\n'
              )
          print('supabase_production_apply_v2_verified')
          PY

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-apply-v2
          path: |
            supabase-production-plan-local.json
            supabase-production-ledger-before.log
            supabase-production-remote-before.txt
            supabase-production-plan-before-apply.json
            supabase-production-dry-run-before-apply.log
            supabase-production-apply.log
            supabase-production-ledger-after.log
            expected-pending.txt
            production-reconciliation-required.txt
          if-no-files-found: ignore
