name: Preview Ledger Honesty

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/ZUNOPLAY_PREVIEW_LEDGER_NOTE.md'

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -q 'não contém o ledger canônico de 237 migrations' docs/ZUNOPLAY_PREVIEW_LEDGER_NOTE.md
          grep -q 'Não inserir versões falsas' docs/ZUNOPLAY_PREVIEW_LEDGER_NOTE.md
