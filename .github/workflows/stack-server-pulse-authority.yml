name: Zuno Stack Server Pulse Authority

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  server-pulse-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard server-authoritative Pulse Shift
        shell: bash
        run: |
          set -euo pipefail
          node --check zuno-stack-server-engine-guard.js
          f='supabase/migrations/20260830030500_server_authoritative_zuno_stack_pulse_shift.sql'
          test -s "$f"
          grep -q 'zuno_stack_apply_pulse_shift_internal' "$f"
          grep -q 'zuno_stack_apply_pulse_shift' "$f"
          grep -q 'stack_pulse_not_ready' "$f"
          grep -q "jsonb_array_length(v_tray) >= 6" "$f"
          grep -q "order by freq asc, ord desc" "$f"
          grep -q "'energy',0" "$f"
          grep -q "'combo',0" "$f"
          grep -q "'lastMatchAt',0" "$f"
          grep -q 'server_pulse_shift' "$f"
          grep -q "revoke all on function public.zuno_stack_apply_pulse_shift" "$f"
          grep -q "sb.rpc('zuno_stack_apply_pulse_shift'" zuno-stack-server-engine-guard.js
          grep -q "k==='pulse_shift'" zuno-stack-server-engine-guard.js
          grep -q 'ZunoStackPulseAuthority' zuno-stack-server-engine-guard.js
          grep -q "if(pulse){applyPulseShift();return}" zuno-stack-server-engine-guard.js
