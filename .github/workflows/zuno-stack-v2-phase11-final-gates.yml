name: Zuno Stack V2 Phase 11 Final Gates

on:
  push:
    branches:
      - 'codex/zuno-stack-v2-phase-11-final-polish'
      - 'codex/zuno-stack-v2-phase-11-p0-solo-fixes'
  pull_request:
    paths:
      - 'src/zuno-stack-v2/**'
      - 'tests/zuno-stack-v2-*.test.mjs'
      - 'docs/zuno-stack-v2/ZUNO_STACK_V2_PHASE_11_*.md'
      - '.github/workflows/zuno-stack-v2-phase11-final-gates.yml'

jobs:
  final-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frozen regression plus Phase 11 gates
        run: >-
          node --test
          tests/zuno-stack-v2-core-*.test.mjs
          tests/zuno-stack-v2-solo-*.test.mjs
          tests/zuno-stack-v2-match-*.test.mjs
          tests/zuno-stack-v2-trio-*.test.mjs
          tests/zuno-stack-v2-pvp-*.test.mjs
          tests/zuno-stack-v2-ranking-*.test.mjs
          tests/zuno-stack-v2-player-authority-*.test.mjs
          tests/zuno-stack-v2-aura-*.test.mjs
          tests/zuno-stack-v2-phase11-*.test.mjs
      - name: Shell Policy Guard
        run: |
          node --check zuno-navigation-policy-v1.js
          node --check zuno-global-navigation-v1.js
          node --check zuno-global-chrome.js
          node --check zuno-shell-experience-v1.js
          node --test tests/navigation-policy.test.mjs
          node --test tests/mobile-scroll-root.test.mjs
          node --test tests/global-shell-policy-integration.test.mjs
          node --test --test-name-pattern='Shell Policy Guard' tests/zuno-stack-v2-phase11-p0-shell-fresh-round.test.mjs
      - name: Fresh Solo Round
        run: node --test --test-name-pattern='Fresh Solo Round' tests/zuno-stack-v2-phase11-p0-shell-fresh-round.test.mjs
      - name: Frozen source mutation guard with controlled Shift exception
        run: |
          BASE=245940b14ddfb4e654e52b1a1a7619651c3a36a6
          git diff --exit-code "$BASE" -- src/zuno-stack-v2/core src/zuno-stack-v2/server src/zuno-stack-v2/trio src/zuno-stack-v2/pvp src/zuno-stack-v2/ranking src/zuno-stack-v2/player-authority src/zuno-stack-v2/aura
          changed="$(git diff --name-only "$BASE" -- src/zuno-stack-v2/solo)"
          test "$changed" = "src/zuno-stack-v2/solo/solo-rules.mjs"
          git diff --unified=0 "$BASE" -- src/zuno-stack-v2/solo/solo-rules.mjs > /tmp/solo-shift.patch
          grep -q '^+  USE_POWER,$' /tmp/solo-shift.patch
          grep -q '^+  usePowerTransition$' /tmp/solo-shift.patch
          grep -q '^+  const transitions={...createCoreTransitions(),\[USE_POWER\]:usePowerTransition};$' /tmp/solo-shift.patch
          grep -q '^+  const rules=createModeRules({modeId:SOLO_MODE,playerSlots:1,transitions,powerCatalog});$' /tmp/solo-shift.patch
          test "$(grep -c '^+[^+]' /tmp/solo-shift.patch)" -eq 5
          test "$(grep -c '^-[^-]' /tmp/solo-shift.patch)" -eq 2
      - name: Device validation marker
        run: |
          echo 'DEVICE_VALIDATION_REQUIRED: CI proxy gates do not certify physical Android FPS, touch latency, memory or frame pacing.'
