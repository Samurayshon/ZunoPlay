name: Supabase Migration Reconciliation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analyze production ledger against repository migrations
        run: node scripts/supabase-migration-reconciliation.mjs --json | tee migration-reconciliation-report.json
      - name: Upload reconciliation report
        uses: actions/upload-artifact@v4
        with:
          name: supabase-migration-reconciliation
          path: migration-reconciliation-report.json

  dump-capability:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check configured Supabase CI credentials without exposing values
        shell: bash
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then echo "access_token_present=yes"; else echo "access_token_present=no"; fi
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then echo "db_password_present=yes"; else echo "db_password_present=no"; fi

  ledger-rest-capability:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://rliymfbbhqoejgfvsbuu.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0
    steps:
      - name: Test migration ledger REST exposure
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/ledger-response.txt -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/schema_migrations?select=version,name&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H 'Accept-Profile: supabase_migrations')
          echo "http_status=$status"
          head -c 500 /tmp/ledger-response.txt || true
          echo
