name: Preview Next Action Guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/ZUNOPLAY_PREVIEW_NEXT.md'

jobs:
  next-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -q 'desacoplar a configuração Supabase do frontend por ambiente' docs/ZUNOPLAY_PREVIEW_NEXT.md
