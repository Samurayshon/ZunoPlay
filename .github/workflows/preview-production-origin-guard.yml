name: Preview Production Origin Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  production-origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve Android production origin
        shell: bash
        run: |
          set -euo pipefail
          file='android-v0/app/src/main/java/com/zunoplay/app/MainActivity.java'
          grep -q 'https://samurayshon.github.io/ZunoPlay/' "$file"
          grep -q 'samurayshon.github.io' "$file"
