name: Preview No Secret Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  no-client-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject obvious Supabase server secrets in frontend/config
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=supabase --exclude='*.md' '(service[_-]?role|sb_secret_)' -- '*.html' '*.js' '*.mjs' 'vercel.json' 2>/dev/null; then
            echo 'Potential server-side Supabase secret marker found in public frontend/config.'
            exit 1
          fi
