name: Zuno Stack Fluxo Score Cap Characterization

on:
  pull_request:
    branches:
      - main
      - stack/eighth-gelo-score-cap
    paths:
      - 'supabase/**'
      - 'tests/zuno-stack-fluxo-score-cap-characterization.sql'
      - '.github/workflows/stack-fluxo-score-cap-characterization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize-fluxo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Inject proven pre-ledger baseline
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_SOURCE='supabase/bootstrap/20260826130000_preledger_baseline.sql'
          BOOTSTRAP_TARGET="supabase/migrations/$(basename "$BOOTSTRAP_SOURCE")"
          test -f "$BOOTSTRAP_SOURCE"
          test ! -e "$BOOTSTRAP_TARGET"
          cp "$BOOTSTRAP_SOURCE" "$BOOTSTRAP_TARGET"
      - name: Start disposable local Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
      - name: Rebuild database from baseline and repository migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed
      - name: Characterize Fluxo score cap before ninth extraction
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -X -f tests/zuno-stack-fluxo-score-cap-characterization.sql
      - name: Show local Supabase status on failure
        if: failure()
        run: supabase status || true
      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup || true
