name: ZunoPlay Stage 19 Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stage19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Stage 19 JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check zuno-turn-provider.js
          node --check zuno-room-avatar-sync-v1.js
          node --check zuno-room-bootstrap-v201.js
          node --check voz-sala-v2.js
          node --check zuno-room-access-v1.js
          node --check zuno-room-invite-entry-v1.js
          node --check zuno-messages.js
          node --check zuno-stack.js

      - name: Guard voice and room integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'zuno-turn-provider.js' sala.html
          grep -q 'voz-sala-v2.js' sala.html
          grep -q 'zuno-room-access-v1.js' sala.html
          grep -q "js('zunoplay-room-invite-entry-v1-script','./zuno-room-invite-entry-v1.js')" nav.js
          grep -q 'avatar-renderer.js' zuno-room-bootstrap-v201.js
          grep -q 'zuno-room-avatar-sync-v1.js' zuno-room-bootstrap-v201.js
          grep -q "mode:'Sala de voz'" zuno-room-avatar-sync-v1.js
          grep -q "avatar_config" zuno-room-avatar-sync-v1.js
          grep -q 'ZunoVoiceICEProvider' zuno-turn-provider.js
          grep -q 'voice-turn' zuno-turn-provider.js

      - name: Guard database stabilization in canonical ledger
        shell: bash
        run: |
          set -euo pipefail
          d='supabase/migrations'
          test -d "$d"
          grep -Rq 'max_speakers = 8' "$d"
          grep -Rq 'room_access_denied' "$d"
          grep -Rq 'room_members_select_authorized' "$d"
          grep -Rq 'rooms_select_authorized' "$d"
          grep -Rq 'zunoplay:voice-reward:' "$d"
          grep -Rq 'zunoplay:presence-reward:' "$d"
          grep -Rq 'speaker_required' "$d"
          grep -Rq 'submit_zuno_stack_result' "$d"
          grep -Rq 'new.game !~' "$d"

      - name: Guard P1 room and voice hardening
        shell: bash
        run: |
          set -euo pipefail
          f='supabase/migrations/20260829173258_harden_rooms_voice_access.sql'
          g='supabase/migrations/20260829173312_guard_voice_answer_direction.sql'
          h='supabase/migrations/20260829173319_reject_membership_in_inactive_room.sql'
          test -s "$f"
          test -s "$g"
          test -s "$h"
          grep -q 'room_invites' "$f"
          grep -q 'zuno_end_room_on_owner_departure' "$f"
          grep -q 'zuno_voice_broadcast_allowed' "$f"
          grep -q 'recvonly|inactive' "$g"
          grep -q 'zuno_reject_membership_in_inactive_room' "$h"

      - name: Guard PWA and auth boot
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'rel="manifest"' index.html
          grep -q "serviceWorker.register('./sw.js'" home-app.js
          grep -q "CACHE_NAME=\"zunoplay-v" sw.js
          grep -q "notificationclick" sw.js
          grep -q 'signUp' zuno-onboarding.js
          grep -q 'complete_zuno_identity' zuno-onboarding.js

      - name: Guard essential social and game persistence
        shell: bash
        run: |
          set -euo pipefail
          grep -q "from('messages').insert" zuno-messages.js
          grep -q "zuno_get_or_create_direct_conversation" zuno-messages.js
          reward_guard='supabase/migrations/20260829154748_contain_unverified_zuno_stack_rewards.sql'
          test -s "$reward_guard"
          grep -q 'revoke execute on function public.submit_zuno_stack_result' "$reward_guard"
          grep -q 'zunoplay_zuno_stack_last_result' zuno-stack.js
          ! grep -q "sb.rpc('submit_zuno_stack_result'" zuno-stack.js || { echo 'Unsafe Zuno Stack reward RPC returned'; exit 1; }
          grep -q "game_scores" historico.html
