name: Zuno Stack Production Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate current Stack runtime
        shell: bash
        run: |
          set -euo pipefail
          files=(
            zuno-stack.html zuno-stack.js zuno-stack-pieces.js zuno-stack-pieces.css
            zuno-stack-lobby-fullscreen-v3.css zuno-stack-lobby-v2.css zuno-stack-lobby-v2.js zuno-stack-lobby-final-polish.css
            zuno-stack-lobby-closeout.css zuno-stack-lobby-closeout.js zuno-stack-brand.css zuno-stack-brand.js zuno-stack-arena-motion.js
            zuno-stack-gameplay-official.css zuno-stack-gameplay-official.js zuno-stack-modes-official.js
            zuno-stack-coop-official.js zuno-stack-progression-official.js zuno-stack-performance-official.js
            zuno-stack-performance.js zuno-stack-social.js zuno-stack-progression.js zuno-stack-content.js zuno-stack-mobile-shell.js
            zuno-stack-objective.js zuno-stack-objective.css zuno-stack-relay-advanced.js zuno-stack-relay-advanced.css
            zuno-stack-feel-official.css zuno-stack-feel-official.js zuno-stack-powers-official.css zuno-stack-powers-official.js
            zuno-stack-orders-official.css zuno-stack-orders-official.js zuno-stack-coop-official.css
            zuno-stack-pressure-official.css zuno-stack-pressure-official.js zuno-stack-touchfix-official.css
            zuno-stack-rhythm-official.css zuno-stack-rhythm-official.js zuno-stack-settings-official.css zuno-stack-settings-official.js
            zuno-stack-feedback-official.css zuno-stack-layout-v2-official.css zuno-stack-layout-v2-official.js zuno-stack-final-compose.css
            zuno-stack-final-polish.css
          )
          for file in "${files[@]}"; do test -s "$file" || { echo "Missing Stack runtime file: $file"; exit 1; }; done
          for file in zuno-stack*.js; do node --check "$file"; done

      - name: Validate Stack boot graph
        shell: bash
        run: |
          set -euo pipefail
          direct=(
            zuno-stack-pieces.css zuno-stack-lobby-fullscreen-v3.css zuno-stack-lobby-v2.css zuno-stack-lobby-final-polish.css
            zuno-stack-lobby-closeout.css zuno-stack-brand.css zuno-stack-gameplay-official.css
            zuno-stack-pieces.js zuno-stack-modes-official.js zuno-stack.js zuno-stack-gameplay-official.js
            zuno-stack-coop-official.js zuno-stack-progression-official.js zuno-stack-performance-official.js
            zuno-stack-brand.js zuno-stack-arena-motion.js zuno-stack-lobby-closeout.js
          )
          for asset in "${direct[@]}"; do grep -q "$asset" zuno-stack.html || { echo "Stack direct boot asset missing: $asset"; exit 1; }; done
          injected=(
            zuno-stack-performance.js zuno-stack-social.js zuno-stack-progression.js zuno-stack-content.js zuno-stack-mobile-shell.js
            zuno-stack-objective.css zuno-stack-objective.js zuno-stack-relay-advanced.css zuno-stack-relay-advanced.js zuno-stack-lobby-v2.js
          )
          for asset in "${injected[@]}"; do grep -q "$asset" nav.js || { echo "Stack injected boot asset missing: $asset"; exit 1; }; done
          official=(
            zuno-stack-feel-official.css zuno-stack-feel-official.js zuno-stack-powers-official.css zuno-stack-powers-official.js
            zuno-stack-orders-official.css zuno-stack-orders-official.js zuno-stack-coop-official.css zuno-stack-coop-official.js
            zuno-stack-pressure-official.css zuno-stack-pressure-official.js zuno-stack-touchfix-official.css
            zuno-stack-rhythm-official.css zuno-stack-rhythm-official.js zuno-stack-settings-official.css zuno-stack-settings-official.js
            zuno-stack-feedback-official.css zuno-stack-layout-v2-official.css zuno-stack-layout-v2-official.js zuno-stack-final-compose.css
            zuno-stack-final-polish.css
          )
          for asset in "${official[@]}"; do grep -q "$asset" zuno-stack-performance-official.js || { echo "Stack official composition asset missing: $asset"; exit 1; }; done
          ! grep -q 'zuno-stack-final-compose.js' zuno-stack-performance-official.js || { echo 'Obsolete final-compose JS returned to boot graph'; exit 1; }

      - name: Validate gameplay and cooperation invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TRAY_LIMIT=7' zuno-stack.js
          grep -q 'RISK_AT=6' zuno-stack.js
          grep -q 'TOTAL_TILES=90' zuno-stack.js
          grep -q 'LAYER_COUNTS=\[36,24,15,10,5\]' zuno-stack.js
          grep -q 'TARGET_MIN_MS=240000' zuno-stack.js
          grep -q 'TARGET_MAX_MS=360000' zuno-stack.js
          grep -q 'stack_relay' zuno-stack.js
          grep -q 'stack_state' zuno-stack.js
          grep -q 'submit_zuno_stack_result' zuno-stack.js
          grep -q 'get_friend_game_leaderboard' zuno-stack-progression.js
          grep -q "from('messages')" zuno-stack-social.js

      - name: Guard obsolete Stack assets
        shell: bash
        run: |
          set -euo pipefail
          obsolete=(
            zuno-stack-pieces.svg zuno-stack-pieces.webp zuno-stack-layout-v1.css zuno-stack-visual.css zuno-stack-visual-final.css
            zuno-stack-lobby.css zuno-stack-gameplay-v1.css zuno-stack-gameplay-v1.js
            zuno-stack-gameplay-polish-v2.css zuno-stack-gameplay-polish-v2.js
            zuno-stack-gameplay-immersive-v3.css zuno-stack-gameplay-immersive-v3.js
          )
          for old in "${obsolete[@]}"; do test ! -e "$old" || { echo "Obsolete Stack asset returned: $old"; exit 1; }; done

      - name: Validate frontend generation
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          nav=pathlib.Path('nav.js').read_text(); sw=pathlib.Path('sw.js').read_text(); current=pathlib.Path('zuno-current.js').read_text()
          n=re.search(r"const V='(\d+)'",nav); s=re.search(r'zunoplay-v(\d+)',sw); c=re.search(r"const VERSION='(\d+)'",current)
          if not all((n,s,c)) or len({n.group(1),s.group(1),c.group(1)}) != 1: raise SystemExit('generation mismatch')
          print('generation v'+n.group(1))
          PY

      - name: Guard removed games and secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_pat='sb''_secret_'; role_pat='service''_role'
          ! grep -RIn --exclude-dir=.git --exclude='*.md' --exclude='*.yml' -E "zuno-core\\.html|zuno-core\\.js|${secret_pat}|${role_pat}" .