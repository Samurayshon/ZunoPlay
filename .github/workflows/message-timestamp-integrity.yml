name: Message Timestamp Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate message timestamp integrity contract
        run: node tests/message-timestamp-integrity.test.mjs
