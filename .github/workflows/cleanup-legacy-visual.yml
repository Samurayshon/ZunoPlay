name: One-shot retired visual cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-legacy-visual.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove retired visual selectors
        shell: python
        run: |
          from pathlib import Path
          import re

          leaf = re.compile(r'[^{}]*(?:\.aura-|#aura|data-pulse-mode=["\']aura["\'])[^{}]*\{[^{}]*\}', re.I)
          keyframes = re.compile(r'@(?:-webkit-)?keyframes\s+zunoAura\s*\{(?:[^{}]|\{[^{}]*\})*\}', re.I)

          changed = []
          for path in Path('.').rglob('*.css'):
              if '.git' in path.parts:
                  continue
              before = path.read_text(encoding='utf-8')
              after = before
              while True:
                  next_text = leaf.sub('', after)
                  if next_text == after:
                      break
                  after = next_text
              after = keyframes.sub('', after)
              if after != before:
                  path.write_text(after, encoding='utf-8')
                  changed.append(str(path))
          print('changed:', ', '.join(changed) if changed else 'none')

          Path('.github/workflows/cleanup-legacy-visual.yml').unlink(missing_ok=True)
      - name: Verify retired selectors are gone
        run: |
          ! grep -RniE '\.aura-|#aura|zunoAura|data-pulse-mode=["'"']aura["'"']' --include='*.css' .
      - name: Commit cleanup
        run: |
          git config user.name 'ZunoPlay Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: purge retired visual selectors' || exit 0
          git push
