name: Android APK Fast Build

on:
  pull_request:
    paths:
      - 'android-v0/**'
      - '.github/workflows/android-v0-fast-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk-fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-v0 assembleDebug --stacktrace

      - name: Verify APK metadata and resolve version
        run: |
          APK='android-v0/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"

          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-v0/app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android-v0/app/build.gradle | head -n 1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee android-apk-badging-fast.txt
          grep -q "package: name='com.zunoplay.app' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'" android-apk-badging-fast.txt
          grep -q "application-label:'ZunoPlay'" android-apk-badging-fast.txt

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=ZunoPlay-${VERSION_NAME}-debug.apk" >> "$GITHUB_ENV"
          cp "$APK" "ZunoPlay-${VERSION_NAME}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZunoPlay-${{ env.VERSION_NAME }}-APK-fast
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 14
