name: Preview Engineering Trigger

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/ZUNOPLAY_PREVIEW_ENGINEERING_TRIGGER.md'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -q 'Gemini' docs/ZUNOPLAY_PREVIEW_ENGINEERING_TRIGGER.md
