name: Zuno Stack Broadcast Authority

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  broadcast-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard broadcast from mutating gameplay
        shell: bash
        run: |
          set -euo pipefail
          node --check zuno-stack.js
          grep -q "function reconcileBroadcast" zuno-stack.js
          grep -Fq "reconcileBroadcast('stack_relay'" zuno-stack.js
          grep -Fq "reconcileBroadcast('stack_win'" zuno-stack.js
          grep -Fq "reconcileBroadcast('stack_boost'" zuno-stack.js
          grep -q "function renderAuthoritativeEnd" zuno-stack.js
          ! grep -Fq "relay=payload.relay.slice(0,3)" zuno-stack.js
          ! grep -Fq "score+=60" zuno-stack.js
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('zuno-stack.js').read_text()
          win=re.search(r"\.on\('broadcast',\{event:'stack_win'\},\(\{payload\}\)=>\{(.*?)\}\)",text,re.S)
          relay=re.search(r"\.on\('broadcast',\{event:'stack_relay'\},\(\{payload\}\)=>\{(.*?)\}\)",text,re.S)
          boost=re.search(r"\.on\('broadcast',\{event:'stack_boost'\},\(\{payload\}\)=>\{(.*?)\}\)",text,re.S)
          for name,m in [('win',win),('relay',relay),('boost',boost)]:
              if not m: raise SystemExit(f'missing {name} broadcast handler')
              body=m.group(1)
              forbidden={'win':['win(','finish('],'relay':['relay=','relay[','renderRelay('],'boost':['score+=','score =','authCommit(']}
              for token in forbidden[name]:
                  if token in body: raise SystemExit(f'{name} broadcast mutates gameplay via {token}')
          PY
