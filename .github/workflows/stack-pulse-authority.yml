name: Zuno Stack Pulse Authority

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pulse-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard server-authoritative Pulse Shift
        shell: bash
        run: |
          set -euo pipefail
          node --check zuno-stack-actions-authority.js
          node --check zuno-stack-performance-official.js
          f='supabase/migrations/20260830030000_server_authoritative_zuno_stack_pulse_shift.sql'
          test -s "$f"
          grep -q 'zuno_stack_apply_pulse_shift_internal' "$f"
          grep -q 'zuno_stack_pulse_shift' "$f"
          grep -q 'security invoker' "$f"
          grep -q 'p_expected_revision' "$f"
          grep -q "v_energy <> 5" "$f"
          grep -q 'jsonb_array_length(v_tray) >= 6' "$f"
          grep -q 'then 3 else 2' "$f"
          grep -q 'then 260 else 160' "$f"
          grep -q "'energy',0" "$f"
          grep -q "'combo',0" "$f"
          grep -q "'lastMatchAt',0" "$f"
          grep -q "'server_pulse_shift'" "$f"
          grep -q 'from public, anon' "$f"
          grep -q "zuno_stack_pulse_shift" zuno-stack-actions-authority.js
          grep -q 'ZunoStackPulseAuthority' zuno-stack-actions-authority.js
          grep -q "closest('#pulse')" zuno-stack-actions-authority.js
          grep -q "k==='pulse_shift'" zuno-stack-actions-authority.js
          grep -q "zuno-stack-actions-authority.js?v=1" zuno-stack-performance-official.js
