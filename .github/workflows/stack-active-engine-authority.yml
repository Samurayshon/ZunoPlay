name: Zuno Stack Active Engine Authority

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  active-engine-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard active engine server ownership
        shell: bash
        run: |
          set -euo pipefail
          node --check zuno-stack-actions-authority.js
          f='supabase/migrations/20260830033601_server_authoritative_zuno_stack_hint.sql'
          test -s "$f"
          grep -q 'stack_server_action_required' "$f"
          grep -q 'stack_server_start_required' "$f"
          grep -q "v_kind <> 'start'" "$f"
          ! grep -q "v_kind = 'hint'" "$f"
          grep -q "k==='late_start'" zuno-stack-actions-authority.js
          grep -q "k==='pulse_shift'" zuno-stack-actions-authority.js
          grep -q "k==='hint'" zuno-stack-actions-authority.js
          grep -q 'ZunoStackPulseAuthority' zuno-stack-actions-authority.js
          grep -q 'ZunoStackHintAuthority' zuno-stack-actions-authority.js
          grep -q "closest('#pulse')" zuno-stack-actions-authority.js
          grep -q "closest('#hint')" zuno-stack-actions-authority.js
          grep -q "data-zso-tactical" zuno-stack-actions-authority.js
          grep -q 'stopImmediatePropagation' zuno-stack-actions-authority.js
          grep -q 'server_action_required_' zuno-stack-actions-authority.js
          grep -q 'zuno-stack-actions-authority.js?v=1' zuno-stack-performance-official.js
          grep -q 'zuno-stack-solo-authority-bootstrap.js?v=12' zuno-stack.html
          ! grep -q 'zuno-stack-server-engine-guard.js' zuno-stack.html
