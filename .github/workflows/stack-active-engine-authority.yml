name: Zuno Stack Active Engine Authority

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  active-engine-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard active engine server ownership
        shell: bash
        run: |
          set -euo pipefail
          node --check zuno-stack-server-engine-guard.js
          f='supabase/migrations/20260830033601_server_authoritative_zuno_stack_hint.sql'
          test -s "$f"
          grep -q 'stack_server_action_required' "$f"
          grep -q 'stack_server_start_required' "$f"
          grep -q "v_kind <> 'start'" "$f"
          ! grep -q "v_kind = 'hint'" "$f"
          grep -q "safeKinds=new Set(\['start','tile','undo','relay_send','relay_take','pulse_shift'\])" zuno-stack-server-engine-guard.js
          grep -q "k==='late_start'" zuno-stack-server-engine-guard.js
          grep -q "k==='pulse_shift'" zuno-stack-server-engine-guard.js
          grep -q "k==='hint'" zuno-stack-server-engine-guard.js
          grep -q 'ZunoStackPulseAuthority?.shift' zuno-stack-server-engine-guard.js
          grep -q 'ZunoStackHintAuthority?.request' zuno-stack-server-engine-guard.js
          grep -q "closest('#pulse')" zuno-stack-server-engine-guard.js
          grep -q "closest('#hint')" zuno-stack-server-engine-guard.js
          grep -q "data-zso-tactical" zuno-stack-server-engine-guard.js
          grep -q 'stopImmediatePropagation' zuno-stack-server-engine-guard.js
          grep -q 'server_action_required_' zuno-stack-server-engine-guard.js
          grep -q 'zuno-stack-server-engine-guard.js?v=1' zuno-stack.html
          python3 - <<'PY'
          import pathlib
          text=pathlib.Path('zuno-stack.html').read_text()
          guard=text.index('zuno-stack-server-engine-guard.js?v=1')
          systems=text.index('zuno-stack-performance-official.js?v=')
          if guard>=systems: raise SystemExit('engine guard must load before performance/systems')
          PY
