name: Zuno Stack Power Authority

on:
  pull_request:
    branches: [main]
    paths:
      - 'zuno-stack-power-authority.js'
      - 'zuno-stack-server-engine-guard.js'
      - 'zuno-stack-performance-official.js'
      - 'supabase/migrations/*zuno_stack_*powers.sql'
      - 'supabase/migrations/*zuno_stack_gelo.sql'
      - '.github/workflows/stack-power-authority.yml'
  push:
    branches: [main]
    paths:
      - 'zuno-stack-power-authority.js'
      - 'zuno-stack-server-engine-guard.js'
      - 'zuno-stack-performance-official.js'
      - 'supabase/migrations/*zuno_stack_*powers.sql'
      - 'supabase/migrations/*zuno_stack_gelo.sql'
      - '.github/workflows/stack-power-authority.yml'

jobs:
  power-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard server power authority
        shell: bash
        run: |
          set -euo pipefail
          node --check zuno-stack-power-authority.js
          node --check zuno-stack-server-engine-guard.js
          base='supabase/migrations/20260830034500_server_authoritative_zuno_stack_fluxo_troca.sql'
          board='supabase/migrations/20260830035500_server_authoritative_zuno_stack_board_powers.sql'
          gelo='supabase/migrations/20260830040257_server_authoritative_zuno_stack_gelo.sql'
          test -s "$base"
          test -s "$board"
          test -s "$gelo"
          grep -q 'zuno_stack_server_power_loadout' "$base"
          grep -q 'trg_zuno_stack_power_state_guard' "$base"
          grep -q "p_power not in ('fluxo','troca','explosion','elo','fase','vortice','ima')" "$board"
          grep -q 'zuno_stack_timer_state_guard' "$gelo"
          grep -q 'stack_timer_invalid_start' "$gelo"
          grep -q "v_duration not in (180000,300000)" "$gelo"
          grep -q 'zuno_stack_apply_gelo_internal' "$gelo"
          grep -q "'geloExtensions'" "$gelo"
          grep -q "'deadlineAt',v_deadline" "$gelo"
          grep -q "'freezeUntil',v_freeze" "$gelo"
          grep -q 'security invoker' "$gelo"
          grep -q 'revoke all on function public.zuno_stack_gelo' "$gelo"
          grep -q "zuno_stack_gelo" zuno-stack-power-authority.js
          grep -Fq '/^(fluxo|troca|explosion|elo|fase|vortice|ima|gelo)$/' zuno-stack-power-authority.js
          grep -Fq '/^power_(fluxo|troca|explosion|elo|fase|vortice|ima|gelo)$/' zuno-stack-server-engine-guard.js
          grep -q 'ZunoStackPowerAuthority?.request' zuno-stack-server-engine-guard.js
          grep -q "resync('power_server_required')" zuno-stack-server-engine-guard.js
