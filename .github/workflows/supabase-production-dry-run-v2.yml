name: Supabase Production Migration Dry Run V2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/supabase-production-approved-migrations.txt'
      - '.github/workflows/supabase-production-dry-run-v2.yml'
      - '.github/workflows/supabase-production-apply-v2.yml'
      - '.github/workflows/supabase-production-cicd-static-guard-v2.yml'
      - 'scripts/supabase-production-plan.mjs'
      - 'supabase/reconciliation/**'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-dry-run-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_CLI_VERSION: '2.116.0'
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Build ledger-aware local production plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/supabase-production-plan.mjs --check --json | tee supabase-production-plan-local.json

      - name: Detect production dry-run capability
        id: remote
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_DB_URL:-}" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Production DB secret is available; value was not printed.'
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'Manual production dry-run requires repository secret SUPABASE_DB_URL.' >&2
            exit 20
          fi
          echo 'available=false' >> "$GITHUB_OUTPUT"
          echo 'PR context has no production DB secret; remote checks are intentionally skipped. Local ledger/allowlist/planner validation still ran.'

      - name: Read remote migration ledger
        if: steps.remote.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL" 2>&1 | tee supabase-production-ledger.log
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('supabase-production-ledger.log').read_text(errors='replace')
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          remote = []
          for raw in text.splitlines():
              line = ansi.sub('', raw)
              parts = line.split('|')
              if len(parts) < 2:
                  continue
              candidate = parts[1].strip()
              if re.fullmatch(r'\d{14}', candidate) and candidate not in remote:
                  remote.append(candidate)
          remote.sort()
          pathlib.Path('supabase-production-remote-versions.txt').write_text('\n'.join(remote) + ('\n' if remote else ''))
          print(f'Remote migration versions captured: {len(remote)}')
          PY

      - name: Reconcile committed ledger with production and classify pending migrations
        if: steps.remote.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/supabase-production-plan.mjs \
            --remote-versions-file supabase-production-remote-versions.txt \
            --check --json | tee supabase-production-plan-remote.json

      - name: Run official production dry-run
        if: steps.remote.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --dry-run --include-all --db-url "$SUPABASE_DB_URL" 2>&1 | tee supabase-production-dry-run.log

      - name: Verify dry-run equals approved truly-pending set
        if: steps.remote.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, sys
          plan = json.loads(pathlib.Path('supabase-production-plan-remote.json').read_text())
          expected = sorted(row['version'] for row in plan['classifications']['approvedPending'])
          pending = {row['version'] for row in plan['classifications']['pending']}
          dry = pathlib.Path('supabase-production-dry-run.log').read_text(errors='replace')
          observed = sorted({version for version in re.findall(r'(?<!\d)(\d{14})(?!\d)', dry) if version in pending})
          if observed != expected:
              print('FAIL-CLOSED: dry-run does not match ledger-aware approved pending set.')
              print('Expected pending:', ', '.join(expected) if expected else '<none>')
              print('Observed pending:', ', '.join(observed) if observed else '<none>')
              sys.exit(40)
          print('supabase_production_dry_run_v2_ok')
          print('Already applied:', len(plan['classifications']['alreadyApplied']))
          print('Approved pending:', ', '.join(expected) if expected else '<none>')
          print('Stale approvals tolerated:', ', '.join(plan['classifications']['staleApprovals']) if plan['classifications']['staleApprovals'] else '<none>')
          PY

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-dry-run-v2
          path: |
            supabase-production-plan-local.json
            supabase-production-ledger.log
            supabase-production-remote-versions.txt
            supabase-production-plan-remote.json
            supabase-production-dry-run.log
          if-no-files-found: ignore
