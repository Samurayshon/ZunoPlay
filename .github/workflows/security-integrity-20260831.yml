name: Security Integrity 2026-08-31

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Desafio score containment
        run: node tests/desafio-score-containment.test.mjs
      - name: Validate notification event integrity
        run: node tests/notification-event-integrity.test.mjs
      - name: Validate room reaction grant surface
        run: node tests/room-reaction-grants.test.mjs
      - name: Validate private helper caller identity
        run: node tests/private-helper-identity-guard.test.mjs
