name: Zuno Stack V2 Aura

on:
  push:
    branches:
      - 'codex/zuno-stack-v2-phase-10-*'
  pull_request:
    paths:
      - 'src/zuno-stack-v2/aura/**'
      - 'tests/zuno-stack-v2-aura-*.test.mjs'
      - '.github/workflows/zuno-stack-v2-aura.yml'

jobs:
  aura-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax gate
        run: |
          node --check src/zuno-stack-v2/aura/aura-contract.mjs
          node --check src/zuno-stack-v2/aura/aura-projection.mjs
          node --check src/zuno-stack-v2/aura/aura-presets.mjs
          node --check src/zuno-stack-v2/aura/aura-presentation-adapter.mjs
      - name: Frozen regression plus Aura
        run: >-
          node --test
          tests/zuno-stack-v2-core-*.test.mjs
          tests/zuno-stack-v2-solo-*.test.mjs
          tests/zuno-stack-v2-match-*.test.mjs
          tests/zuno-stack-v2-trio-*.test.mjs
          tests/zuno-stack-v2-pvp-*.test.mjs
          tests/zuno-stack-v2-ranking-*.test.mjs
          tests/zuno-stack-v2-player-authority-*.test.mjs
          tests/zuno-stack-v2-aura-*.test.mjs
