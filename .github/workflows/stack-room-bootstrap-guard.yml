name: Zuno Stack Room Bootstrap Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  stale-room-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate stale room recovery
        shell: bash
        run: |
          set -euo pipefail
          node --check zuno-stack-solo-authority-bootstrap.js
          node --check zuno-stack-authority-official.js
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const stale='c80c2f73-cd46-4b58-8c86-06f3588902a2';
          const active='7a38c442-a961-4c89-8d02-63e8d2eeb013';
          const userId='11111111-1111-4111-8111-111111111111';
          const store=new Map();
          const start={disabled:false,textContent:'JOGAR AGORA'};
          const location={href:`https://app.example/zuno-stack.html?room=${stale}`,search:`?room=${stale}`,pathname:'/zuno-stack.html',hash:''};
          const history={state:null,replaceState(_s,_t,next){const u=new URL(next,'https://app.example');location.href=u.href;location.search=u.search;location.pathname=u.pathname;location.hash=u.hash;}};
          function roomsQuery(){
            const filters={};
            const api={
              select(){return api},eq(k,v){filters[k]=v;return api},order(){return api},limit(){return api},
              async maybeSingle(){
                if(filters.id===stale)return {data:null,error:null};
                if(filters.owner_id===userId&&filters.status==='active'&&filters.description==='__zuno_stack_solo_authority__'&&filters.visibility==='private'&&filters.is_discoverable===false)return {data:{id:active},error:null};
                return {data:null,error:null};
              },
              async insert(){throw new Error('stale room recovery must reuse the existing solo room')}
            };
            return api;
          }
          const sb={
            auth:{async getSession(){return {data:{session:{user:{id:userId}}}}}},
            from(name){if(name==='rooms')return roomsQuery();if(name==='room_members')return {select(){return this},eq(){return this},async maybeSingle(){return {data:null,error:null}}};throw new Error(`unexpected table ${name}`)}
          };
          const document={
            readyState:'complete',
            getElementById(id){return id==='start'?start:null},
            createElement(){return {addEventListener(){}}},
            head:{appendChild(el){if(String(el.src||'').includes('zuno-stack-authority-official.js')){window.ZunoStackAuthority={};queueMicrotask(()=>el.onload?.())}}}
          };
          const window={ZunoSupabaseClient:sb,addEventListener(){},__ZUNO_STACK_AUTHORITY_OFFICIAL__:false};
          const context={window,document,location,history,sessionStorage:{setItem(k,v){store.set(k,v)},getItem(k){return store.get(k)||null},removeItem(k){store.delete(k)}},URL,URLSearchParams,crypto:require('crypto').webcrypto,console,setTimeout,clearTimeout,Promise,queueMicrotask};
          context.globalThis=context;
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('zuno-stack-solo-authority-bootstrap.js','utf8'),context);
          setTimeout(()=>{
            if(window.__ZUNO_STACK_AUTHORITY_ROOM_ID__!==active)throw new Error(`resolved room mismatch: ${window.__ZUNO_STACK_AUTHORITY_ROOM_ID__}`);
            if(store.get('zunoplay_room_id')!==active)throw new Error('resolved room was not persisted');
            if(location.search.includes('room='))throw new Error(`stale room query survived: ${location.search}`);
            if(start.disabled)throw new Error('start button remained disabled after authority recovery');
            if(start.textContent!=='JOGAR AGORA')throw new Error(`start label mismatch: ${start.textContent}`);
            console.log('stale room recovery ok');
          },50);
          NODE

      - name: Guard resolved room precedence
        shell: bash
        run: |
          set -euo pipefail
          grep -q "window.__ZUNO_STACK_AUTHORITY_ROOM_ID__=roomId" zuno-stack-solo-authority-bootstrap.js
          grep -q "window.__ZUNO_STACK_AUTHORITY_ROOM_ID__||q.get('room')" zuno-stack-authority-official.js
          grep -q "reusableSoloRoom" zuno-stack-solo-authority-bootstrap.js
          grep -q "canUseRoom" zuno-stack-solo-authority-bootstrap.js
