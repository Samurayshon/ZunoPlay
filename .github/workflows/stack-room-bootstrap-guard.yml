name: Zuno Stack Room Bootstrap Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  stale-room-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate canonical Stack runtime scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check zuno-stack-solo-authority-bootstrap.js
          node --check zuno-stack-authority-official.js
          node --check zuno-stack-actions-authority.js
          node --check zuno-stack-performance-official.js
          node tests/zuno-stack-cache-version.test.mjs
          node tests/zuno-stack-canonical-runtime.test.mjs
          node tests/zuno-stack-fresh-solo-round.test.mjs

      - name: Reproduce validated room publication race
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const assert=require('assert/strict');
          const candidate='8abf4b48-fc59-4a8a-b447-9fef32994a3f';
          const active='99a7f21b-0f22-4aec-a97e-33465946b022';
          const userId='11111111-1111-4111-8111-111111111111';
          const store=new Map(),events=[];
          const start={disabled:false,textContent:'JOGAR AGORA',setAttribute(){},removeAttribute(){}};
          const board={style:{}};
          let authorityInjectedFor='';
          const location={href:'https://app.example/zuno-stack.html',search:'',pathname:'/zuno-stack.html',hash:''};
          const history={state:null,replaceState(){}};
          function roomsQuery(){const filters={};const api={select(){return api},eq(k,v){filters[k]=v;return api},order(){return api},limit(){return api},async maybeSingle(){if(filters.owner_id===userId&&filters.status==='active'&&filters.description==='__zuno_stack_solo_authority__'&&filters.visibility==='private'&&filters.is_discoverable===false){await new Promise(r=>setTimeout(r,20));return {data:{id:active},error:null}}return {data:null,error:null}},async insert(){return {error:{code:'23505',message:'duplicate active room'}}}};return api}
          const sb={auth:{async getSession(){return {data:{session:{user:{id:userId}}}}}},from(name){if(name==='rooms')return roomsQuery();if(name==='room_members')return {select(){return this},eq(){return this},async maybeSingle(){return {data:null,error:null}}};if(name==='zuno_stack_match_state')return {select(){return this},eq(){return this},async maybeSingle(){return {data:null,error:null}}};throw new Error(`unexpected table ${name}`)}};
          const document={readyState:'complete',documentElement:{dataset:{}},getElementById(id){return id==='start'?start:id==='board'?board:null},querySelector(){return null},addEventListener(){},removeEventListener(){},dispatchEvent(e){events.push(e)},createElement(){return {dataset:{},addEventListener(){}}},head:{appendChild(el){if(String(el.src||'').includes('zuno-stack-authority-official.js')){authorityInjectedFor=window.__ZUNO_STACK_AUTHORITY_ROOM_ID__||'';window.ZunoStackAuthority={getState(){return {roomId:authorityInjectedFor}}}}}}};
          const window={ZunoSupabaseClient:sb,addEventListener(){}};
          const crypto={randomUUID(){return candidate}};
          function CustomEvent(type,opts={}){this.type=type;this.detail=opts.detail}
          const context={window,document,location,history,sessionStorage:{setItem(k,v){store.set(k,v)},getItem(k){return store.get(k)||null},removeItem(k){store.delete(k)}},URL,URLSearchParams,crypto,console,setTimeout,clearTimeout,Promise,CustomEvent};context.globalThis=context;vm.createContext(context);
          vm.runInContext(fs.readFileSync('zuno-stack-solo-authority-bootstrap.js','utf8'),context);
          assert.equal(window.__ZUNO_STACK_AUTHORITY_ROOM_READY__,false);
          assert.equal(window.__ZUNO_STACK_AUTHORITY_ROOM_ID__,undefined,'candidate room published before validation');
          setTimeout(()=>{assert.equal(window.__ZUNO_STACK_AUTHORITY_ROOM_ID__,active);assert.equal(store.get('zunoplay_room_id'),active);assert.equal(window.__ZUNO_STACK_AUTHORITY_ROOM_READY__,true);assert.equal(authorityInjectedFor,active);assert.ok(events.some(e=>e.type==='zuno:stack-authority-room-ready'&&e.detail?.roomId===active));assert.equal(start.disabled,false);console.log('canonical authority room race guard ok')},150);
          NODE

      - name: Guard canonical authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          boot=Path('zuno-stack-solo-authority-bootstrap.js').read_text()
          perf=Path('zuno-stack-performance-official.js').read_text()
          auth=Path('zuno-stack-authority-official.js').read_text()
          actions=Path('zuno-stack-actions-authority.js').read_text()
          prefix=boot.split('async function canUseRoom',1)[0]
          if 'persistRoom();' in prefix: raise SystemExit('candidate room persisted before validation')
          for token in ["window.__ZUNO_STACK_AUTHORITY_ROOM_READY__=false","window.__ZUNO_STACK_AUTHORITY_ROOM_READY__=true","zuno:stack-authority-room-ready","zuno_stack_abandon_solo_round","captureStart","waitServerActive"]:
              if token not in boot: raise SystemExit(f'missing canonical bootstrap gate: {token}')
          if "if(!window.__ZUNO_STACK_AUTHORITY_ROOM_READY__||!window.__ZUNO_STACK_AUTHORITY_ROOM_ID__)return false" not in perf: raise SystemExit('authority modules not gated by validated room')
          if "zuno-stack-actions-authority.js?v=1" not in perf: raise SystemExit('consolidated actions authority not loaded')
          if "window.__ZUNO_STACK_AUTHORITY_ROOM_ID__||q.get('room')" not in auth: raise SystemExit('main authority does not prioritize resolved room')
          if "document.addEventListener('click',capture,true)" not in actions: raise SystemExit('canonical actions capture missing')
          for old in ['tile-bridge','fresh-round-guard','server-engine-guard','relay-authority.js','pulse-authority.js','hint-authority.js','power-authority.js']:
              if old in perf: raise SystemExit(f'obsolete authority layer referenced: {old}')
          print('canonical room, start and action authority gates ok')
          PY
