name: One-time frontend generation sync v341

on:
  push:
    branches: [main]
    paths:
      - '.zuno-sync-v341'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align active core runtime cachebusters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          for path in pathlib.Path('.').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              text=re.sub(r'nav\.js\?v=\d+', 'nav.js?v=341', text)
              text=re.sub(r'zuno-current\.js\?v=\d+', 'zuno-current.js?v=341', text)
              text=re.sub(r'home-app\.js\?v=\d+', 'home-app.js?v=341', text)
              path.write_text(text,encoding='utf-8')
          PY
          rm -f .zuno-sync-v341
          git config user.name 'ZunoPlay Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(frontend): align active runtime cachebusters v341'
          git push