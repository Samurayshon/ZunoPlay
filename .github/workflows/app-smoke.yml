name: ZunoPlay App Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          node --check scripts/repo-audit.mjs

      - name: Validate inline application scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,subprocess,tempfile,sys
          files=['index.html','entrada.html','login.html','cadastro.html','sala.html','jogos.html','pulso.html','zuno-stack.html','historico.html']
          failed=False
          for name in files:
              text=pathlib.Path(name).read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',text,re.I|re.S)
              for i,code in enumerate(blocks,1):
                  with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False) as f:
                      f.write(code); tmp=f.name
                  result=subprocess.run(['node','--check',tmp],capture_output=True,text=True)
                  if result.returncode:
                      failed=True; print(f'Inline JS error: {name} block {i}'); print(result.stderr)
          if failed: sys.exit(1)
          PY

      - name: Validate critical application files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html entrada.html login.html cadastro.html perfil.html avatar.html amigos.html conversas.html notificacoes.html comunidades.html
            salas.html sala.html jogos.html historico.html pulso.html zuno-stack.html manifest.json sw.js nav.js
            home-app.js realtime-global.js room-session-guard.js zuno-room-app.js zuno-room-v1-core.js zuno-room-experience-v2.js
            zuno-room-controls-v2.js zuno-room-composer-v2.js voz-sala-v2.js zuno-room-access-v1.js zuno-room-invite-entry-v1.js presenca-sala.js
            avatar-renderer.js avatar-home-sync.js zuno-notifications.js zuno-messages.js zuno-pulso-v3.js zuno-pulso-v6.js
            zuno-stack.js zuno-stack-pieces.js zuno-stack-pieces.css zuno-stack-performance-official.js zuno-stack-combo-chain.js zuno-stack-combo-chain.css
          )
          for file in "${required[@]}"; do test -s "$file" || { echo "Missing/empty critical file: $file"; exit 1; }; done

      - name: Audit active dependency graph
        run: node scripts/repo-audit.mjs

      - name: Guard removed prototypes and dead layers
        shell: bash
        run: |
          set -euo pipefail
          removed=(
            sala-v200.html zuno-room-app-v200.js avatar-asset-registry.js avatar-preview-sync.js avatar-stage-controls.js legal.html
            zuno-current-hero-separation.css zuno-current-home-polish-v164.css zuno-current-shell-v173.css zuno-current-viewport-v154.css zuno-current-viewport.css zuno-home-reference-v152.css
            zuno-navigation.css zuno-navigation.js zuno-moments.js zuno-pulso-v2.js zuno-pulso-v4.css zuno-pulso-v4.js zuno-pulso-v5.js
            zuno-directed-gifts.css zuno-directed-gifts.js zuno-room-chat-fix-v1.css zuno-room-games.js zuno-room-immersive-v1.css zuno-room-live-feed-v1.css
            zuno-room-moderation.css zuno-room-moderation.js zuno-room-profile-card.css zuno-room-profile-card.js zuno-room-voice-headless-v1.js zuno-voice-feedback.css zuno-voice-feedback.js
            zuno-stack-pieces.svg zuno-stack-pieces.webp zuno-core.html zuno-core.js zuno-core-v04.js zuno-core-v05.js zuno-core-v05-engine.js
            desafio.html partida.html reflexo.html precisao.html arena.html zuno-caos.html zuno-rush.html zuno-pulse.html
            zuno-home-auth-gate.js zuno-home-header-guard.js zuno-home-header-guard.css zuno-final-audit.js zuno-final-audit.css
            zuno-pulso-discover-rescue-v303.js zuno-pulso-discover-v15.css zuno-pulso-discover-v15.js zuno-pulso-discover-v9.css zuno-pulso-discover-v9.js
            zuno-pulso-discovery-nav-v10.css zuno-pulso-discovery-nav-v10.js zuno-pulso-header-v7.css
            zuno-room-connection-fix.js zuno-room-controls-clean-v1.js zuno-room-controls-v1.js zuno-room-experience.js
            zuno-stack-endgame.css zuno-stack-endgame.js zuno-stack-final-compose.js zuno-stack-gameplay-state.js zuno-stack-streak-official.css zuno-stack-streak-official.js
          )
          for file in "${removed[@]}"; do if test -e "$file"; then echo "Dead/prototype file returned: $file"; exit 1; fi; done

      - name: Validate frontend generation consistency
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          nav=pathlib.Path('nav.js').read_text(); sw=pathlib.Path('sw.js').read_text(); current=pathlib.Path('zuno-current.js').read_text()
          n=re.search(r"const V='(\d+)'",nav); s=re.search(r'CACHE_NAME="zunoplay-v(\d+)"',sw); c=re.search(r"const VERSION='(\d+)'",current)
          if not all((n,s,c)) or len({n.group(1),s.group(1),c.group(1)})!=1: raise SystemExit('frontend generation mismatch')
          if f'__ZUNOPLAY_GLOBAL_BOOT_V{n.group(1)}__' not in nav: raise SystemExit('global boot marker mismatch')
          if f'zuno-sw-v{n.group(1)}-reloaded' not in current: raise SystemExit('service worker refresh marker mismatch')
          print('frontend generation v'+n.group(1))
          PY

      - name: Validate resilient PWA behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AbortController' sw.js
          grep -q "notificationclick" sw.js
          grep -q "addEventListener('push'" sw.js
          ! grep -q 'cache.addAll' sw.js
          python3 - <<'PY'
          import pathlib,re,json
          text=pathlib.Path('sw.js').read_text()
          m=re.search(r'const STATIC_FILES=(\[.*?\]);',text,re.S)
          if not m: raise SystemExit('STATIC_FILES missing')
          files=json.loads(m.group(1)); missing=[]
          for item in files:
              p=item.split('?',1)[0].removeprefix('./')
              if p and p!='.' and not pathlib.Path(p).exists(): missing.append(item)
          if missing: raise SystemExit('Missing precache assets: '+', '.join(missing))
          PY

      - name: Guard canonical Home boot
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'user_metadata' home-app.js
          grep -Fq "currentProfile?.username" home-app.js
          ! grep -q 'zuno-home-auth-gate' nav.js
          ! grep -q 'zuno-final-audit' nav.js
          ! grep -q 'id="searchBackdrop"' index.html
          ! grep -q 'class="topbar"' index.html
          grep -q "zuno-stack.html" index.html

      - name: Guard current product invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Zuno Stack' jogos.html
          grep -q 'TRAY_LIMIT=7' zuno-stack.js
          grep -q 'RISK_AT=6' zuno-stack.js
          grep -q 'TOTAL_TILES=90' zuno-stack.js
          grep -q "new URL('jogos.html'" zuno-room-experience-v2.js
          grep -q 'zunoplay_zuno_stack_last_result' zuno-stack.js
          ! grep -RIn --include='zuno-stack*.js' "sb.rpc('submit_zuno_stack_result'" . || { echo 'Unsafe Zuno Stack reward RPC returned'; exit 1; }
          grep -q 'zuno-pulso-v6.js' pulso.html
          grep -q 'zuno-pulso-header-v8.js' pulso.html

      - name: Guard against accidental server secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_pat='sb''_secret_'; role_pat='service''_role'
          if grep -RIn --exclude-dir=.git --exclude='*.md' --exclude='*.yml' -E "${secret_pat}" .; then echo 'Potential Supabase secret key found.'; exit 1; fi
          if grep -RIn --exclude-dir=.git --exclude='*.md' --exclude='*.yml' --exclude='*.sql' -E "${role_pat}" .; then echo 'Potential service role exposure found outside SQL migrations.'; exit 1; fi