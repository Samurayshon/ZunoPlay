name: Zuno Stack V2 Core Block 1

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/zuno-stack-v2/core/**'
      - 'tests/zuno-stack-v2-core-*.test.mjs'
      - '.github/workflows/stack-v2-core-block1.yml'
  push:
    branches: [main]
    paths:
      - 'src/zuno-stack-v2/core/**'
      - 'tests/zuno-stack-v2-core-*.test.mjs'
      - '.github/workflows/stack-v2-core-block1.yml'

permissions:
  contents: read

jobs:
  core-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Core syntax
        run: |
          set -euo pipefail
          for file in src/zuno-stack-v2/core/*.mjs; do node --check "$file"; done
      - name: Run Core foundation behavior tests
        run: node tests/zuno-stack-v2-core-block1.test.mjs
      - name: Guard Core architectural boundaries
        run: node tests/zuno-stack-v2-core-boundaries.test.mjs
