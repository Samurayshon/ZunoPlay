<style>
:root{--cyan:#52e9ff;--purple:#9d4dff;--pink:#ff4fd8;--panel:#0b1020;--muted:#8b97ad;--line:#ffffff14}*{box-sizing:border-box}html{background:#02040b}body{margin:0;background:#02040b;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;cursor:pointer}.app{width:min(100%,540px);min-height:100vh;margin:auto;padding:12px 14px calc(30px + env(safe-area-inset-bottom));background:radial-gradient(circle at 15% 8%,rgba(126,48,255,.32),transparent 25%),radial-gradient(circle at 92% 35%,rgba(0,216,255,.16),transparent 25%),linear-gradient(180deg,#060a18,#030611 58%,#080518)}.top{height:58px;display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center}.iconBtn{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:#10172bd9;display:grid;place-items:center}.brand{display:flex;align-items:center;gap:9px;min-width:0}.mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:1000;background:linear-gradient(135deg,#25dfff,#873cff 52%,#ff3ec8);box-shadow:0 0 24px #873cff55}.brand h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:7px}.hero{height:414px;position:relative;overflow:hidden;border:1px solid #9b6cff32;border-radius:28px;background:radial-gradient(ellipse at 50% 65%,#7c3aed40,transparent 39%),linear-gradient(180deg,#0b1024,#050817);box-shadow:inset 0 0 60px #6d28d91f,0 18px 50px #0009}.hero:after{content:"";position:absolute;left:50%;bottom:46px;transform:translateX(-50%) perspective(240px) rotateX(68deg);width:224px;height:56px;border:2px solid #7258ff;border-radius:50%;box-shadow:0 0 30px #8b5cf688,inset 0 0 24px #22d3ee42}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#58eaff 1px,transparent 1px);background-size:47px 47px,71px 71px;opacity:.14}.pulseLabel{position:absolute;left:15px;top:15px;z-index:8;padding:7px 10px;border-radius:12px;border:1px solid #a959ff44;background:#120d27df;font-size:10px;color:#c9adff}.pulseLabel b{color:#58eaff}.modelSwitch{position:absolute;right:14px;top:14px;z-index:9;display:flex;padding:3px;border-radius:13px;background:#080d19e6;border:1px solid var(--line)}.modelSwitch button{border:0;background:transparent;color:#7f8da5;padding:7px 9px;border-radius:10px;font-size:9px;font-weight:800}.modelSwitch button.on{color:#fff;background:linear-gradient(135deg,#7837df,#155e75);box-shadow:0 0 18px #7c3aed45}.pulse{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);width:275px;height:275px;border:1px solid #a855f755;border-radius:50%;opacity:.72;transition:.2s}.hero.voice .pulse{animation:voicePulse .7s infinite alternate;box-shadow:0 0 42px #52e9ff66}@keyframes voicePulse{to{transform:translate(-50%,-50%) scale(1.1);opacity:.32}}.stage{position:absolute;left:50%;top:47px;transform:translateX(-50%) rotateY(var(--rot,0deg)) scale(var(--scale,1));width:245px;height:330px;z-index:4;transition:.25s ease;transform-origin:50% 58%;filter:drop-shadow(0 0 18px #6128a755)}.stage img{width:100%;height:100%;object-fit:contain;display:block}.hero.profile .stage{top:75px;--scale:1.42}.hero.room .stage{top:57px;--scale:1.15}.viewTools{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:center;z-index:10}.toolGroup{display:flex;gap:6px}.tool{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:11px;background:#10172be8;font-size:10px}.mode{display:flex;padding:3px;border-radius:12px;background:#080d19e8;border:1px solid var(--line)}.mode button{border:0;background:transparent;padding:7px 8px;border-radius:9px;color:#8290a8;font-size:9px}.mode button.on{background:linear-gradient(135deg,#7837df,#175f8d);color:#fff}.identity{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:13px 2px 2px}.identity strong{font-size:13px}.identity span{font-size:10px;color:#8c9ab0}.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 1px 9px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{min-width:70px;height:61px;border:1px solid var(--line);border-radius:16px;background:#0d1324;color:#8f9bb1;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.tab .ico{font-size:18px}.tab.on{color:#fff;border-color:#8954ff88;background:linear-gradient(145deg,#231448,#0c2037)}.panel{border:1px solid var(--line);border-radius:22px;background:#0b1020cc;padding:13px}.panelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.panelHead strong{font-size:14px}.panelHead small{color:#7f8da6;font-size:10px}.mix{font-size:9px;color:#8fa1bc;margin-bottom:10px;line-height:1.45}.mix b{color:#59eaff}.options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.option{min-height:82px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#172038,#0a0f1c);position:relative;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:5px}.option.on{border-color:#64e8ff;box-shadow:inset 0 0 0 1px #9a4cff,0 0 18px #6d28d922}.thumb{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#293653,#131a2b);display:grid;place-items:center;font-size:19px;box-shadow:inset 0 0 18px #7c3aed18}.label{text-align:center;font-size:8px;color:#a6b2c5;line-height:1.15}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:13px}.controls small{color:#8795ac;font-size:9px;min-width:44px}.color{width:27px;height:27px;border:2px solid #fff2;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px #0003}.color.on{outline:2px solid #55e9ff;outline-offset:2px}.save{width:100%;height:55px;margin-top:13px;border:0;border-radius:17px;background:linear-gradient(105deg,#7c3aed,#bb3ee9 50%,#16d9ed);font-weight:1000;letter-spacing:.5px;box-shadow:0 0 28px #7c3aed55}.saved{display:flex;justify-content:center;gap:10px;margin-top:12px}.slot{width:72px;height:44px;border:1px dashed #58647b;border-radius:12px;background:#0b1020;position:relative}.slot.filled{border-style:solid;border-color:#7b53e7;background:linear-gradient(145deg,#1b1434,#0c1728)}.slot.active{outline:2px solid #52e9ff;outline-offset:2px}.slot span{position:absolute;inset:0;display:grid;place-items:center;color:#8190aa;font-size:9px}.status{text-align:center;margin-top:10px;font-size:9px;color:#7890ad}.status.ok{color:#69e8b8}.hint{text-align:center;margin-top:8px;font-size:9px;color:#59667c}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);padding:11px 15px;border-radius:13px;background:#11192dee;border:1px solid #8654ff66;font-size:11px;opacity:0;transition:.2s;pointer-events:none;z-index:99;max-width:86%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:390px){.hero{height:395px}.stage{width:225px;height:312px}.viewTools{bottom:9px}.mode button{padding:6px 6px;font-size:8px}.options{gap:6px}.option{min-height:78px}.modelSwitch button{padding:6px 7px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><button class="iconBtn" id="back" aria-label="Voltar">‹</button><div class="brand"><div class="mark">Z</div><h1>Zuno Avatar Studio</h1></div><div class="actions"><button class="iconBtn" id="undo" aria-label="Desfazer">↶</button><button class="iconBtn" id="saveTop" aria-label="Salvar">▣</button></div></header>
<section class="hero" id="hero"><div class="stars"></div><button class="pulseLabel" id="pulseLabel"><b>Zuno Pulse</b> · testar reação</button><div class="modelSwitch" id="modelSwitch"><button data-model="masculino" class="on">Masculino</button><button data-model="feminino">Feminino</button></div><div class="pulse"></div><div class="stage" id="stage"><img id="avatarPreview" alt="Avatar Zuno"></div><div class="viewTools"><div class="toolGroup"><button class="tool" id="rotate">↻ Girar</button><button class="tool" id="zoom">⌕ Ampliar</button></div><div class="mode" id="modes"><button data-mode="Perfil">Perfil</button><button data-mode="Sala de voz">Sala</button><button class="on" data-mode="Corpo inteiro">Corpo</button></div></div></section>
<div class="identity"><strong id="identityTitle">Avatar masculino</strong><span id="identityMeta">Estilo oficial Zuno</span></div><nav class="tabs" id="tabs" aria-label="Categorias do avatar"></nav>
<section class="panel"><div class="panelHead"><strong id="panelTitle">Base</strong><small id="selectedInfo"></small></div><div class="mix"><b>Avatar Studio:</b> personalize o mesmo personagem que aparece na Home, Perfil e superfícies sociais compatíveis.</div><div class="options" id="options"></div><div class="controls" id="controls"></div></section>
<button class="save" id="save">SALVAR MEU ZUNO</button><div class="saved" id="saved"><button class="slot" data-slot="0"><span>Visual 1</span></button><button class="slot" data-slot="1"><span>Visual 2</span></button><button class="slot" data-slot="2"><span>Visual 3</span></button></div><div class="status" id="status">Carregando configuração...</div><div class="hint">Zuno Avatar System · masculino + feminino</div>
</main><div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://rliymfbbhqoejgfvsbuu.supabase.co',SUPABASE_KEY='sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0';
const DATA={Base:['Equilibrado','Atlético','Curvilíneo','Alto'],Rosto:['Suave','Marcado','Angular','Jovem'],Cabelo:['Curto','Anime','Longo','Fade'],Roupas:['Street Z','Techwear','Casual','Cyber'],Calçados:['Sneaker Z','Runner','Bota Tech','High-top'],Acessórios:['Nenhum','Óculos','Headset','Colar'],Mascote:['Sem mascote','Zuno Fox','Zuno Cat','Z-Bot'],Efeitos:['Sem efeito','Zuno Pulse','Aura Ciano','Aura Rosa']};
const ICON={Base:'◉',Rosto:'◌',Cabelo:'✦',Roupas:'♢',Calçados:'▰',Acessórios:'✧',Mascote:'◆',Efeitos:'✺'};
const PALETTES={pele:['#f2c7a5','#dfa482','#c9825d','#9d6248','#714735','#442d28'],cabelo:['#141725','#2b1b19','#5d3828','#9b6a43','#cfd5e4','#6d36d9','#1cc9d7'],roupa:['#7c3aed','#a855f7','#22d3ee','#ec4899','#f59e0b','#10b981','#eef2ff']};
const DEFAULT={style:'zuno-studio-v1',version:2,model:'masculino',selections:{Base:0,Rosto:0,Cabelo:0,Roupas:0,Calçados:0,Acessórios:0,Mascote:1,Efeitos:1},colors:{pele:1,cabelo:0,roupa:0},mode:'Corpo inteiro',rotation:0,zoom:1,updatedAt:null};
let state=clone(DEFAULT),history=[],cat='Base',activeSlot=null,slots=[null,null,null],sb=null,rendererReady=false;const $=s=>document.querySelector(s),hero=$('#hero'),stage=$('#stage'),preview=$('#avatarPreview'),toast=$('#toast'),statusEl=$('#status');
function clone(v){return JSON.parse(JSON.stringify(v))}function clamp(n,min,max){n=Number(n);return Number.isFinite(n)?Math.max(min,Math.min(max,n)):min}
function safeConfig(v){const c=clone(DEFAULT);if(!v||typeof v!=='object')return c;c.model=v.model==='feminino'?'feminino':'masculino';if(v.selections)Object.keys(c.selections).forEach(k=>c.selections[k]=clamp(v.selections[k],0,DATA[k].length-1));if(v.colors){c.colors.pele=clamp(v.colors.pele,0,PALETTES.pele.length-1);c.colors.cabelo=clamp(v.colors.cabelo,0,PALETTES.cabelo.length-1);c.colors.roupa=clamp(v.colors.roupa,0,PALETTES.roupa.length-1)}c.mode=['Perfil','Sala de voz','Corpo inteiro'].includes(v.mode)?v.mode:'Corpo inteiro';c.rotation=Number(v.rotation)||0;c.zoom=Math.max(.8,Math.min(1.6,Number(v.zoom)||1));c.updatedAt=v.updatedAt||null;c.version=2;return c}
function show(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('show'),1700)}function push(){history.push(clone(state));if(history.length>30)history.shift()}function renderer(){return window.ZunoAvatarRenderer||null}
function renderTabs(){const t=$('#tabs');t.innerHTML='';Object.keys(DATA).forEach(k=>{const b=document.createElement('button');b.className='tab'+(k===cat?' on':'');b.innerHTML=`<span class="ico">${ICON[k]}</span>${k}`;b.onclick=()=>{cat=k;renderTabs();renderOptions()};t.appendChild(b)})}
function renderOptions(){$('#panelTitle').textContent=cat;$('#selectedInfo').textContent='Selecionado: '+DATA[cat][state.selections[cat]];const o=$('#options');o.innerHTML='';DATA[cat].forEach((name,i)=>{const b=document.createElement('button');b.className='option'+(state.selections[cat]===i?' on':'');b.innerHTML=`<span class="thumb">${ICON[cat]}</span><span class="label">${name}</span>`;b.onclick=()=>{push();state.selections[cat]=i;renderOptions();applyPreview()};o.appendChild(b)});renderControls()}
function renderControls(){const c=$('#controls');c.innerHTML='';let key=null,label='Cores';if(cat==='Base'||cat==='Rosto'){key='pele';label='Pele'}else if(cat==='Cabelo'){key='cabelo';label='Cabelo'}else if(cat==='Roupas'||cat==='Calçados'||cat==='Acessórios'||cat==='Efeitos'){key='roupa';label='Cor Zuno'}const small=document.createElement('small');small.textContent=label;c.appendChild(small);if(!key){const muted=document.createElement('span');muted.style.cssText='font-size:9px;color:#59667c';muted.textContent='Sem ajuste de cor';c.appendChild(muted);return}PALETTES[key].forEach((v,i)=>{const b=document.createElement('button');b.className='color'+(state.colors[key]===i?' on':'');b.style.setProperty('--c',v);b.setAttribute('aria-label',label+' '+(i+1));b.onclick=()=>{push();state.colors[key]=i;renderControls();applyPreview()};c.appendChild(b)})}
function renderModel(){document.querySelectorAll('#modelSwitch [data-model]').forEach(b=>b.classList.toggle('on',b.dataset.model===state.model));$('#identityTitle').textContent=state.model==='feminino'?'Avatar feminino':'Avatar masculino';$('#identityMeta').textContent=state.model==='feminino'?'Modelo oficial feminino':'Modelo oficial masculino'}
function applyPreview(){renderModel();hero.classList.toggle('voice',state.mode==='Sala de voz'||state.selections.Efeitos===1);hero.classList.toggle('profile',state.mode==='Perfil');hero.classList.toggle('room',state.mode==='Sala de voz');stage.style.setProperty('--rot',state.rotation+'deg');stage.style.setProperty('--scale',state.zoom);document.querySelectorAll('#modes [data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.mode));const r=renderer();if(r){state=r.normalize?.(state)||state;r.mount(preview,state);rendererReady=true}else{preview.removeAttribute('src');preview.alt='Carregando renderizador do avatar...'}}
function renderSlots(){document.querySelectorAll('.slot').forEach((b,i)=>{b.classList.toggle('filled',!!slots[i]);b.classList.toggle('active',activeSlot===i);b.querySelector('span').textContent=slots[i]?'Visual '+(i+1)+' ✓':'Visual '+(i+1)})}function renderAll(){renderTabs();renderOptions();renderSlots();renderModel();applyPreview()}
function writeLocal(){localStorage.setItem('zunoAvatarPreset',JSON.stringify(state));localStorage.setItem('zunoAvatarLooks',JSON.stringify(slots));localStorage.setItem('zunoAvatarActiveSlot',activeSlot===null?'':String(activeSlot))}
async function getClient(){if(sb)return sb;if(window.ZunoSupabaseClient)return sb=window.ZunoSupabaseClient;if(window.supabase?.createClient)return sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return null}
async function saveCurrent(){state.version=2;state.updatedAt=new Date().toISOString();if(activeSlot===null){activeSlot=slots.findIndex(v=>!v);if(activeSlot<0)activeSlot=0}slots[activeSlot]=clone(state);writeLocal();renderSlots();statusEl.textContent='Salvo neste aparelho';statusEl.className='status ok';let cloud=false;try{const client=await getClient();if(client){const {data:{user}}=await client.auth.getUser();if(user){const {error}=await client.from('profiles').update({avatar_config:state}).eq('id',user.id);if(!error){cloud=true;statusEl.textContent='Salvo no aparelho e na conta';statusEl.className='status ok'}}}}catch(e){console.warn('Zuno Studio save:',e)}window.dispatchEvent(new CustomEvent('zuno-avatar-saved',{detail:clone(state)}));show(cloud?'Seu Zuno foi salvo na conta.':'Seu Zuno foi salvo neste aparelho.')}
async function loadInitial(){try{const raw=JSON.parse(localStorage.getItem('zunoAvatarLooks')||'null');if(Array.isArray(raw))slots=[0,1,2].map(i=>raw[i]?safeConfig(raw[i]):null);const a=localStorage.getItem('zunoAvatarActiveSlot');if(a!==null&&a!=='')activeSlot=clamp(a,0,2);const local=JSON.parse(localStorage.getItem('zunoAvatarPreset')||'null');if(local?.style==='zuno-studio-v1')state=safeConfig(local)}catch(_){}try{const client=await getClient();if(client){const {data:{user}}=await client.auth.getUser();if(user){const {data,error}=await client.from('profiles').select('avatar_config').eq('id',user.id).maybeSingle();if(!error&&data?.avatar_config?.style==='zuno-studio-v1'){state=safeConfig(data.avatar_config);localStorage.setItem('zunoAvatarPreset',JSON.stringify(state));statusEl.textContent='Configuração carregada da sua conta';statusEl.className='status ok'}else{statusEl.textContent='Configuração local carregada';statusEl.className='status ok'}}else statusEl.textContent='Modo local · faça login para sincronizar'}}catch(_){statusEl.textContent='Configuração local carregada';statusEl.className='status ok'}renderAll()}
$('#back').onclick=()=>history.back();$('#undo').onclick=()=>{if(!history.length)return show('Nada para desfazer.');state=history.pop();renderAll()};$('#rotate').onclick=()=>{push();state.rotation=(state.rotation+45)%360;applyPreview()};$('#zoom').onclick=()=>{push();state.zoom=state.zoom>=1.25?1:Math.round((state.zoom+.1)*10)/10;applyPreview()};document.querySelectorAll('#modelSwitch [data-model]').forEach(b=>b.onclick=()=>{if(state.model===b.dataset.model)return;push();state.model=b.dataset.model;applyPreview()});document.querySelectorAll('#modes [data-mode]').forEach(b=>b.onclick=()=>{push();state.mode=b.dataset.mode;applyPreview()});$('#pulseLabel').onclick=()=>{hero.classList.add('voice');setTimeout(()=>{if(state.mode!=='Sala de voz'&&state.selections.Efeitos!==1)hero.classList.remove('voice')},1200)};document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.slot);activeSlot=i;if(slots[i]){push();state=safeConfig(slots[i]);show('Visual '+(i+1)+' carregado.');renderAll()}else{renderSlots();show('Visual '+(i+1)+' selecionado para salvar.')}});$('#save').onclick=saveCurrent;$('#saveTop').onclick=saveCurrent;window.addEventListener('zuno-avatar-renderer-ready',()=>{rendererReady=true;applyPreview()});loadInitial();[120,350,800,1500].forEach(ms=>setTimeout(()=>{if(!rendererReady)applyPreview()},ms));
</script>
</body>
</html>
