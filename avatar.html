function mountUI(){ $('tabs').innerHTML=TABS.map(([id,l])=>`<button class="tab ${active===id?'active':''}" data-tab="${id}">${l}</button>`).join('');$('panels').innerHTML=TABS.map(([id])=>`<div class="panel ${active===id?'active':''}" data-panel="${id}">${panelContent(id)}</div>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;mountUI()});document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{state[b.dataset.key]=b.dataset.value;if(b.dataset.key==='body'&&state.body==='male'&&['long','layered','bob','pony'].includes(state.hairStyle))state.hairStyle='spike';render();mountUI()})}

function faceParts(){const rx=state.face==='round'?52:state.face==='sharp'?47:50,ry=state.face==='round'?57:63;const eyeY=155;let eyes=state.eyeStyle==='calm'?`<path d="M145 ${eyeY}q13 9 26 0M189 ${eyeY}q13 9 26 0" fill="none" stroke="#27222c" stroke-width="6"/>`:`<ellipse cx="158" cy="${eyeY}" rx="13" ry="${state.eyeStyle==='bold'?15:17}" fill="#f6f4ff"/><ellipse cx="202" cy="${eyeY}" rx="13" ry="${state.eyeStyle==='bold'?15:17}" fill="#f6f4ff"/><ellipse cx="158" cy="157" rx="7" ry="10" fill="${state.eyeColor}"/><ellipse cx="202" cy="157" rx="7" ry="10" fill="${state.eyeColor}"/><circle cx="160" cy="153" r="2.5" fill="#fff"/><circle cx="204" cy="153" r="2.5" fill="#fff"/>`;return `<ellipse cx="180" cy="158" rx="${rx}" ry="${ry}" fill="${state.skin}" stroke="#2a2028" stroke-width="4"/>${eyes}<path d="M167 188q13 9 26 0" fill="none" stroke="#a25e69" stroke-width="4" stroke-linecap="round"/>`}

async function boot(){const {data:{user:u},error}=await sb.auth.getUser();if(error||!u){location.href='login.html?next='+encodeURIComponent('avatar.html');return}user=u;const {data}=await sb.from('profiles').select('avatar_config,sex').eq('id',u.id).maybeSingle();if(data?.avatar_config)migrate(data.avatar_config);else if(data?.sex==='feminino')state.body='female';mountUI();render()}
