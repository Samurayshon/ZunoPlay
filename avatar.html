<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d1a"><title>Zuno Avatar Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#080d1a;color:#fff;font-family:Inter,Arial,sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;background:#10182a;padding-bottom:34px}.top{padding:22px 20px 8px;display:flex;align-items:center;gap:15px}.back{border:0;background:none;color:#fff;font-size:35px}.top h1{font-size:27px;margin:0}.preview{height:285px;display:flex;align-items:center;justify-content:center;position:relative}.avatar{width:126px;height:210px;position:relative;filter:drop-shadow(0 14px 20px #0008)}.head{position:absolute;width:74px;height:76px;left:26px;top:7px;background:var(--skin,#d79a72);border:3px solid #171226;border-radius:44% 44% 47% 47%;z-index:1;box-shadow:inset -8px -4px 12px rgba(90,40,35,.12)}.avatar[data-head="male01"] .head{width:76px;height:78px;left:25px;border-radius:46% 46% 43% 43%}.ear{display:none;position:absolute;width:12px;height:22px;top:34px;background:var(--skin);border:3px solid #171226;border-radius:50%;z-index:0}.avatar[data-head="male01"] .ear{display:block}.ear.l{left:20px}.ear.r{right:20px}.hair{position:absolute;width:82px;height:43px;left:22px;top:0;border-radius:50% 55% 28% 24%;background:var(--hair,#171321);transform:rotate(-4deg);z-index:4;clip-path:polygon(0 54%,8% 25%,20% 37%,31% 6%,44% 29%,59% 0,67% 30%,83% 9%,79% 39%,100% 30%,92% 67%,73% 50%,58% 67%,40% 51%,22% 72%)}.eye{position:absolute;width:13px;height:10px;border-radius:50% 50% 45% 45%;background:#f7f4ff;top:39px;z-index:5;border:2px solid #261c34}.eye:after{content:'';position:absolute;width:6px;height:7px;border-radius:50%;background:#6d28d9;left:2px;top:0}.eye.l{left:40px}.eye.r{right:40px}.brow{display:none;position:absolute;width:18px;height:4px;background:#211827;top:31px;z-index:6;border-radius:10px}.avatar[data-head="male01"] .brow{display:block}.brow.l{left:36px;transform:rotate(-8deg)}.brow.r{right:36px;transform:rotate(8deg)}.nose{display:none;position:absolute;left:61px;top:49px;width:5px;height:8px;border-left:2px solid rgba(80,34,31,.45);border-bottom:2px solid rgba(80,34,31,.35);border-radius:0 0 0 5px;z-index:6}.mouth{display:none;position:absolute;left:54px;top:65px;width:18px;height:7px;border-bottom:3px solid #8f4d56;border-radius:50%;z-index:6}.avatar[data-head="male01"] .nose,.avatar[data-head="male01"] .mouth{display:block}.body{position:absolute;left:22px;top:80px;width:82px;height:75px;border-radius:25px 25px 17px 17px;background:var(--top,#7c3aed);border:3px solid #171226}.leg{position:absolute;top:150px;width:29px;height:47px;border-radius:0 0 12px 12px;background:var(--bottom,#171827);border:3px solid #171226}.leg.l{left:31px}.leg.r{right:31px}.shoe{position:absolute;top:190px;width:36px;height:18px;border-radius:12px 14px 7px 7px;background:var(--shoe,#f4f4f5);border:3px solid #171226}.shoe.l{left:24px}.shoe.r{right:24px}.sex{position:absolute;left:20px;top:10px;display:flex;gap:16px}.sex button,.mode button{border:0;background:#273149;color:#8993a8;border-radius:50%;width:50px;height:50px;font-size:22px}.sex button.on,.mode button.on{background:#bdf17b;color:#243214}.mode{position:absolute;right:20px;top:10px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #536078;border-bottom:1px solid #536078;background:#182237}.tabs button{border:0;background:transparent;color:#b7c0cf;padding:13px 4px;font-size:11px;font-weight:800}.tabs button.on{color:#c9ff78;border-bottom:3px solid #c9ff78}.grid{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid #667188}.item{height:122px;border:0;border-right:1px solid #667188;border-bottom:1px solid #667188;background:#354055;color:#fff;position:relative;padding:7px;font-size:9px}.item.on{outline:3px solid #8b5cf6;outline-offset:-3px}.item.on:after{content:'✓';position:absolute;right:7px;top:3px;color:#b8f05e;font-size:24px;font-weight:bold}.headThumb{width:58px;height:66px;margin:9px auto 3px;position:relative}.headThumb .face{position:absolute;width:48px;height:51px;left:5px;top:9px;border-radius:46% 46% 43% 43%;background:var(--s);border:2px solid #1a2030}.headThumb .hairMini{position:absolute;width:52px;height:26px;left:3px;top:3px;background:#171321;clip-path:polygon(0 60%,12% 26%,26% 42%,39% 5%,52% 35%,67% 0,73% 35%,89% 14%,83% 45%,100% 36%,90% 69%,69% 52%,52% 70%,34% 54%,18% 73%);z-index:2}.headThumb .eyes{position:absolute;width:32px;height:5px;left:13px;top:32px;border-left:6px solid #6d28d9;border-right:6px solid #6d28d9;z-index:3}.thumb{width:58px;height:78px;margin:12px auto 0;position:relative}.thumb .h{width:40px;height:40px;border-radius:45%;background:var(--s);margin:auto}.thumb .t{width:52px;height:38px;border-radius:15px;background:var(--c);margin:-2px auto}.thumb.headOnly .t{display:none}.pager{text-align:center;padding:18px;font-size:20px}.pager span{margin:0 18px;color:#9ca7b9}.save{display:block;width:calc(100% - 40px);margin:10px 20px 0;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#9333ea,#6d28d9);color:#fff;font-weight:900;font-size:15px}.save:disabled{opacity:.55}.note{text-align:center;color:#8f9bb0;font-size:11px;padding:10px 20px}</style></head><body><main class="app"><header class="top"><button class="back" onclick="history.back()">‹</button><h1>Zuno Avatar Studio</h1></header><section class="preview"><div class="sex"><button class="on" data-sex="m">♂</button><button data-sex="f">♀</button></div><div class="mode"><button class="on">●</button></div><div class="avatar" id="avatar" data-head="male01"><i class="ear l"></i><i class="ear r"></i><i class="hair"></i><i class="head"></i><i class="brow l"></i><i class="brow r"></i><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth"></i><i class="body"></i><i class="leg l"></i><i class="leg r"></i><i class="shoe l"></i><i class="shoe r"></i></div></section><nav class="tabs"><button class="on" data-cat="cabeca">Cabeça</button><button data-cat="pele">Pele</button><button data-cat="cabelo">Cabelo</button><button data-cat="roupa">Roupas</button><button data-cat="calcado">Calçados</button></nav><section class="grid" id="grid"></section><div class="pager">‹‹ <span>1 de 1</span> ››</div><button class="save" id="save">Salvar personagem</button><div class="note" id="note">Cabeça masculina Zuno 01 adicionada.</div></main><script>
const client=window.supabase.createClient('https://rliymfbbhqoejgfvsbuu.supabase.co','sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0');
const HEADS=[{id:'male01',name:'Zuno Masculino 01'}];const A={pele:['#f2c7a5','#e5b08d','#d79a72','#bd7d59','#a9694c','#8f573d','#68402f','#4b3028'],cabelo:['#171321','#2b1b18','#563629','#9b5c32','#d9c1a3','#c7cbd5','#3b176e','#111827'],roupa:['#7c3aed','#111827','#2563eb','#db2777','#0f766e','#dc2626','#d97706','#4f46e5','#27272a','#9333ea','#0891b2','#be123c'],calcado:['#f4f4f5','#171827','#7c3aed','#dc2626','#2563eb','#d97706','#52525b','#0f766e']};
const DEFAULT={version:2,style:'zuno-preset-v2',sex:'m',cabeca:'male01',pele:2,cabelo:0,roupa:0,calcado:0};let state={...DEFAULT},cat='cabeca';const av=document.getElementById('avatar'),grid=document.getElementById('grid'),note=document.getElementById('note'),saveBtn=document.getElementById('save');
function sanitize(v){const s={...DEFAULT,...(v||{})};s.cabeca=HEADS.some(h=>h.id===s.cabeca)?s.cabeca:'male01';for(const k of ['pele','cabelo','roupa','calcado'])s[k]=Math.max(0,Math.min(A[k].length-1,Number(s[k])||0));s.sex=s.sex==='f'?'f':'m';s.version=2;s.style='zuno-preset-v2';return s}
function paint(){av.dataset.head=state.cabeca;av.style.setProperty('--skin',A.pele[state.pele]);av.style.setProperty('--hair',A.cabelo[state.cabelo]);av.style.setProperty('--top',A.roupa[state.roupa]);av.style.setProperty('--bottom',state.roupa%2?'#111827':'#26324a');av.style.setProperty('--shoe',A.calcado[state.calcado])}
function render(){grid.innerHTML='';if(cat==='cabeca'){HEADS.filter(h=>state.sex==='m').forEach(h=>{const b=document.createElement('button');b.className='item '+(state.cabeca===h.id?'on':'');b.innerHTML='<div class="headThumb"><div class="face" style="--s:'+A.pele[state.pele]+'"></div><div class="hairMini"></div><div class="eyes"></div></div><div>'+h.name+'</div>';b.onclick=()=>{state.cabeca=h.id;paint();render()};grid.appendChild(b)});return}A[cat].forEach((c,i)=>{const b=document.createElement('button');b.className='item '+(state[cat]===i?'on':'');b.innerHTML='<div class="thumb '+(cat==='pele'||cat==='cabelo'?'headOnly':'')+'"><div class="h" style="--s:'+(cat==='pele'?c:A.pele[state.pele])+'"></div><div class="t" style="--c:'+c+'"></div></div>';b.onclick=()=>{state[cat]=i;paint();render()};grid.appendChild(b)})}
function syncSex(){document.querySelectorAll('[data-sex]').forEach(x=>x.classList.toggle('on',x.dataset.sex===state.sex))}
async function loadSaved(){try{const local=JSON.parse(localStorage.getItem('zunoAvatarPreset')||'null');if(local)state=sanitize(local);const {data:{user}}=await client.auth.getUser();if(user){const {data}=await client.from('profiles').select('avatar_config').eq('id',user.id).maybeSingle();if(data?.avatar_config?.style?.startsWith('zuno-preset'))state=sanitize(data.avatar_config)}}catch(e){console.warn(e)}syncSex();paint();render()}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.cat;render()});document.querySelectorAll('[data-sex]').forEach(b=>b.onclick=()=>{state.sex=b.dataset.sex;syncSex();render()});
saveBtn.onclick=async()=>{saveBtn.disabled=true;note.textContent='Salvando personagem...';try{state=sanitize(state);const {data:{user},error:uErr}=await client.auth.getUser();if(uErr||!user)throw new Error('Sessão inválida.');const cfg={...state,updatedAt:new Date().toISOString()};const {error}=await client.from('profiles').update({avatar_config:cfg,avatar_url:null,sex:state.sex==='f'?'feminino':'masculino'}).eq('id',user.id);if(error)throw error;localStorage.setItem('zunoAvatarPreset',JSON.stringify(cfg));note.textContent='Personagem salvo no ZunoPlay ✓'}catch(e){note.textContent='Erro ao salvar: '+(e.message||'tente novamente')}finally{saveBtn.disabled=false}};loadSaved();
</script></body></html>
