<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070811"><title>Personagem 3D - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js?v=53"></script><style>:root{--bg:#070811;--panel:#11121f;--line:#2d3049;--purple:#8b5cf6;--text:#f8fafc;--muted:#9598aa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 4%,#2b1760 0,transparent 30%),#070811;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}.app{width:min(100%,620px);margin:auto;padding:16px 14px 40px}.header{display:flex;align-items:center;gap:12px;margin-bottom:14px}.home{width:44px;height:44px;border-radius:14px;border:1px solid #34364e;background:#151625;color:#fff;font-size:20px}.logo{font-size:28px;font-weight:900}.logo span{color:#9b5cff}.card{background:linear-gradient(160deg,#141523,#0d0e18);border:1px solid var(--line);border-radius:24px;padding:15px}.title{display:flex;justify-content:space-between;gap:12px}.title h1{margin:0;font-size:22px}.title p{margin:5px 0 0;color:var(--muted);font-size:11px}.tag{height:max-content;padding:6px 9px;border-radius:99px;background:#201638;border:1px solid #5d3d91;color:#d8b4fe;font-size:9px;font-weight:900}.preview{height:380px;margin:14px 0;border-radius:22px;border:1px solid #332d52;background:radial-gradient(circle at 50% 78%,rgba(139,92,246,.24),transparent 29%),linear-gradient(#121228,#090a15);display:grid;place-items:center;overflow:hidden;position:relative}.preview:before{content:"";position:absolute;width:260px;height:46px;bottom:24px;border-radius:50%;background:rgba(139,92,246,.18);filter:blur(9px)}#avatarPreview{width:330px;height:365px;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 22px 24px #0009)}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid #303249;border-radius:12px;background:#11121d;color:#aaacbb;padding:10px 12px;font-size:10px;font-weight:800}.tab.active{color:#fff;border-color:#8b5cf6;background:#21163a}.panel{display:none}.panel.active{display:block}.group{margin-top:13px}.group h3{font-size:12px;margin:0 0 8px;color:#dedee8}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.options.colors{grid-template-columns:repeat(6,1fr)}.opt{min-height:43px;padding:8px 5px;border:1px solid #303249;border-radius:12px;background:#12131f;color:#e7e7ef;font-size:10px;font-weight:750}.opt.active{border-color:#a78bfa;background:#211936;box-shadow:0 0 0 1px #7c3aed}.color{height:38px;padding:4px}.color i{display:block;width:100%;height:100%;border-radius:8px;border:1px solid #ffffff22}.save{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#9333ea,#6366f1);color:#fff;font-size:14px;font-weight:900}.save:disabled{opacity:.55}.msg{text-align:center;min-height:18px;margin-top:8px;font-size:11px;color:#86efac}.msg.err{color:#fca5a5}@media(max-width:390px){.preview{height:350px}#avatarPreview{width:300px;height:335px}.options.colors{grid-template-columns:repeat(4,1fr)}}</style></head><body><main class="app"><header class="header"><button class="home" onclick="location.href='index.html'">⌂</button><div class="logo">Zuno<span>Play</span></div></header><section class="card"><div class="title"><div><h1>Meu personagem</h1><p>Visual 3D estilizado · corpo, rosto, roupas, calçados e acessórios independentes.</p></div><span class="tag">3D STYLIZED v53</span></div><div class="preview"><img id="avatarPreview" alt="Prévia do personagem 3D"></div><div id="tabs" class="tabs"></div><div id="panels"></div><button id="save" class="save">Salvar personagem</button><div id="msg" class="msg"></div></section></main><script src="avatar-v53.js?v=53"></script></body></html>
