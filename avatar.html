<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050817"><title>Zuno Avatar Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js"></script><style>:root{--cyan:#52e9ff;--purple:#9d4dff;--pink:#ff4fd8;--skin:#c99172;--hair:#11131d;--top:#111827;--shoe:#111827}*{box-sizing:border-box}body{margin:0;background:#02040b;color:#fff;font-family:Inter,system-ui,Arial}.app{max-width:520px;min-height:100vh;margin:auto;padding:14px 14px 30px;background:radial-gradient(circle at 12% 10%,#5821b84a,transparent 25%),radial-gradient(circle at 90% 34%,#00d9ff24,transparent 24%),linear-gradient(180deg,#060a18,#030611 58%,#080518)}button{font:inherit;color:inherit;cursor:pointer}.top{height:58px;display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center}.iconBtn{width:40px;height:40px;border:1px solid #ffffff15;border-radius:13px;background:#10172bd9;display:grid;place-items:center}.brand{display:flex;align-items:center;gap:9px}.mark{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;font-weight:1000;background:linear-gradient(135deg,#25dfff,#873cff 52%,#ff3ec8)}.brand h1{font-size:16px;margin:0}.actions{display:flex;gap:7px}.hero{height:398px;position:relative;overflow:hidden;border:1px solid #9b6cff2b;border-radius:28px;background:radial-gradient(ellipse at 50% 64%,#7c3aed38,transparent 38%),linear-gradient(180deg,#0b1024,#050817);box-shadow:inset 0 0 55px #6d28d91c,0 18px 50px #0008}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#58eaff 1px,transparent 1px);background-size:47px 47px,71px 71px;opacity:.14}.pulseLabel{position:absolute;left:15px;top:15px;z-index:8;padding:7px 10px;border-radius:12px;border:1px solid #a959ff44;background:#120d27d9;font-size:10px;color:#c9adff}.pulseLabel b{color:#58eaff}.capsule{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:232px;height:321px;border:1px solid #61eaff55;border-radius:50% 50% 35% 35%;box-shadow:inset 0 0 38px #00d9ff16,0 0 42px #8b5cf633}.capsule:before,.capsule:after{content:'';position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;border:2px solid}.capsule:before{bottom:4px;width:188px;height:37px;border-color:#6ceaff99;box-shadow:0 0 25px #00ddff88}.capsule:after{bottom:17px;width:142px;height:22px;border-color:#b449ff77}.pulse{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:254px;height:254px;border:1px solid #a855f755;border-radius:50%;opacity:.75}.hero.voice .pulse{animation:voicePulse .75s infinite alternate;box-shadow:0 0 35px #8b5cf655}.hero.voice .capsule{box-shadow:inset 0 0 45px #00d9ff24,0 0 50px #8b5cf655}.hero.voice .stage{filter:drop-shadow(0 0 18px #36e5ff77) drop-shadow(0 0 24px #a855f755)}@keyframes voicePulse{to{transform:translate(-50%,-50%) scale(1.1);opacity:.35}}.stage{position:absolute;left:50%;top:55px;transform:translateX(-50%) rotateY(var(--rot,0deg)) scale(var(--scale,1));width:164px;height:268px;z-index:4;transform-style:preserve-3d;transition:.28s ease;filter:drop-shadow(0 0 16px #6128a744)}.stage.profile{top:88px;--scale:1.38}.stage.room{top:67px;--scale:1.1}.head{position:absolute;left:49px;top:0;width:66px;height:75px;border-radius:48% 48% 44% 44%;background:var(--skin);border:1px solid #ffffff18;overflow:hidden}.head:before{content:'';position:absolute;left:-5px;right:-5px;top:-7px;height:35px;background:var(--hair);border-radius:50% 50% 35% 35%}.head:after{content:'••';position:absolute;left:0;right:0;top:33px;text-align:center;letter-spacing:13px;color:#dae9ff;font-size:15px;text-shadow:0 0 5px #66eaff}.neck{position:absolute;left:70px;top:67px;width:24px;height:25px;background:var(--skin);border-radius:7px}.torso{position:absolute;left:22px;top:84px;width:120px;height:105px;border-radius:36px 36px 20px 20px;background:var(--top);border:1px solid #5ee9ff35;clip-path:polygon(12% 0,88% 0,100% 22%,88% 100%,12% 100%,0 22%)}.torso:after{content:'Z';position:absolute;left:0;right:0;top:25px;text-align:center;font-size:45px;font-weight:1000;color:#9c4dff;text-shadow:0 0 16px #7c3aed}.arm{position:absolute;top:94px;width:25px;height:115px;border-radius:16px;background:var(--top)}.arm.l{left:4px;transform:rotate(5deg)}.arm.r{right:4px;transform:rotate(-5deg)}.leg{position:absolute;top:181px;width:40px;height:69px;border-radius:13px;background:#0d1320}.leg.l{left:37px}.leg.r{right:37px}.foot{position:absolute;top:239px;width:51px;height:20px;border-radius:15px 18px 7px 7px;background:var(--shoe);border:1px solid #884dff66}.foot.l{left:24px}.foot.r{right:24px}.hairFx{position:absolute;left:42px;top:-8px;width:80px;height:52px;background:var(--hair);clip-path:polygon(3% 75%,7% 29%,22% 38%,28% 6%,42% 30%,51% 0,61% 30%,77% 5%,75% 37%,97% 28%,90% 72%,73% 58%,57% 77%,40% 58%,24% 77%);display:none;z-index:3}.stage.hair-anime .hairFx,.stage.hair-fade .hairFx,.stage.hair-long .hairFx{display:block}.stage.hair-long .hairFx{height:100px;clip-path:polygon(5% 0,95% 0,88% 100%,72% 70%,68% 20%,32% 20%,28% 70%,12% 100%)}.stage.face-angular .head{border-radius:43% 43% 35% 35%}.stage.face-soft .head{border-radius:52% 52% 48% 48%}.stage.base-athletic .torso{left:15px;width:134px}.stage.base-curvy .torso{left:28px;width:108px;border-radius:38px 38px 28px 28px}.stage.base-tall{height:285px;transform:translateX(-50%) rotateY(var(--rot,0deg)) scaleY(1.07) scale(var(--scale,1))}.acc{position:absolute;z-index:8;display:none}.stage.acc-glasses .acc{display:block;left:46px;top:34px;width:72px;height:19px;border:2px solid #61eaff;border-radius:10px;box-shadow:inset 33px 0 0 transparent}.stage.acc-headset .acc{display:block;left:39px;top:17px;width:85px;height:61px;border:5px solid #934fff;border-bottom:0;border-radius:44px 44px 0 0}.mascot{position:absolute;right:21px;top:111px;width:63px;height:56px;border-radius:23px 23px 27px 27px;background:linear-gradient(145deg,#171f38,#080c18);border:1px solid #934fff88;box-shadow:0 0 22px #713cff55;z-index:6;transition:.2s}.mascot.hidden{opacity:0;transform:translateY(8px) scale(.8)}.mascot:before,.mascot:after{content:'';position:absolute;top:-13px;width:22px;height:25px;background:#151d34;border:1px solid #7d4bff88}.mascot:before{left:3px;clip-path:polygon(0 100%,35% 0,100% 100%)}.mascot:after{right:3px;clip-path:polygon(0 100%,65% 0,100% 100%)}.eyes{position:absolute;top:22px;left:12px;right:12px;display:flex;justify-content:space-between}.eyes i{width:11px;height:7px;border-radius:50%;background:#51eaff;box-shadow:0 0 10px #27dfff}.viewTools{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:center;z-index:8}.toolGroup{display:flex;gap:6px}.tool{height:34px;padding:0 10px;border:1px solid #ffffff18;border-radius:11px;background:#10172bd9;font-size:10px}.mode{display:flex;padding:3px;border-radius:12px;background:#080d19df;border:1px solid #ffffff12}.mode button{border:0;background:transparent;padding:7px 8px;border-radius:9px;color:#8290a8;font-size:9px}.mode button.on{background:linear-gradient(135deg,#7837df,#175f8d);color:#fff}.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 1px 9px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{min-width:68px;height:61px;border:1px solid #ffffff12;border-radius:16px;background:#0d1324;color:#8f9bb1;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.tab .ico{font-size:18px}.tab.on{color:#fff;border-color:#8954ff88;background:linear-gradient(145deg,#231448,#0c2037)}.panel{border:1px solid #ffffff12;border-radius:22px;background:#0b1020cc;padding:13px}.panelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.panelHead strong{font-size:14px}.panelHead small{color:#7f8da6;font-size:10px}.mix{font-size:9px;color:#8fa1bc;margin-bottom:10px}.mix b{color:#59eaff}.options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.option{height:81px;border:1px solid #ffffff12;border-radius:15px;background:linear-gradient(145deg,#172038,#0a0f1c);position:relative}.option.on{border-color:#64e8ff;box-shadow:inset 0 0 0 1px #9a4cff}.thumb{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:41px;height:41px;border-radius:13px;background:#222e48;display:grid;place-items:center;font-size:18px}.label{position:absolute;bottom:7px;left:4px;right:4px;text-align:center;font-size:8px;color:#a6b2c5}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}.controls small{color:#8795ac}.color{width:24px;height:24px;border:2px solid #fff2;border-radius:50%;background:var(--c)}.color.on{outline:2px solid #55e9ff;outline-offset:2px}.save{width:100%;height:54px;margin-top:13px;border:0;border-radius:17px;background:linear-gradient(105deg,#7c3aed,#bb3ee9 50%,#16d9ed);font-weight:1000;letter-spacing:.5px;box-shadow:0 0 28px #7c3aed55}.saved{display:flex;justify-content:center;gap:10px;margin-top:12px}.slot{width:45px;height:34px;border:1px dashed #58647b;border-radius:10px;background:#0b1020}.hint{text-align:center;margin-top:8px;font-size:9px;color:#59667c}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);padding:11px 15px;border-radius:13px;background:#11192de8;border:1px solid #8654ff66;font-size:11px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><main class="app"><header class="top"><button class="iconBtn" id="back">‹</button><div class="brand"><div class="mark">Z</div><h1>Zuno Avatar Studio</h1></div><div class="actions"><button class="iconBtn" id="undo">↶</button><button class="iconBtn" id="saveTop">▣</button></div></header><section class="hero" id="hero"><div class="stars"></div><div class="pulseLabel"><b>Zuno Pulse</b> · toque para simular voz</div><div class="pulse"></div><div class="capsule"></div><div class="stage" id="stage"><div class="hairFx"></div><div class="head"></div><div class="neck"></div><div class="torso"></div><i class="arm l"></i><i class="arm r"></i><i class="leg l"></i><i class="leg r"></i><i class="foot l"></i><i class="foot r"></i><i class="acc"></i></div><div class="mascot" id="mascot"><div class="eyes"><i></i><i></i></div></div><div class="viewTools"><div class="toolGroup"><button class="tool" id="rotate">↻ Girar</button><button class="tool" id="zoom">⌕ Ampliar</button></div><div class="mode" id="modes"><button data-mode="Perfil">Perfil</button><button data-mode="Sala de voz">Sala de voz</button><button class="on" data-mode="Corpo inteiro">Corpo inteiro</button></div></div></section><nav class="tabs" id="tabs"></nav><section class="panel"><div class="panelHead"><strong id="panelTitle">Base</strong><small id="selectedInfo"></small></div><div class="mix"><b>Preview em tempo real:</b> toda seleção abaixo atualiza o personagem central imediatamente.</div><div class="options" id="options"></div><div class="controls" id="controls"></div></section><button class="save" id="save">SALVAR MEU ZUNO</button><div class="saved"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div><div class="hint">Etapa 3 · preview central em validação</div></main><div class="toast" id="toast"></div><script>const DATA={Base:['Neutro','Atlético','Curvilíneo','Alto'],Rosto:['Suave','Marcado','Angular','Jovem'],Cabelo:['Curto','Anime','Longo','Fade'],Roupas:['Street Z','Techwear','Casual','Cyber'],Calçados:['Sneaker Z','Runner','Bota Tech','High-top'],Acessórios:['Nenhum','Óculos','Headset','Colar'],Mascote:['Sem mascote','Zuno Fox','Zuno Cat','Z-Bot'],Efeitos:['Sem efeito','Zuno Pulse','Aura Ciano','Aura Rosa']};const ICON={Base:'◉',Rosto:'◌',Cabelo:'✦',Roupas:'♢',Calçados:'▰',Acessórios:'✧',Mascote:'◆',Efeitos:'✺'};const state={cat:'Base',sel:{Base:0,Rosto:0,Cabelo:0,Roupas:0,Calçados:0,Acessórios:0,Mascote:1,Efeitos:1},color:0,mode:'Corpo inteiro',rot:0,zoom:false};const historyStack=[];const COLORS=['#111827','#7c3aed','#0f766e','#2563eb','#be123c','#d97706'];const HAIR=['#101219','#3a241b','#e5e7eb','#6d28d9','#b45309'];const stage=document.getElementById('stage'),hero=document.getElementById('hero'),mascot=document.getElementById('mascot'),tabs=document.getElementById('tabs'),options=document.getElementById('options'),controls=document.getElementById('controls');function snap(){historyStack.push(JSON.stringify(state.sel));if(historyStack.length>20)historyStack.shift()}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1300)}function renderTabs(){tabs.innerHTML=Object.keys(DATA).map(k=>`<button class="tab ${state.cat===k?'on':''}" data-cat="${k}"><span class="ico">${ICON[k]}</span>${k}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;renderTabs();renderPanel()})}function renderPanel(){document.getElementById('panelTitle').textContent=state.cat;document.getElementById('selectedInfo').textContent='Selecionado: '+DATA[state.cat][state.sel[state.cat]];options.innerHTML=DATA[state.cat].map((n,i)=>`<button class="option ${state.sel[state.cat]===i?'on':''}" data-i="${i}"><span class="thumb">${ICON[state.cat]}</span><span class="label">${n}</span></button>`).join('');options.querySelectorAll('button').forEach(b=>b.onclick=()=>{snap();state.sel[state.cat]=+b.dataset.i;renderPanel();applyPreview()});let pal=state.cat==='Cabelo'?HAIR:COLORS;controls.innerHTML='<small>Cor</small>'+pal.map((c,i)=>`<button class="color ${state.color===i?'on':''}" style="--c:${c}" data-i="${i}"></button>`).join('');controls.querySelectorAll('.color').forEach(b=>b.onclick=()=>{state.color=+b.dataset.i;renderPanel();applyPreview()})}function applyPreview(){stage.className='stage';const b=state.sel.Base,f=state.sel.Rosto,h=state.sel.Cabelo,a=state.sel.Acessórios;stage.classList.add(['','base-athletic','base-curvy','base-tall'][b]||'');stage.classList.add(['face-soft','','face-angular','face-soft'][f]||'');stage.classList.add(['','hair-anime','hair-long','hair-fade'][h]||'');stage.classList.add(['','acc-glasses','acc-headset',''][a]||'');stage.classList.toggle('profile',state.mode==='Perfil');stage.classList.toggle('room',state.mode==='Sala de voz');stage.style.setProperty('--rot',state.rot+'deg');stage.style.setProperty('--scale',state.zoom?1.18:1);stage.style.setProperty('--top',COLORS[state.sel.Roupas%COLORS.length]);stage.style.setProperty('--shoe',COLORS[state.sel.Calçados%COLORS.length]);stage.style.setProperty('--hair',HAIR[state.cat==='Cabelo'?state.color%HAIR.length:state.sel.Cabelo%HAIR.length]);mascot.classList.toggle('hidden',state.sel.Mascote===0);hero.classList.toggle('voice',state.sel.Efeitos===1||state.mode==='Sala de voz');if(state.sel.Efeitos===2)hero.style.boxShadow='inset 0 0 65px #24ddff2b,0 18px 50px #0008';else if(state.sel.Efeitos===3)hero.style.boxShadow='inset 0 0 65px #ff43d92b,0 18px 50px #0008';else hero.style.boxShadow='inset 0 0 55px #6d28d91c,0 18px 50px #0008'}document.getElementById('rotate').onclick=()=>{state.rot=(state.rot+45)%360;applyPreview()};document.getElementById('zoom').onclick=()=>{state.zoom=!state.zoom;applyPreview()};document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#modes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.mode=b.dataset.mode;applyPreview()});document.querySelector('.pulseLabel').onclick=()=>{hero.classList.toggle('voice');toast(hero.classList.contains('voice')?'Zuno Pulse ativo':'Zuno Pulse pausado')};document.getElementById('undo').onclick=()=>{if(!historyStack.length)return toast('Nada para desfazer');state.sel=JSON.parse(historyStack.pop());renderPanel();applyPreview();toast('Última alteração desfeita')};document.getElementById('back').onclick=()=>history.back();function pending(){toast('Salvamento real será ativado na Etapa 4')}document.getElementById('save').onclick=pending;document.getElementById('saveTop').onclick=pending;renderTabs();renderPanel();applyPreview();</script></body></html>
