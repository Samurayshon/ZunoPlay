<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050817"><title>Zuno Avatar Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js"></script><style>:root{--bg:#030611;--panel:#0b1020cc;--panel2:#10172b;--line:#ffffff14;--txt:#f8fbff;--muted:#8d9ab2;--cyan:#52e9ff;--purple:#9d4dff;--pink:#ff4fd8}*{box-sizing:border-box}body{margin:0;background:#02040b;color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;padding:14px 14px 30px;overflow:hidden;background:radial-gradient(circle at 12% 11%,#5723b94a,transparent 26%),radial-gradient(circle at 88% 33%,#00d9ff24,transparent 25%),radial-gradient(circle at 45% 76%,#ff2fc71a,transparent 24%),linear-gradient(180deg,#060a18,#030611 56%,#080518)}button{font:inherit;color:inherit;cursor:pointer}.top{height:58px;display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center}.iconBtn{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:#10172bd9;display:grid;place-items:center;backdrop-filter:blur(12px);transition:.18s}.iconBtn:active{transform:scale(.95)}.iconBtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.brand{display:flex;align-items:center;gap:9px;min-width:0}.mark{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;font-weight:1000;font-size:15px;background:linear-gradient(135deg,#25dfff,#873cff 52%,#ff3ec8);box-shadow:0 0 20px #8b3dff55}.brand h1{font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:7px}.hero{position:relative;height:390px;margin-top:8px;border:1px solid #9b6cff2b;border-radius:28px;overflow:hidden;background:radial-gradient(ellipse at 50% 65%,#7c3aed33,transparent 39%),linear-gradient(180deg,#0b1024e8,#050817f3);box-shadow:inset 0 0 55px #6d28d91c,0 18px 50px #0008}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#58eaff 1px,transparent 1px);background-size:47px 47px,71px 71px;background-position:0 0,18px 27px;opacity:.15}.capsule{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:232px;height:320px;border:1px solid #61eaff55;border-radius:50% 50% 35% 35%;box-shadow:inset 0 0 38px #00d9ff16,0 0 42px #8b5cf633}.capsule:before,.capsule:after{content:'';position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;border:2px solid}.capsule:before{bottom:4px;width:188px;height:37px;border-color:#6ceaff99;box-shadow:0 0 25px #00ddff88}.capsule:after{bottom:17px;width:142px;height:22px;border-color:#b449ff77}.pulse{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:258px;height:258px;border:1px solid #ad55ff4c;border-radius:50%;box-shadow:0 0 25px #9d4dff22;animation:pulse 2.4s infinite}.pulse:after{content:'';position:absolute;inset:24px;border:1px solid #25dcff3f;border-radius:50%;animation:pulse 2.4s .7s infinite}@keyframes pulse{50%{transform:scale(1.06);opacity:.55}}.pulseLabel{position:absolute;left:16px;top:16px;z-index:6;padding:7px 10px;border-radius:12px;border:1px solid #a959ff44;background:#120d27c9;font-size:10px;font-weight:800;color:#c8a8ff}.pulseLabel b{color:#58eaff}.avatarBase{position:absolute;left:50%;top:58px;transform:translateX(-50%);width:158px;height:263px;z-index:3;filter:drop-shadow(0 0 16px #6128a744)}.avatarHead{position:absolute;left:49px;top:0;width:61px;height:72px;border-radius:47% 47% 44% 44%;background:linear-gradient(145deg,#33415f,#121827);border:1px solid #8da0c43c}.avatarNeck{position:absolute;left:68px;top:65px;width:24px;height:24px;border-radius:7px;background:#1f293d}.avatarTorso{position:absolute;left:22px;top:82px;width:114px;height:102px;border-radius:35px 35px 20px 20px;background:linear-gradient(145deg,#171b29,#070a11);border:1px solid #5ee9ff35;clip-path:polygon(13% 0,87% 0,100% 22%,88% 100%,12% 100%,0 22%)}.avatarTorso:after{content:'Z';position:absolute;inset:24px 0 auto;text-align:center;font-size:45px;font-weight:1000;color:#9c4dff;text-shadow:0 0 16px #7c3aed}.arm{position:absolute;top:91px;width:24px;height:113px;border-radius:15px;background:linear-gradient(#141a29,#090c14);border:1px solid #55678144}.arm.l{left:6px;transform:rotate(5deg)}.arm.r{right:6px;transform:rotate(-5deg)}.leg{position:absolute;top:175px;width:39px;height:78px;border-radius:14px;background:linear-gradient(#111827,#080b12);border:1px solid #53617935}.leg.l{left:37px}.leg.r{right:37px}.foot{position:absolute;top:241px;width:50px;height:18px;border-radius:15px 18px 7px 7px;background:#0d1320;border:1px solid #884dff66}.foot.l{left:24px}.foot.r{right:24px}.mascot{position:absolute;right:21px;top:111px;width:63px;height:56px;border-radius:23px 23px 27px 27px;background:linear-gradient(145deg,#171f38,#080c18);border:1px solid #934fff88;box-shadow:0 0 22px #713cff55;z-index:4}.mascot:before,.mascot:after{content:'';position:absolute;top:-13px;width:22px;height:25px;background:#151d34;border:1px solid #7d4bff88}.mascot:before{left:3px;clip-path:polygon(0 100%,35% 0,100% 100%)}.mascot:after{right:3px;clip-path:polygon(0 100%,65% 0,100% 100%)}.eyes{position:absolute;top:22px;left:12px;right:12px;display:flex;justify-content:space-between}.eyes i{width:11px;height:7px;border-radius:50%;background:#51eaff;box-shadow:0 0 10px #27dfff}.viewTools{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:center;z-index:6}.toolGroup{display:flex;gap:6px}.tool{height:34px;padding:0 10px;border:1px solid #ffffff18;border-radius:11px;background:#10172bd9;font-size:10px;display:flex;align-items:center;gap:6px}.tool svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}.mode{display:flex;padding:3px;border-radius:12px;background:#080d19df;border:1px solid #ffffff12}.mode button{border:0;background:transparent;padding:7px 8px;border-radius:9px;color:#8290a8;font-size:9px;white-space:nowrap}.mode button.on{background:linear-gradient(135deg,#7837df,#175f8d);color:#fff}.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 1px 9px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{min-width:68px;height:61px;border:1px solid #ffffff12;border-radius:16px;background:#0d1324;color:#8f9bb1;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:.18s}.tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.tab.on{color:#fff;border-color:#8954ff88;background:linear-gradient(145deg,#231448,#0c2037);box-shadow:0 0 17px #793cff22}.panel{border:1px solid #ffffff12;border-radius:22px;background:#0b1020cc;padding:13px;backdrop-filter:blur(12px)}.panelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.panelHead strong{font-size:14px}.panelHead small{color:#7f8da6;font-size:10px}.options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.option{height:79px;border:1px solid #ffffff12;border-radius:15px;background:linear-gradient(145deg,#172038,#0a0f1c);position:relative;overflow:hidden}.option.on{border-color:#64e8ff;box-shadow:inset 0 0 0 1px #9a4cff,0 0 14px #3fdfff22}.option:before{content:'';position:absolute;width:42px;height:42px;border-radius:50%;left:50%;top:10px;transform:translateX(-50%);background:linear-gradient(145deg,#34415d,#151c2e)}.option:after{content:attr(data-name);position:absolute;bottom:7px;left:0;right:0;text-align:center;color:#9ba9bf;font-size:9px}.colors{display:flex;align-items:center;gap:9px;margin-top:12px}.colors small{color:#8795ac;margin-right:3px}.color{width:24px;height:24px;border:2px solid #fff2;border-radius:50%;background:var(--c)}.color.on{outline:2px solid #55e9ff;outline-offset:2px}.save{width:100%;height:54px;margin-top:13px;border:0;border-radius:17px;background:linear-gradient(105deg,#7c3aed,#bb3ee9 50%,#16d9ed);font-weight:1000;letter-spacing:.5px;box-shadow:0 0 28px #7c3aed55}.saved{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}.slot{width:45px;height:34px;border:1px dashed #58647b;border-radius:10px;background:#0b1020}.hint{text-align:center;margin-top:8px;font-size:9px;color:#59667c}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);max-width:calc(100% - 40px);padding:11px 15px;border-radius:13px;background:#11192de8;border:1px solid #8654ff66;color:#dbe7fa;font-size:11px;opacity:0;pointer-events:none;transition:.22s;z-index:50;box-shadow:0 10px 35px #000a}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:390px){.hero{height:375px}.brand h1{font-size:15px}.mode button{padding:7px 6px}.tool{padding:0 8px}.tab{min-width:64px}}</style></head><body><main class="app"><header class="top"><button class="iconBtn" id="back" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><div class="brand"><div class="mark">Z</div><h1>Zuno Avatar Studio</h1></div><div class="actions"><button class="iconBtn" id="undo" aria-label="Desfazer"><svg viewBox="0 0 24 24"><path d="M9 7H5v-4"/><path d="M5 7c2-3 5-4 8-3 4 1 7 5 6 9s-5 7-9 6c-2-.4-4-1.5-5-3"/></svg></button><button class="iconBtn" id="saveTop" aria-label="Salvar visual"><svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg></button></div></header><section class="hero"><div class="stars"></div><div class="pulseLabel"><b>Zuno Pulse</b> · voz reativa</div><div class="pulse"></div><div class="capsule"></div><div class="avatarBase" id="avatarStage"><div class="avatarHead"></div><div class="avatarNeck"></div><div class="avatarTorso"></div><i class="arm l"></i><i class="arm r"></i><i class="leg l"></i><i class="leg r"></i><i class="foot l"></i><i class="foot r"></i></div><div class="mascot"><div class="eyes"><i></i><i></i></div></div><div class="viewTools"><div class="toolGroup"><button class="tool" id="rotate"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6"/><path d="M4 4v5h5"/></svg>Girar</button><button class="tool" id="zoom"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4M8 11h6M11 8v6"/></svg>Ampliar</button></div><div class="mode" id="modes"><button data-mode="Perfil">Perfil</button><button data-mode="Sala de voz">Sala de voz</button><button class="on" data-mode="Corpo inteiro">Corpo inteiro</button></div></div></section><nav class="tabs" id="tabs"><button class="tab on" data-cat="Base"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M7 20v-4a5 5 0 0 1 10 0v4"/></svg>Base</button><button class="tab" data-cat="Rosto"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9 10h.01M15 10h.01M9 15c2 1.5 4 1.5 6 0"/></svg>Rosto</button><button class="tab" data-cat="Cabelo"><svg viewBox="0 0 24 24"><path d="M5 12c0-5 3-8 7-8s7 3 7 8v5"/><path d="M6 10c3 0 4-3 6-4 1 3 4 4 6 4"/></svg>Cabelo</button><button class="tab" data-cat="Roupas"><svg viewBox="0 0 24 24"><path d="M8 4l4 2 4-2 4 4-3 3v9H7v-9L4 8z"/></svg>Roupas</button><button class="tab" data-cat="Calçados"><svg viewBox="0 0 24 24"><path d="M5 5v8c0 2 2 3 4 3h3l4 3h4v-3l-7-3V7z"/></svg>Calçados</button><button class="tab" data-cat="Acessórios"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M3 12h6M15 12h6M12 3v6M12 15v6"/></svg>Acessórios</button><button class="tab" data-cat="Mascote"><svg viewBox="0 0 24 24"><path d="M6 8l2-4 3 3h2l3-3 2 4v8c0 3-3 5-6 5s-6-2-6-5z"/><path d="M9 13h.01M15 13h.01"/></svg>Mascote</button><button class="tab" data-cat="Efeitos"><svg viewBox="0 0 24 24"><path d="M12 2l1.5 5L18 4l-2 5 5 1-5 2 3 4-5-1-1 5-2-5-4 3 1-5-5-1 5-2-3-4 5 1z"/></svg>Efeitos</button></nav><section class="panel"><div class="panelHead"><strong id="panelTitle">Base</strong><small>Interface em validação</small></div><div class="options" id="options"><button class="option on" data-name="Modelo 01"></button><button class="option" data-name="Modelo 02"></button><button class="option" data-name="Modelo 03"></button><button class="option" data-name="Modelo 04"></button></div><div class="colors"><small>Cores</small><button class="color on" style="--c:#d79a72"></button><button class="color" style="--c:#8f573d"></button><button class="color" style="--c:#0d111c"></button><button class="color" style="--c:#7c3aed"></button><button class="color" style="--c:#22d3ee"></button></div></section><button class="save" id="saveMain">SALVAR MEU ZUNO</button><div class="saved"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div><div class="hint">Etapa 1: interface e navegação. O avatar final e o salvamento serão ligados nas próximas etapas.</div></main><div class="toast" id="toast"></div><script>(()=>{const toast=document.getElementById('toast');let timer;function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}document.getElementById('back').onclick=()=>history.back();document.getElementById('undo').onclick=()=>say('Desfazer validado. Histórico real entra com a personalização.');document.getElementById('saveTop').onclick=()=>say('Salvar visual validado. Persistência será ligada na etapa 4.');document.getElementById('saveMain').onclick=()=>say('Botão principal validado. Salvamento real entra na etapa 4.');document.getElementById('rotate').onclick=()=>{const a=document.getElementById('avatarStage');a.animate([{transform:'translateX(-50%) rotateY(0deg)'},{transform:'translateX(-50%) rotateY(360deg)'}],{duration:650});say('Controle de rotação funcionando.')};document.getElementById('zoom').onclick=()=>{document.querySelector('.hero').classList.toggle('zoomed');const a=document.getElementById('avatarStage');a.animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(1.12)'},{transform:'translateX(-50%) scale(1)'}],{duration:450});say('Controle de ampliação funcionando.')};document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#modes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');say('Visualização: '+b.dataset.mode)});const labels={Base:['Modelo 01','Modelo 02','Modelo 03','Modelo 04'],Rosto:['Rosto 01','Rosto 02','Rosto 03','Rosto 04'],Cabelo:['Corte 01','Corte 02','Corte 03','Corte 04'],Roupas:['Look 01','Look 02','Look 03','Look 04'],Calçados:['Tênis 01','Tênis 02','Bota 01','Bota 02'],Acessórios:['Óculos','Boné','Fone','Corrente'],Mascote:['Zuno Bot','Fox Bot','Cat Bot','Orb'],Efeitos:['Pulse','Aura','Partículas','Neon']};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('panelTitle').textContent=b.dataset.cat;document.querySelectorAll('.option').forEach((o,i)=>{o.dataset.name=labels[b.dataset.cat][i];o.classList.toggle('on',i===0)});say('Categoria '+b.dataset.cat+' aberta.')});document.querySelectorAll('.option').forEach(o=>o.onclick=()=>{document.querySelectorAll('.option').forEach(x=>x.classList.remove('on'));o.classList.add('on')});document.querySelectorAll('.color').forEach(c=>c.onclick=()=>{document.querySelectorAll('.color').forEach(x=>x.classList.remove('on'));c.classList.add('on')});})();</script></body></html>
