 16px 8px 8px}.shoe.l{left:32px}.shoe.r{right:32px}.avatar[data-sex="m"] .head{border-radius:44% 44% 42% 42%;width:88px;height:88px}.avatar[data-sex="m"] .body{left:27px;width:136px;clip-path:polygon(9% 0,91% 0,100% 28%,84% 100%,16% 100%,0 28%)}.avatar[data-sex="m"] .brow{height:6px}.avatar[data-sex="m"] .eye{height:17px}.avatar[data-sex="m"] .mouth{width:19px;left:86px}.avatar[data-sex="f"] .head{left:48px;top:8px;width:94px;height:99px;border-radius:50% 50% 47% 47%}.avatar[data-sex="f"] .ear.l{left:41px}.avatar[data-sex="f"] .ear.r{right:41px}.avatar[data-sex="f"] .brow{width:20px;height:4px;top:47px}.avatar[data-sex="f"] .brow.l{left:63px}.avatar[data-sex="f"] .brow.r{right:63px}.avatar[data-sex="f"] .eye{top:57px;width:19px;height:23px}.avatar[data-sex="f"] .eye.l{left:64px}.avatar[data-sex="f"] .eye.r{right:64px}.avatar[data-sex="f"] .eye:after{width:10px;height:14px;background:#8b5cf6}.avatar[data-sex="f"] .nose{left:93px;top:76px;height:6px}.avatar[data-sex="f"] .mouth{left:82px;top:92px;width:27px;border-bottom-color:#c85d78}.avatar[data-sex="f"] .cheek{display:block}.avatar[data-sex="f"] .neck{top:99px}.avatar[data-sex="f"] .body{left:43px;top:116px;width:104px;height:99px;border-radius:32px 32px 27px 27px;clip-path:polygon(16% 0,84% 0,76% 38%,94% 100%,6% 100%,24% 38%)}.avatar[data-sex="f"] .arm{top:126px;width:27px;height:82px}.avatar[data-sex="f"] .arm.l{left:32px}.avatar[data-sex="f"] .arm.r{right:32px}.avatar[data-sex="f"] .hand{top:197px;width:24px;height:25px}.avatar[data-sex="f"] .hand.l{left:31px}.avatar[data-sex="f"] .hand.r{right:31px}.avatar[data-sex="f"] .logoZ{left:80px;top:143px;width:30px;height:39px}.avatar[data-sex="f"] .leg{top:205px;width:34px;height:50px}.avatar[data-sex="f"] .leg.l{left:56px}.avatar[data-sex="f"] .leg.r{right:56px}.avatar[data-sex="f"] .shoe{top:245px;width:48px}.avatar[data-sex="f"] .shoe.l{left:42px}.avatar[data-sex="f"] .shoe.r{right:42px}.avatar[data-head="female01"] .hair{left:36px;top:-5px;width:118px;height:139px;border-radius:50%;clip-path:polygon(7% 10%,28% 1%,51% 0,74% 5%,92% 20%,100% 45%,92% 100%,78% 80%,78% 31%,66% 19%,51% 27%,38% 20%,23% 32%,21% 80%,5% 100%,0 44%)}.avatar[data-head="female02"] .hair{left:34px;top:-4px;width:122px;height:89px;clip-path:polygon(0 67%,4% 25%,18% 34%,27% 3%,39% 25%,51% 0,62% 24%,78% 4%,76% 30%,96% 19%,88% 51%,100% 62%,78% 68%,65% 50%,52% 72%,37% 51%,20% 74%)}.avatar[data-head="female02"] .head{border-radius:52% 52% 43% 43%}.avatar[data-head="female02"] .eye:after{background:#a855f7}.avatar[data-body="female02"] .body{left:39px;width:112px;clip-path:polygon(10% 0,90% 0,81% 45%,94% 100%,6% 100%,19% 45%)}.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:#182237;border-block:1px solid #536078}.tabs button{border:0;background:none;color:#aab4c7;padding:14px 3px;font-size:10px;font-weight:bold}.tabs button.on{color:#c9ff78;border-bottom:3px solid #c9ff78}.grid{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid #667188}.item{height:124px;border:0;border-right:1px solid #667188;border-bottom:1px solid #667188;background:#354055;color:#fff;position:relative;font-size:10px}.item.on{outline:3px solid #8b5cf6;outline-offset:-3px}.item.on:after{content:'✓';position:absolute;right:7px;top:4px;color:#bdf17b;font-size:24px}.mini{width:62px;height:76px;margin:8px auto 3px;position:relative}.mini .mh{width:46px;height:46px;border-radius:45%;background:var(--skin,#d79a72);margin:auto;border:2px solid #272034}.mini .mb{width:59px;height:34px;border-radius:16px;background:var(--c,#111827);margin:-2px auto;border:2px solid #272034}.mini.female .mh{width:51px;height:53px;border-radius:50%}.mini.female .mb{width:49px;border-radius:17px 17px 14px 14px}.mini.head .mb{display:none}.save{display:block;width:calc(100% - 36px);margin:20px 18px 0;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#9333ea,#6d28d9);color:#fff;font-weight:bold;font-size:15px}.note{text-align:center;color:#99a4b8;font-size:12px;padding:12px}</style></head><body><main class="app"><header class="top"><button onclick="history.back()">‹</button><h1>Zuno Avatar Studio</h1></header><section class="preview"><div class="sex"><button data-sex="m">♂</button><button data-sex="f">♀</button></div><div class="avatar" id="av"><i class="hair"></i><i class="ear l"></i><i class="ear r"></i><i class="head"></i><i class="brow l"></i><i class="brow r"></i><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="cheek l"></i><i class="cheek r"></i><i class="mouth"></i><i class="neck"></i><i class="arm l"></i><i class="arm r"></i><i class="body"></i><i class="logoZ"></i><i class="hand l"></i><i class="hand r"></i><i class="leg l"></i><i class="leg r"></i><i class="shoe l"></i><i class="shoe r"></i></div></section><nav class="tabs"><button class="on" data-cat="cabeca">Cabeça</button><button data-cat="corpo">Corpo</button><button data-cat="pele">Pele</button><button data-cat="cabelo">Cabelo</button><button data-cat="roupa">Roupas</button><button data-cat="calcado">Calçados</button></nav><section class="grid" id="grid"></section><button class="save" id="save">Salvar personagem</button><div class="note" id="note">Avatares Zuno redesenhados.</div></main><script>const sb=window.supabase.createClient('https://rliymfbbhqoejgfvsbuu.supabase.co','sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0');const C={pele:['#f4c8b8','#e5b08d','#d79a72','#bd7d59','#8f573d','#68402f'],cabelo:['#09090d','#2b1b18','#563629','#c7cbd5','#3b176e'],roupa:['#0b0a10','#7c3aed','#111827','#2563eb','#0f766e','#be123c'],calcado:['#15101d','#f4f4f5','#7c3aed','#2563eb']};const MODELS={m:{cabeca:[['classic-m01','Masculino Zuno']],corpo:[['classic-m01','Corpo Masculino']]},f:{cabeca:[['female01','Feminina Suave'],['female02','Feminina Urbana']],corpo:[['female01','Corpo Feminino Suave'],['female02','Corpo Feminino Urbano']]}};const D={version:6,style:'zuno-preset-v6',sex:'m',cabeca:'classic-m01',corpo:'classic-m01',pele:0,cabelo:0,roupa:0,calcado:0};let s={...D},cat='cabeca';const av=document.getElementById('av'),grid=document.getElementById('grid'),note=document.getElementById('note');function clean(v){let x={...D,...(v||{})};x.sex=x.sex==='f'?'f':'m';const h=MODELS[x.sex].cabeca.map(a=>a[0]),b=MODELS[x.sex].corpo.map(a=>a[0]);if(!h.includes(x.cabeca))x.cabeca=h[0];if(!b.includes(x.corpo))x.corpo=b[0];['pele','cabelo','roupa','calcado'].forEach(k=>x[k]=Math.max(0,Math.min(C[k].length-1,+x[k]||0)));x.style=D.style;x.version=6;return x}function paint(){av.dataset.sex=s.sex;av.dataset.head=s.cabeca;av.dataset.body=s.corpo;av.style.setProperty('--skin',C.pele[s.pele]);av.style.setProperty('--hair',C.cabelo[s.cabelo]);av.style.setProperty('--top',C.roupa[s.roupa]);av.style.setProperty('--bottom',s.roupa%2?'#111827':'#0c0b11');av.style.setProperty('--shoe',C.calcado[s.calcado]);document.querySelectorAll('[data-sex]').forEach(b=>b.classList.toggle('on',b.dataset.sex===s.sex))}function render(){grid.innerHTML='';if(cat==='cabeca'||cat==='corpo'){MODELS[s.sex][cat].forEach(([id,name])=>{let b=document.createElement('button');b.className='item '+(s[cat]===id?'on':'');b.innerHTML='<div class="mini '+(cat==='cabeca'?'head ':'')+(s.sex==='f'?'female':'')+'"><div class="mh"></div><div class="mb"></div></div>'+name;b.onclick=()=>{s[cat]=id;paint();render()};grid.appendChild(b)});return}C[cat].forEach((c,i)=>{let b=document.createElement('button');b.className='item '+(s[cat]===i?'on':'');b.innerHTML='<div class="mini '+((cat==='pele'||cat==='cabelo')?'head ':'')+(s.sex==='f'?'female':'')+'"><div class="mh" style="'+(cat==='pele'?'--skin:'+c:'')+'"></div><div class="mb" style="--c:'+c+'"></div></div>';b.onclick=()=>{s[cat]=i;paint();render()};grid.appendChild(b)})}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.cat;render()});document.querySelectorAll('[data-sex]').forEach(b=>b.onclick=()=>{if(s.sex===b.dataset.sex)return;s.sex=b.dataset.sex;if(s.sex==='f'){s.cabeca='female01';s.corpo='female01'}else{s.cabeca='classic-m01';s.corpo='classic-m01'};paint();render();note.textContent=s.sex==='f'?'Bases femininas selecionadas.':'Base masculina selecionada.'});document.getElementById('save').onclick=async()=>{note.textContent='Salvando...';try{s=clean(s);const {data:{user}}=await sb.auth.getUser();if(!user)throw Error('Sessão inválida');const cfg={...s,updatedAt:new Date().toISOString()};const {error}=await sb.from('profiles').update({avatar_config:cfg,avatar_url:null,sex:s.sex==='f'?'feminino':'masculino'}).eq('id',user.id);if(error)throw error;localStorage.setItem('zunoAvatarPreset',JSON.stringify(cfg));note.textContent='Personagem Zuno salvo ✓'}catch(e){note.textContent='Erro ao salvar: '+e.message}};(async()=>{try{const local=JSON.parse(localStorage.getItem('zunoAvatarPreset')||'null');if(local)s=clean(local);const {data:{user}}=await sb.auth.getUser();if(user){const {data}=await sb.from('profiles').select('avatar_config').eq('id',user.id).maybeSingle();if(data?.avatar_config?.style?.startsWith('zuno-preset'))s=clean(data.avatar_config)}}catch(e){}paint();render()})();</script></body></html>
