<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02040d">
<title>ZunoPlay · Avatar Studio</title>
<script>window.__ZUNO_AVATAR_STUDIO_MANAGED__=true;window.__ZUNO_AVATAR_SIMPLE__=true;</script>
<!-- Bloqueia os módulos legados do Avatar Studio mesmo se um zuno-current antigo estiver em cache. -->
<style id="zunoplay-current-avatar-studio-style"></style>
<script id="zunoplay-avatar-studio-reference-v167" type="application/json"></script>
<style id="zunoplay-avatar-studio-reference-v169-style"></style>
<script id="zunoplay-avatar-studio-reference-v169-script" type="application/json"></script>
<style id="zunoplay-avatar-studio-reference-v170-style"></style>
<script id="zunoplay-avatar-studio-fixes-v170-script" type="application/json"></script>
<style id="zunoplay-avatar-studio-mobile-v171-style"></style>
<script id="zunoplay-avatar-studio-command-hierarchy-v172" type="application/json"></script>
<style id="zunoplay-current-avatar-finish-v174-style"></style>
<link rel="stylesheet" href="zuno-avatar-simple.css?v=3">
<link rel="stylesheet" href="zuno-avatar-simple-v4.css?v=4">
<script defer src="nav.js?v=188"></script>
<script defer src="zuno-avatar-simple.js?v=1"></script>
</head>
<body class="zuno-avatar-simple">
<main class="avatar-simple-app" aria-label="Avatar Studio ZunoPlay">
  <section class="avatar-simple-intro">
    <div>
      <h1>Escolha seu Zuno</h1>
      <p>Use um dos dois avatares oficiais. A aparência é fixa para manter a identidade ZunoPlay.</p>
    </div>
    <div class="avatar-simple-badge">2 AVATARES OFICIAIS</div>
  </section>

  <section class="avatar-choice-grid" aria-label="Escolha do avatar oficial">
    <button class="avatar-choice is-active" type="button" data-model="masculino" aria-label="Selecionar avatar masculino">
      <img id="simpleMaleThumb" alt="Avatar masculino oficial ZunoPlay">
      <span class="avatar-choice-copy"><strong>Masculino</strong><span>Street Z oficial</span></span>
      <span class="avatar-choice-check">✓</span>
    </button>
    <button class="avatar-choice" type="button" data-model="feminino" aria-label="Selecionar avatar feminino">
      <img id="simpleFemaleThumb" alt="Avatar feminino oficial ZunoPlay">
      <span class="avatar-choice-copy"><strong>Feminino</strong><span>Street Z oficial</span></span>
      <span class="avatar-choice-check">✓</span>
    </button>
  </section>

  <section class="avatar-stage-card" aria-label="Prévia do avatar selecionado">
    <div class="avatar-stage-grid"></div>
    <div class="avatar-stage-ring"></div>
    <div class="avatar-stage-title">ZUNO PULSE <span class="avatar-stage-sub" id="simpleAvatarName">Zuno Masculino</span></div>
    <img class="avatar-stage-img" id="simpleAvatarPreview" alt="Prévia do avatar oficial ZunoPlay">
    <div class="avatar-stage-platform"></div>
  </section>

  <section class="avatar-simple-section" aria-labelledby="mascotTitle">
    <div class="avatar-simple-section-head">
      <h2 id="mascotTitle">Mascote</h2>
      <span>Escolha quem acompanha seu Zuno</span>
    </div>
    <div class="mascot-grid">
      <button class="mascot-option" type="button" data-mascot="0"><span class="mascot-icon">—</span><span>Sem mascote</span></button>
      <button class="mascot-option is-active" type="button" data-mascot="1"><span class="mascot-icon">Z</span><span>Zuno Fox</span></button>
      <button class="mascot-option" type="button" data-mascot="2"><span class="mascot-icon">C</span><span>Zuno Cat</span></button>
      <button class="mascot-option" type="button" data-mascot="3"><span class="mascot-icon">B</span><span>Z-Bot</span></button>
    </div>
  </section>

  <button class="avatar-save" id="simpleAvatarSave" type="button">SALVAR MEU ZUNO</button>
  <div class="avatar-status" id="simpleAvatarStatus">Carregando seu avatar...</div>
</main>
<div class="avatar-toast" id="simpleAvatarToast"></div>
</body>
</html>
