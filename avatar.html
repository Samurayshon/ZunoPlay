<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02040d">
<title>ZunoPlay · Avatar Studio</title>
<script>window.__ZUNO_AVATAR_STUDIO_MANAGED__=true;window.__ZUNO_AVATAR_SIMPLE__=true;</script>
<link rel="stylesheet" href="zuno-avatar-simple.css?v=5">
<link rel="stylesheet" href="zuno-avatar-simple-v4.css?v=5">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="nav.js?v=350"></script>
<script id="zunoplay-avatar-renderer" defer src="avatar-renderer.js?v=347"></script>
<script defer src="zuno-avatar-simple.js?v=2"></script>
</head>
<body class="zuno-avatar-simple">
<main class="avatar-simple-app" aria-label="Avatar Studio ZunoPlay">
  <section class="avatar-simple-intro"><div><h1>Escolha seu avatar</h1><p>Seu avatar representa você dentro do ZunoPlay. O Zuno é o mascote e guia oficial da plataforma.</p></div><div class="avatar-simple-badge">2 AVATARES OFICIAIS</div></section>
  <section class="avatar-choice-grid" aria-label="Escolha do avatar oficial">
    <button class="avatar-choice is-active" type="button" data-model="masculino" aria-label="Selecionar avatar masculino"><img id="simpleMaleThumb" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Avatar masculino oficial ZunoPlay"><span class="avatar-choice-copy"><strong>Masculino</strong><span>Street Z oficial</span></span><span class="avatar-choice-check">✓</span></button>
    <button class="avatar-choice" type="button" data-model="feminino" aria-label="Selecionar avatar feminino"><img id="simpleFemaleThumb" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Avatar feminino oficial ZunoPlay"><span class="avatar-choice-copy"><strong>Feminino</strong><span>Street Z oficial</span></span><span class="avatar-choice-check">✓</span></button>
  </section>
  <section class="avatar-stage-card" aria-label="Prévia do avatar selecionado"><div class="avatar-stage-grid"></div><div class="avatar-stage-ring"></div><div class="avatar-stage-title">ZUNO PULSE <span class="avatar-stage-sub" id="simpleAvatarName">Avatar Masculino</span></div><img class="avatar-stage-img" id="simpleAvatarPreview" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Prévia do avatar oficial ZunoPlay"><div class="avatar-stage-platform"></div></section>
  <section class="avatar-simple-section" aria-labelledby="mascotTitle"><div class="avatar-simple-section-head"><h2 id="mascotTitle">Companheiro</h2><span>Escolha quem acompanha seu avatar</span></div><div class="mascot-grid"><button class="mascot-option" type="button" data-mascot="0"><span class="mascot-icon">—</span><span>Sem companheiro</span></button><button class="mascot-option is-active" type="button" data-mascot="1"><span class="mascot-icon">Z</span><span>Zuno Fox</span></button><button class="mascot-option" type="button" data-mascot="2"><span class="mascot-icon">C</span><span>Zuno Cat</span></button><button class="mascot-option" type="button" data-mascot="3"><span class="mascot-icon">B</span><span>Z-Bot</span></button></div></section>
  <button class="avatar-save" id="simpleAvatarSave" type="button">SALVAR MEU AVATAR</button><div class="avatar-status" id="simpleAvatarStatus" data-zuno-loader-ignore>Carregando seu avatar...</div>
</main><div class="avatar-toast" id="simpleAvatarToast"></div>
</body></html>
