<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Avatar - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#070811;color:#fff;font-family:Arial,sans-serif}.app{max-width:480px;min-height:100vh;margin:auto;padding:22px}.header{display:flex;align-items:center;gap:12px;margin-bottom:18px}.home{width:42px;height:42px;border:1px solid #303145;border-radius:12px;background:#1b1c2b;color:#fff;font-size:20px}.logo{font-size:27px;font-weight:800}.logo span{color:#8b5cf6}.card{background:#141523;border:1px solid #303145;border-radius:22px;padding:20px;margin-bottom:14px}.preview{display:flex;justify-content:center;padding:10px 0 22px}.avatar{width:190px;height:190px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(145deg,#8b5cf6,#312e81);box-shadow:0 15px 45px #0008}.avatar .body{position:absolute;width:110px;height:75px;bottom:-8px;border-radius:55% 55% 0 0;background:var(--shirt)}.avatar .head{position:absolute;width:92px;height:105px;top:43px;border-radius:48% 48% 45% 45%;background:var(--skin);z-index:2}.avatar .hair{position:absolute;width:100px;height:55px;top:35px;border-radius:55% 55% 35% 35%;background:var(--hair);z-index:3}.avatar .eye{position:absolute;width:9px;height:9px;border-radius:50%;background:#161622;top:91px;z-index:4}.avatar .eye.l{left:69px}.avatar .eye.r{right:69px}.avatar .mouth{position:absolute;width:24px;height:8px;border-bottom:3px solid #7b3f45;border-radius:50%;top:120px;z-index:4}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button.opt{padding:11px 5px;border-radius:12px;border:1px solid #303145;background:#10111c;color:#fff}.opt.active{border-color:#8b5cf6;background:#21164a}.save{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-weight:bold;font-size:15px}.msg{text-align:center;min-height:20px;margin-top:10px;color:#86efac}.muted{color:#9293a3;font-size:13px}h2{margin:0 0 6px}</style></head><body><main class="app"><header class="header"><button class="home" onclick="location.href='index.html'">⌂</button><div class="logo">Zuno<span>Play</span></div></header><section class="card"><h2>Crie seu Avatar</h2><p class="muted">Personalize seu personagem para aparecer no perfil e nas salas.</p><div class="preview"><div id="avatar" class="avatar"><div class="body"></div><div class="head"></div><div class="hair"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div></div><h3>Tom de pele</h3><div id="skin" class="grid"></div><h3>Cabelo</h3><div id="hair" class="grid"></div><h3>Roupa</h3><div id="shirt" class="grid"></div><button class="save" id="save">Salvar avatar</button><div id="msg" class="msg"></div></section></main><script>const sb=window.supabase.createClient("https://rliymfbbhqoejgfvsbuu.supabase.co","sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0");const choices={skin:["#f6c7a5","#e6a77b","#b86f45","#70412c","#4a281d"],hair:["#17131b","#4a2c1e","#8b5a2b","#d6a33a","#7a1f46","#d8d8df"],shirt:["#8b5cf6","#2563eb","#16a34a","#ef4444","#f59e0b","#e5e7eb"]};let state={skin:choices.skin[0],hair:choices.hair[0],shirt:choices.shirt[0]};function render(k){const box=document.getElementById(k);box.innerHTML='';choices[k].forEach((v,i)=>{const b=document.createElement('button');b.className='opt '+(state[k]===v?'active':'');b.textContent=['Pele','Pele','Pele','Pele','Pele'][i]||'';b.style.background=v;b.style.color=(k==='shirt'&&i===5)?'#111':'#fff';if(k==='hair')b.textContent='Cabelo '+(i+1);if(k==='shirt')b.textContent='Roupa '+(i+1);if(k==='skin')b.textContent='Tom '+(i+1);b.onclick=()=>{state[k]=v;render(k);paint()};box.appendChild(b)})}function paint(){const a=document.getElementById('avatar');a.style.setProperty('--skin',state.skin);a.style.setProperty('--hair',state.hair);a.style.setProperty('--shirt',state.shirt)}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='login.html';return}const{data:p}=await sb.from('profiles').select('avatar_url').eq('id',session.user.id).maybeSingle();if(p?.avatar_url){try{const x=JSON.parse(p.avatar_url);if(x.skin)state=x}catch(e){}}Object.keys(choices).forEach(render);paint()}document.getElementById('save').onclick=async()=>{const{data:{session}}=await sb.auth.getSession();if(!session?.user)return;const b=document.getElementById('save'),m=document.getElementById('msg');b.disabled=true;b.textContent='Salvando...';const{error}=await sb.from('profiles').update({avatar_url:JSON.stringify(state)}).eq('id',session.user.id);m.textContent=error?'Não foi possível salvar.':'Avatar salvo com sucesso! ✅';b.disabled=false;b.textContent='Salvar avatar'};init();</script></body></html>
