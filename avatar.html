<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Avatar - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#070811;color:#fff;font-family:Arial,sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;padding:20px}.header{display:flex;align-items:center;gap:12px;margin-bottom:18px}.home{width:42px;height:42px;border:1px solid #303145;border-radius:12px;background:#1b1c2b;color:#fff;font-size:20px}.logo{font-size:27px;font-weight:800}.logo span{color:#8b5cf6}.card{background:#141523;border:1px solid #303145;border-radius:22px;padding:18px;margin-bottom:14px}.preview{display:flex;justify-content:center;padding:12px 0 20px}.avatar{width:210px;height:210px;border-radius:50%;position:relative;overflow:hidden;background:linear-gradient(145deg,#8b5cf6,#312e81);box-shadow:0 15px 45px #0008}.avatar .body{position:absolute;width:125px;height:92px;left:42px;bottom:-12px;border-radius:55% 55% 0 0;background:var(--shirt);z-index:1}.avatar .neck{position:absolute;width:34px;height:35px;left:88px;top:130px;background:var(--skin);z-index:2}.avatar .head{position:absolute;width:96px;height:112px;left:57px;top:55px;border-radius:48% 48% 45% 45%;background:var(--skin);z-index:3}.avatar .hair-back{display:none;position:absolute;background:var(--hair);z-index:2}.avatar .hair{position:absolute;width:106px;height:62px;left:52px;top:46px;border-radius:55% 55% 35% 35%;background:var(--hair);z-index:4}.avatar .eye{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--eye);top:102px;z-index:5}.avatar .eye.l{left:79px}.avatar .eye.r{right:79px}.avatar .brow{position:absolute;width:24px;height:5px;border-radius:5px;background:var(--hair);top:90px;z-index:5}.avatar .brow.l{left:72px}.avatar .brow.r{right:72px}.avatar .mouth{position:absolute;width:27px;height:9px;border-bottom:3px solid #7b3f45;border-radius:50%;left:91px;top:132px;z-index:5}.avatar.masculino.hair-degrade .hair{height:48px;top:51px;border-radius:58% 58% 28% 28%}.avatar.masculino.hair-ondulado .hair{height:68px;top:43px;border-radius:48% 62% 42% 30%;transform:rotate(-2deg)}.avatar.feminino .body{width:112px;left:49px;height:96px;border-radius:48% 48% 0 0}.avatar.feminino .neck{width:30px;left:90px}.avatar.feminino .head{width:90px;height:114px;left:60px;border-radius:49% 49% 48% 48%}.avatar.feminino .eye{width:11px;height:9px}.avatar.feminino .eye.l{left:80px}.avatar.feminino .eye.r{right:80px}.avatar.feminino .brow{width:22px;height:4px}.avatar.feminino .hair-back{display:block;width:116px;height:130px;left:47px;top:48px;border-radius:52% 52% 42% 42%}.avatar.feminino .hair{width:106px;height:64px;left:52px;top:44px;border-radius:55% 55% 30% 30%}.avatar.feminino.hair-chanel .hair-back{height:105px;top:51px;border-radius:48% 48% 38% 38%}.avatar.feminino.hair-rabo .hair-back{width:101px;height:100px;left:54px}.avatar.feminino.hair-rabo .hair-back:after{content:'';position:absolute;width:48px;height:75px;right:-31px;top:24px;border-radius:50%;background:var(--hair);transform:rotate(16deg)}.avatar.feminino .mouth{width:25px;left:92px}.section{margin-top:18px}.section h3{margin:0 0 9px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid.two{grid-template-columns:1fr 1fr}.opt{padding:11px 6px;border-radius:12px;border:1px solid #303145;background:#10111c;color:#fff;cursor:pointer}.opt.active{border-color:#8b5cf6;box-shadow:0 0 0 1px #8b5cf6}.sex-opt{padding:14px 10px;font-size:14px}.sex-opt span{display:block;font-size:24px;margin-bottom:4px}.save{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-weight:bold;font-size:15px;cursor:pointer}.save:disabled{opacity:.6}.msg{text-align:center;min-height:20px;margin-top:10px;color:#86efac;font-size:13px}.muted{color:#9293a3;font-size:13px}h2{margin:0 0 6px}</style></head><body><main class="app"><header class="header"><button class="home" onclick="location.href='index.html'">⌂</button><div class="logo">Zuno<span>Play</span></div></header><section class="card"><h2>Meu Avatar</h2><p class="muted">Crie sua identidade para o perfil e para as salas.</p><div class="preview"><div id="avatar" class="avatar masculino hair-curto"><div class="hair-back"></div><div class="body"></div><div class="neck"></div><div class="head"></div><div class="hair"></div><div class="brow l"></div><div class="brow r"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div></div><div class="section"><h3>Sexo do avatar</h3><div id="sex" class="grid two"></div></div><div class="section"><h3>Tom de pele</h3><div id="skin" class="grid"></div></div><div class="section"><h3>Estilo do cabelo</h3><div id="hairStyle" class="grid"></div></div><div class="section"><h3>Cor do cabelo</h3><div id="hair" class="grid"></div></div><div class="section"><h3>Roupa</h3><div id="shirt" class="grid"></div></div><div class="section"><h3>Cor dos olhos</h3><div id="eyes" class="grid"></div></div><div class="section"><h3>Fundo</h3><div id="bg" class="grid"></div></div><button class="save" id="save">Salvar avatar</button><div id="msg" class="msg"></div></section></main><script>const sb=window.supabase.createClient("https://rliymfbbhqoejgfvsbuu.supabase.co","sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0");const choices={skin:["#f6c7a5","#e6a77b","#b86f45","#70412c","#4a281d"],hair:["#17131b","#4a2c1e","#8b5a2b","#d6a33a","#7a1f46","#d8d8df"],shirt:["#8b5cf6","#2563eb","#16a34a","#ef4444","#f59e0b","#e5e7eb"],eyes:["#161622","#4b2e1e","#2563eb","#16a34a","#6b4f2a","#64748b"],bg:["linear-gradient(145deg,#8b5cf6,#312e81)","linear-gradient(145deg,#2563eb,#172554)","linear-gradient(145deg,#16a34a,#064e3b)","linear-gradient(145deg,#ef4444,#7f1d1d)","linear-gradient(145deg,#f59e0b,#78350f)","linear-gradient(145deg,#ec4899,#581c87)"]};const hairStyles={masculino:[['curto','Curto'],['degrade','Degradê'],['ondulado','Ondulado']],feminino:[['longo','Longo'],['chanel','Chanel'],['rabo','Rabo de cavalo']]};let state={sex:'masculino',skin:choices.skin[0],hair:choices.hair[0],hairStyle:'curto',shirt:choices.shirt[0],eyes:choices.eyes[0],bg:choices.bg[0]};function colorLabel(k,i){return k==='skin'?'Tom '+(i+1):k==='hair'?'Cor '+(i+1):k==='shirt'?'Roupa '+(i+1):k==='eyes'?'Olhos '+(i+1):'Fundo '+(i+1)}function renderSex(){const box=document.getElementById('sex');box.innerHTML='';[['masculino','♂','Masculino'],['feminino','♀','Feminino']].forEach(([v,icon,label])=>{const b=document.createElement('button');b.type='button';b.className='opt sex-opt '+(state.sex===v?'active':'');b.innerHTML='<span>'+icon+'</span>'+label;b.onclick=()=>{if(state.sex===v)return;state.sex=v;state.hairStyle=hairStyles[v][0][0];renderSex();renderHairStyle();paint()};box.appendChild(b)})}function renderHairStyle(){const box=document.getElementById('hairStyle');box.innerHTML='';hairStyles[state.sex].forEach(([v,label])=>{const b=document.createElement('button');b.type='button';b.className='opt '+(state.hairStyle===v?'active':'');b.textContent=label;b.onclick=()=>{state.hairStyle=v;renderHairStyle();paint()};box.appendChild(b)})}function render(k){const box=document.getElementById(k);box.innerHTML='';choices[k].forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.className='opt '+(state[k]===v?'active':'');b.textContent=colorLabel(k,i);b.style.background=v;if(k==='eyes')b.style.color='#fff';if(k==='skin'||k==='hair'||k==='shirt'||k==='eyes')b.style.boxShadow='inset 0 0 0 999px '+v+'22';b.onclick=()=>{state[k]=v;render(k);paint()};box.appendChild(b)})}function paint(){const a=document.getElementById('avatar');a.className='avatar '+state.sex+' hair-'+state.hairStyle;a.style.setProperty('--skin',state.skin);a.style.setProperty('--hair',state.hair);a.style.setProperty('--shirt',state.shirt);a.style.setProperty('--eye',state.eyes);a.style.background=state.bg;document.querySelectorAll('.eye').forEach(e=>e.style.background=state.eyes)}function hairSvg(){if(state.sex==='feminino'){if(state.hairStyle==='chanel')return '<path d="M142 112c5-62 111-65 116 0v112c-18 10-31 12-45 7l-13-31-13 31c-16 5-30 2-45-7z" fill="'+state.hair+'"/><path d="M148 116c8-58 96-70 108 0v34c-26-24-57-30-108 0z" fill="'+state.hair+'"/>';if(state.hairStyle==='rabo')return '<ellipse cx="278" cy="151" rx="34" ry="61" fill="'+state.hair+'" transform="rotate(18 278 151)"/><path d="M151 110c8-55 91-64 103 2v80c-12 20-96 20-105 0z" fill="'+state.hair+'"/><path d="M148 116c8-58 96-70 108 0v34c-26-24-57-30-108 0z" fill="'+state.hair+'"/>';return '<path d="M142 110c5-64 111-67 116 0v154c-20 17-39 15-58-4-19 19-38 21-58 4z" fill="'+state.hair+'"/><path d="M148 116c8-58 96-70 108 0v34c-26-24-57-30-108 0z" fill="'+state.hair+'"/>'}if(state.hairStyle==='degrade')return '<path d="M150 119c8-50 92-59 104 0v27c-24-18-51-23-104 0z" fill="'+state.hair+'"/>';if(state.hairStyle==='ondulado')return '<path d="M145 119c4-60 100-75 113-5 3 19-3 35-9 45-26-28-55-28-101-7-5-11-8-22-3-33z" fill="'+state.hair+'"/>';return '<path d="M148 116c8-58 96-70 108 0v32c-22-20-45-28-108 0z" fill="'+state.hair+'"/>'}function svgData(){const colors=state.bg.match(/#[0-9a-fA-F]{6}/g)||['#8b5cf6','#312e81'];const female=state.sex==='feminino';const body=female?'<path d="M92 400c8-88 53-116 108-116s100 28 108 116" fill="'+state.shirt+'"/>':'<path d="M80 400c10-88 62-112 120-112s110 24 120 112" fill="'+state.shirt+'"/>';const head=female?'<rect x="157" y="92" width="86" height="120" rx="43" fill="'+state.skin+'"/>':'<rect x="154" y="92" width="92" height="118" rx="45" fill="'+state.skin+'"/>';const lashes=female?'<path d="M170 150l-7-4M230 150l7-4" stroke="'+state.hair+'" stroke-width="3" stroke-linecap="round"/>':'';const svg='<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><metadata data-zuno-sex="'+state.sex+'" data-zuno-hair-style="'+state.hairStyle+'"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="'+colors[0]+'"/><stop offset="1" stop-color="'+colors[1]+'"/></linearGradient></defs><circle cx="200" cy="200" r="200" fill="url(#g)"/>'+body+'<rect x="184" y="205" width="32" height="45" rx="14" fill="'+state.skin+'"/>'+hairSvg()+head+'<path d="M165 135h25M210 135h25" stroke="'+state.hair+'" stroke-width="6" stroke-linecap="round"/><circle cx="180" cy="153" r="7" fill="'+state.eyes+'"/><circle cx="220" cy="153" r="7" fill="'+state.eyes+'"/>'+lashes+'<path d="M185 180q15 12 30 0" fill="none" stroke="#7b3f45" stroke-width="6" stroke-linecap="round"/></svg>';return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}function restoreFromSvg(value){try{const raw=decodeURIComponent(String(value).split(',').slice(1).join(','));const sex=raw.match(/data-zuno-sex="(masculino|feminino)"/)?.[1];const style=raw.match(/data-zuno-hair-style="([^"]+)"/)?.[1];const bg1=raw.match(/<stop stop-color="(#[0-9a-fA-F]{6})"/)?.[1];const bg2=raw.match(/<stop offset="1" stop-color="(#[0-9a-fA-F]{6})"/)?.[1];const shirt=raw.match(/<path d="M(?:80|92) 400[^>]*fill="(#[0-9a-fA-F]{6})"/)?.[1];const skin=raw.match(/<rect x="(?:154|157)" y="92"[^>]*fill="(#[0-9a-fA-F]{6})"/)?.[1];const eyes=raw.match(/<circle cx="180" cy="153"[^>]*fill="(#[0-9a-fA-F]{6})"/)?.[1];const hair=raw.match(/stroke="(#[0-9a-fA-F]{6})" stroke-width="6"/)?.[1];const bg=bg1&&bg2?`linear-gradient(145deg,${bg1},${bg2})`:null;if(sex)state.sex=sex;if(style&&hairStyles[state.sex].some(x=>x[0]===style))state.hairStyle=style;if(skin&&choices.skin.includes(skin))state.skin=skin;if(hair&&choices.hair.includes(hair))state.hair=hair;if(shirt&&choices.shirt.includes(shirt))state.shirt=shirt;if(eyes&&choices.eyes.includes(eyes))state.eyes=eyes;if(bg&&choices.bg.includes(bg))state.bg=bg}catch(e){console.warn('Avatar antigo não pôde ser restaurado.',e)}}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='login.html';return}const{data:p}=await sb.from('profiles').select('avatar_url,sex').eq('id',session.user.id).maybeSingle();if(p?.sex==='feminino'){state.sex='feminino';state.hairStyle='longo'}else{state.sex='masculino';state.hairStyle='curto'}if(p?.avatar_url&&p.avatar_url.startsWith('data:image/svg+xml'))restoreFromSvg(p.avatar_url);renderSex();renderHairStyle();['skin','hair','shirt','eyes','bg'].forEach(render);paint()}document.getElementById('save').onclick=async()=>{const{data:{session}}=await sb.auth.getSession();if(!session?.user)return;const b=document.getElementById('save'),m=document.getElementById('msg');b.disabled=true;b.textContent='Salvando...';const{error}=await sb.from('profiles').update({avatar_url:svgData(),sex:state.sex}).eq('id',session.user.id);m.textContent=error?'Não foi possível salvar o avatar.':'Avatar salvo com sucesso! ✅';m.style.color=error?'#fca5a5':'#86efac';b.disabled=false;b.textContent='Salvar avatar'};init();</script></body></html>
