<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d1a"><title>Zuno Avatar Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#080d1a;color:#fff;font-family:Arial,sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;background:#10182a;padding-bottom:30px}.top{display:flex;gap:14px;align-items:center;padding:22px 18px}.top button{border:0;background:none;color:#fff;font-size:36px}.top h1{margin:0;font-size:26px}.preview{height:300px;display:flex;align-items:center;justify-content:center;position:relative}.sex{position:absolute;left:18px;top:0;display:flex;gap:10px}.sex button{width:52px;height:52px;border:0;border-radius:50%;font-size:23px;background:#273149;color:#8993a8}.sex button.on{background:#bdf17b;color:#20310e}.avatar{width:170px;height:250px;position:relative;filter:drop-shadow(0 12px 18px #6d28d966)}.head{position:absolute;z-index:3;left:47px;top:18px;width:76px;height:76px;border-radius:50%;background:var(--skin);border:4px solid #32233b}.hair{position:absolute;z-index:5;left:39px;top:0;width:92px;height:62px;background:var(--hair);clip-path:polygon(0 65%,0 28%,12% 34%,7% 9%,24% 24%,30% 0,43% 20%,53% 0,62% 22%,80% 3%,77% 30%,100% 23%,88% 50%,100% 58%,78% 66%,69% 49%,54% 68%,39% 50%,22% 69%)}.avatar[data-head="female01"] .head{left:48px;width:74px;height:78px;border-radius:48% 48% 52% 52%}.avatar[data-head="female01"] .hair{left:35px;width:100px;height:105px;clip-path:polygon(8% 8%,38% 0,70% 4%,93% 25%,98% 100%,78% 78%,75% 28%,58% 18%,42% 23%,25% 31%,22% 80%,2% 100%,4% 28%)}.avatar[data-head="female02"] .head{left:49px;top:19px;width:72px;height:76px;border-radius:50% 50% 45% 45%}.avatar[data-head="female02"] .hair{left:36px;top:2px;width:98px;height:72px;clip-path:polygon(2% 58%,7% 20%,25% 29%,34% 2%,48% 24%,65% 0,72% 25%,94% 14%,87% 48%,100% 62%,76% 67%,62% 48%,49% 69%,35% 49%,18% 72%)}.eye{position:absolute;z-index:6;top:49px;width:14px;height:18px;border-radius:50%;background:#f7f2ff;border:2px solid #5a3c72}.eye:after{content:'';position:absolute;width:7px;height:10px;border-radius:50%;background:#8b5cf6;left:2px;top:2px}.eye.l{left:66px}.eye.r{right:66px}.mouth{position:absolute;z-index:6;left:75px;top:78px;width:20px;height:9px;border-bottom:3px solid #a15768;border-radius:50%}.body{position:absolute;left:35px;top:94px;width:100px;height:105px;border-radius:35px 35px 22px 22px;background:var(--top);border:4px solid #30253f}.avatar[data-body="female01"] .body{left:40px;width:90px;border-radius:31px 31px 30px 30px;clip-path:polygon(10% 0,90% 0,82% 42%,100% 100%,0 100%,18% 42%)}.avatar[data-body="female02"] .body{left:38px;width:94px;border-radius:34px 34px 20px 20px;clip-path:polygon(8% 0,92% 0,84% 48%,94% 100%,6% 100%,16% 48%)}.logoZ{position:absolute;z-index:4;left:68px;top:124px;width:35px;height:44px;border:5px solid #b44cff;clip-path:polygon(0 0,100% 0,50% 100%);transform:rotate(180deg)}.leg{position:absolute;top:188px;width:39px;height:48px;background:var(--bottom);border:4px solid #30253f;border-radius:0 0 15px 15px}.leg.l{left:44px}.leg.r{right:44px}.avatar[data-body^="female"] .leg{width:34px}.avatar[data-body^="female"] .leg.l{left:48px}.avatar[data-body^="female"] .leg.r{right:48px}.shoe{position:absolute;top:226px;width:52px;height:21px;background:var(--shoe);border:4px solid #6d28d9;border-radius:16px 16px 8px 8px}.shoe.l{left:30px}.shoe.r{right:30px}.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:#182237;border-block:1px solid #536078;overflow:auto}.tabs button{border:0;background:none;color:#aab4c7;padding:14px 3px;font-size:10px;font-weight:bold}.tabs button.on{color:#c9ff78;border-bottom:3px solid #c9ff78}.grid{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid #667188}.item{height:120px;border:0;border-right:1px solid #667188;border-bottom:1px solid #667188;background:#354055;color:#fff;position:relative;font-size:10px}.item.on{outline:3px solid #8b5cf6;outline-offset:-3px}.item.on:after{content:'✓';position:absolute;right:7px;top:4px;color:#bdf17b;font-size:24px}.mini{width:58px;height:70px;margin:10px auto 4px;position:relative}.mini .mh{width:44px;height:44px;border-radius:50%;background:var(--skin,#d79a72);margin:auto;border:2px solid #272034}.mini .mb{width:54px;height:31px;border-radius:15px;background:var(--c);margin:-2px auto;border:2px solid #272034}.mini.head .mb{display:none}.save{display:block;width:calc(100% - 36px);margin:20px 18px 0;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#9333ea,#6d28d9);color:#fff;font-weight:bold;font-size:15px}.note{text-align:center;color:#99a4b8;font-size:12px;padding:12px}</style></head><body><main class="app"><header class="top"><button onclick="history.back()">‹</button><h1>Zuno Avatar Studio</h1></header><section class="preview"><div class="sex"><button data-sex="m">♂</button><button data-sex="f">♀</button></div><div class="avatar" id="av"><i class="hair"></i><i class="head"></i><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i><i class="body"></i><i class="logoZ"></i><i class="leg l"></i><i class="leg r"></i><i class="shoe l"></i><i class="shoe r"></i></div></section><nav class="tabs"><button class="on" data-cat="cabeca">Cabeça</button><button data-cat="corpo">Corpo</button><button data-cat="pele">Pele</button><button data-cat="cabelo">Cabelo</button><button data-cat="roupa">Roupas</button><button data-cat="calcado">Calçados</button></nav><section class="grid" id="grid"></section><button class="save" id="save">Salvar personagem</button><div class="note" id="note">Escolha cabeça e corpo do seu personagem Zuno.</div></main><script>const sb=window.supabase.createClient('https://rliymfbbhqoejgfvsbuu.supabase.co','sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0');const C={pele:['#f4c8b8','#e5b08d','#d79a72','#bd7d59','#8f573d','#68402f'],cabelo:['#09090d','#2b1b18','#563629','#c7cbd5','#3b176e'],roupa:['#0b0a10','#7c3aed','#111827','#2563eb','#0f766e','#be123c'],calcado:['#15101d','#f4f4f5','#7c3aed','#2563eb']};const MODELS={m:{cabeca:[['classic-m01','Zuno Masculino Clássico']],corpo:[['classic-m01','Zuno Masculino Clássico']]},f:{cabeca:[['female01','Zuno Feminina 01'],['female02','Zuno Feminina 02']],corpo:[['female01','Zuno Feminino 01'],['female02','Zuno Feminino 02']]}};const D={version:4,style:'zuno-preset-v4',sex:'m',cabeca:'classic-m01',corpo:'classic-m01',pele:0,cabelo:0,roupa:0,calcado:0};let s={...D},cat='cabeca';const av=document.getElementById('av'),grid=document.getElementById('grid'),note=document.getElementById('note');function clean(v){let x={...D,...(v||{})};x.sex=x.sex==='f'?'f':'m';const validH=MODELS[x.sex].cabeca.map(a=>a[0]),validB=MODELS[x.sex].corpo.map(a=>a[0]);if(!validH.includes(x.cabeca))x.cabeca=validH[0];if(!validB.includes(x.corpo))x.corpo=validB[0];['pele','cabelo','roupa','calcado'].forEach(k=>x[k]=Math.max(0,Math.min(C[k].length-1,+x[k]||0)));x.style=D.style;x.version=4;return x}function paint(){av.dataset.head=s.cabeca;av.dataset.body=s.corpo;av.style.setProperty('--skin',C.pele[s.pele]);av.style.setProperty('--hair',C.cabelo[s.cabelo]);av.style.setProperty('--top',C.roupa[s.roupa]);av.style.setProperty('--bottom',s.roupa%2?'#111827':'#0c0b11');av.style.setProperty('--shoe',C.calcado[s.calcado]);document.querySelectorAll('[data-sex]').forEach(b=>b.classList.toggle('on',b.dataset.sex===s.sex))}function render(){grid.innerHTML='';if(cat==='cabeca'||cat==='corpo'){MODELS[s.sex][cat].forEach(([id,name])=>{let b=document.createElement('button');b.className='item '+(s[cat]===id?'on':'');b.innerHTML='<div class="mini '+(cat==='cabeca'?'head':'')+'"><div class="mh"></div><div class="mb" style="--c:#0b0a10"></div></div>'+name;b.onclick=()=>{s[cat]=id;paint();render()};grid.appendChild(b)});return}C[cat].forEach((c,i)=>{let b=document.createElement('button');b.className='item '+(s[cat]===i?'on':'');b.innerHTML='<div class="mini '+((cat==='pele'||cat==='cabelo')?'head':'')+'"><div class="mh" style="'+(cat==='pele'?'--skin:'+c:'')+'"></div><div class="mb" style="--c:'+c+'"></div></div>';b.onclick=()=>{s[cat]=i;paint();render()};grid.appendChild(b)})}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.cat;render()});document.querySelectorAll('[data-sex]').forEach(b=>b.onclick=()=>{if(s.sex===b.dataset.sex)return;s.sex=b.dataset.sex;if(s.sex==='f'){s.cabeca='female01';s.corpo='female01'}else{s.cabeca='classic-m01';s.corpo='classic-m01'};paint();render();note.textContent=s.sex==='f'?'2 cabeças e 2 corpos femininos disponíveis.':'Avatar masculino clássico selecionado.'});document.getElementById('save').onclick=async()=>{note.textContent='Salvando...';try{s=clean(s);const {data:{user}}=await sb.auth.getUser();if(!user)throw Error('Sessão inválida');const cfg={...s,updatedAt:new Date().toISOString()};const {error}=await sb.from('profiles').update({avatar_config:cfg,avatar_url:null,sex:s.sex==='f'?'feminino':'masculino'}).eq('id',user.id);if(error)throw error;localStorage.setItem('zunoAvatarPreset',JSON.stringify(cfg));note.textContent='Personagem Zuno salvo ✓';window.dispatchEvent(new CustomEvent('zuno-avatar-saved',{detail:cfg}))}catch(e){note.textContent='Erro ao salvar: '+e.message}};(async()=>{try{const local=JSON.parse(localStorage.getItem('zunoAvatarPreset')||'null');if(local)s=clean(local);const {data:{user}}=await sb.auth.getUser();if(user){const {data}=await sb.from('profiles').select('avatar_config').eq('id',user.id).maybeSingle();if(data?.avatar_config?.style?.startsWith('zuno-preset'))s=clean(data.avatar_config)}}catch(e){}paint();render()})();</script></body></html>
