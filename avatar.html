<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050817"><title>Zuno Avatar Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js"></script><style>:root{--bg:#030611;--panel:#0b1020cc;--panel2:#10172b;--line:#ffffff14;--txt:#f8fbff;--muted:#8d9ab2;--cyan:#52e9ff;--purple:#9d4dff;--pink:#ff4fd8}*{box-sizing:border-box}body{margin:0;background:#02040b;color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;padding:14px 14px 30px;overflow:hidden;background:radial-gradient(circle at 12% 11%,#5723b94a,transparent 26%),radial-gradient(circle at 88% 33%,#00d9ff24,transparent 25%),radial-gradient(circle at 45% 76%,#ff2fc71a,transparent 24%),linear-gradient(180deg,#060a18,#030611 56%,#080518)}button{font:inherit;color:inherit;cursor:pointer}.top{height:58px;display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center}.iconBtn{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:#10172bd9;display:grid;place-items:center;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:9px;min-width:0}.mark{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;font-weight:1000;font-size:15px;background:linear-gradient(135deg,#25dfff,#873cff 52%,#ff3ec8);box-shadow:0 0 20px #8b3dff55}.brand h1{font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:7px}.hero{position:relative;height:390px;margin-top:8px;border:1px solid #9b6cff2b;border-radius:28px;overflow:hidden;background:radial-gradient(ellipse at 50% 65%,#7c3aed33,transparent 39%),linear-gradient(180deg,#0b1024e8,#050817f3);box-shadow:inset 0 0 55px #6d28d91c,0 18px 50px #0008}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#58eaff 1px,transparent 1px);background-size:47px 47px,71px 71px;background-position:0 0,18px 27px;opacity:.15}.capsule{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:232px;height:320px;border:1px solid #61eaff55;border-radius:50% 50% 35% 35%;box-shadow:inset 0 0 38px #00d9ff16,0 0 42px #8b5cf633}.capsule:before,.capsule:after{content:'';position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;border:2px solid}.capsule:before{bottom:4px;width:188px;height:37px;border-color:#6ceaff99;box-shadow:0 0 25px #00ddff88}.capsule:after{bottom:17px;width:142px;height:22px;border-color:#b449ff77}.pulse{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:258px;height:258px;border:1px solid #ad55ff4c;border-radius:50%;animation:pulse 2.4s infinite}.pulse:after{content:'';position:absolute;inset:24px;border:1px solid #25dcff3f;border-radius:50%;animation:pulse 2.4s .7s infinite}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.06);opacity:.55}}.pulseLabel{position:absolute;left:16px;top:16px;z-index:6;padding:7px 10px;border-radius:12px;border:1px solid #a959ff44;background:#120d27c9;font-size:10px;font-weight:800;color:#c8a8ff}.pulseLabel b{color:#58eaff}.avatarBase{position:absolute;left:50%;top:58px;transform:translateX(-50%);width:158px;height:263px;z-index:3;filter:drop-shadow(0 0 16px #6128a744);transition:.2s}.avatarHead{position:absolute;left:49px;top:0;width:61px;height:72px;border-radius:47% 47% 44% 44%;background:linear-gradient(145deg,#33415f,#121827);border:1px solid #8da0c43c}.avatarNeck{position:absolute;left:68px;top:65px;width:24px;height:24px;border-radius:7px;background:#1f293d}.avatarTorso{position:absolute;left:22px;top:82px;width:114px;height:102px;border-radius:35px 35px 20px 20px;background:linear-gradient(145deg,#171b29,#070a11);border:1px solid #5ee9ff35;clip-path:polygon(13% 0,87% 0,100% 22%,88% 100%,12% 100%,0 22%)}.avatarTorso:after{content:'Z';position:absolute;inset:24px 0 auto;text-align:center;font-size:45px;font-weight:1000;color:#9c4dff;text-shadow:0 0 16px #7c3aed}.arm{position:absolute;top:91px;width:24px;height:113px;border-radius:15px;background:#111827}.arm.l{left:6px;transform:rotate(5deg)}.arm.r{right:6px;transform:rotate(-5deg)}.leg{position:absolute;top:175px;width:39px;height:78px;border-radius:14px;background:#111827}.leg.l{left:37px}.leg.r{right:37px}.foot{position:absolute;top:241px;width:50px;height:18px;border-radius:15px 18px 7px 7px;background:#0d1320;border:1px solid #884dff66}.foot.l{left:24px}.foot.r{right:24px}.mascot{position:absolute;right:21px;top:111px;width:63px;height:56px;border-radius:23px 23px 27px 27px;background:linear-gradient(145deg,#171f38,#080c18);border:1px solid #934fff88;box-shadow:0 0 22px #713cff55;z-index:4}.mascot:before,.mascot:after{content:'';position:absolute;top:-13px;width:22px;height:25px;background:#151d34;border:1px solid #7d4bff88}.mascot:before{left:3px;clip-path:polygon(0 100%,35% 0,100% 100%)}.mascot:after{right:3px;clip-path:polygon(0 100%,65% 0,100% 100%)}.eyes{position:absolute;top:22px;left:12px;right:12px;display:flex;justify-content:space-between}.eyes i{width:11px;height:7px;border-radius:50%;background:#51eaff;box-shadow:0 0 10px #27dfff}.viewTools{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:center;z-index:6}.toolGroup{display:flex;gap:6px}.tool{height:34px;padding:0 10px;border:1px solid #ffffff18;border-radius:11px;background:#10172bd9;font-size:10px}.mode{display:flex;padding:3px;border-radius:12px;background:#080d19df;border:1px solid #ffffff12}.mode button{border:0;background:transparent;padding:7px 8px;border-radius:9px;color:#8290a8;font-size:9px;white-space:nowrap}.mode button.on{background:linear-gradient(135deg,#7837df,#175f8d);color:#fff}.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 1px 9px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{min-width:68px;height:61px;border:1px solid #ffffff12;border-radius:16px;background:#0d1324;color:#8f9bb1;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.tab .ico{font-size:18px}.tab.on{color:#fff;border-color:#8954ff88;background:linear-gradient(145deg,#231448,#0c2037);box-shadow:0 0 17px #793cff22}.panel{border:1px solid #ffffff12;border-radius:22px;background:#0b1020cc;padding:13px;backdrop-filter:blur(12px)}.panelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.panelHead strong{font-size:14px}.panelHead small{color:#7f8da6;font-size:10px}.mixNotice{margin:-2px 0 10px;padding:8px 10px;border-radius:11px;background:#0e1930;border:1px solid #49ddff22;font-size:9px;color:#8fa1bc}.mixNotice b{color:#59eaff}.options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.option{height:83px;border:1px solid #ffffff12;border-radius:15px;background:linear-gradient(145deg,#172038,#0a0f1c);position:relative;overflow:hidden;padding:0}.option.on{border-color:#64e8ff;box-shadow:inset 0 0 0 1px #9a4cff,0 0 14px #3fdfff22}.option .thumb{position:absolute;width:42px;height:42px;border-radius:13px;left:50%;top:9px;transform:translateX(-50%);display:grid;place-items:center;background:linear-gradient(145deg,#34415d,#151c2e);font-size:19px}.option .label{position:absolute;bottom:7px;left:4px;right:4px;text-align:center;color:#a6b2c5;font-size:8.5px;line-height:1.1}.option .tag{position:absolute;top:4px;right:4px;padding:2px 4px;border-radius:5px;background:#11192bcc;color:#7f8ca3;font-size:6px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.controls small{color:#8795ac}.color{width:24px;height:24px;border:2px solid #fff2;border-radius:50%;background:var(--c)}.color.on{outline:2px solid #55e9ff;outline-offset:2px}.save{width:100%;height:54px;margin-top:13px;border:0;border-radius:17px;background:linear-gradient(105deg,#7c3aed,#bb3ee9 50%,#16d9ed);font-weight:1000;letter-spacing:.5px;box-shadow:0 0 28px #7c3aed55}.saved{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}.slot{width:45px;height:34px;border:1px dashed #58647b;border-radius:10px;background:#0b1020}.hint{text-align:center;margin-top:8px;font-size:9px;color:#59667c}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);padding:11px 15px;border-radius:13px;background:#11192de8;border:1px solid #8654ff66;color:#dbe7fa;font-size:11px;opacity:0;pointer-events:none;transition:.22s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:390px){.hero{height:375px}.brand h1{font-size:15px}.mode button{padding:7px 6px}.tab{min-width:64px}}</style></head><body><main class="app"><header class="top"><button class="iconBtn" id="back">‹</button><div class="brand"><div class="mark">Z</div><h1>Zuno Avatar Studio</h1></div><div class="actions"><button class="iconBtn" id="undo">↶</button><button class="iconBtn" id="saveTop">▣</button></div></header><section class="hero"><div class="stars"></div><div class="pulseLabel"><b>Zuno Pulse</b> · voz reativa</div><div class="pulse"></div><div class="capsule"></div><div class="avatarBase" id="avatarStage"><div class="avatarHead"></div><div class="avatarNeck"></div><div class="avatarTorso"></div><i class="arm l"></i><i class="arm r"></i><i class="leg l"></i><i class="leg r"></i><i class="foot l"></i><i class="foot r"></i></div><div class="mascot" id="mascot"><div class="eyes"><i></i><i></i></div></div><div class="viewTools"><div class="toolGroup"><button class="tool" id="rotate">↻ Girar</button><button class="tool" id="zoom">⌕ Ampliar</button></div><div class="mode" id="modes"><button data-mode="Perfil">Perfil</button><button data-mode="Sala de voz">Sala de voz</button><button class="on" data-mode="Corpo inteiro">Corpo inteiro</button></div></div></section><nav class="tabs" id="tabs"></nav><section class="panel"><div class="panelHead"><strong id="panelTitle">Base</strong><small id="selectedInfo">Selecionado: Neutro 01</small></div><div class="mixNotice"><b>Personalização livre:</b> itens não são bloqueados por gênero. Você poderá combinar qualquer base, rosto, cabelo, roupa ou acessório.</div><div class="options" id="options"></div><div class="controls" id="controls"></div></section><button class="save" id="save">SALVAR MEU ZUNO</button><div class="saved"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div><div class="hint">3 espaços para visuais salvos · Etapa 2 em validação</div></main><div class="toast" id="toast"></div><script>const DATA={Base:{ico:'◉',items:[['base01','Neutro 01','Livre'],['base02','Atlético','Livre'],['base03','Curvilíneo','Livre'],['base04','Alto','Livre'],['base05','Compacto','Livre'],['base06','Elegante','Livre']]},Rosto:{ico:'◌',items:[['face01','Suave','Livre'],['face02','Marcado','Livre'],['face03','Jovem','Livre'],['face04','Angular','Livre'],['face05','Delicado','Livre'],['face06','Maduro','Livre']]},Cabelo:{ico:'✦',items:[['hair01','Curto','Livre'],['hair02','Médio','Livre'],['hair03','Longo','Livre'],['hair04','Ondulado','Livre'],['hair05','Anime','Livre'],['hair06','Fade','Livre']]},Roupas:{ico:'♢',items:[['cloth01','Street Z','Livre'],['cloth02','Techwear','Livre'],['cloth03','Casual','Livre'],['cloth04','Oversized','Livre'],['cloth05','Cyber','Livre'],['cloth06','Minimal','Livre']]},Calçados:{ico:'▰',items:[['shoe01','Sneaker Z','Livre'],['shoe02','Runner','Livre'],['shoe03','Bota Tech','Livre'],['shoe04','High-top','Livre']]},Acessórios:{ico:'✧',items:[['acc00','Nenhum','Livre'],['acc01','Óculos','Livre'],['acc02','Brinco','Livre'],['acc03','Headset','Livre'],['acc04','Colar','Livre']]},Mascote:{ico:'◆',items:[['pet00','Sem mascote','Livre'],['pet01','Zuno Fox','Livre'],['pet02','Zuno Cat','Livre'],['pet03','Z-Bot','Livre']]},Efeitos:{ico:'✺',items:[['fx00','Sem efeito','Livre'],['fx01','Zuno Pulse','Livre'],['fx02','Aura Neon','Livre'],['fx03','Partículas','Livre'],['fx04','Holograma','Livre']]}};const state={cat:'Base',selected:{Base:'base01',Rosto:'face01',Cabelo:'hair01',Roupas:'cloth01',Calçados:'shoe01',Acessórios:'acc00',Mascote:'pet01',Efeitos:'fx01'},colors:{Base:'#d79a72',Cabelo:'#17131d',Roupas:'#7c3aed',Calçados:'#111827',Efeitos:'#52e9ff'}};const historyStack=[];const tabs=document.getElementById('tabs'),options=document.getElementById('options'),controls=document.getElementById('controls'),title=document.getElementById('panelTitle'),info=document.getElementById('selectedInfo'),toast=document.getElementById('toast'),stage=document.getElementById('avatarStage'),mascot=document.getElementById('mascot');function notify(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.__zt);window.__zt=setTimeout(()=>toast.classList.remove('show'),1500)}function snapshot(){historyStack.push(JSON.stringify(state));if(historyStack.length>20)historyStack.shift()}function renderTabs(){tabs.innerHTML='';Object.entries(DATA).forEach(([name,d])=>{const b=document.createElement('button');b.className='tab '+(state.cat===name?'on':'');b.innerHTML='<span class="ico">'+d.ico+'</span>'+name;b.onclick=()=>{state.cat=name;renderAll()};tabs.appendChild(b)})}function renderOptions(){const d=DATA[state.cat];title.textContent=state.cat;options.innerHTML='';d.items.forEach(([id,label,tag],i)=>{const b=document.createElement('button');b.className='option '+(state.selected[state.cat]===id?'on':'');b.innerHTML='<span class="thumb">'+d.ico+'</span><span class="tag">'+tag+'</span><span class="label">'+label+'</span>';b.onclick=()=>{snapshot();state.selected[state.cat]=id;applyPreview();renderOptions();updateInfo()};options.appendChild(b)});updateInfo();renderControls()}function updateInfo(){const d=DATA[state.cat],id=state.selected[state.cat],item=d.items.find(x=>x[0]===id);info.textContent='Selecionado: '+(item?.[1]||'Nenhum')}function renderControls(){controls.innerHTML='';const palettes={Base:['#f2c4ad','#d79a72','#b97855','#8c563f','#5e3d31'],Cabelo:['#09090d','#3a241b','#6b4432','#c7cbd5','#6d28d9'],Roupas:['#111827','#7c3aed','#2563eb','#0f766e','#be123c'],Calçados:['#111827','#f4f4f5','#7c3aed','#2563eb'],Efeitos:['#52e9ff','#9d4dff','#ff4fd8','#8cff6a']};const arr=palettes[state.cat];if(!arr)return;const s=document.createElement('small');s.textContent=state.cat==='Base'?'Tom':'Cor';controls.appendChild(s);arr.forEach(c=>{const b=document.createElement('button');b.className='color '+(state.colors[state.cat]===c?'on':'');b.style.setProperty('--c',c);b.onclick=()=>{snapshot();state.colors[state.cat]=c;applyPreview();renderControls()};controls.appendChild(b)})}function applyPreview(){stage.style.setProperty('--skin',state.colors.Base||'#d79a72');document.querySelector('.avatarHead').style.background=state.colors.Base||'#d79a72';document.querySelector('.avatarNeck').style.background=state.colors.Base||'#d79a72';document.querySelector('.avatarTorso').style.background='linear-gradient(145deg,'+(state.colors.Roupas||'#171b29')+',#070a11)';document.querySelectorAll('.arm').forEach(x=>x.style.background=state.colors.Roupas||'#111827');document.querySelectorAll('.foot').forEach(x=>x.style.background=state.colors.Calçados||'#0d1320');mascot.style.display=state.selected.Mascote==='pet00'?'none':'block';document.querySelector('.pulse').style.display=state.selected.Efeitos==='fx00'?'none':'block';const base=state.selected.Base;stage.style.transform='translateX(-50%) scale('+(base==='base04'?1.06:base==='base05'?.94:1)+')';if(state.selected.Roupas==='cloth02')document.querySelector('.avatarTorso').style.borderColor='#52e9ff88';else if(state.selected.Roupas==='cloth05')document.querySelector('.avatarTorso').style.borderColor='#ff4fd888';else document.querySelector('.avatarTorso').style.borderColor='#5ee9ff35'}function renderAll(){renderTabs();renderOptions();applyPreview()}document.getElementById('back').onclick=()=>history.back();document.getElementById('undo').onclick=()=>{if(!historyStack.length)return notify('Nada para desfazer');const prev=JSON.parse(historyStack.pop());Object.assign(state,prev);renderAll();notify('Alteração desfeita')};document.getElementById('saveTop').onclick=()=>notify('Salvar visual será conectado na Etapa 4');document.getElementById('save').onclick=()=>notify('Configuração pronta para salvar na Etapa 4');document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#modes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');notify('Visualização: '+b.dataset.mode)});let rot=0;document.getElementById('rotate').onclick=()=>{rot=(rot+1)%4;stage.style.filter='drop-shadow(0 0 16px #6128a744) hue-rotate('+(rot*4)+'deg)';notify('Personagem girado')};let zoomed=false;document.getElementById('zoom').onclick=()=>{zoomed=!zoomed;stage.style.top=zoomed?'35px':'58px';stage.style.zoom=zoomed?'1.14':'1';notify(zoomed?'Visualização ampliada':'Visualização normal')};renderAll();</script></body></html>
