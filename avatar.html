<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d1a"><title>Zuno Avatar Studio</title><script src="nav.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#080d1a;color:#fff;font-family:Inter,Arial,sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;background:#10182a;padding-bottom:34px}.top{padding:22px 20px 8px;display:flex;align-items:center;gap:15px}.back{border:0;background:none;color:#fff;font-size:35px}.top h1{font-size:27px;margin:0}.preview{height:285px;display:flex;align-items:center;justify-content:center;position:relative}.avatar{width:126px;height:210px;position:relative;filter:drop-shadow(0 14px 20px #0008)}.head{position:absolute;width:74px;height:74px;border-radius:46% 46% 48% 48%;left:26px;top:6px;background:var(--skin,#d79a72);border:3px solid #171226}.hair{position:absolute;width:80px;height:43px;left:23px;top:0;border-radius:50% 55% 30% 25%;background:var(--hair,#171321);transform:rotate(-5deg);z-index:2}.eye{position:absolute;width:9px;height:13px;border-radius:50%;background:#4c2a72;top:36px;z-index:3}.eye.l{left:44px}.eye.r{right:44px}.body{position:absolute;left:22px;top:76px;width:82px;height:78px;border-radius:28px 28px 17px 17px;background:var(--top,#7c3aed);border:3px solid #171226}.leg{position:absolute;top:148px;width:29px;height:48px;border-radius:0 0 12px 12px;background:var(--bottom,#171827);border:3px solid #171226}.leg.l{left:31px}.leg.r{right:31px}.shoe{position:absolute;top:188px;width:36px;height:18px;border-radius:12px 14px 7px 7px;background:var(--shoe,#f4f4f5);border:3px solid #171226}.shoe.l{left:24px}.shoe.r{right:24px}.sex{position:absolute;left:20px;top:10px;display:flex;gap:16px}.sex button,.mode button{border:0;background:#273149;color:#8993a8;border-radius:50%;width:50px;height:50px;font-size:22px}.sex button.on,.mode button.on{background:#bdf17b;color:#243214}.mode{position:absolute;right:20px;top:10px;display:flex;gap:12px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #536078;border-bottom:1px solid #536078;background:#182237}.tabs button{border:0;background:transparent;color:#b7c0cf;padding:13px 4px;font-size:11px;font-weight:800}.tabs button.on{color:#c9ff78;border-bottom:3px solid #c9ff78}.grid{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid #667188}.item{height:122px;border:0;border-right:1px solid #667188;border-bottom:1px solid #667188;background:#354055;color:#fff;position:relative;padding:8px}.item.on{outline:3px solid #8b5cf6;outline-offset:-3px}.item.on:after{content:'✓';position:absolute;right:8px;top:4px;color:#b8f05e;font-size:26px;font-weight:bold}.thumb{width:58px;height:78px;margin:12px auto 0;position:relative}.thumb .h{width:40px;height:40px;border-radius:45%;background:var(--s);margin:auto}.thumb .t{width:52px;height:38px;border-radius:15px;background:var(--c);margin:-2px auto}.thumb.headOnly .t{display:none}.pager{text-align:center;padding:18px;font-size:20px;color:#fff}.pager span{margin:0 18px;color:#9ca7b9}.save{display:block;width:calc(100% - 40px);margin:10px 20px 0;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#9333ea,#6d28d9);color:#fff;font-weight:900;font-size:15px}.note{text-align:center;color:#8f9bb0;font-size:11px;padding:10px 20px}</style></head><body><main class="app"><header class="top"><button class="back" onclick="history.back()">‹</button><h1>Zuno Avatar Studio</h1></header><section class="preview"><div class="sex"><button class="on" data-sex="m">♂</button><button data-sex="f">♀</button></div><div class="mode"><button class="on">●</button></div><div class="avatar" id="avatar"><i class="hair"></i><i class="head"></i><i class="eye l"></i><i class="eye r"></i><i class="body"></i><i class="leg l"></i><i class="leg r"></i><i class="shoe l"></i><i class="shoe r"></i></div></section><nav class="tabs" id="tabs"><button class="on" data-cat="cabeca">Cabeça</button><button data-cat="pele">Pele</button><button data-cat="cabelo">Cabelo</button><button data-cat="roupa">Roupas</button><button data-cat="calcado">Calçados</button></nav><section class="grid" id="grid"></section><div class="pager">‹‹ <span>1 de 1</span> ››</div><button class="save" id="save">Salvar personagem</button><div class="note" id="note">Novo sistema por presets do ZunoPlay · assets próprios serão adicionados ao catálogo.</div></main><script>const A={cabeca:['#d79a72','#bd7d59','#8f573d','#e5b08d','#68402f','#f0c4a4','#a9694c','#4b3028'],pele:['#f2c7a5','#e5b08d','#d79a72','#bd7d59','#a9694c','#8f573d','#68402f','#4b3028'],cabelo:['#171321','#2b1b18','#563629','#9b5c32','#d9c1a3','#c7cbd5','#3b176e','#111827'],roupa:['#7c3aed','#111827','#2563eb','#db2777','#0f766e','#dc2626','#d97706','#4f46e5','#27272a','#9333ea','#0891b2','#be123c'],calcado:['#f4f4f5','#171827','#7c3aed','#dc2626','#2563eb','#d97706','#52525b','#0f766e']};let state=JSON.parse(localStorage.getItem('zunoAvatarPreset')||'null')||{sex:'m',cabeca:0,pele:2,cabelo:0,roupa:0,calcado:0};let cat='cabeca';const av=document.getElementById('avatar'),grid=document.getElementById('grid');function paint(){av.style.setProperty('--skin',A.pele[state.pele]);av.style.setProperty('--hair',A.cabelo[state.cabelo]);av.style.setProperty('--top',A.roupa[state.roupa]);av.style.setProperty('--bottom',state.roupa%2?'#111827':'#26324a');av.style.setProperty('--shoe',A.calcado[state.calcado])}function render(){grid.innerHTML='';A[cat].forEach((c,i)=>{const b=document.createElement('button');b.className='item '+(state[cat]===i?'on':'');b.innerHTML='<div class="thumb '+(cat==='cabeca'||cat==='pele'||cat==='cabelo'?'headOnly':'')+'"><div class="h" style="--s:'+(cat==='pele'?c:A.pele[state.pele])+'"></div><div class="t" style="--c:'+c+'"></div></div>';b.onclick=()=>{state[cat]=i;paint();render()};grid.appendChild(b)})}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.cat;render()});document.querySelectorAll('[data-sex]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-sex]').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.sex=b.dataset.sex});document.getElementById('save').onclick=()=>{localStorage.setItem('zunoAvatarPreset',JSON.stringify(state));document.getElementById('note').textContent='Personagem salvo neste dispositivo ✓'};document.querySelector('[data-sex="'+state.sex+'"]').classList.add('on');paint();render();</script></body></html>
