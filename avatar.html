<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Avatar - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#070811;color:#fff;font-family:Arial,sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;padding:20px}.header{display:flex;align-items:center;gap:12px;margin-bottom:18px}.home{width:42px;height:42px;border:1px solid #303145;border-radius:12px;background:#1b1c2b;color:#fff;font-size:20px}.logo{font-size:27px;font-weight:800}.logo span{color:#8b5cf6}.card{background:#141523;border:1px solid #303145;border-radius:22px;padding:18px;margin-bottom:14px}.preview{display:flex;justify-content:center;padding:5px 0 20px}.avatar{width:210px;height:210px;border-radius:50%;position:relative;overflow:hidden;background:linear-gradient(145deg,#8b5cf6,#312e81);box-shadow:0 15px 45px #0008}.avatar .body{position:absolute;width:125px;height:92px;left:42px;bottom:-12px;border-radius:55% 55% 0 0;background:var(--shirt)}.avatar .neck{position:absolute;width:34px;height:35px;left:88px;top:130px;background:var(--skin);z-index:1}.avatar .head{position:absolute;width:96px;height:112px;left:57px;top:55px;border-radius:48% 48% 45% 45%;background:var(--skin);z-index:2}.avatar .hair{position:absolute;width:106px;height:62px;left:52px;top:46px;border-radius:55% 55% 35% 35%;background:var(--hair);z-index:3}.avatar .eye{position:absolute;width:10px;height:10px;border-radius:50%;background:#161622;top:102px;z-index:4}.avatar .eye.l{left:79px}.avatar .eye.r{right:79px}.avatar .brow{position:absolute;width:24px;height:5px;border-radius:5px;background:var(--hair);top:90px;z-index:4}.avatar .brow.l{left:72px}.avatar .brow.r{right:72px}.avatar .mouth{position:absolute;width:27px;height:9px;border-bottom:3px solid #7b3f45;border-radius:50%;left:91px;top:132px;z-index:4}.section{margin-top:18px}.section h3{margin:0 0 9px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.opt{padding:11px 6px;border-radius:12px;border:1px solid #303145;background:#10111c;color:#fff;cursor:pointer}.opt.active{border-color:#8b5cf6;box-shadow:0 0 0 1px #8b5cf6}.save{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-weight:bold;font-size:15px;cursor:pointer}.save:disabled{opacity:.6}.msg{text-align:center;min-height:20px;margin-top:10px;color:#86efac;font-size:13px}.muted{color:#9293a3;font-size:13px}h2{margin:0 0 6px}</style></head><body><main class="app"><header class="header"><button class="home" onclick="location.href='index.html'">⌂</button><div class="logo">Zuno<span>Play</span></div></header><section class="card"><h2>Meu Avatar</h2><p class="muted">Crie sua identidade para o perfil e para as salas.</p><div class="preview"><div id="avatar" class="avatar"><div class="body"></div><div class="neck"></div><div class="head"></div><div class="hair"></div><div class="brow l"></div><div class="brow r"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div></div><div class="section"><h3>Tom de pele</h3><div id="skin" class="grid"></div></div><div class="section"><h3>Cabelo</h3><div id="hair" class="grid"></div></div><div class="section"><h3>Roupa</h3><div id="shirt" class="grid"></div></div><div class="section"><h3>Cor dos olhos</h3><div id="eyes" class="grid"></div></div><div class="section"><h3>Fundo</h3><div id="bg" class="grid"></div></div><button class="save" id="save">Salvar avatar</button><div id="msg" class="msg"></div></section></main><script>const sb=window.supabase.createClient("https://rliymfbbhqoejgfvsbuu.supabase.co","sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0");const choices={skin:["#f6c7a5","#e6a77b","#b86f45","#70412c","#4a281d"],hair:["#17131b","#4a2c1e","#8b5a2b","#d6a33a","#7a1f46","#d8d8df"],shirt:["#8b5cf6","#2563eb","#16a34a","#ef4444","#f59e0b","#e5e7eb"],eyes:["#161622","#4b2e1e","#2563eb","#16a34a","#6b4f2a","#64748b"],bg:["linear-gradient(145deg,#8b5cf6,#312e81)","linear-gradient(145deg,#2563eb,#172554)","linear-gradient(145deg,#16a34a,#064e3b)","linear-gradient(145deg,#ef4444,#7f1d1d)","linear-gradient(145deg,#f59e0b,#78350f)","linear-gradient(145deg,#ec4899,#581c87)"]};let state={skin:choices.skin[0],hair:choices.hair[0],shirt:choices.shirt[0],eyes:choices.eyes[0],bg:choices.bg[0]};function render(k){const box=document.getElementById(k);box.innerHTML='';choices[k].forEach((v,i)=>{const b=document.createElement('button');b.className='opt '+(state[k]===v?'active':'');b.textContent=k==='skin'?'Tom '+(i+1):k==='hair'?'Cabelo '+(i+1):k==='shirt'?'Roupa '+(i+1):k==='eyes'?'Olhos '+(i+1):'Fundo '+(i+1);b.style.background=v;if(k==='eyes')b.style.color='#fff';if(k==='skin'||k==='hair'||k==='shirt'||k==='eyes')b.style.boxShadow='inset 0 0 0 999px '+v+'22';b.onclick=()=>{state[k]=v;render(k);paint()};box.appendChild(b)})}function paint(){const a=document.getElementById('avatar');a.style.setProperty('--skin',state.skin);a.style.setProperty('--hair',state.hair);a.style.setProperty('--shirt',state.shirt);a.style.setProperty('--eye',state.eyes);a.style.background=state.bg;document.querySelectorAll('.eye').forEach(e=>e.style.background=state.eyes)}function svgData(){const svg='<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="'+state.bg.match(/#([0-9a-fA-F]{6})/)[0]+'"/><stop offset="1" stop-color="'+state.bg.match(/#([0-9a-fA-F]{6})(?!.*#)/)[0]+'"/></linearGradient></defs><circle cx="200" cy="200" r="200" fill="url(#g)"/><path d="M80 400c10-88 62-112 120-112s110 24 120 112" fill="'+state.shirt+'"/><rect x="184" y="205" width="32" height="45" rx="14" fill="'+state.skin+'"/><rect x="154" y="92" width="92" height="118" rx="45" fill="'+state.skin+'"/><path d="M148 116c8-58 96-70 108 0v32c-22-20-45-28-108 0z" fill="'+state.hair+'"/><path d="M165 135h25M210 135h25" stroke="'+state.hair+'" stroke-width="6" stroke-linecap="round"/><circle cx="180" cy="153" r="7" fill="'+state.eyes+'"/><circle cx="220" cy="153" r="7" fill="'+state.eyes+'"/><path d="M185 180q15 12 30 0" fill="none" stroke="#7b3f45" stroke-width="6" stroke-linecap="round"/></svg>';return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='login.html';return}const{data:p}=await sb.from('profiles').select('avatar_url').eq('id',session.user.id).maybeSingle();if(p?.avatar_url&&p.avatar_url.startsWith('data:')){const raw=decodeURIComponent(p.avatar_url.split(',')[1]);const skin=raw.match(/rect x="154" y="92"[^>]*fill="(#[0-9a-fA-F]{6})"/)?.[1];const hair=raw.match(/z="3"/)?.[1];if(skin)state.skin=skin}Object.keys(choices).forEach(render);paint()}document.getElementById('save').onclick=async()=>{const{data:{session}}=await sb.auth.getSession();if(!session?.user)return;const b=document.getElementById('save'),m=document.getElementById('msg');b.disabled=true;b.textContent='Salvando...';const{error}=await sb.from('profiles').update({avatar_url:svgData()}).eq('id',session.user.id);m.textContent=error?'Não foi possível salvar o avatar.':'Avatar salvo com sucesso! ✅';b.disabled=false;b.textContent='Salvar avatar'};init();</script></body></html>
