-sex="f"] .shoe.r{right:62px}.avatar[data-sex="f"] .logoZ{left:91px;top:157px;width:29px;height:37px}.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:#182237;border-block:1px solid #536078}.tabs button{border:0;background:none;color:#aab4c7;padding:14px 3px;font-size:10px;font-weight:bold}.tabs button.on{color:#c9ff78;border-bottom:3px solid #c9ff78}.grid{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid #667188}.item{height:124px;border:0;border-right:1px solid #667188;border-bottom:1px solid #667188;background:#354055;color:#fff;position:relative;font-size:10px}.item.on{outline:3px solid #8b5cf6;outline-offset:-3px}.item.on:after{content:'✓';position:absolute;right:7px;top:4px;color:#bdf17b;font-size:24px}.mini{width:62px;height:76px;margin:8px auto 3px;position:relative}.mini .mh{width:42px;height:45px;border-radius:45%;background:var(--skin,#d79a72);margin:auto;border:2px solid #272034}.mini .mb{width:55px;height:32px;border-radius:14px;background:var(--c,#111827);margin:-2px auto;border:2px solid #272034}.mini.female .mh{width:50px;height:52px;border-radius:50%}.mini.female .mb{width:48px}.mini.head .mb{display:none}.save{display:block;width:calc(100% - 36px);margin:20px 18px 0;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#9333ea,#6d28d9);color:#fff;font-weight:bold;font-size:15px}.note{text-align:center;color:#99a4b8;font-size:12px;padding:12px}</style></head><body><main class="app"><header class="top"><button onclick="history.back()">‹</button><h1>Zuno Avatar Studio</h1></header><section class="preview"><div class="sex"><button data-sex="m">♂</button><button data-sex="f">♀</button></div><div class="avatar" id="av"><i class="hair"></i><i class="ear l"></i><i class="ear r"></i><i class="head"></i><i class="brow l"></i><i class="brow r"></i><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth"></i><i class="neck"></i><i class="arm l"></i><i class="arm r"></i><i class="forearm l"></i><i class="forearm r"></i><i class="body"></i><i class="logoZ"></i><i class="hand l"></i><i class="hand r"></i><i class="pelvis"></i><i class="thigh l"></i><i class="thigh r"></i><i class="knee l"></i><i class="knee r"></i><i class="calf l"></i><i class="calf r"></i><i class="shoe l"></i><i class="shoe r"></i></div></section><nav class="tabs"><button class="on" data-cat="cabeca">Cabeça</button><button data-cat="corpo">Corpo</button><button data-cat="pele">Pele</button><button data-cat="cabelo">Cabelo</button><button data-cat="roupa">Roupas</button><button data-cat="calcado">Calçados</button></nav><section class="grid" id="grid"></section><button class="save" id="save">Salvar personagem</button><div class="note" id="note">Corpo masculino com proporções humanas refinadas.</div></main><script>const sb=window.supabase.createClient('https://rliymfbbhqoejgfvsbuu.supabase.co','sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0');const C={pele:['#f4c8b8','#e5b08d','#d79a72','#bd7d59','#8f573d','#68402f'],cabelo:['#09090d','#2b1b18','#563629','#c7cbd5','#3b176e'],roupa:['#0b0a10','#7c3aed','#111827','#2563eb','#0f766e','#be123c'],calcado:['#15101d','#f4f4f5','#7c3aed','#2563eb']};const MODELS={m:{cabeca:[['classic-m01','Masculino Zuno']],corpo:[['classic-m01','Corpo Masculino Natural']]},f:{cabeca:[['female01','Feminina Suave'],['female02','Feminina Urbana']],corpo:[['female01','Corpo Feminino Suave'],['female02','Corpo Feminino Urbano']]}};const D={version:7,style:'zuno-preset-v7',sex:'m',cabeca:'classic-m01',corpo:'classic-m01',pele:0,cabelo:0,roupa:0,calcado:0};let s={...D},cat='cabeca';const av=document.getElementById('av'),grid=document.getElementById('grid'),note=document.getElementById('note');function clean(v){let x={...D,...(v||{})};x.sex=x.sex==='f'?'f':'m';const h=MODELS[x.sex].cabeca.map(a=>a[0]),b=MODELS[x.sex].corpo.map(a=>a[0]);if(!h.includes(x.cabeca))x.cabeca=h[0];if(!b.includes(x.corpo))x.corpo=b[0];['pele','cabelo','roupa','calcado'].forEach(k=>x[k]=Math.max(0,Math.min(C[k].length-1,+x[k]||0)));x.style=D.style;x.version=7;return x}function paint(){av.dataset.sex=s.sex;av.dataset.head=s.cabeca;av.dataset.body=s.corpo;av.style.setProperty('--skin',C.pele[s.pele]);av.style.setProperty('--hair',C.cabelo[s.cabelo]);av.style.setProperty('--top',C.roupa[s.roupa]);av.style.setProperty('--bottom',s.roupa%2?'#111827':'#0c0b11');av.style.setProperty('--shoe',C.calcado[s.calcado]);document.querySelectorAll('[data-sex]').forEach(b=>b.classList.toggle('on',b.dataset.sex===s.sex))}function render(){grid.innerHTML='';if(cat==='cabeca'||cat==='corpo'){MODELS[s.sex][cat].forEach(([id,name])=>{const b=document.createElement('button');b.className='item '+(s[cat]===id?'on':'');b.innerHTML='<div class="mini '+(cat==='cabeca'?'head ':'')+(s.sex==='f'?'female':'')+'"><div class="mh"></div><div class="mb"></div></div>'+name;b.onclick=()=>{s[cat]=id;paint();render()};grid.appendChild(b)});return}C[cat].forEach((c,i)=>{const b=document.createElement('button');b.className='item '+(s[cat]===i?'on':'');b.innerHTML='<div class="mini '+((cat==='pele'||cat==='cabelo')?'head ':'')+(s.sex==='f'?'female':'')+'"><div class="mh" style="'+(cat==='pele'?'--skin:'+c:'')+'"></div><div class="mb" style="--c:'+c+'"></div></div>';b.onclick=()=>{s[cat]=i;paint();render()};grid.appendChild(b)})}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.cat;render()});document.querySelectorAll('[data-sex]').forEach(b=>b.onclick=()=>{if(s.sex===b.dataset.sex)return;s.sex=b.dataset.sex;if(s.sex==='f'){s.cabeca='female01';s.corpo='female01'}else{s.cabeca='classic-m01';s.corpo='classic-m01'};paint();render();note.textContent=s.sex==='m'?'Corpo masculino com anatomia mais natural.':'Bases femininas selecionadas.'});document.getElementById('save').onclick=async()=>{note.textContent='Salvando...';try{s=clean(s);const {data:{user}}=await sb.auth.getUser();if(!user)throw Error('Sessão inválida');const cfg={...s,updatedAt:new Date().toISOString()};const {error}=await sb.from('profiles').update({avatar_config:cfg,avatar_url:null,sex:s.sex==='f'?'feminino':'masculino'}).eq('id',user.id);if(error)throw error;localStorage.setItem('zunoAvatarPreset',JSON.stringify(cfg));note.textContent='Personagem Zuno salvo ✓';window.dispatchEvent(new CustomEvent('zuno-avatar-saved',{detail:cfg}))}catch(e){note.textContent='Erro ao salvar: '+e.message}};(async()=>{try{const local=JSON.parse(localStorage.getItem('zunoAvatarPreset')||'null');if(local)s=clean(local);const {data:{user}}=await sb.auth.getUser();if(user){const {data}=await sb.from('profiles').select('avatar_config').eq('id',user.id).maybeSingle();if(data?.avatar_config?.style?.startsWith('zuno-preset'))s=clean(data.avatar_config)}}catch(e){}paint();render()})();</script></body></html>
