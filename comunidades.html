<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Comunidades - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nav.js?v=350"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 20% 20%,#25145c 0%,transparent 35%),radial-gradient(circle at 80% 80%,#102d59 0%,transparent 35%),#070811;color:#fff}.app{width:100%;max-width:480px;min-height:100vh;margin:auto;padding:25px}.header{display:flex;align-items:center;gap:15px;padding-top:20px;margin-bottom:25px}.logo{font-size:28px;font-weight:800}.logo span{color:#8b5cf6}.card{background:rgba(20,21,35,.9);border:1px solid #292a3d;border-radius:20px;padding:18px;margin-bottom:15px}.title{font-size:25px;margin-bottom:6px}.sub{color:#9293a3;font-size:13px;margin-bottom:20px}.input{width:100%;padding:13px;border-radius:12px;border:1px solid #303145;background:#11121e;color:#fff;outline:none;margin-top:9px}.textarea{min-height:80px;resize:vertical}.button{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-weight:bold;cursor:pointer;margin-top:12px}.button:disabled{opacity:.6}.row{display:flex;gap:8px}.row .button{flex:1}.community{background:#11121e;border:1px solid #292a3d;border-radius:16px;padding:16px;margin-top:12px}.community h3{font-size:17px;margin-bottom:5px}.community p{color:#9293a3;font-size:12px;line-height:1.5}.meta{color:#8b5cf6;font-size:11px;margin-top:9px}.empty,.status{color:#9293a3;font-size:13px;text-align:center;padding:20px}.success{color:#86efac}.error{color:#fca5a5}</style></head><body><div class="app"><div class="header"><div class="logo">Zuno<span>Play</span></div></div><div class="card"><h1 class="title">🌐 Comunidades</h1><p class="sub">Encontre pessoas com os mesmos interesses.</p><form id="createForm"><input class="input" id="name" maxlength="60" minlength="3" placeholder="Nome da comunidade" required><textarea class="input textarea" id="description" maxlength="500" placeholder="Descrição (opcional)"></textarea><button class="button" id="createButton">Criar comunidade</button></form><div id="status" class="status"></div></div><div class="card"><h2>Comunidades disponíveis</h2><div id="list" class="empty">Carregando...</div></div></div><script>const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co",SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0",sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user,channel;const list=document.getElementById("list"),status=document.getElementById("status");function esc(v){const d=document.createElement("div");d.textContent=v??"";return d.innerHTML}async function load(){const{data,error}=await sb.from("communities").select("id,owner_id,name,description,created_at,community_members(count)").order("created_at",{ascending:false});if(error){status.className="status error";status.textContent="Não foi possível carregar as comunidades.";return}if(!data?.length){list.innerHTML="<div class='empty'>Ainda não há comunidades. Crie a primeira!</div>";return}const memberships=await sb.from("community_members").select("community_id").eq("user_id",user.id);const joined=new Set((memberships.data||[]).map(x=>x.community_id));list.innerHTML=data.map(c=>{const count=c.community_members?.[0]?.count||0;const isOwner=c.owner_id===user.id;return `<div class='community'><h3>${esc(c.name)}</h3><p>${esc(c.description||"Sem descrição")}</p><div class='meta'>${count} membro${count===1?"":"s"}</div><div class='row'>${joined.has(c.id)?`<button class='button' onclick="leaveCommunity('${c.id}')">Sair</button>`:`<button class='button' onclick="joinCommunity('${c.id}')">Entrar</button>`}${isOwner?`<button class='button' onclick="deleteCommunity('${c.id}')">Excluir</button>`:""}</div></div>`}).join("")}async function joinCommunity(id){const{error}=await sb.from("community_members").insert({community_id:id,user_id:user.id});if(error&&error.code!=="23505"){status.className="status error";status.textContent="Não foi possível entrar.";return}await load()}async function leaveCommunity(id){const{error}=await sb.from("community_members").delete().eq("community_id",id).eq("user_id",user.id);if(error){status.className="status error";status.textContent="Não foi possível sair.";return}await load()}async function deleteCommunity(id){if(!confirm("Excluir esta comunidade?"))return;const{error}=await sb.from("communities").delete().eq("id",id).eq("owner_id",user.id);if(error){status.className="status error";status.textContent="Não foi possível excluir.";return}await load()}document.getElementById("createForm").addEventListener("submit",async e=>{e.preventDefault();const button=document.getElementById("createButton");button.disabled=true;try{const name=document.getElementById("name").value.trim(),description=document.getElementById("description").value.trim();const{data,error}=await sb.from("communities").insert({owner_id:user.id,name,description:description||null}).select("id").single();if(error)throw error;const{error:memberError}=await sb.from("community_members").insert({community_id:data.id,user_id:user.id});if(memberError)throw memberError;status.className="status success";status.textContent="Comunidade criada com sucesso!";e.target.reset();await load()}catch(error){status.className="status error";status.textContent="Não foi possível criar a comunidade: "+error.message}finally{button.disabled=false}});async function start(){const{data}=await sb.auth.getSession();user=data.session?.user;if(!user){location.href="login.html";return}await load();channel=sb.channel("communities-live").on("postgres_changes",{event:"*",schema:"public",table:"communities"},load).on("postgres_changes",{event:"*",schema:"public",table:"community_members"},load).subscribe()}start();window.addEventListener("beforeunload",()=>{if(channel)sb.removeChannel(channel)})</script></body></html>
