<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZunoPlay</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0b12;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #7c3aed;
        }

        .subtitle {
            color: #999;
            margin-bottom: 40px;
        }

        .button {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .button.secondary {
            background: #1b1b27;
        }
    </style>
</head>

<body>

    <div class="app">

        <div class="logo">
            Zuno<span>Play</span>
        </div>

        <div class="subtitle">
            Conecte. Converse. Jogue.
        </div>

        <button class="button">
            Criar conta
        </button>

        <button class="button secondary">
            Entrar
        </button>

    </div>

</body>
</html>
