<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diagnóstico - ZunoPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #25145c 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #102d59 0%, transparent 35%),
        #070811;
    color: white;
}

.app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
}

.header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px;
    border-bottom: 1px solid #292a3d;
    background: rgba(10,11,20,.95);
}

.back {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid #303145;
    background: #1b1c2b;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.logo span {
    color: #8b5cf6;
}

.page {
    padding: 20px;
}

.title {
    font-size: 25px;
    margin-bottom: 10px;
}

.box {
    margin-top: 15px;
    padding: 18px;
    border-radius: 16px;
    background: #141523;
    border: 1px solid #292a3d;
}

.label {
    color: #9293a3;
    font-size: 12px;
    margin-bottom: 6px;
}

.value {
    color: #8b5cf6;
    font-size: 13px;
    word-break: break-all;
    margin-bottom: 18px;
}

.success {
    color: #65d391;
    font-weight: bold;
}

.error {
    color: #ff7777;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="app" class="app">

    <div class="page">

        <h1 class="title">
            🔔 Diagnóstico ZunoPlay
        </h1>

        <div class="box">
            Carregando...
        </div>

    </div>

</div>

<script>

const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const app =
document.getElementById("app");


async function start() {

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();


    if (error) {

        showError(
            "Erro ao obter sessão: " +
            error.message
        );

        return;

    }


    if (!data.session) {

        showError(
            "Nenhuma sessão encontrada. Faça login novamente."
        );

        return;

    }


    const user =
    data.session.user;


    app.innerHTML = `

        <div class="header">

            <button
                class="back"
                onclick="window.location.href='index.html'">
                ←
            </button>

            <div class="logo">
                Zuno<span>Play</span>
            </div>

        </div>

        <div class="page">

            <h1 class="title">
                🔔 Diagnóstico
            </h1>

            <div class="box">

                <div class="label">
                    ID da sessão
                </div>

                <div class="value">
                    ${user.id}
                </div>

                <div class="label">
                    E-mail
                </div>

                <div class="value">
                    ${user.email || "sem e-mail"}
                </div>

                <div id="resultado">
                    Consultando notificações...
                </div>

            </div>

        </div>

    `;


    const {
        data: notificacoes,
        error: erroNotificacoes
    } =
    await supabaseClient
    .from("notifications")
    .select("*")
    .eq(
        "user_id",
        user.id
    );


    const resultado =
    document.getElementById(
        "resultado"
    );


    if (erroNotificacoes) {

        resultado.innerHTML = `

            <div class="error">
                ERRO AO CONSULTAR NOTIFICAÇÕES
            </div>

            <br>

            <div>
                ${erroNotificacoes.message}
            </div>

        `;

        console.error(
            erroNotificacoes
        );

        return;

    }


    resultado.innerHTML = `

        <div class="success">
            Notificações encontradas:
            ${notificacoes.length}
        </div>

    `;


    console.log(
        "Usuário:",
        user.id
    );

    console.log(
        "Notificações:",
        notificacoes
    );

}


function showError(message) {

    app.innerHTML = `

        <div class="page">

            <div class="box">

                <div class="error">
                    ${message}
                </div>

            </div>

        </div>

    `;

}


start();

</script>

</body>
</html>
