<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02040d"><title>Notificações — ZunoPlay</title><link rel="stylesheet" href="zuno-notifications.css?v=9"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="nav.js?v=346"></script><script defer src="zuno-notifications.js?v=9"></script></head><body><main class="zn-app"><section class="zn-page"><header class="zn-header"><div class="zn-heading"><h1 class="zn-title">Notificações</h1><span id="unreadPill" class="zn-unread" hidden>0</span></div><div class="zn-tools" aria-label="Gerenciar notificações"><button id="markAll" class="zn-tool">Marcar como lidas</button><button id="clearRead" class="zn-tool">Limpar lidas</button><button id="clearAll" class="zn-tool zn-tool-danger">Limpar tudo</button></div></header><nav class="zn-tabs" aria-label="Filtros"><button class="zn-tab active" data-filter="all">Tudo</button><button class="zn-tab" data-filter="social">Pulso</button><button class="zn-tab" data-filter="message">Mensagens</button><button class="zn-tab" data-filter="friend_request">Pedidos</button><button class="zn-tab" data-filter="rewards">Recompensas</button><button class="zn-tab" data-filter="system">Sistema</button></nav><div id="summary" class="zn-summary"><span>Carregando...</span></div><div id="list" class="zn-list"><div class="zn-loading">Carregando notificações...</div></div></section></main><script>
const $=s=>document.querySelector(s),list=$('#list'),summary=$('#summary'),pill=$('#unreadPill'),markAll=$('#markAll'),clearRead=$('#clearRead'),clearAll=$('#clearAll');
let active='all',currentItems=[],requestStates=new Map(),requestLoading=new Set();
const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
const rel=v=>{const d=new Date(v),s=Math.max(0,(Date.now()-d)/1000);if(s<60)return'agora';if(s<3600)return`${Math.floor(s/60)} min`;if(s<86400)return`${Math.floor(s/3600)} h`;if(s<604800)return`${Math.floor(s/86400)} d`;return d.toLocaleDateString('pt-BR')};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const categoryLabel=c=>c==='friend_request'?'Pedido de amizade':c==='message'?'Mensagem':c==='social'?'Pulso':c==='rewards'?'Recompensa':'Sistema';
function visible(items){return items.filter(n=>ZunoNotifications.matches(n,active))}
function requestState(n){if(n.type!=='friend_request'||!n.related_id)return null;return requestStates.get(n.related_id)||'loading'}
function requestStateMarkup(state){if(state==='accepted')return'<span class="zn-request-state accepted">✓ Pedido aceito</span>';if(state==='rejected')return'<span class="zn-request-state rejected">Pedido recusado</span>';if(state==='missing')return'<span class="zn-request-state neutral">Pedido respondido</span>';if(state==='loading')return'<span class="zn-request-state neutral">Verificando pedido…</span>';return'<div class="zn-actions"><button class="zn-action zn-accept">Aceitar</button><button class="zn-action zn-reject">Recusar</button></div>'}
async function hydrateRequestStates(items){const ids=[...new Set(items.filter(n=>n.type==='friend_request'&&n.related_id).map(n=>n.related_id))];if(!ids.length)return;const c=ZunoNotifications.client;if(!c)return;ids.forEach(id=>requestStates.set(id,'loading'));const{data,error}=await c.from('friend_requests').select('id,status').in('id',ids);if(error){console.warn('[Zuno Notifications] friend request states',error);return}const found=new Map((data||[]).map(r=>[r.id,r.status]));ids.forEach(id=>requestStates.set(id,found.get(id)||'missing'))}
function render(items){currentItems=items;const data=visible(items),unread=data.filter(n=>!n.read_at).length;summary.innerHTML=`<span><strong>${data.length}</strong> ${data.length===1?'notificação':'notificações'}</span><span><strong>${unread}</strong> ${unread===1?'não lida':'não lidas'}</span>`;pill.hidden=!ZunoNotifications.unseenCount;pill.textContent=ZunoNotifications.unseenCount;markAll.hidden=!unread;clearRead.hidden=!data.some(n=>n.read_at);clearAll.hidden=!data.length;if(!data.length){list.innerHTML='<div class="zn-empty">Nenhuma notificação nesta categoria.</div>';return}list.innerHTML='';data.forEach(n=>{const c=ZunoNotifications.config(n),el=document.createElement('article'),isFriend=n.type==='friend_request',state=requestState(n);el.className='zn-card'+(n.read_at?'':' unread');const message=!isFriend&&n.message?`<div class="zn-card-message">${esc(n.message)}</div>`:'';el.innerHTML=`<div class="zn-notif-icon">${c.icon}</div><div class="zn-card-body"><div class="zn-card-title">${esc(n.title||'Notificação')}</div>${message}<div class="zn-meta"><span class="zn-category">${esc(categoryLabel(c.category))}</span><span>•</span><span>${rel(n.created_at)}</span></div>${isFriend&&n.related_id?requestStateMarkup(state):''}</div>${n.read_at?'':'<span class="zn-dot"></span>'}`;if(isFriend&&n.related_id&&state==='pending'){el.querySelector('.zn-accept').onclick=e=>{e.stopPropagation();finishRequest(n,true,el)};el.querySelector('.zn-reject').onclick=e=>{e.stopPropagation();finishRequest(n,false,el)}}if(!isFriend)el.onclick=()=>ZunoNotifications.open(n);list.appendChild(el)})}
async function handleItems(items){currentItems=items;await hydrateRequestStates(items);render(items)}
async function finishRequest(n,accepted,el){if(requestLoading.has(n.related_id))return;const c=ZunoNotifications.client,u=ZunoNotifications.user;if(!c||!u)return;requestLoading.add(n.related_id);el?.classList.add('is-busy');el?.querySelectorAll('button').forEach(b=>b.disabled=true);try{const{data:r,error:readError}=await c.from('friend_requests').select('id,receiver_id,status').eq('id',n.related_id).eq('receiver_id',u.id).maybeSingle();if(readError)throw readError;if(!r){requestStates.set(n.related_id,'missing');await ZunoNotifications.load();return}if(r.status!=='pending'){requestStates.set(n.related_id,r.status);await ZunoNotifications.markRead(n.id);await ZunoNotifications.load();return}const next=accepted?'accepted':'rejected';const{data:updated,error}=await c.from('friend_requests').update({status:next}).eq('id',r.id).eq('receiver_id',u.id).eq('status','pending').select('id,status').maybeSingle();if(error)throw error;if(!updated)throw new Error('request_state_changed');requestStates.set(n.related_id,next);await ZunoNotifications.markRead(n.id);await ZunoNotifications.load()}catch(e){console.error('[Zuno Notifications] request response',e);alert('Não foi possível responder agora. Tente novamente.')}finally{requestLoading.delete(n.related_id);el?.classList.remove('is-busy')}}
function scopedDeleteQuery(onlyRead=false){const c=ZunoNotifications.client,u=ZunoNotifications.user;if(!c||!u)return null;let q=c.from('notifications').delete().eq('user_id',u.id);if(onlyRead)q=q.not('read_at','is',null);if(active==='friend_request')q=q.eq('type','friend_request');else if(active==='message')q=q.eq('category','message');else if(active==='social')q=q.eq('category','social');else if(active==='rewards')q=q.eq('category','rewards');else if(active==='system')q=q.eq('category','system');return q}
async function clearNotifications(onlyRead){const label=active==='all'?'todas as categorias':'esta categoria';const text=onlyRead?`Limpar as notificações já lidas de ${label}?`:`Limpar todas as notificações de ${label}?`;if(!confirm(text))return;const q=scopedDeleteQuery(onlyRead);if(!q)return;const{error}=await q;if(error){console.error('[Zuno Notifications] clear',error);alert('Não foi possível limpar as notificações.');return}await ZunoNotifications.load()}
document.querySelectorAll('.zn-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.zn-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.filter;render(currentItems)});
markAll.onclick=()=>ZunoNotifications.markAllRead(active);clearRead.onclick=()=>clearNotifications(true);clearAll.onclick=()=>clearNotifications(false);
async function readyCenter(){ZunoNotifications.onChange(items=>{handleItems(items).catch(e=>console.error('[Zuno Notifications] render',e))});await ZunoNotifications.markAllSeen().catch(e=>console.error('[ZunoNotifications] seen',e));await handleItems(ZunoNotifications.items)}
async function bootNotifications(){for(let attempt=0;attempt<5;attempt++){await ZunoNotifications.init().catch(()=>{});if(ZunoNotifications.user){await readyCenter();return}const sb=window.ZunoSupabaseClient||window.__zunoSupabaseClient||window.supabaseClient;if(sb?.auth){try{const{data}=await sb.auth.getSession();if(data?.session?.user){await ZunoNotifications.init().catch(()=>{});if(ZunoNotifications.user){await readyCenter();return}}}catch(_){}}await sleep(180*(attempt+1))}location.replace('login.html?next=notificacoes.html')}
window.addEventListener('DOMContentLoaded',bootNotifications,{once:true});
</script></body></html>
