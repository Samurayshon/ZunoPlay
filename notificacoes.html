<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05050d"><title>Notificações — ZunoPlay</title><link rel="stylesheet" href="zuno-notifications.css?v=2"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="zuno-notifications.js?v=2"></script></head><body><main class="zn-app"><header class="zn-header"><div class="zn-brand"><button class="zn-back" onclick="location.href='index.html'" aria-label="Voltar">←</button><div class="zn-logo">Zuno<b>Play</b></div></div><button id="markAll" class="zn-mark-all">Marcar todas</button></header><section class="zn-page"><div class="zn-title-row"><div><h1 class="zn-title">Notificações</h1><p class="zn-sub">Tudo que merece sua atenção, sem spam.</p></div><span id="unreadPill" class="zn-unread" hidden>0</span></div><nav class="zn-tabs" aria-label="Filtros"><button class="zn-tab active" data-filter="all">Tudo</button><button class="zn-tab" data-filter="social">Social</button><button class="zn-tab" data-filter="rooms">Salas</button><button class="zn-tab" data-filter="games">Jogos</button><button class="zn-tab" data-filter="rewards">Recompensas</button><button class="zn-tab" data-filter="system">Sistema</button></nav><div id="summary" class="zn-summary"><span>Carregando...</span></div><div id="list" class="zn-list"><div class="zn-loading">Carregando notificações...</div></div><section class="zn-settings"><h2>Preferências</h2><div class="zn-setting"><span>Notificações no app</span><button class="zn-switch" data-pref="in_app_enabled" aria-label="Notificações no app"></button></div><div class="zn-setting"><span>Social</span><button class="zn-switch" data-pref="social_enabled" aria-label="Social"></button></div><div class="zn-setting"><span>Salas</span><button class="zn-switch" data-pref="rooms_enabled" aria-label="Salas"></button></div><div class="zn-setting"><span>Jogos</span><button class="zn-switch" data-pref="games_enabled" aria-label="Jogos"></button></div><div class="zn-setting"><span>Recompensas</span><button class="zn-switch" data-pref="rewards_enabled" aria-label="Recompensas"></button></div><div class="zn-setting"><span>Sistema</span><button class="zn-switch" data-pref="system_enabled" aria-label="Sistema"></button></div><div class="zn-setting"><span>Modo silencioso</span><button class="zn-switch" data-pref="quiet_hours_enabled" aria-label="Modo silencioso"></button></div><div class="zn-setting"><span>Horário silencioso</span><span style="display:flex;gap:7px;align-items:center"><input id="quietStart" type="time" value="23:00" style="width:88px;background:#090b16;color:#fff;border:1px solid #303249;border-radius:10px;padding:7px"><span>–</span><input id="quietEnd" type="time" value="08:00" style="width:88px;background:#090b16;color:#fff;border:1px solid #303249;border-radius:10px;padding:7px"></span></div><button id="enablePush" class="zn-push">Ativar notificações do dispositivo</button></section></section></main><script>
const $=s=>document.querySelector(s),list=$('#list'),summary=$('#summary'),pill=$('#unreadPill'),markAll=$('#markAll');let active='all',prefs=null;
const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};const rel=v=>{const d=new Date(v),s=Math.max(0,(Date.now()-d)/1000);if(s<60)return'agora';if(s<3600)return`${Math.floor(s/60)} min`;if(s<86400)return`${Math.floor(s/3600)} h`;if(s<604800)return`${Math.floor(s/86400)} d`;return d.toLocaleDateString('pt-BR')};
function visible(items){return items.filter(n=>active==='all'||ZunoNotifications.config(n).category===active)}
function render(items){const data=visible(items),unread=data.filter(n=>!n.read_at).length;summary.innerHTML=`<span>${data.length} ${data.length===1?'notificação':'notificações'}</span><span>${unread} ${unread===1?'não lida':'não lidas'}</span>`;pill.hidden=!ZunoNotifications.unreadCount;pill.textContent=ZunoNotifications.unreadCount;markAll.hidden=!unread;if(!data.length){list.innerHTML='<div class="zn-empty">Nenhuma notificação nesta categoria.</div>';return}list.innerHTML='';data.forEach(n=>{const c=ZunoNotifications.config(n),el=document.createElement('article');el.className='zn-card'+(n.read_at?'':' unread');el.innerHTML=`<div class="zn-notif-icon">${c.icon}</div><div class="zn-card-body"><div class="zn-card-title">${esc(n.title||'Notificação')}</div><div class="zn-card-message">${esc(n.message||'')}</div><div class="zn-meta"><span class="zn-category">${esc(c.category)}</span><span>•</span><span>${rel(n.created_at)}</span></div>${n.type==='friend_request'&&n.related_id?'<div class="zn-actions"><button class="zn-action zn-accept">Aceitar</button><button class="zn-action zn-reject">Recusar</button></div>':''}</div>${n.read_at?'':'<span class="zn-dot"></span>'}`;if(n.type==='friend_request'&&n.related_id){el.querySelector('.zn-accept').onclick=e=>{e.stopPropagation();finishRequest(n,true)};el.querySelector('.zn-reject').onclick=e=>{e.stopPropagation();finishRequest(n,false)}}el.onclick=()=>ZunoNotifications.open(n);list.appendChild(el)})}
async function finishRequest(n,accepted){const c=ZunoNotifications.client,u=ZunoNotifications.user;if(!c||!u)return;const{data:r}=await c.from('friend_requests').select('id,sender_id,receiver_id,status').eq('id',n.related_id).eq('receiver_id',u.id).eq('status','pending').maybeSingle();if(!r){alert('Essa solicitação já foi respondida.');return}const{error}=await c.from('friend_requests').update({status:accepted?'accepted':'rejected'}).eq('id',r.id).eq('receiver_id',u.id).eq('status','pending');if(error){alert('Não foi possível responder agora.');return}if(accepted){const x=await c.from('friendships').insert({user_id:r.sender_id,friend_id:r.receiver_id});if(x.error&&x.error.code!=='23505'){alert('Não foi possível criar a amizade.');return}}await ZunoNotifications.markRead(n.id);await ZunoNotifications.load()}
async function loadPrefs(){try{prefs=await ZunoNotifications.preferences();document.querySelectorAll('[data-pref]').forEach(b=>b.classList.toggle('on',prefs?.[b.dataset.pref]!==false));$('#quietStart').value=(prefs?.quiet_hours_start||'23:00').slice(0,5);$('#quietEnd').value=(prefs?.quiet_hours_end||'08:00').slice(0,5)}catch(e){console.error(e)}}
document.querySelectorAll('.zn-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.zn-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.filter;render(ZunoNotifications.items)});markAll.onclick=()=>ZunoNotifications.markAllRead(active);document.querySelectorAll('[data-pref]').forEach(b=>b.onclick=async()=>{const k=b.dataset.pref,v=!b.classList.contains('on');b.classList.toggle('on',v);try{prefs=await ZunoNotifications.savePreferences({[k]:v})}catch(e){b.classList.toggle('on',!v)}});async function saveQuiet(){try{prefs=await ZunoNotifications.savePreferences({quiet_hours_start:$('#quietStart').value||'23:00',quiet_hours_end:$('#quietEnd').value||'08:00'})}catch(e){console.error(e)}}$('#quietStart').onchange=saveQuiet;$('#quietEnd').onchange=saveQuiet;$('#enablePush').onclick=async()=>{const r=await ZunoNotifications.requestPushPermission();$('#enablePush').textContent=r==='granted'?'Notificações do dispositivo ativadas':r==='denied'?'Permissão bloqueada no dispositivo':'Notificações indisponíveis'};
window.addEventListener('DOMContentLoaded',async()=>{await ZunoNotifications.init();if(!ZunoNotifications.user){location.href='login.html';return}ZunoNotifications.onChange(render);await loadPrefs()});
</script></body></html>
