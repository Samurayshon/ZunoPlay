<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Notificações - ZunoPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {

    padding: 0;

    font-family: Arial, sans-serif;
}

body {

}

.app {

}

.header {

    align-items: center;

    border-bottom: 1px solid #292a3d;
    background: rgba(10,11,20,.95);
}

.header-left {
    display: flex;
    align-items: center;

}

.back {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid #303145;
    background: #1b1c2b;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.logo {
    font-size: 27px;
    font-weight: 800;
}

.logo span {
    color: #8b5cf6;
}

.mark-all {
    border: none;
    background: transparent;
    color: #8b5cf6;

}

.page {
    padding: 20px;
}

.title {
    font-size: 25px;
    margin-bottom: 5px;
}

.subtitle {
    color: #9293a3;
    font-size: 13px;
    margin-bottom: 20px;
}

.notification {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 16px;
    margin-bottom: 10px;
    border-radius: 18px;
    border: 1px solid #292a3d;
    background: rgba(20,21,35,.9);
    cursor: pointer;
    transition: .2s;
}

.notification:hover {
    border-color: #55506f;
}

.notification.unread {
    border-color: rgba(139,92,246,.65);
    background: rgba(38,31,62,.95);
}

.icon {
    width: 46px;
    height: 46px;
    min-width: 46px;
    border-radius: 50%;
    background: #1b1c2b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
}

.info {
    flex: 1;
    min-width: 0;
}

.notification-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 5px;
}

.notification-message {
    color: #9697a7;
    font-size: 12px;
    line-height: 1.4;
}

.notification-time {
    color: #666879;
    font-size: 10px;
    margin-top: 8px;
}

.dot {
    width: 9px;
    height: 9px;
    min-width: 9px;
    border-radius: 50%;
    background: #8b5cf6;
    margin-top: 5px;
}

.empty {
    text-align: center;
    color: #737486;
    padding: 70px 20px;
    font-size: 14px;
}

.loading {
    text-align: center;
    color: #737486;
    padding: 50px 20px;
}

.error {
    padding: 20px;
    border-radius: 15px;
    background: rgba(239,68,68,.1);
    border: 1px solid rgba(239,68,68,.3);
    color: #fca5a5;
    font-size: 13px;
}
</style>
</head>

<body>

<div id="app" class="app">

    <div class="header">

        <div class="header-left">

            <button
                class="back"
                onclick="window.location.href='index.html'">
                ←
            </button>

            <div class="logo">
                Zuno<span>Play</span>
            </div>

        </div>

        <button
            id="markAllButton"
            class="mark-all"
            onclick="markAllAsRead()">
            Marcar todas
        </button>

    </div>


    <div class="page">

        <h1 class="title">
            🔔 Notificações
        </h1>

        <p class="subtitle">
            Veja suas atividades recentes.
        </p>

        <div id="notifications">

            <div class="loading">
                Carregando notificações...
            </div>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const notificationsElement =
document.getElementById(
    "notifications"
);


const markAllButton =
document.getElementById(
    "markAllButton"
);


let currentUser = null;
let notificationChannel = null;


/* =========================================
   INICIAR
========================================= */

async function start() {

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();


    if (
        error ||
        !data.session
    ) {

        window.location.href =
        "login.html";

        return;

    }


    currentUser =
    data.session.user;


    await loadNotifications();


    subscribeNotifications();

}


/* =========================================
   CARREGAR NOTIFICAÇÕES
========================================= */

async function loadNotifications() {

    notificationsElement.innerHTML = `
        <div class="loading">
            Carregando notificações...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
    .from("notifications")
    .select("*")
    .eq(
        "user_id",
        currentUser.id
    )
    .order(
        "created_at",
        {
            ascending: false
        }
    );


    if (error) {

        console.error(
            "Erro:",
            error
        );

        notificationsElement.innerHTML = `
            <div class="error">
                Não foi possível carregar suas notificações.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        notificationsElement.innerHTML = `
            <div class="empty">
                Você não possui notificações ainda. 🔔
            </div>
        `;

        markAllButton.style.display =
        "none";

        return;

    }


    const unreadCount =
    data.filter(function(notification) {

        return notification.read_at === null;

    }).length;


    if (unreadCount === 0) {

        markAllButton.style.display =
        "none";

    } else {

        markAllButton.style.display =
        "block";

    }


    notificationsElement.innerHTML =
    "";


    data.forEach(function(notification) {

        const element =
        document.createElement(
            "div"
        );


        const unread =
        notification.read_at === null;


        element.className =
        "notification" +
        (
            unread
            ? " unread"
            : ""
        );


        element.innerHTML = `

            <div class="icon">
                ${getIcon(notification.type)}
            </div>

            <div class="info">

                <div class="notification-title">
                    ${escapeHTML(
                        notification.title ||
                        "Notificação"
                    )}
                </div>

                <div class="notification-message">
                    ${escapeHTML(
                        notification.message ||
                        ""
                    )}
                </div>

                <div class="notification-time">
                    ${formatDate(
                        notification.created_at
                    )}
                </div>

            </div>

            ${
