<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Notificações - ZunoPlay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 20% 20%,#25145c 0,transparent 35%),radial-gradient(circle at 80% 80%,#102d59 0,transparent 35%),#070811;color:#fff}.app{width:100%;max-width:480px;min-height:100vh;margin:auto}.header{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid #292a3d;background:rgba(10,11,20,.95)}.header-left{display:flex;align-items:center;gap:12px}.back{width:42px;height:42px;border-radius:12px;border:1px solid #303145;background:#1b1c2b;color:#fff;font-size:20px;cursor:pointer}.logo{font-size:27px;font-weight:800}.logo span{color:#8b5cf6}.mark-all{border:0;background:transparent;color:#8b5cf6;font-size:12px;font-weight:bold;cursor:pointer}.page{padding:20px}.title{font-size:25px;margin-bottom:5px}.subtitle{color:#9293a3;font-size:13px;margin-bottom:20px}.notification{display:flex;align-items:flex-start;gap:13px;padding:16px;margin-bottom:10px;border-radius:18px;border:1px solid #292a3d;background:rgba(20,21,35,.9);cursor:pointer}.notification.unread{border-color:rgba(139,92,246,.65);background:rgba(38,31,62,.95)}.icon{width:46px;height:46px;min-width:46px;border-radius:50%;background:#1b1c2b;display:flex;align-items:center;justify-content:center;font-size:21px}.info{flex:1;min-width:0}.notification-title{font-size:14px;font-weight:bold;margin-bottom:5px}.notification-message{color:#9697a7;font-size:12px;line-height:1.4}.notification-time{color:#666879;font-size:10px;margin-top:8px}.dot{width:9px;height:9px;min-width:9px;border-radius:50%;background:#8b5cf6;margin-top:5px}.actions{display:flex;gap:8px;margin-top:12px}.action{border:0;border-radius:10px;padding:9px 13px;color:#fff;font-size:11px;font-weight:bold;cursor:pointer}.accept{background:linear-gradient(135deg,#8b5cf6,#6366f1)}.reject{background:#2a171d;border:1px solid #5b2830;color:#ffb0b0}.action:disabled{opacity:.5}.loading,.empty{text-align:center;color:#737486;padding:50px 20px;font-size:14px}.error{padding:20px;border-radius:15px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;font-size:13px}.count{padding:14px;margin-bottom:15px;border-radius:15px;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);color:#c4b5fd;font-size:13px}</style></head><body><div class="app"><div class="header"><div class="header-left"><button class="back" onclick="location.href='index.html'">←</button><div class="logo">Zuno<span>Play</span></div></div><button id="markAllButton" class="mark-all">Marcar todas</button></div><div class="page"><h1 class="title">🔔 Notificações</h1><p class="subtitle">Veja suas atividades recentes.</p><div id="notifications"><div class="loading">Carregando notificações...</div></div></div></div><script>
const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co",SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const box=document.getElementById("notifications"),markAll=document.getElementById("markAllButton");let user=null,nChannel=null,rChannel=null;
const esc=v=>{const d=document.createElement("div");d.textContent=v??"";return d.innerHTML};const icon=t=>t==="friend_request"?"👥":t==="friend_accepted"?"🤝":"🔔";const fmt=v=>{const d=new Date(v);return isNaN(d)?"":d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})};
async function login(){const {data,error}=await supabaseClient.auth.getSession();if(error||!data?.session?.user){location.href="login.html";return false}user=data.session.user;return true}
async function markRead(id){const {error}=await supabaseClient.from("notifications").update({read_at:new Date().toISOString()}).eq("id",id).eq("user_id",user.id);if(error)console.error(error)}
async function finishRequest(requestId,accepted){const {data:r,error:e}=await supabaseClient.from("friend_requests").select("id,sender_id,receiver_id,status").eq("id",requestId).eq("receiver_id",user.id).eq("status","pending").maybeSingle();if(e||!r){alert("Essa solicitação já foi respondida ou não está disponível.");return}if(accepted){const {error:u}=await supabaseClient.from("friend_requests").update({status:"accepted"}).eq("id",requestId).eq("receiver_id",user.id).eq("status","pending");if(u){alert("Não foi possível aceitar a solicitação.");return}const {error:f}=await supabaseClient.from("friendships").insert({user_id:r.sender_id,friend_id:r.receiver_id});if(f&&f.code!=="23505"){alert("Não foi possível criar a amizade.");return}}else{const {error:u}=await supabaseClient.from("friend_requests").update({status:"rejected"}).eq("id",requestId).eq("receiver_id",user.id).eq("status","pending");if(u){alert("Não foi possível recusar a solicitação.");return}}await supabaseClient.from("notifications").update({read_at:new Date().toISOString()}).eq("user_id",user.id).eq("type","friend_request").eq("related_id",requestId).is("read_at",null);await load()}
async function load(){box.innerHTML='<div class="loading">Carregando notificações...</div>';const {data,error}=await supabaseClient.from("notifications").select("*").eq("user_id",user.id).neq("type","message").order("created_at",{ascending:false});if(error){box.innerHTML='<div class="error">Não foi possível carregar as notificações.</div>';return}if(!data?.length){box.innerHTML='<div class="empty">Nenhuma notificação por enquanto. 🔔</div>';markAll.style.display="none";return}const unread=data.filter(n=>!n.read_at).length;markAll.style.display=unread?"block":"none";box.innerHTML='<div class="count">🔔 '+data.length+' notificação'+(data.length===1?"":"ões")+' · '+unread+' não lida'+(unread===1?"":"s")+'</div>';data.forEach(n=>{const el=document.createElement("div");el.className="notification"+(n.read_at?"":" unread");const request=n.type==="friend_request"&&n.related_id;el.innerHTML='<div class="icon">'+icon(n.type)+'</div><div class="info"><div class="notification-title">'+esc(n.title||"Notificação")+'</div><div class="notification-message">'+esc(n.message||"")+'</div><div class="notification-time">'+esc(fmt(n.created_at))+'</div>'+(request?'<div class="actions"><button class="action accept">Aceitar</button><button class="action reject">Recusar</button></div>':"")+'</div>'+(n.read_at?"":'<div class="dot"></div>');if(request){el.querySelector(".accept").onclick=e=>{e.stopPropagation();finishRequest(n.related_id,true)};el.querySelector(".reject").onclick=e=>{e.stopPropagation();finishRequest(n.related_id,false)}}else el.onclick=async()=>{await markRead(n.id);await load()};box.appendChild(el)})}
markAll.onclick=async()=>{markAll.disabled=true;const {error}=await supabaseClient.from("notifications").update({read_at:new Date().toISOString()}).eq("user_id",user.id).neq("type","message").is("read_at",null);if(error)alert("Não foi possível marcar todas como lidas.");await load();markAll.disabled=false};
function subscribe(){if(nChannel)supabaseClient.removeChannel(nChannel);if(rChannel)supabaseClient.removeChannel(rChannel);nChannel=supabaseClient.channel("notifications-page-"+user.id).on("postgres_changes",{event:"*",schema:"public",table:"notifications",filter:"user_id=eq."+user.id},load).subscribe();rChannel=supabaseClient.channel("notification-requests-"+user.id).on("postgres_changes",{event:"*",schema:"public",table:"friend_requests",filter:"receiver_id=eq."+user.id},load).subscribe()}
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){if(nChannel)supabaseClient.removeChannel(nChannel);if(rChannel)supabaseClient.removeChannel(rChannel);location.href="login.html"}});window.addEventListener("beforeunload",()=>{if(nChannel)supabaseClient.removeChannel(nChannel);if(rChannel)supabaseClient.removeChannel(rChannel)});(async()=>{if(await login()){await load();subscribe()}})();
</script></body></html>
