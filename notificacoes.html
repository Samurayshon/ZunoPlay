<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notificações - ZunoPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #25145c 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #102d59 0%, transparent 35%),
        #070811;
    color: white;
}

.app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
}

.header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px;
    border-bottom: 1px solid #292a3d;
    background: rgba(10,11,20,.95);
}

.back {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid #303145;
    background: #1b1c2b;
    color: white;
    font-size: 20px;
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.logo span {
    color: #8b5cf6;
}

.page {
    padding: 20px;
}

.title {
    font-size: 25px;
    margin-bottom: 6px;
}

.subtitle {
    color: #9293a3;
    font-size: 13px;
    margin-bottom: 20px;
}

.notification {
    display: flex;
    gap: 13px;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 17px;
    border: 1px solid #292a3d;
    background: rgba(20,21,35,.9);
}

.notification.unread {
    border-color: #8b5cf6;
    background: rgba(34,28,58,.95);
}

.icon {
    width: 45px;
    height: 45px;
    min-width: 45px;
    border-radius: 50%;
    background: #1b1c2b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.info {
    flex: 1;
}

.notification-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 5px;
}

.notification-message {
    color: #9697a7;
    font-size: 12px;
}

.notification-time {
    color: #666879;
    font-size: 10px;
    margin-top: 7px;
}

.dot {
    width: 8px;
    height: 8px;
    min-width: 8px;
    border-radius: 50%;
    background: #8b5cf6;
    margin-top: 6px;
}

.empty {
    text-align: center;
    color: #737486;
    padding: 65px 20px;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="app" class="app">
    <div class="empty">
        Carregando notificações...
    </div>
</div>

<script>

const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const app =
document.getElementById("app");

let currentUser = null;


/* ===============================
   INICIAR SESSÃO
================================ */

async function start() {

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();

    if (
        error ||
        !data.session
    ) {

        window.location.href =
        "login.html";

        return;
    }

    currentUser =
    data.session.user;

    await loadNotifications();

}


/* ===============================
   NOTIFICAÇÕES
================================ */

async function loadNotifications() {

    const {
        data,
        error
    } =
    await supabaseClient
    .from("notifications")
    .select("*")
    .eq(
        "user_id",
        currentUser.id
    )
    .order(
        "created_at",
        {
            ascending: false
        }
    );

    if (error) {

        console.error(
            "ERRO NOTIFICAÇÕES:",
            error
        );

        app.innerHTML = `
            <div class="empty">
                Erro ao carregar notificações.
                <br><br>
                ${error.message}
            </div>
        `;

        return;
    }


    let html = `

        <div class="header">

            <button
                class="back"
                onclick="window.location.href='index.html'">
                ←
            </button>

            <div class="logo">
                Zuno<span>Play</span>
            </div>

        </div>

        <div class="page">

            <h1 class="title">
                🔔 Notificações
            </h1>

            <p class="subtitle">
                Suas atividades recentes.
            </p>

    `;


    if (!data || data.length === 0) {

        html += `

            <div class="empty">
                Você não possui notificações ainda. 🔔
            </div>

        `;

    } else {

        data.forEach(function(notification) {

            const unread =
            notification.read_at === null;


            html += `

                <div
                    class="notification
                    ${unread ? "unread" : ""}"
                    onclick="markRead('${notification.id}')">

                    <div class="icon">
                        ${getIcon(notification.type)}
                    </div>

                    <div class="info">

                        <div class="notification-title">
                            ${escapeHTML(notification.title)}
                        </div>

                        <div class="notification-message">
                            ${escapeHTML(notification.message || "")}
                        </div>

                        <div class="notification-time">
                            ${formatDate(notification.created_at)}
                        </div>

                    </div>

                    ${
                        unread
                        ? '<div class="dot"></div>'
                        : ''
                    }

                </div>

            `;

        });

    }


    html += `
        </div>
    `;


    app.innerHTML =
    html;

}


function getIcon(type) {

    if (type === "message")
        return "💬";

    if (type === "friend_request")
        return "👥";

    if (type === "friend_accepted")
        return "🤝";

    return "🔔";

}


function formatDate(date) {

    return new Date(date)
    .toLocaleString(
        "pt-BR",
        {
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function escapeHTML(text) {

    const div =
    document.createElement("div");

    div.textContent =
    text;

    return div.innerHTML;

}


/* ===============================
   MARCAR COMO LIDA
================================ */

async function markRead(id) {

    const {
        error
    } =
    await supabaseClient
    .from("notifications")
    .update({
        read_at:
        new Date().toISOString()
    })
    .eq(
        "id",
        id
    )
    .eq(
        "user_id",
        currentUser.id
    );


    if (error) {

        console.error(error);

        return;
    }


    await loadNotifications();

}


start();

</script>

</body>
</html>
