<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02040d"><title>Notificações — ZunoPlay</title><link rel="stylesheet" href="zuno-notifications.css?v=8"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="nav.js?v=310"></script><script defer src="zuno-notifications.js?v=9"></script></head><body><main class="zn-app"><section class="zn-page"><div class="zn-title-row"><div><h1 class="zn-title">Notificações</h1><p class="zn-sub">Mensagens, Pulso, pedidos, recompensas e avisos importantes do ZunoPlay.</p></div><div class="zn-title-actions"><span id="unreadPill" class="zn-unread" hidden>0</span><button id="markAll" class="zn-mark-all">Marcar todas</button></div></div><nav class="zn-tabs" aria-label="Filtros"><button class="zn-tab active" data-filter="all">Tudo</button><button class="zn-tab" data-filter="social">Pulso</button><button class="zn-tab" data-filter="message">Mensagens</button><button class="zn-tab" data-filter="friend_request">Pedidos</button><button class="zn-tab" data-filter="rewards">Recompensas</button><button class="zn-tab" data-filter="system">Sistema</button></nav><div id="summary" class="zn-summary"><span>Carregando...</span></div><div id="list" class="zn-list"><div class="zn-loading">Carregando notificações...</div></div></section></main><script>
const $=s=>document.querySelector(s),list=$('#list'),summary=$('#summary'),pill=$('#unreadPill'),markAll=$('#markAll');let active='all';
const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};const rel=v=>{const d=new Date(v),s=Math.max(0,(Date.now()-d)/1000);if(s<60)return'agora';if(s<3600)return`${Math.floor(s/60)} min`;if(s<86400)return`${Math.floor(s/3600)} h`;if(s<604800)return`${Math.floor(s/86400)} d`;return d.toLocaleDateString('pt-BR')};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));const categoryLabel=c=>c==='friend_request'?'Pedido de amizade':c==='message'?'Mensagem':c==='social'?'Pulso':c==='rewards'?'Recompensa':'Sistema';
function visible(items){return items.filter(n=>ZunoNotifications.matches(n,active))}
function render(items){const data=visible(items),unread=data.filter(n=>!n.read_at).length;summary.innerHTML=`<span>${data.length} ${data.length===1?'notificação':'notificações'}</span><span>${unread} ${unread===1?'não lida':'não lidas'}</span>`;pill.hidden=!ZunoNotifications.unseenCount;pill.textContent=ZunoNotifications.unseenCount;markAll.hidden=!unread;if(!data.length){list.innerHTML='<div class="zn-empty">Nenhuma notificação nesta categoria.</div>';return}list.innerHTML='';data.forEach(n=>{const c=ZunoNotifications.config(n),el=document.createElement('article');el.className='zn-card'+(n.read_at?'':' unread');el.innerHTML=`<div class="zn-notif-icon">${c.icon}</div><div class="zn-card-body"><div class="zn-card-title">${esc(n.title||'Notificação')}</div><div class="zn-card-message">${esc(n.message||'')}</div><div class="zn-meta"><span class="zn-category">${esc(categoryLabel(c.category))}</span><span>•</span><span>${rel(n.created_at)}</span></div>${n.type==='friend_request'&&n.related_id?'<div class="zn-actions"><button class="zn-action zn-accept">Aceitar</button><button class="zn-action zn-reject">Recusar</button></div>':''}</div>${n.read_at?'':'<span class="zn-dot"></span>'}`;if(n.type==='friend_request'&&n.related_id){el.querySelector('.zn-accept').onclick=e=>{e.stopPropagation();finishRequest(n,true)};el.querySelector('.zn-reject').onclick=e=>{e.stopPropagation();finishRequest(n,false)}}el.onclick=()=>ZunoNotifications.open(n);list.appendChild(el)})}
async function finishRequest(n,accepted){const c=ZunoNotifications.client,u=ZunoNotifications.user;if(!c||!u)return;const{data:r}=await c.from('friend_requests').select('id,sender_id,receiver_id,status').eq('id',n.related_id).eq('receiver_id',u.id).eq('status','pending').maybeSingle();if(!r){alert('Essa solicitação já foi respondida.');return}const{error}=await c.from('friend_requests').update({status:accepted?'accepted':'rejected'}).eq('id',r.id).eq('receiver_id',u.id).eq('status','pending');if(error){alert('Não foi possível responder agora.');return}if(accepted){const x=await c.from('friendships').insert({user_id:r.sender_id,friend_id:r.receiver_id});if(x.error&&x.error.code!=='23505'){alert('Não foi possível criar a amizade.');return}}await ZunoNotifications.markRead(n.id);await ZunoNotifications.load()}
document.querySelectorAll('.zn-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.zn-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.filter;render(ZunoNotifications.items)});markAll.onclick=()=>ZunoNotifications.markAllRead(active);
async function readyCenter(){ZunoNotifications.onChange(render);await ZunoNotifications.markAllSeen().catch(e=>console.error('[ZunoNotifications] seen',e));render(ZunoNotifications.items)}
async function bootNotifications(){for(let attempt=0;attempt<5;attempt++){await ZunoNotifications.init().catch(()=>{});if(ZunoNotifications.user){await readyCenter();return}const sb=window.ZunoSupabaseClient||window.__zunoSupabaseClient||window.supabaseClient;if(sb?.auth){try{const{data}=await sb.auth.getSession();if(data?.session?.user){await ZunoNotifications.init().catch(()=>{});if(ZunoNotifications.user){await readyCenter();return}}}catch(_){}}await sleep(180*(attempt+1))}location.replace('login.html?next=notificacoes.html')}
window.addEventListener('DOMContentLoaded',bootNotifications,{once:true});
</script></body></html>
