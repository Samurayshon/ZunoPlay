<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notificações - ZunoPlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 20% 20%,
            #25145c 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            #102d59 0%,
            transparent 35%
        ),
        #070811;

    color: white;
}

.app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
}


/* =========================================
   HEADER
========================================= */

.header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 20px;

    border-bottom:
        1px solid #292a3d;

    background:
        rgba(10,11,20,.95);

}

.header-left {

    display: flex;

    align-items: center;

    gap: 12px;

}

.back {

    width: 42px;
    height: 42px;

    border-radius: 12px;

    border:
        1px solid #303145;

    background:
        #1b1c2b;

    color: white;

    font-size: 20px;

    cursor: pointer;

}

.logo {

    font-size: 27px;

    font-weight: 800;

}

.logo span {

    color: #8b5cf6;

}


/* =========================================
   BOTÃO MARCAR TODAS
========================================= */

.mark-all {

    border: none;

    background: transparent;

    color: #8b5cf6;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;

}

.mark-all:disabled {

    opacity: .5;

}


/* =========================================
   CONTEÚDO
========================================= */

.page {

    padding: 20px;

}

.title {

    font-size: 25px;

    margin-bottom: 5px;

}

.subtitle {

    color: #9293a3;

    font-size: 13px;

    margin-bottom: 20px;

}


/* =========================================
   NOTIFICAÇÃO
========================================= */

.notification {

    display: flex;

    align-items: flex-start;

    gap: 13px;

    padding: 16px;

    margin-bottom: 10px;

    border-radius: 18px;

    border:
        1px solid #292a3d;

    background:
        rgba(20,21,35,.9);

    cursor: pointer;

    transition: .2s;

}

.notification.unread {

    border-color:
        rgba(139,92,246,.65);

    background:
        rgba(38,31,62,.95);

}

.icon {

    width: 46px;
    height: 46px;

    min-width: 46px;

    border-radius: 50%;

    background:
        #1b1c2b;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 21px;

}

.info {

    flex: 1;

    min-width: 0;

}

.notification-title {

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 5px;

}

.notification-message {

    color: #9697a7;

    font-size: 12px;

    line-height: 1.4;

}

.notification-time {

    color: #666879;

    font-size: 10px;

    margin-top: 8px;

}

.dot {

    width: 9px;
    height: 9px;

    min-width: 9px;

    border-radius: 50%;

    background:
        #8b5cf6;

    margin-top: 5px;

}


/* =========================================
   ESTADOS
========================================= */

.loading {

    text-align: center;

    color: #737486;

    padding: 50px 20px;

}

.empty {

    text-align: center;

    color: #737486;

    padding: 70px 20px;

    font-size: 14px;

}

.error {

    padding: 20px;

    border-radius: 15px;

    background:
        rgba(239,68,68,.1);

    border:
        1px solid rgba(239,68,68,.3);

    color: #fca5a5;

    font-size: 13px;

}

.debug {

    padding: 15px;

    margin-bottom: 15px;

    border-radius: 15px;

    background:
        #11121e;

    border:
        1px solid #292a3d;

    color: #9293a3;

    font-size: 11px;

    word-break: break-all;

}

.count {

    padding: 14px;

    margin-bottom: 15px;

    border-radius: 15px;

    background:
        rgba(139,92,246,.12);

    border:
        1px solid rgba(139,92,246,.3);

    color: #c4b5fd;

    font-size: 13px;

}

</style>

</head>


<body>


<div id="app" class="app">


    <div class="header">


        <div class="header-left">


            <button
                class="back"
                onclick="window.location.href='index.html'">

                ←

            </button>


            <div class="logo">

                Zuno<span>Play</span>

            </div>


        </div>


        <button
            id="markAllButton"
            class="mark-all">

            Marcar todas

        </button>


    </div>


    <div class="page">


        <h1 class="title">

            🔔 Notificações

        </h1>


        <p class="subtitle">

            Veja suas atividades recentes.

        </p>


        <div id="notifications">

            <div class="loading">

                Carregando notificações...

            </div>

        </div>


    </div>


</div>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rliymfbbhqoejgfvsbuu.supabase.co";


const SUPABASE_KEY =
"sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   ELEMENTOS
========================================= */

const notificationsElement =
document.getElementById(
    "notifications"
);


const markAllButton =
document.getElementById(
    "markAllButton"
);


let currentUser = null;

let notificationChannel = null;


/* =========================================
   SEGURANÇA
========================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text == null
        ? ""
        : String(text);

    return div.innerHTML;

}


/* =========================================
   ÍCONES
========================================= */

function getIcon(type) {

    if (type === "message") {

        return "💬";

    }

    if (type === "friend_request") {

        return "👥";

    }

    if (type === "friend_accepted") {

        return "🤝";

    }

    return "🔔";

}


/* =========================================
   DATA
========================================= */

function formatDate(date) {

    if (!date) {

        return "";

    }


    const value =
        new Date(date);


    if (isNaN(value.getTime())) {

        return "";

    }


    return value.toLocaleString(
        "pt-BR",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================
   LOGIN
========================================= */

async function checkLogin() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if (error) {

        showError(
            "Erro ao verificar login: " +
            error.message
        );

        return false;

    }


    if (!data.session) {

        window.location.href =
            "login.html";

        return false;

    }


    currentUser =
        data.session.user;


    return true;

}


/* =========================================
   CARREGAR NOTIFICAÇÕES
========================================= */

async function loadNotifications() {

    notificationsElement.innerHTML = `

        <div class="loading">

            Carregando notificações...

        </div>

    `;


    console.log(
        "Usuário atual:",
        currentUser.id
    );


    const result =
        await supabaseClient
            .from("notifications")
            .select("*")
            .eq(
                "user_id",
                currentUser.id
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    console.log(
        "Resultado das notificações:",
        result
    );


    if (result.error) {

        showError(
            "Erro ao carregar notificações:<br><br>" +
            escapeHTML(
                result.error.message
            )
        );

        return;

    }


    const data =
        result.data || [];


    console.log(
        "Quantidade:",
        data.length
    );


    if (data.length === 0) {

        notificationsElement.innerHTML = `

            <div class="empty">

                Nenhuma notificação encontrada. 🔔

            </div>

            <div class="debug">

                Usuário consultado:<br><br>

                ${escapeHTML(
                    currentUser.id
                )}

            </div>

        `;

        markAllButton.style.display =
            "none";

        return;

    }


    const unreadCount =
        data.filter(
            function(notification) {

                return notification.read_at === null;

            }
        ).length;


    notificationsElement.innerHTML = `

        <div class="count">

            📋 ${data.length}
            notificação${data.length === 1 ? "" : "ões"}
            encontrada${data.length === 1 ? "" : "s"}

            <br>

            🔴 ${unreadCount}
            não lida${unreadCount === 1 ? "" : "s"}

        </div>

    `;


    if (unreadCount === 0) {

        markAllButton.style.display =
            "none";

    } else {

        markAllButton.style.display =
            "block";

    }


    data.forEach(
        function(notification) {

            const element =
                document.createElement(
                    "div"
                );


            const unread =
                notification.read_at === null;


            element.className =
                "notification" +
                (
                    unread
                    ? " unread"
                    : ""
                );


            element.innerHTML = `

                <div class="icon">

                    ${getIcon(
                        notification.type
                    )}

                </div>


                <div class="info">

                    <div class="notification-title">

                        ${escapeHTML(
                            notification.title ||
                            "Notificação"
                        )}

                    </div>


                    <div class="notification-message">

                        ${escapeHTML(
                            notification.message ||
                            ""
                        )}

                    </div>


                    <div class="notification-time">

                        ${formatDate(
                            notification.created_at
                        )}

                    </div>

                </div>


                ${
                    unread
                    ? '<div class="dot"></div>'
                    : ""
                }

            `;


            element.addEventListener(
                "click",
                function() {

                    markAsRead(
                        notification.id
                    );

                }
            );


            notificationsElement.appendChild(
                element
            );

        }
    );

}


/* =========================================
   ERRO
========================================= */

function showError(message) {

    notificationsElement.innerHTML = `

        <div class="error">

            ${message}

        </div>

    `;

}


/* =========================================
   MARCAR UMA COMO LIDA
========================================= */

async function markAsRead(id) {

    console.log(
        "Marcando como lida:",
        id
    );


    const result =
        await supabaseClient
            .from("notifications")
            .update({

                read_at:
                    new Date().toISOString()

            })
            .eq(
                "id",
                id
            )
            .eq(
                "user_id",
                currentUser.id
            );


    console.log(
        "Resultado atualização:",
        result
    );


    if (result.error) {

        alert(
            "Erro ao marcar como lida:\n\n" +
            result.error.message
        );

        return;

    }


    await loadNotifications();

}


/* =========================================
   MARCAR TODAS COMO LIDAS
========================================= */

async function markAllAsRead() {

    markAllButton.disabled =
        true;


    markAllButton.textContent =
        "Marcando...";


    const result =
        await supabaseClient
            .from("notifications")
            .update({

                read_at:
                    new Date().toISOString()

            })
            .eq(
                "user_id",
                currentUser.id
            )
            .is(
                "read_at",
                null
            );


    console.log(
        "Resultado marcar todas:",
        result
    );


    if (result.error) {

        alert(
            "Erro ao marcar notificações:\n\n" +
            result.error.message
        );

        markAllButton.disabled =
            false;

        markAllButton.textContent =
            "Marcar todas";

        return;

    }


    await loadNotifications();


    markAllButton.disabled =
        false;

    markAllButton.textContent =
        "Marcar todas";

}


/* =========================================
   REALTIME
========================================= */

function subscribeNotifications() {

    if (notificationChannel) {

        supabaseClient
            .removeChannel(
                notificationChannel
            );

    }


    notificationChannel =
        supabaseClient
            .channel(
                "notifications-" +
                currentUser.id
            )
            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "notifications",
                    filter:
                        "user_id=eq." +
                        currentUser.id
                },
                function(payload) {

                    console.log(
                        "Notificação atualizada:",
                        payload
                    );


                    loadNotifications();

                }
            )
            .subscribe();

}


/* =========================================
   INICIAR
========================================= */

async function start() {

    const logged =
        await checkLogin();


    if (!logged) {

        return;

    }


    await loadNotifications();


    subscribeNotifications();

}


start();


/* =========================================
   LIMPEZA
========================================= */

window.addEventListener(
    "beforeunload",
    function() {

        if (notificationChannel) {

            supabaseClient
                .removeChannel(
                    notificationChannel
                );

        }

    }
);


</script>


</body>

</html>
