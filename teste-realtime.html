<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste Realtime - ZunoPlay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nav.js"></script>
<style>
body{margin:0;padding:30px;background:#070811;color:white;font-family:Arial,sans-serif}.box{max-width:500px;margin:auto}h1{color:#8b5cf6}#status{padding:15px;margin:20px 0;border-radius:10px;background:#141523}#log{padding:15px;border-radius:10px;background:#11121e;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="box">
<h1>Teste Realtime</h1>
<div id="status">⏳ Iniciando Broadcast privado...</div>
<div id="log">Aguardando evento INSERT...</div>
</div>
<script>
const SUPABASE_URL="https://rliymfbbhqoejgfvsbuu.supabase.co",SUPABASE_KEY="sb_publishable_E4go4X7yZ6d-aXnKAT-fWw_Y8uHIJT0",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),status=document.getElementById("status"),log=document.getElementById("log");let channel=null;function record(p){return p?.payload?.record||p?.payload?.new||p?.record||p?.new||null}function core(){if(window.ZunoRealtime)return Promise.resolve(window.ZunoRealtime);return new Promise((resolve,reject)=>{const done=()=>window.ZunoRealtime?resolve(window.ZunoRealtime):reject(new Error("Realtime global indisponível"));window.addEventListener("zuno:realtime-installed",done,{once:true});setTimeout(done,5000)})}async function start(){try{const{data,error}=await supabaseClient.auth.getSession();if(error)throw error;const user=data?.session?.user;if(!user){status.textContent="⚠️ Faça login antes de testar.";return}const rt=await core();await rt.start();channel=rt.broadcast.scope("user:"+user.id+":messages",{private:true});channel.on("INSERT",payload=>{const row=record(payload);console.log("BROADCAST RECEBIDO:",payload);status.textContent="🟢 BROADCAST PRIVADO FUNCIONANDO!";log.textContent=JSON.stringify(row||payload,null,2)});await channel.subscribe();status.textContent="🟣 Broadcast privado conectado · aguardando INSERT..."}catch(error){console.error(error);status.textContent="🔴 Erro no Broadcast: "+(error.message||error)}}window.addEventListener("beforeunload",()=>{channel?.close?.().catch?.(()=>{})});start();
</script>
</body>
</html>
