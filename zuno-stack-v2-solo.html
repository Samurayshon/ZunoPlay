<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07040d"><title>Zuno Stack — Solo</title><link rel="stylesheet" href="zuno-stack-v2-solo.css"></head><body><main class="app" aria-labelledby="title"><header><button class="back" type="button" onclick="history.length>1?history.back():location.href='jogos.html'" aria-label="Voltar aos jogos">‹</button><div class="brand"><span class="eyebrow">ZUNO STACK</span><h1 id="title">Solo</h1></div><span class="mode">SOLO</span></header><section class="hud" aria-label="Estado da partida"><div class="hud-card"><span>Pontos</span><strong id="score">0</strong></div><div class="hud-card combo-card"><span>Combo</span><strong id="combo">0</strong></div><div class="hud-card pulse-card"><span>Pulse</span><strong id="pulse">0/10</strong></div></section><p id="status" class="status" role="status" aria-live="polite">Preparando partida…</p><section class="board-wrap" aria-label="Tabuleiro"><div class="board-aura"></div><div id="board" class="board"></div></section><section class="tray-wrap" aria-labelledby="trayTitle"><div class="tray-head"><strong id="trayTitle">Bandeja</strong><span id="trayCount">0/7</span></div><div id="tray" class="tray" aria-live="polite"></div></section><section class="actions" aria-label="Poderes"><button id="undo" type="button"><span>↶</span>Desfazer <small id="undoCount"></small></button><button id="hint" type="button"><span>✦</span>Dica <small id="hintCount"></small></button><button id="rescue" type="button"><span>◇</span>Resgate <small id="rescueCount"></small></button><button id="shift" type="button"><span>⇄</span>Shift <small id="shiftCount"></small></button></section><div class="meta"><span>Solo</span><span>XP/recompensas desativados</span></div></main><script type="module" src="zuno-stack-v2-solo-ui.mjs"></script></body></html>
