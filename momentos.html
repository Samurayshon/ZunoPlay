<body class="zuno-moments-page">
<main id="momentsApp" class="zm-app">
  <header class="zm-header">
    <div class="zm-brand-row">
      <div><h1>Pulso</h1></div>
      <div class="zp-head-actions" aria-label="Ações do Pulso">
        <button id="zpTrendingBtn" class="zp-head-action trending" type="button" aria-label="Em alta hoje">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2.5c.4 3-1.2 4.5-2.5 5.8-1.5 1.5-2.5 3-1.8 5.2.5 1.6 2 2.5 3.7 2.5 3.1 0 5.1-2.3 5.1-5.4 0-2.5-1.3-4.8-3.6-6.8.1 2.3-.5 3.7-1.7 4.8.1-2.4-.8-4.4-2.2-6.1"/><path d="M7.2 13.8c-1.6 1.4-2.5 3.1-2.2 4.8.4 2.1 2.4 3.9 5.1 3.9 3.2 0 5.4-2.2 5.4-5.1 0-1.2-.4-2.3-1.2-3.4-.5 2.1-1.8 3.3-3.5 3.4.3-1.8-.4-3-1.5-4.2-.8 1.3-1.4 2-2.1 2.6"/></svg>
          <span class="zp-action-caption">Em alta</span>
        </button>
        <button id="zpNotificationsBtn" class="zp-head-action" type="button" aria-label="Notificações">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
          <span class="zp-notification-badge" data-zuno-notification-badge hidden></span>
        </button>
      </div>
    </div>
    <nav class="zm-tabs" aria-label="Pulso e Descobrir">
      <button class="zm-tab active" data-view="moments" type="button">Pulso</button>
      <button class="zm-tab" data-view="plaza" type="button">Descobrir</button>
    </nav>
  </header>
  <section id="topicStrip" class="zm-topic-strip" aria-label="Assuntos em alta" hidden></section>
  <section id="composer" class="zm-composer">
    <div class="zm-composer-top"><div id="composerAvatar" class="zm-avatar">Z</div><textarea id="postText" maxlength="2000" rows="2" placeholder="Compartilhe no Pulso..."></textarea></div>
    <div id="mediaPreview" class="zm-media-preview" hidden></div>
    <div class="zm-composer-actions"><label class="zm-media-button" for="postMedia" aria-label="Adicionar foto ou vídeo">＋ Mídia</label><input id="postMedia" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" hidden><span id="composerHint" class="zm-hint">Seus amigos veem aqui; publicações públicas podem aparecer em Descobrir.</span><button id="publishButton" class="zm-publish" type="button">Publicar</button></div>
  </section>
  <section id="plazaIntro" class="zm-plaza-intro" hidden><div class="zm-plaza-orb">✦</div><div><strong>Descobrir</strong><span>Descubra fotos, pessoas e assuntos além do seu círculo.</span></div></section>
  <section id="feed" class="zm-feed" aria-live="polite"><div class="zp-loading">Carregando o Pulso...</div></section>
</main>
<div id="toast" class="zm-toast" role="status" aria-live="polite"></div>
</body>
</html>
