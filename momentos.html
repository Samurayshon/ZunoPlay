<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#05050d">
<title>Pulso • ZunoPlay</title>
<link rel="manifest" href="manifest.json">
<style>[hidden]{display:none!important}</style>
<link rel="stylesheet" href="zuno-design-system.css?v=285">
<link rel="stylesheet" href="zuno-moments.css?v=285">
<link rel="stylesheet" href="zuno-pulso-v2.css?v=285">
<link rel="stylesheet" href="zuno-pulso-v3.css?v=285">
<link rel="stylesheet" href="zuno-pulso-perfect.css?v=285">
<link rel="stylesheet" href="zuno-pulso-v6.css?v=285">
<link rel="stylesheet" href="zuno-pulso-header-v7.css?v=285">
<link rel="stylesheet" href="zuno-pulso-header-v8.css?v=285">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="zuno-posthog.js?v=285"></script>
<script defer src="zuno-notifications.js?v=285"></script>
<script defer src="nav.js?v=285"></script>
<script defer src="zuno-pulso-v3.js?v=285"></script>
<script defer src="zuno-pulso-perfect.js?v=285"></script>
<script defer src="zuno-pulso-v6.js?v=285"></script>
<script defer src="zuno-pulso-header-v8.js?v=285"></script>
</head>
<body class="zuno-moments-page">
<main id="momentsApp" class="zm-app">
  <header class="zm-header">
    <div class="zm-brand-row">
      <div><h1>Pulso</h1></div>
    </div>
    <nav class="zm-tabs" aria-label="Pulso e Descobrir">
      <button class="zm-tab active" data-view="moments" type="button">Pulso</button>
      <button class="zm-tab" data-view="plaza" type="button">Descobrir</button>
    </nav>
  </header>
  <section id="topicStrip" class="zm-topic-strip" aria-label="Assuntos em alta" hidden></section>
  <section id="composer" class="zm-composer">
    <div class="zm-composer-top">
      <div id="composerAvatar" class="zm-avatar">Z</div>
      <textarea id="postText" maxlength="2000" rows="2" placeholder="Compartilhe no Pulso..."></textarea>
    </div>
    <div id="mediaPreview" class="zm-media-preview" hidden></div>
    <div class="zm-composer-actions">
      <label class="zm-media-button" for="postMedia" aria-label="Adicionar foto ou vídeo">＋ Mídia</label>
      <input id="postMedia" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" hidden>
      <span id="composerHint" class="zm-hint">Seus amigos veem aqui; publicações públicas podem aparecer em Descobrir.</span>
      <button id="publishButton" class="zm-publish" type="button">Publicar</button>
    </div>
  </section>
  <section id="plazaIntro" class="zm-plaza-intro" hidden>
    <div class="zm-plaza-orb">✦</div><div><strong>Descobrir</strong><span>Descubra fotos, pessoas e assuntos além do seu círculo.</span></div>
  </section>
  <section id="feed" class="zm-feed" aria-live="polite"><div class="zp-loading">Carregando o Pulso...</div></section>
</main>
<div id="toast" class="zm-toast" role="status" aria-live="polite"></div>
</body>
</html>
